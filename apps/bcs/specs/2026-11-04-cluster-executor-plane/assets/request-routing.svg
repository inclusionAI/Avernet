<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b3402e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="660" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">Routing a round for session S to its owner</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">Hash = fast guess (entry gateway) · lease = truth (target executor) · durable write = fallback. At most two forwarding hops.</text>

  <!-- column headers -->
  <rect x="24" y="70" width="430" height="30" rx="6" fill="#ffffff" stroke="#5c6a62"/>
  <text x="239" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2420">Entry gateway (holds the PA's stream)</text>
  <rect x="506" y="70" width="430" height="30" rx="6" fill="#e3f0e9" stroke="#157a55"/>
  <text x="721" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#157a55">Target executor (the guess)</text>

  <!-- entry steps -->
  <rect x="44" y="120" width="390" height="56" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="60" y="142" font-size="12" font-weight="bold" fill="#1c2420">① target = bucket_map[bucket(S)] or HRW(bucket(S))</text>
  <text x="60" y="162" font-size="11" fill="#5c6a62">in memory, microseconds, no DB</text>
  <line x1="239" y1="176" x2="239" y2="204" stroke="#5c6a62" marker-end="url(#ar)"/>
  <rect x="44" y="208" width="390" height="40" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="60" y="233" font-size="12" font-weight="bold" fill="#1c2420">② send Submit(round) to target</text>
  <line x1="434" y1="228" x2="526" y2="160" stroke="#2457a6" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="440" y="262" font-size="11" fill="#2457a6">Submit</text>

  <!-- target steps -->
  <rect x="526" y="120" width="390" height="56" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="542" y="142" font-size="12" font-weight="bold" fill="#1c2420">Do I own bucket(S)? (my in-memory owned set)</text>
  <text x="542" y="162" font-size="11" fill="#5c6a62">no DB read</text>

  <line x1="600" y1="176" x2="600" y2="214" stroke="#157a55" marker-end="url(#ar)"/>
  <text x="608" y="200" font-size="11" fill="#157a55">yes</text>
  <rect x="526" y="218" width="190" height="72" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="542" y="240" font-size="12" font-weight="bold" fill="#157a55">(a) SERVE</text>
  <text x="542" y="258" font-size="11" fill="#1c2420">dedup · persist round (fenced)</text>
  <text x="542" y="275" font-size="11" fill="#1c2420">reply Task · drive</text>

  <line x1="840" y1="176" x2="840" y2="214" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="848" y="200" font-size="11" fill="#5c6a62">no</text>
  <rect x="730" y="218" width="186" height="72" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="746" y="240" font-size="12" font-weight="bold" fill="#1c2420">CLAIM transaction</text>
  <text x="746" y="258" font-size="11" fill="#1c2420">of bucket(S), if claimable</text>
  <text x="746" y="275" font-size="11" fill="#5c6a62">no prior token needed</text>

  <line x1="760" y1="290" x2="660" y2="324" stroke="#157a55" marker-end="url(#ar)"/>
  <text x="590" y="304" font-size="11" fill="#157a55">read-back = me</text>
  <rect x="526" y="328" width="190" height="56" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="542" y="350" font-size="12" font-weight="bold" fill="#157a55">(b) unowned bucket:</text>
  <text x="542" y="368" font-size="11" fill="#1c2420">owner of b now (n+1) → serve</text>
  <line x1="840" y1="290" x2="840" y2="324" stroke="#b3402e" marker-end="url(#ab)"/>
  <text x="848" y="312" font-size="11" fill="#b3402e">read-back = X</text>
  <rect x="730" y="328" width="186" height="56" rx="8" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="746" y="350" font-size="12" font-weight="bold" fill="#9a6b0a">(c) owned by X</text>
  <text x="746" y="368" font-size="10.5" fill="#1c2420">reply NOT_OWNER(X)</text>

  <!-- back to entry -->
  <polyline points="823,384 823,432 470,432 470,298 438,298" fill="none" stroke="#9a6b0a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="600" y="426" font-size="11" fill="#9a6b0a">NOT_OWNER(X) back to the entry gateway</text>
  <rect x="44" y="270" width="390" height="56" rx="8" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="60" y="292" font-size="12" font-weight="bold" fill="#9a6b0a">③ bucket_map[b] = X; Submit to X</text>
  <text x="60" y="312" font-size="11" fill="#1c2420">second and last hop; X must serve or claim</text>

  <rect x="44" y="346" width="390" height="74" rx="8" fill="#f8e6e1" stroke="#b3402e"/>
  <text x="60" y="368" font-size="12" font-weight="bold" fill="#b3402e">④ refused / timed out → next-ranked executor</text>
  <text x="60" y="388" font-size="11" fill="#1c2420">it serves, claims bucket(S) if claimable, or records the round as input</text>
  <text x="60" y="405" font-size="11" fill="#1c2420">(durable fallback) and acks · no executor at all → retryable error</text>

  <!-- bottom: cases -->
  <rect x="24" y="464" width="912" height="176" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="44" y="488" font-size="13" font-weight="bold" fill="#1c2420">Cases</text>
  <text x="44" y="512" font-size="11.5" fill="#1c2420"><tspan font-weight="bold">Stable cluster</tspan> — guess is the owner: one hop, zero extra DB reads. ~2–7 ms added to TTFT (vs ~500 ms average with polling).</text>
  <text x="44" y="534" font-size="11.5" fill="#1c2420"><tspan font-weight="bold">During a bucket handoff</tspan> — map says A, lease says B: one extra hop, once; the bucket map is corrected.</text>
  <text x="44" y="556" font-size="11.5" fill="#1c2420"><tspan font-weight="bold">Cold session</tspan> — the bucket's owner loads it: one read, no claim.</text>
  <text x="44" y="578" font-size="11.5" fill="#1c2420"><tspan font-weight="bold">Owner crashed</tspan> — Submit fails → next-ranked executor claims the bucket if claimable, else durable fallback; TTFT ≤ takeover time.</text>
  <text x="44" y="600" font-size="11.5" fill="#1c2420"><tspan font-weight="bold">Timeout, but the owner did process it</tspan> — two copies of one round: dedup on (principal, session_id, messageId) is required.</text>
  <text x="44" y="624" font-size="11" fill="#5c6a62">No load-balancer dependency: unique node_id, shared DB, direct peer reachability, same hash on every node. Gateways never touch leases.</text>
</svg>
