<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a6b0a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">桶 b 从正在排空的执行器 A 交接给后继 B</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">轮次和控制事件会重试直到被确认;只有增量可能从实时画面中缺失,B 会从智能体那里找回。</text>

  <rect x="60" y="72" width="170" height="40" rx="8" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="145" y="97" font-size="13" font-weight="bold" text-anchor="middle" fill="#9a6b0a">执行器 A(排空中)</text>
  <rect x="300" y="72" width="170" height="40" rx="8" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="385" y="91" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#9a6b0a">消息队列</text>
  <text x="385" y="105" font-size="10.5" text-anchor="middle" fill="#5c6a62">增量频道 deltas:{b}</text>
  <rect x="540" y="72" width="150" height="40" rx="8" fill="#eef2fa" stroke="#2457a6"/>
  <text x="615" y="97" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457a6">共享数据库</text>
  <rect x="760" y="72" width="170" height="40" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="845" y="97" font-size="13" font-weight="bold" text-anchor="middle" fill="#157a55">执行器 B(后继)</text>
  <line x1="145" y1="112" x2="145" y2="520" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="385" y1="112" x2="385" y2="520" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="615" y1="112" x2="615" y2="520" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="845" y1="112" x2="845" y2="520" stroke="#b9c6bf" stroke-dasharray="3 4"/>

  <text x="24" y="144" font-size="11" font-weight="bold" fill="#5c6a62">1</text>
  <rect x="70" y="130" width="150" height="22" rx="5" fill="#ffffff" stroke="#9a6b0a"/>
  <text x="145" y="145" font-size="10.5" text-anchor="middle" fill="#9a6b0a">排空中 · 不再认领</text>

  <text x="24" y="184" font-size="11" font-weight="bold" fill="#5c6a62">2</text>
  <line x1="149" y1="180" x2="841" y2="180" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="495" y="174" font-size="11" text-anchor="middle" fill="#1c2420">PREPARE(b)</text>
  <text x="845" y="198" font-size="10.5" text-anchor="middle" fill="#157a55">加载 b 的热会话 —— 还不是所有者</text>
  <line x1="381" y1="214" x2="149" y2="214" stroke="#9a6b0a" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="265" y="208" font-size="10.5" text-anchor="middle" fill="#9a6b0a">增量持续到达</text>
  <text x="145" y="232" font-size="10.5" text-anchor="middle" fill="#9a6b0a">A 继续处理并转发</text>

  <text x="24" y="270" font-size="11" font-weight="bold" fill="#5c6a62">3</text>
  <line x1="149" y1="266" x2="381" y2="266" stroke="#9a6b0a" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="265" y="260" font-size="10.5" text-anchor="middle" fill="#9a6b0a">停止订阅</text>
  <rect x="60" y="276" width="170" height="22" rx="5" fill="#ffffff" stroke="#9a6b0a"/>
  <text x="145" y="291" font-size="10.5" text-anchor="middle" fill="#9a6b0a">处理完已收到的增量</text>

  <text x="24" y="332" font-size="11" font-weight="bold" fill="#5c6a62">4</text>
  <line x1="149" y1="328" x2="611" y2="328" stroke="#5c6a62" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="440" y="322" font-size="11" text-anchor="middle" fill="#1c2420">TRANSFER:b 的所有者 = B,令牌 n → n+1</text>
  <line x1="149" y1="356" x2="841" y2="356" stroke="#157a55" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="560" y="350" font-size="11" text-anchor="middle" fill="#157a55">COMMIT:你现在是 b 的所有者,请开始处理</text>

  <text x="24" y="392" font-size="11" font-weight="bold" fill="#5c6a62">5</text>
  <rect x="40" y="378" width="400" height="26" rx="5" fill="#f8e6e1" stroke="#b3402e"/>
  <text x="240" y="395" font-size="10.5" text-anchor="middle" fill="#b3402e">超时(低于 stop hook 的 timeout):剩下的直接转交</text>

  <text x="24" y="436" font-size="11" font-weight="bold" fill="#5c6a62">6</text>
  <line x1="841" y1="432" x2="619" y2="432" stroke="#157a55" marker-end="url(#ag)"/>
  <text x="730" y="426" font-size="10.5" text-anchor="middle" fill="#157a55">再加载一次变化(write_seq)</text>
  <line x1="841" y1="458" x2="389" y2="458" stroke="#9a6b0a" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="615" y="452" font-size="10.5" text-anchor="middle" fill="#9a6b0a">订阅 deltas:{b}</text>
  <rect x="700" y="470" width="240" height="40" rx="5" fill="#ffffff" stroke="#157a55"/>
  <text x="820" y="486" font-size="10.5" text-anchor="middle" fill="#157a55">经派发网关向智能体查询</text>
  <text x="820" y="501" font-size="10.5" text-anchor="middle" fill="#157a55">丢失的输出 · 以 append: false 重新发布</text>

  <text x="24" y="508" font-size="11" font-weight="bold" fill="#5c6a62">7</text>
  <rect x="60" y="494" width="170" height="22" rx="5" fill="#ffffff" stroke="#5c6a62"/>
  <text x="145" y="509" font-size="10.5" text-anchor="middle" fill="#1c2420">stop hook 完成 · A 下线</text>

  <rect x="24" y="536" width="912" height="88" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="44" y="560" font-size="13" font-weight="bold" fill="#1c2420">中途出现失败时,现有机制兜底</text>
  <text x="44" y="582" font-size="11.5" fill="#1c2420">B 死了 → 普通接管 · COMMIT 丢了 → B 在下一次读取未采纳租约时发现 b · A 在第 4 步后写入 → 被围栏挡掉 ·</text>
  <text x="44" y="600" font-size="11.5" fill="#1c2420">A 在第 4 步后发布 → 订阅者丢弃令牌 n · 第 3 到第 6 步之间的增量实时到不了任何人 → B 在第 6 步找回。</text>
</svg>
