id: repeat-audit-analysis
version: "1"
title: 重复稽核任务处理 Workflow
nodes:
  - id: detect-scenario
    title: 步骤1-场景识别与工单解析
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        根据处罚策略名和告警内容识别重复稽核场景类型。
        请读取 skill ~/.openclaw/workspace/skills/repeat-audit-entry/workflow-pack/actions/scripts/detect_scenario.py 中的场景识别逻辑，然后根据以下输入判断场景类型：
        输入参数： - alertAccounts: {{input.params.alertAccounts}} - alertContent: {{input.params.alertContent}} - alertTime: {{input.params.alertTime}} - penaltyStrategy: {{input.params.penaltyStrategy}}
        场景识别规则： - 策略名含"欺诈/被欺诈者/跑分/fraud" → fraud - 策略名含"盗用/账户盗窃/ato/theft" → ato - 策略名含"外卡/国际/跨境/foreign/overseas" → foreign_card - 无法判断时默认 fraud
        同时解析出 userId（取 alertAccounts 第一个元素）和 alertTime。
        严格输出 JSON（不输出 Markdown，不输出解释）： {"scenarioType": "fraud|ato|foreign_card", "scenarioLabel": "场景中文标签", "userId": "2088xxx", "alertTime": "告警时间", "alertContent": "告警内容", "penaltyStrategy": ["策略列表"]}
    phase: P1
    businessStatus: scenario_detected
    dependsOn: []
    outputContract:
      schema:
        type: object
        required:
          - scenarioType
          - userId
          - alertTime
        properties:
          scenarioType:
            type: string
            enum:
              - fraud
              - ato
              - foreign_card
          scenarioLabel:
            type: string
          userId:
            type: string
          alertTime:
            type: string
          alertContent:
            type: string
          penaltyStrategy:
            type: array
    progressMessage: 正在识别场景类型...

  - id: query-alert-ticket
    title: 步骤2-告警工单事件查询
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        执行 alert-ticket-query skill 查询告警工单对应的稽核事件。
        请按照 ~/.openclaw/skills/alert-ticket-query/SKILL.md 的流程执行：
        参数提取： - userId: {{nodeOutput.detect-scenario.userId}} - endTime: {{nodeOutput.detect-scenario.alertTime}} - scene: {{nodeOutput.detect-scenario.scenarioType}}（fraud→欺诈, ato→盗用, foreign_card→外卡） - withOutAction: "null" - eventType: "SYN" - page_num: "0"
        执行命令： python3 ~/.openclaw/skills/alert-ticket-query/scripts/query_latest_transaction.py \
          --user_id {{nodeOutput.detect-scenario.userId}} \
          --end_time "{{nodeOutput.detect-scenario.alertTime}}" \
          --without_action "null" \
          --eventType "SYN" \
          --page_num "0" \
          --scene "{{nodeOutput.detect-scenario.scenarioType}}" \
          --user_query "重复稽核告警查询"

        读取脚本输出中的事件列表和事件详情，提取以下信息： - eventId: 稽核事件ID - eventTime: 事件发生时间 - decisionResult: 决策结果 - userName: 用户姓名 - transactionAmount: 交易金额 - counterpartyId: 对手方ID - counterpartyName: 对手方名称
        严格输出 JSON（不输出 Markdown，不输出解释）： {"eventId": "事件ID", "eventTime": "事件时间", "decisionResult": "决策结果", "userName": "用户姓名", "transactionAmount": 金额, "counterpartyId": "对手方ID", "counterpartyName": "对手方名称"}
      timeoutSeconds: 120
    phase: P2
    businessStatus: event_queried
    dependsOn:
      - detect-scenario
    retry:
      maxAttempts: 2
      backoffMs: 5000
    outputContract:
      schema:
        type: object
        required:
          - eventId
          - eventTime
          - decisionResult
        properties:
          eventId:
            type: string
          eventTime:
            type: string
          decisionResult:
            type: string
          userName:
            type: string
          transactionAmount:
            type: number
          counterpartyId:
            type: string
          counterpartyName:
            type: string
    progressMessage: 正在查询稽核事件...

  - id: query-strategy
    title: 步骤3-策略稽核查询
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        执行 get-strategy-info skill 查询策略稽核信息。
        请按照 ~/.openclaw/skills/get-strategy-info/SKILL.md 的流程执行：
        参数： - eventId: {{nodeOutput.query-alert-ticket.eventId}} - eventType: sync - scenario: {{nodeOutput.detect-scenario.scenarioType}}（fraud→fraud, ato→ato, foreign_card→overseas）
        步骤1 - 执行数据查询脚本： python3 ~/.openclaw/skills/get-strategy-info/scripts/query_strategy_info.py \
          --action batch \
          --event-id "{{nodeOutput.query-alert-ticket.eventId}}" \
          --event-type sync \
          --scenario "{{nodeOutput.detect-scenario.scenarioType}}" \
          --run-mode R

        步骤2 - 读取查询结果中决策日志和策略回放数据，提取： - hitStrategies: 命中的有效策略列表（排除MTR/MONITOR/REC类策略） - hitStrategyCount: 命中策略数量 - finalDecision: 最终决策 - riskLabels: 风险标签列表
        场景过滤规则： - fraud: 仅保留UCTEMPOWER域策略，排除含"mtr/monitor/record/rec"的策略 - ato: 保留 ACCOUNTTHEFTSYNC/UCTPOLICY/UCTBIOSYN/UCTFINANCE 域策略，排除含"mtr/monitor/record/rec"和标签含"变量验证/特征沉淀"的策略 - foreign_card: 仅保留UCTFRAUD域策略，排除含"MTR/REC"和标签含"监控策略/变量验证"的策略
        严格输出 JSON（不输出 Markdown，不输出解释）： {"hitStrategies": [{"id": "策略ID", "name": "策略名称", "domain": "域", "label": "标签"}], "hitStrategyCount": 数量, "finalDecision": "决策", "riskLabels": ["标签列表"]}
      timeoutSeconds: 120
    phase: P3
    businessStatus: strategy_queried
    dependsOn:
      - query-alert-ticket
    retry:
      maxAttempts: 2
      backoffMs: 5000
    outputContract:
      schema:
        type: object
        required:
          - hitStrategies
          - finalDecision
        properties:
          hitStrategies:
            type: array
          hitStrategyCount:
            type: number
          finalDecision:
            type: string
          riskLabels:
            type: array
    progressMessage: 正在查询策略稽核...

  - id: query-strategy-details
    title: 步骤4-策略明细分析
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        执行 query-event-strategy-details skill 查询策略明细。
        请按照 ~/.openclaw/skills/query-event-strategy-details/SKILL.md 的流程执行：
        对每个命中策略查询详细规则路由信息。
        参数： - eventId: {{nodeOutput.query-alert-ticket.eventId}} - eventType: sync - hitStrategies: {{nodeOutput.query-strategy.hitStrategies}}
        对每个策略执行： python3 ~/.openclaw/skills/query-event-strategy-details/scripts/query_strategy_route.py \
          --event-id "{{nodeOutput.query-alert-ticket.eventId}}" \
          --strategy-id "策略ID" \
          --domain "策略域" \
          --event-type "sync" \
          --output-dir "/tmp/repeat_audit_strategy_details"

        然后对每个策略执行处理脚本生成报告： python3 ~/.openclaw/skills/query-event-strategy-details/scripts/process_strategy_details.py \
          "{{nodeOutput.query-alert-ticket.eventId}}" \
          "策略ID" \
          "策略域" \
          "sync"

        收集所有策略的明细，汇总输出。
        严格输出 JSON（不输出 Markdown，不输出解释）： {"strategyDetails": [{"strategyId": "策略ID", "strategyName": "策略名称", "domain": "域", "rules": [{"ruleName": "规则名", "featureName": "特征名", "featureValue": "特征值", "threshold": "阈值", "result": "结果"}], "summary": "策略小结"}], "hasDetails": true/false}
      timeoutSeconds: 300
    phase: P4
    businessStatus: strategy_details_queried
    dependsOn:
      - query-strategy
    retry:
      maxAttempts: 2
      backoffMs: 5000
    outputContract:
      schema:
        type: object
        properties:
          strategyDetails:
            type: array
          hasDetails:
            type: boolean
    progressMessage: 正在分析策略明细...

  - id: query-interaction
    title: 步骤5-解限交互分析
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        执行 release-interaction-analysis skill 查询解限交互记录。
        请按照 ~/.openclaw/skills/release-interaction-analysis/SKILL.md 的流程执行：
        参数： - userId: {{nodeOutput.detect-scenario.userId}} - end_time: {{nodeOutput.detect-scenario.alertTime}} - scenario: {{nodeOutput.detect-scenario.scenarioType}}（fraud→fraud, ato→domestic_theft, foreign_card→foreign_card_theft）
        根据场景选择对应脚本：
        【欺诈场景】： python3 ~/.openclaw/skills/release-interaction-analysis/scenarios/fraud/scripts/fraud_scenario_query.py \
          full {{nodeOutput.detect-scenario.userId}} \
          --start "告警时间前7天" --end "{{nodeOutput.detect-scenario.alertTime}}" \
          --output "./output/fraud/raw"

        【国内盗用场景】： python3 ~/.openclaw/skills/release-interaction-analysis/scenarios/domestic_theft/scripts/unified_query_domestic.py \
          full-query {{nodeOutput.detect-scenario.userId}} \
          --start "告警时间前7天" --end "{{nodeOutput.detect-scenario.alertTime}}"

        【外卡盗用场景】： python3 ~/.openclaw/skills/release-interaction-analysis/scenarios/foreign_card_theft/scripts/foreign_card_theft_query.py \
          full {{nodeOutput.detect-scenario.userId}} \
          --start "告警时间前7天" --end "{{nodeOutput.detect-scenario.alertTime}}"

        读取原始结果后，按照 skill 文档中的阶段B总结逻辑进行结构化分析。
        严格输出 JSON（不输出 Markdown，不输出解释）： {"hasServiceTask": true/false, "serviceTaskCount": 数量, "hotlineRecords": 数量, "onlineRecords": 数量, "interactionSummary": "交互记录摘要", "releaseDetails": [{"releaseTime": "时间", "channel": "渠道", "authType": "核身类型", "ipLocation": "IP地点", "device": "设备信息"}], "riskIndicators": ["风险指标"]}
      timeoutSeconds: 180
    phase: P5
    businessStatus: interaction_queried
    dependsOn:
      - query-strategy-details
    outputContract:
      schema:
        type: object
        properties:
          hasServiceTask:
            type: boolean
          serviceTaskCount:
            type: number
          hotlineRecords:
            type: number
          onlineRecords:
            type: number
          interactionSummary:
            type: string
          releaseDetails:
            type: array
          riskIndicators:
            type: array
    progressMessage: 正在查询解限交互记录...

  - id: query-features
    title: 步骤6-特征数据查询
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        执行 featuresnap_by_eventId skill 和 fraud-risk-analysis 的 query_data.py 查询特征数据。
        步骤1 - 查询事件特征快照： 请按照 ~/.openclaw/skills/featuresnap_by_eventId/SKILL.md 执行：
        python3 ~/.openclaw/skills/featuresnap_by_eventId/scripts/get_feature_res_by_eventid.py \
          --eventID "{{nodeOutput.query-alert-ticket.eventId}}"

        步骤2 - 查询特征计算数据（fraud场景专用）： 请按照 ~/.openclaw/skills/fraud-risk-analysis/SKILL.md 执行：
        python3 ~/.openclaw/skills/fraud-risk-analysis/scripts/query_data.py calc \
          --user-id "{{nodeOutput.detect-scenario.userId}}" \
          --alert-time "{{nodeOutput.detect-scenario.alertTime}}" \
          --output /tmp/repeat_audit_feature_calc.json

        注意：必须传入 --alert-time 参数，否则部分特征返回无效值！
        读取两个查询结果，合并输出。
        严格输出 JSON（不输出 Markdown，不输出解释）： {"featureCalc": {特征计算结果}, "featureSnap": {特征快照结果}, "transactions": [交易流水列表]}
      timeoutSeconds: 120
    phase: P6
    businessStatus: features_queried
    dependsOn:
      - query-interaction
    outputContract:
      schema:
        type: object
        properties:
          featureCalc:
            type: object
          featureSnap:
            type: object
          transactions:
            type: array
    progressMessage: 正在查询特征数据...

  - id: risk-analysis
    title: 步骤7-场景化风险研判
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        根据 scenarioType 执行对应场景的风险研判 skill。
        已收集的上下文数据： - scenarioType: {{nodeOutput.detect-scenario.scenarioType}} - userId: {{nodeOutput.detect-scenario.userId}} - eventId: {{nodeOutput.query-alert-ticket.eventId}} - eventTime: {{nodeOutput.query-alert-ticket.eventTime}} - alertTime: {{nodeOutput.detect-scenario.alertTime}} - hitStrategies: {{nodeOutput.query-strategy.hitStrategies}} - riskLabels: {{nodeOutput.query-strategy.riskLabels}} - strategyDetails: {{nodeOutput.query-strategy-details.strategyDetails}} - interactionData: {{nodeOutput.query-interaction}} - featureCalc: {{nodeOutput.query-features.featureCalc}} - featureSnap: {{nodeOutput.query-features.featureSnap}}
        【如果 scenarioType = fraud】： 请读取并执行 ~/.openclaw/skills/fraud-risk-analysis/SKILL.md 中的完整分析流程。 该 skill 包含四个脚本，按顺序执行： 1. python3 ~/.openclaw/skills/fraud-risk-analysis/scripts/query_data.py calc --user-id "{{nodeOutput.detect-scenario.userId}}" --alert-time "{{nodeOutput.detect-scenario.alertTime}}" --output /tmp/repeat_audit_fraud_features.json 2. python3 ~/.openclaw/skills/fraud-risk-analysis/scripts/paofen_judgment.py --input /tmp/repeat_audit_fraud_features.json --output /tmp/repeat_audit_paofen.json 3. python3 ~/.openclaw/skills/fraud-risk-analysis/scripts/strategy_consistency.py --input /tmp/repeat_audit_paofen.json --output /tmp/repeat_audit_consistency.json 4. python3 ~/.openclaw/skills/fraud-risk-analysis/scripts/risk_classification.py --input /tmp/repeat_audit_consistency.json --output /tmp/repeat_audit_classification.json
        最终从 risk_classification.py 的输出获取分类结果。
        【如果 scenarioType = ato】： 请读取并执行 ~/.openclaw/skills/ato-scene-risk-analysis/SKILL.md 中的完整分析流程。 四步分析：1)管控策略稽核风险分析 2)补充信息风险分析 3)解限/核身/交互风险分析 4)综合研判 需要调用 ~/.openclaw/skills/ato-scene-risk-analysis/scripts/ 下的脚本执行数据查询和分析。
        【如果 scenarioType = foreign_card】： 请读取并执行 ~/.openclaw/skills/fc-risk-analysis/SKILL.md 中的完整分析流程。 基于稽核事件、策略、交互和补充信息研判风险等级。
        严格输出 JSON（不输出 Markdown，不输出解释）： {"classification": "被骗|跑分|误稽核", "classificationCode": "SCAMMED|PAOFEN|FALSE_POSITIVE", "confidence": 置信度0-100, "riskLevel": "低|中|高|极高", "riskLevelCode": "LOW|MEDIUM|HIGH|CRITICAL", "keyFactors": ["关键因素1", "关键因素2"], "evidence": ["证据1", "证据2"], "analysisSummary": "分析摘要"}
      timeoutSeconds: 300
    phase: P7
    businessStatus: risk_analyzed
    dependsOn:
      - query-features
    outputContract:
      schema:
        type: object
        required:
          - classification
          - classificationCode
          - confidence
        properties:
          classification:
            type: string
            enum:
              - 被骗
              - 跑分
              - 误稽核
          classificationCode:
            type: string
            enum:
              - SCAMMED
              - PAOFEN
              - FALSE_POSITIVE
          confidence:
            type: number
          riskLevel:
            type: string
          riskLevelCode:
            type: string
          keyFactors:
            type: array
          evidence:
            type: array
          analysisSummary:
            type: string
    progressMessage: 正在执行风险研判...

  - id: generate-dealing-advice
    title: 步骤8-处置建议生成
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        根据风险研判结论和场景类型生成处置建议。
        请按照对应场景的处置建议 skill 执行：
        【如果 scenarioType = fraud】： 请读取 ~/.openclaw/skills/fraud-dealing-advice/SKILL.md 中的处置映射逻辑。
        结论映射： - classificationCode=SCAMMED → 不做保障，同步服审外呼 - classificationCode=PAOFEN → 不做保障，同步下游跑分团队治理 - classificationCode=FALSE_POSITIVE → 保障用户3日内免疫
        【如果 scenarioType = ato】： 请读取 ~/.openclaw/skills/theft-risk-suggestion/SKILL.md 中的处置建议逻辑。 需要判断是否已完成相似操作，推荐临时保障名单。
        【如果 scenarioType = foreign_card】： 基于外卡风险研判结论生成对应处置建议。
        输入数据： - scenarioType: {{nodeOutput.detect-scenario.scenarioType}} - classification: {{nodeOutput.risk-analysis.classification}} - classificationCode: {{nodeOutput.risk-analysis.classificationCode}} - confidence: {{nodeOutput.risk-analysis.confidence}} - keyFactors: {{nodeOutput.risk-analysis.keyFactors}} - userId: {{nodeOutput.detect-scenario.userId}}
        严格输出 JSON（不输出 Markdown，不输出解释）： {"advice": "处置建议文本", "actions": {"listProtection": "名单保障措施", "syncAction": "同步动作", "riskAlert": "风险提示"}, "governanceSuggestion": "治理建议"}
      timeoutSeconds: 120
    phase: P8
    businessStatus: advice_generated
    dependsOn:
      - risk-analysis
    outputContract:
      schema:
        type: object
        required:
          - advice
          - actions
        properties:
          advice:
            type: string
          actions:
            type: object
          governanceSuggestion:
            type: string
    progressMessage: 正在生成处置建议...

  - id: generate-final-report
    title: 步骤9-生成最终报告
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        整合全流程数据生成完整的重复稽核分析报告。
        报告数据来源： - userId: {{nodeOutput.detect-scenario.userId}} - userName: {{nodeOutput.query-alert-ticket.userName}} - alertTime: {{nodeOutput.detect-scenario.alertTime}} - alertContent: {{nodeOutput.detect-scenario.alertContent}} - scenarioType: {{nodeOutput.detect-scenario.scenarioType}} - eventId: {{nodeOutput.query-alert-ticket.eventId}} - eventTime: {{nodeOutput.query-alert-ticket.eventTime}} - decisionResult: {{nodeOutput.query-alert-ticket.decisionResult}} - transactionAmount: {{nodeOutput.query-alert-ticket.transactionAmount}} - hitStrategies: {{nodeOutput.query-strategy.hitStrategies}} - riskLabels: {{nodeOutput.query-strategy.riskLabels}} - strategyDetails: {{nodeOutput.query-strategy-details.strategyDetails}} - interactionData: {{nodeOutput.query-interaction}} - classification: {{nodeOutput.risk-analysis.classification}} - classificationCode: {{nodeOutput.risk-analysis.classificationCode}} - confidence: {{nodeOutput.risk-analysis.confidence}} - keyFactors: {{nodeOutput.risk-analysis.keyFactors}} - dealingAdvice: {{nodeOutput.generate-dealing-advice}}
        生成 Markdown 格式报告，包含以下章节： 1. 基本信息（账户、告警时间、场景类型、事件ID） 2. 策略稽核分析（命中策略、风险标签、策略明细） 3. 解限交互分析（交互记录、核身统计） 4. 风险研判结论（分类结论、置信度、关键因素、证据） 5. 处置建议 6. 附录（原始数据摘要）
        将报告保存到 /tmp/repeat_audit_report_{{nodeOutput.detect-scenario.userId}}_{{nodeOutput.query-alert-ticket.eventId}}.md
        严格输出 JSON（不输出 Markdown，不输出解释）： {"reportPath": "/tmp/repeat_audit_report_xxx.md", "reportContent": "Markdown格式报告内容"}
      timeoutSeconds: 120
    phase: P9
    businessStatus: report_generated
    dependsOn:
      - generate-dealing-advice
    outputContract:
      schema:
        type: object
        required:
          - reportPath
          - reportContent
        properties:
          reportPath:
            type: string
          reportContent:
            type: string
    progressMessage: 正在生成分析报告...

  - id: done
    title: 重复稽核分析完成
    executor:
      type: done
    phase: P10
    businessStatus: completed
    dependsOn:
      - generate-final-report

input:
  mode: mixed
  requiredParams:
    - alertAccounts
    - alertContent
    - alertTime
  schema:
    type: object
    properties:
      alertAccounts:
        type: array
        description: 告警账户列表，如 ["2088102563120972"]
      alertContent:
        type: string
        description: 告警内容，如"服审-外呼-解限后再稽核-告警"
      alertTime:
        type: string
        description: 告警时间，格式"2026-07-03 13:31:02"
      penaltyStrategy:
        type: array
        description: 处罚策略名列表，如["商户欺诈-被欺诈者持续失败-通用-直连BD"]
      ticketUrl:
        type: string
        description: 工单地址/ID

identity:
  key: "{{input.params.alertAccounts}}"
  label: 重复稽核_{{input.params.alertAccounts}}
  duplicatePolicy: reject-active

outputs:
  classification:
    from: "{{nodeOutput.risk-analysis.classification}}"
    public: true
    description: 风险研判结论（被骗/跑分/误稽核）
  confidence:
    from: "{{nodeOutput.risk-analysis.confidence}}"
    public: true
    description: 研判置信度
  dealingAdvice:
    from: "{{nodeOutput.generate-dealing-advice.advice}}"
    public: true
    description: 处置建议
  reportPath:
    from: "{{nodeOutput.generate-final-report.reportPath}}"
    public: true
    description: 完整分析报告路径

debug:
  summaryKeys:
    - workflowData.userId
    - workflowData.scenarioType
    - workflowData.eventId
    - nodeOutput.risk-analysis.classification
    - nodeOutput.risk-analysis.confidence

goal: |
  自动完成重复稽核告警任务的全流程分析，识别欺诈/盗用/外卡风险场景，
  调用各场景专用 skill 进行稽核事件.query、策略分析、交互记录查询、特征数据查询，
  执行场景化风险研判（fraud-risk-analysis / ato-scene-risk-analysis / fc-risk-analysis），
  生成处置建议（fraud-dealing-advice / theft-risk-suggestion），
  汇总输出完整分析报告。

exitCriteria: |-
  1. 成功识别场景类型（欺诈/盗用/外卡）
  2. 完成稽核事件查询并获取事件详情（alert-ticket-query skill）
  3. 完成策略稽核查询并获取命中策略列表（get-strategy-info skill）
  4. 完成策略明细分析（query-event-strategy-details skill）
  5. 完成解限交互分析（release-interaction-analysis skill）
  6. 完成特征数据查询（featuresnap_by_eventId + fraud-risk-analysis query_data skill）
  7. 完成场景化风险研判并输出分类结论和置信度（fraud-risk-analysis / ato-scene-risk-analysis / fc-risk-analysis skill）
  8. 生成对应的处置建议（fraud-dealing-advice / theft-risk-suggestion skill）
  9. 生成完整的分析报告并输出到指定路径