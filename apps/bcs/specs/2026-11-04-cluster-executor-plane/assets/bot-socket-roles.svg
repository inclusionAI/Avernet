<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2457a6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">Bot socket on the draining node: two independent jobs</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">Handoff moves session ownership. It does not touch the socket, so the bot's stream is never interrupted.</text>

  <!-- before -->
  <rect x="24" y="72" width="440" height="250" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="244" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2420">Before handoff</text>
  <rect x="44" y="120" width="120" height="44" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="104" y="147" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">Bot X</text>
  <rect x="200" y="112" width="244" height="180" rx="10" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="322" y="134" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#9a6b0a">Node A</text>
  <rect x="216" y="146" width="212" height="42" rx="6" fill="#ffffff" stroke="#5c6a62"/>
  <text x="322" y="164" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1c2420">socket holder for X</text>
  <text x="322" y="180" font-size="10.5" text-anchor="middle" fill="#5c6a62">transport</text>
  <rect x="216" y="228" width="212" height="48" rx="6" fill="#e3f0e9" stroke="#157a55"/>
  <text x="322" y="248" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#157a55">owner of S</text>
  <text x="322" y="265" font-size="10.5" text-anchor="middle" fill="#5c6a62">decisions, fenced writes</text>
  <line x1="164" y1="148" x2="212" y2="164" stroke="#5c6a62" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="322" y1="188" x2="322" y2="224" stroke="#2457a6" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="330" y="212" font-size="10.5" fill="#2457a6">in-process</text>

  <!-- after -->
  <rect x="496" y="72" width="440" height="250" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="716" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2420">After handoff (A is now "node C" for S)</text>
  <rect x="516" y="120" width="80" height="44" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="556" y="147" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">Bot X</text>
  <rect x="640" y="112" width="140" height="90" rx="10" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="710" y="134" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#9a6b0a">Node A</text>
  <text x="710" y="156" font-size="11" text-anchor="middle" fill="#1c2420">socket holder</text>
  <text x="710" y="172" font-size="11" text-anchor="middle" fill="#1c2420">for X</text>
  <text x="710" y="190" font-size="10" text-anchor="middle" fill="#5c6a62">owns nothing</text>
  <rect x="800" y="208" width="120" height="68" rx="10" fill="#e3f0e9" stroke="#157a55"/>
  <text x="860" y="232" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#157a55">Node B</text>
  <text x="860" y="252" font-size="11" text-anchor="middle" fill="#1c2420">owner of S</text>
  <line x1="598" y1="142" x2="636" y2="152" stroke="#5c6a62" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="780" y1="170" x2="840" y2="204" stroke="#2457a6" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="690" y="226" font-size="10.5" fill="#2457a6">relay per event</text>
  <text x="690" y="240" font-size="10.5" fill="#2457a6">to current owner</text>
  <text x="516" y="300" font-size="11" fill="#5c6a62">The socket holder looks up S's owner for every event —</text>
  <text x="516" y="314" font-size="11" fill="#5c6a62">it must never remember "the owner is me" for a run.</text>

  <!-- rules -->
  <rect x="24" y="340" width="912" height="160" rx="10" fill="#ffffff" stroke="#5c6a62"/>
  <text x="44" y="364" font-size="13" font-weight="bold" fill="#1c2420">What waits is closing the socket, not the session</text>
  <text x="44" y="388" font-size="11.5" fill="#1c2420">• One socket can carry runs for sessions owned by any node. Closing it interrupts all of them, so A closes it only when every run on it has ended.</text>
  <text x="44" y="408" font-size="11.5" fill="#1c2420">• Until then A starts no new work on it, but still relays events, allows chat.abort for in-flight runs, and answers the bot's own requests.</text>
  <text x="44" y="428" font-size="11.5" fill="#1c2420">• New work for X is never queued at A: it stays a durable delivery row owned by the session's owner, dispatched once X is reachable elsewhere.</text>
  <text x="44" y="448" font-size="11.5" fill="#1c2420">• Then A sends "please reconnect" (or closes); X redials through the LB and lands on a non-draining node.</text>
  <text x="44" y="476" font-size="11" fill="#b3402e">Requires item 2: per-event relay to the current owner, cluster-wide bot reachability, and a "please reconnect" frame.</text>
</svg>
