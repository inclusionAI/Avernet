<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2457a6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">Bot sockets live on gateways; session ownership lives on executors</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">Handing session S from executor A to B does not touch bot X's socket, so the bot never notices.</text>

  <!-- before -->
  <rect x="24" y="72" width="440" height="230" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="244" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2420">Before handoff</text>
  <rect x="44" y="124" width="100" height="44" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="94" y="151" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">Bot X</text>
  <rect x="184" y="116" width="120" height="60" rx="10" fill="#eef2fa" stroke="#2457a6"/>
  <text x="244" y="140" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2457a6">Gateway G</text>
  <text x="244" y="158" font-size="10.5" text-anchor="middle" fill="#5c6a62">holds X's socket</text>
  <rect x="334" y="200" width="112" height="60" rx="10" fill="#e3f0e9" stroke="#157a55"/>
  <text x="390" y="224" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#157a55">Executor A</text>
  <text x="390" y="242" font-size="10.5" text-anchor="middle" fill="#1c2420">owner of S</text>
  <line x1="144" y1="146" x2="180" y2="146" stroke="#5c6a62" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="290" y1="176" x2="350" y2="198" stroke="#2457a6" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="220" y="206" font-size="10.5" fill="#2457a6">forward per event</text>

  <!-- after -->
  <rect x="496" y="72" width="440" height="230" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="716" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2420">After handoff</text>
  <rect x="516" y="124" width="100" height="44" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="566" y="151" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">Bot X</text>
  <rect x="656" y="116" width="120" height="60" rx="10" fill="#eef2fa" stroke="#2457a6"/>
  <text x="716" y="140" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2457a6">Gateway G</text>
  <text x="716" y="158" font-size="10.5" text-anchor="middle" fill="#5c6a62">same socket</text>
  <rect x="806" y="200" width="112" height="60" rx="10" fill="#e3f0e9" stroke="#157a55"/>
  <text x="862" y="224" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#157a55">Executor B</text>
  <text x="862" y="242" font-size="10.5" text-anchor="middle" fill="#1c2420">owner of S now</text>
  <line x1="616" y1="146" x2="652" y2="146" stroke="#5c6a62" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="762" y1="176" x2="822" y2="198" stroke="#2457a6" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="640" y="206" font-size="10.5" fill="#2457a6">next event → B</text>
  <text x="516" y="272" font-size="11" fill="#5c6a62">G looks up S's owner for every event (hint + NOT_OWNER);</text>
  <text x="516" y="288" font-size="11" fill="#5c6a62">it never remembers an owner for the life of a run.</text>

  <!-- rules -->
  <rect x="24" y="320" width="912" height="160" rx="10" fill="#ffffff" stroke="#5c6a62"/>
  <text x="44" y="344" font-size="13" font-weight="bold" fill="#1c2420">Only draining the gateway touches the socket</text>
  <text x="44" y="368" font-size="11.5" fill="#1c2420">• One socket can carry runs for sessions owned by any executor. Closing it interrupts all of them, so G closes it only when every run on it has ended.</text>
  <text x="44" y="388" font-size="11.5" fill="#1c2420">• Until then G starts no new work on it, but still forwards events, allows chat.abort for in-flight runs, and answers the bot's own requests.</text>
  <text x="44" y="408" font-size="11.5" fill="#1c2420">• New work for X is never queued at G: it stays a durable delivery owned by the session's owner, dispatched once X is reachable again.</text>
  <text x="44" y="428" font-size="11.5" fill="#1c2420">• Then G sends "please reconnect"; X redials through the load balancer and lands on another gateway.</text>
  <text x="44" y="456" font-size="11" fill="#b3402e">Requires item 2: per-event forwarding to the current owner, a cluster-wide "which gateway holds bot X" registry, and a "please reconnect" frame.</text>
</svg>
