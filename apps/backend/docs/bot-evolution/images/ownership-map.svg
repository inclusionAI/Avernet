<text x="46" y="476" font-size="13" font-weight="600" fill="#334155" text-anchor="start" dominant-baseline="middle">Contracts between the workstreams, and the doc that owns each</text>
<text x="40" y="498" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">Platform ↔ ClawEvolve</text>
<text x="40" y="518" font-size="10" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">strategy port run(ctx) and the Job Protocol — 03 §2, 06 §9</text>
<text x="40" y="534" font-size="10" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">registration record, params_schema, agent definitions — 03 §2.2</text>
<text x="40" y="550" font-size="10" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">Episode schema and the session-export contract — 02 §5</text>
<text x="40" y="566" font-size="10" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">conformance kit, both sides of the port — 03 §8.4</text>
<text x="420" y="498" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">ClawEvolve ↔ Evaluation</text>
<text x="420" y="518" font-size="10" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">evaluation.train@1: add cases, scores, critiques — 03 §4.2, 07 §5</text>
<text x="420" y="534" font-size="10" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">Verdict view: status and aggregates only — 07 §2.6</text>
<text x="420" y="550" font-size="10" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">case format clawbench-md@1 — 07 §2.2</text>
<text x="420" y="566" font-size="10" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">ClawBench graders and gates extracted — 04 §4.5</text>
<text x="800" y="498" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">Platform ↔ Evaluation</text>
<text x="800" y="518" font-size="10" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">verify(candidate, profile) and train evaluation — 06 §5.4, 07 §9</text>
<text x="800" y="534" font-size="10" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">FloorCheck and GateDecision — 08 §4</text>
<text x="800" y="550" font-size="10" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">eval traces into the Experience Store — 02 §1</text>
<text x="800" y="566" font-size="10" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">deployed executor via eval_publish / eval_env — 07 §2.3</text>
<rect x="30" y="600" width="1120" height="124" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="46" y="620" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">To settle together before coding against each other</text>
<text x="46" y="642" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">RSI-01  accept or revise DR-1 (the genome is the unit of evolution) and DR-2 (promotion is platform-owned)</text>
<text x="46" y="659" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">DS-6  one ClawEvolve strategy with params, or three (bot_evolution, skill_evolution, skill_hardening)</text>
<text x="46" y="676" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">ER-10 / S-8  how a sandboxed job worker reaches the strategy's own progress store</text>
<text x="46" y="693" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">DS-2  ClawBench as the default grader or one of several · DS-1  long-term host of the ClawEvolve strategy code</text>
<text x="46" y="710" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">OP-4 (this guide §7)  mid-run human input: ClawEvolve stages can ask the user; platform runs are unattended</text>
