name: Singlebox Coverage

on:
  pull_request:
    branches:
      - dev
      - dev_refactory_collaboration
      - main
      - 'REL*'
  push:
    branches:
      - dev
      - dev_refactory_collaboration
      - main
  workflow_dispatch:
    inputs:
      use_cn_mirror:
        description: "Use public China mirrors for dependency downloads"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: singlebox-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  singlebox-coverage:
    name: Singlebox coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      OCB_SKIP_GIT_HOOKS: "1"
      SINGLEBOX_MODEL_CONFIG_MODE: mock
      SINGLEBOX_COVERAGE_MODE: real
      SINGLEBOX_COVERAGE_BCS_LINE_MIN: "40"
      SINGLEBOX_COVERAGE_BCS_METHOD_MIN: "36"
      USE_CN_MIRROR: ${{ inputs.use_cn_mirror && '1' || '' }}
      BCN_PLUGIN_SOURCE: source
      CARGO_TERM_COLOR: always
      # PR: compare against the checked-out merge commit's exact base tree.
      # push/dispatch: compare against dev (repo default branch) instead.
      SINGLEBOX_BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/dev' }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect singlebox-relevant changes vs base
        id: changes
        shell: bash
        run: |
          # Always run on manual dispatch so an operator can force coverage.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch; running singlebox coverage regardless of changed files."
            exit 0
          fi
          # Ensure the base ref is present locally (shallow clones may not have it).
          git fetch --no-tags --depth=1 origin "${SINGLEBOX_BASE_REF#origin/}" 2>/dev/null || true
          # Diff base against the working tree. PR checkouts are merge commits,
          # so diffing the tree (not HEAD) against the base captures all PR-introduced
          # changes regardless of the merge-commit structure.
          mapfile -t files < <(git diff --name-only "${SINGLEBOX_BASE_REF}" -- \
            scripts \
            src/backend \
            src/baas \
            src/bcs \
            src/engine \
            src/frontend \
            .github/workflows/singlebox-coverage.yml \
            || true)
          n=${#files[@]}
          if [ "$n" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No singlebox-relevant changes vs ${SINGLEBOX_BASE_REF}; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Detected ${n} singlebox-relevant changed file(s) vs ${SINGLEBOX_BASE_REF}:"
            printf '%s\n' "${files[@]}" | sed 's/^/  - /'
          fi

      - name: Mark singlebox coverage as passed (no relevant changes)
        if: steps.changes.outputs.skip == 'true'
        run: echo "No singlebox-relevant changes detected; marking job as passed."

      - name: Set up Python
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Cache ~/.npm keyed on the committed lockfiles. `npm ci` for the
          # frontend (2153 packages, ~44s) and the BCS panel asset then
          # resolve tarballs from the cache; the openclaw global install and
          # the lockfile-less BCN plugin build share the same tarball cache.
          cache: npm
          cache-dependency-path: |
            src/frontend/package-lock.json
            src/bcs/assets/panel/package-lock.json

      - name: Install Rust toolchain
        if: steps.changes.outputs.skip != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add llvm-tools
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          rustc --version
          cargo --version

      - name: Install cargo-llvm-cov
        if: steps.changes.outputs.skip != 'true'
        # Prebuilt release binary into ~/.cargo/bin. `cargo install
        # cargo-llvm-cov --locked` compiled it from source on every run
        # (~55s of the 61s toolchain step); the download takes seconds.
        # No version pin, so this tracks the latest release exactly like
        # `cargo install` did.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Show cargo-llvm-cov version
        if: steps.changes.outputs.skip != 'true'
        run: cargo llvm-cov --version

      - name: Install system dependencies
        if: steps.changes.outputs.skip != 'true'
        # ubuntu-latest already ships gcc/make, curl, git, jq, libsqlite3-dev,
        # libssl-dev, lsof, pkg-config, and procps; listing them here only
        # pulled in package upgrades. protobuf-compiler (protoc, needed by
        # the BCS build) is the one package the image lacks.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install uv
        if: steps.changes.outputs.skip != 'true'
        # Same setup as unit-tests.yml. The cache holds uv's wheel/sdist-build
        # cache (~/.cache/uv), keyed on the lockfiles of every project the
        # coverage stack syncs, so `uv sync` links from cache instead of
        # re-downloading (and rebuilding jieba from sdist) on every run.
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            src/backend/uv.lock
            src/baas/uv.lock
            src/bcsfuse/uv.lock
            src/engine/uv.lock

      - name: Show uv version
        if: steps.changes.outputs.skip != 'true'
        run: uv --version

      - name: Install OpenClaw CLI
        if: steps.changes.outputs.skip != 'true'
        run: |
          npm install -g openclaw@2026.6.1
          openclaw --version || true

      - name: Cache Cargo registry and git
        if: steps.changes.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          # Registry/git fetch only. NOT src/bcs/target: the instrumented
          # build under target/cov-e2e/llvm-cov-target is force-rebuilt every
          # run (BCS_COVERAGE_FORCE_REBUILD=1) so coverage always reflects
          # the pushed source; caching those artifacts would risk stale
          # coverage across commits (same reasoning as e2e-tests.yml).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-singlebox-${{ hashFiles('src/bcs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-singlebox-
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Cache built BCN plugin
        if: steps.changes.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          # `setup_bcn_plugin` (scripts/modules/bcs.sh) rebuilds the plugin from
          # source on every run: three unlocked npm tree operations in a fresh
          # temp dir. package-lock.json is gitignored for this package, so npm
          # re-resolves all 2051 packages from the registry each time — the one
          # npm step in this job with no lockfile to fall back on. That cost 29s
          # when the registry was fast and 11m when it was not (run 33837445531).
          # Restoring dist/ + node_modules makes the script's own
          # "BCN plugin already built, skipping" branch fire instead.
          #
          # No restore-keys: a near-miss would restore a dist/ built from a
          # different package.json and the skip branch would accept it, so the
          # key must match exactly or the plugin is rebuilt. node_modules is the
          # prod-only tree the build reduces to before copying back: `ws` alone,
          # 232 KB, so this entry stays small against the repo cache budget.
          path: |
            src/bcs/crates/plugins/openclaw-channel-bcn/dist
            src/bcs/crates/plugins/openclaw-channel-bcn/node_modules
          key: ${{ runner.os }}-bcn-plugin-${{ hashFiles('src/bcs/crates/plugins/openclaw-channel-bcn/package.json', 'src/bcs/crates/plugins/openclaw-channel-bcn/.npmrc') }}

      - name: Validate shell scripts
        if: steps.changes.outputs.skip != 'true'
        run: |
          bash -n scripts/singlebox.sh
          bash -n scripts/ci/singlebox_coverage.sh
          find scripts/modules -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: Run singlebox coverage
        if: steps.changes.outputs.skip != 'true'
        run: |
          echo "SINGLEBOX_COVERAGE_MODE=${SINGLEBOX_COVERAGE_MODE}"
          bash scripts/ci/singlebox_coverage.sh

      - name: Verify singlebox coverage artifacts
        if: steps.changes.outputs.skip != 'true'
        run: |
          python3 scripts/ci/verify_singlebox_coverage_artifacts.py \
            --reports-dir scripts/.dependencies/coverage/singlebox/reports \
            --bcs-line-min 40 \
            --bcs-method-min 36 \
            --bcs-router-min 100 \
            --bcs-cli-min 100

      - name: Show singlebox diagnostics on failure
        if: failure() && steps.changes.outputs.skip != 'true'
        run: |
          bash scripts/singlebox.sh --standalone status all || true
          bash scripts/singlebox.sh --local status all || true
          find scripts/.dependencies/logs -maxdepth 2 -type f -print -exec tail -n 160 {} \; || true
          find .standalone-openclaw -type f -name "*.log" -print -exec tail -n 160 {} \; || true

      - name: Stop singlebox
        if: always() && steps.changes.outputs.skip != 'true'
        run: |
          bash scripts/singlebox.sh --standalone stop all || true
          bash scripts/singlebox.sh --local stop all || true

      - name: Upload singlebox artifacts
        if: always() && steps.changes.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: singlebox-coverage-artifacts
          path: |
            scripts/.dependencies/logs/**
            scripts/.dependencies/coverage/singlebox/**
            scripts/.dependencies/standalone/**
            .standalone-openclaw/logs/**
            src/bcs/target/cov-e2e/cobertura.xml
            src/bcs/target/cov-e2e/coverage.txt
            src/bcs/target/cov-e2e/summary.json
            src/bcs/target/cov-e2e/endpoint_coverage.xml
            src/bcs/target/cov-e2e/endpoint_coverage.txt
            src/bcs/target/cov-e2e/cli_command_coverage.txt
          if-no-files-found: ignore
