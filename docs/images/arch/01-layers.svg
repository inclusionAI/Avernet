<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 760" width="1260" height="760" role="img" aria-label="微内核七角色分层对照图">
  <style>
    .bg{fill:#FAF9F7}
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
    .m{font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
    .title{font-size:25px;font-weight:600;fill:#1F1E1C}
    .sub{font-size:13.5px;fill:#75736E}
    .colhead{font-size:11.5px;font-weight:600;fill:#8A8781;letter-spacing:.06em}
    .role{font-size:14.5px;font-weight:600;fill:#1F1E1C}
    .roleen{font-size:10.5px;fill:#9A968F;letter-spacing:.04em}
    .pkg{font-size:13px;font-weight:600}
    .desc{font-size:11.5px;fill:#5E5C57}
    .foot{font-size:12.5px;fill:#33322E}
    .footm{font-size:11px;fill:#75736E}
    .axis{font-size:11.5px;font-weight:600;fill:#8A8781;letter-spacing:.08em}
  </style>
  <rect class="bg" width="1260" height="760"/>
  <g class="t">
    <text x="44" y="50" class="title">微内核七角色：一套分层，两个模块</text>
    <text x="44" y="78" class="sub">backend 与 engine 在结构上同构。差异不在层数，而在每一层抽象的对象 —— backend 抽象外部基础设施，engine 抽象异构 Agent 引擎本身。</text>

    <text x="44" y="116" class="colhead">架构角色</text>
    <text x="274" y="116" class="colhead">BACKEND · src/backend/src/agentclaw/community</text>
    <text x="734" y="116" class="colhead">ENGINE · src/engine/src/engine/community</text>
    <line x1="44" y1="126" x2="1178" y2="126" stroke="#D8D5CF" stroke-width="1"/>

    <!-- row 1 delivery -->
    <text x="44" y="164" class="role">交付适配</text>
    <text x="44" y="182" class="roleen">DELIVERY ADAPTER</text>
    <rect x="274" y="140" width="444" height="60" rx="6" fill="#E4EBF5" stroke="#3C6198"/>
    <text x="290" y="166" class="m pkg" fill="#22405F">adapters/http/</text>
    <text x="290" y="186" class="desc">40+ 个路由组 · FastAPI · 只做协议翻译，不持有领域策略</text>
    <rect x="734" y="140" width="444" height="60" rx="6" fill="#E4EBF5" stroke="#3C6198"/>
    <text x="750" y="166" class="m pkg" fill="#22405F">api/</text>
    <text x="750" y="186" class="desc">20+ 个路由组 + WebSocket /api/{engine}/ws · 同名不同角色</text>

    <!-- row 2 service api -->
    <text x="44" y="236" class="role">服务契约</text>
    <text x="44" y="254" class="roleen">SERVICE API · 外 → 内</text>
    <rect x="274" y="212" width="444" height="60" rx="6" fill="#F6EBD8" stroke="#A1762E"/>
    <text x="290" y="238" class="m pkg" fill="#5E4519">api/</text>
    <text x="290" y="258" class="desc">115 个 Protocol 再导出 · 定义在 owning core 模块，此处只 re-export</text>
    <rect x="734" y="212" width="444" height="60" rx="6" fill="#F6EBD8" stroke="#A1762E"/>
    <text x="750" y="238" class="m pkg" fill="#5E4519">core/&lt;domain&gt;/protocol.py</text>
    <text x="750" y="258" class="desc">23 个能力域协议 · SessionService / ChatService / McpService …</text>

    <!-- row 3 core -->
    <text x="44" y="308" class="role">领域内核</text>
    <text x="44" y="326" class="roleen">CORE</text>
    <rect x="274" y="284" width="444" height="60" rx="6" fill="#E3EDE4" stroke="#3F7350"/>
    <text x="290" y="310" class="m pkg" fill="#26452F">core/</text>
    <text x="290" y="330" class="desc">55 个领域模块 · 零 fastapi / starlette 导入（AST 门禁强制）</text>
    <rect x="734" y="284" width="444" height="60" rx="6" fill="#E3EDE4" stroke="#3F7350"/>
    <text x="750" y="310" class="m pkg" fill="#26452F">core/ + core/adapters/</text>
    <text x="750" y="330" class="desc">领域模型 + 反腐层（ACL）· core 中唯一知道具体引擎的地方</text>

    <!-- row 4 plugin api -->
    <text x="44" y="380" class="role">插件契约</text>
    <text x="44" y="398" class="roleen">PLUGIN API · 内 → 外</text>
    <rect x="274" y="356" width="444" height="60" rx="6" fill="#F6EBD8" stroke="#A1762E"/>
    <text x="290" y="382" class="m pkg" fill="#5E4519">plugin_api/</text>
    <text x="290" y="402" class="desc">35 个能力契约 · 数据库 / 缓存 / 对象存储 / 身份 / 审批 / 传输</text>
    <rect x="734" y="356" width="444" height="60" rx="6" fill="#F6EBD8" stroke="#A1762E"/>
    <text x="750" y="382" class="m pkg" fill="#5E4519">plugin_api/&lt;engine&gt;/</text>
    <text x="750" y="402" class="desc">每引擎一组原生端口 · ClaudeCodePlugin / OpenClawPlugin</text>

    <!-- row 5 plugin impl -->
    <text x="44" y="452" class="role">插件实现</text>
    <text x="44" y="470" class="roleen">PLUGIN IMPL</text>
    <rect x="274" y="428" width="444" height="60" rx="6" fill="#EBE5F3" stroke="#69539B"/>
    <text x="290" y="454" class="m pkg" fill="#3E315F">plugins/{community, local}</text>
    <text x="290" y="474" class="desc">开源树两套 · 企业实现在内部树，按 profile 绑定，消费方无感</text>
    <rect x="734" y="428" width="444" height="60" rx="6" fill="#EBE5F3" stroke="#69539B"/>
    <text x="750" y="454" class="m pkg" fill="#3E315F">plugins/&lt;engine&gt;/</text>
    <text x="750" y="474" class="desc">纯传输叶子 · 禁止 import core（ACL 叶子规则）</text>

    <!-- row 6 kernel -->
    <text x="44" y="524" class="role">底座</text>
    <text x="44" y="542" class="roleen">KERNEL</text>
    <rect x="274" y="500" width="444" height="60" rx="6" fill="#E9E8E5" stroke="#6E6C66"/>
    <text x="290" y="526" class="m pkg" fill="#33322E">kernel/</text>
    <text x="290" y="546" class="desc">lifecycle · 设备 DTO · bot 配置原语 · 不 import 任何本包模块</text>
    <rect x="734" y="500" width="444" height="60" rx="6" fill="#E9E8E5" stroke="#6E6C66"/>
    <text x="750" y="526" class="m pkg" fill="#33322E">kernel/frames</text>
    <text x="750" y="546" class="desc">线协议信封 Request / Response / Event · 下沉以避免 plugins → core</text>

    <!-- row 7 composition root -->
    <text x="44" y="596" class="role">组装根</text>
    <text x="44" y="614" class="roleen">COMPOSITION ROOT</text>
    <rect x="274" y="572" width="444" height="60" rx="6" fill="#F5E5E0" stroke="#A85C47"/>
    <text x="290" y="598" class="m pkg" fill="#643127">di/</text>
    <text x="290" y="618" class="desc">59 个 Module · DEPLOY_PROFILE 五档，启动时读一次且必须显式</text>
    <rect x="734" y="572" width="444" height="60" rx="6" fill="#F5E5E0" stroke="#A85C47"/>
    <text x="750" y="598" class="m pkg" fill="#643127">di/ + engines/&lt;name&gt;/</text>
    <text x="750" y="618" class="desc">ENGINE_PROFILE · 每引擎一个组装根，把 ACL 与传输拼起来</text>

    <!-- dependency axis -->
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8781"/>
      </marker>
    </defs>
    <line x1="1205" y1="140" x2="1205" y2="620" stroke="#8A8781" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="1236" y="380" class="axis" transform="rotate(-90 1236 380)" text-anchor="middle">依赖方向 · 单向向下</text>

    <!-- footer -->
    <rect x="44" y="656" width="1134" height="62" rx="6" fill="#F1EFEA" stroke="#D8D5CF"/>
    <text x="64" y="681" class="foot">依赖只允许向下。组装根是唯一可以同时 import 契约与具体实现的地方 —— 越界的 import 在 CI 上直接失败，不靠 review 记忆。</text>
    <text x="64" y="703" class="m footm">docs/arch/arch.rules.md · 25 条架构宪法 · 53 组 AST 架构守护测试 · 87 个模块声明机器可校验的 Context Boundary</text>
  </g>
</svg>
