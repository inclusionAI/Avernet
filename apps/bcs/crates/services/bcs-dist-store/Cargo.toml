[package]
name = "bcs-dist-store"
description = "Shared store layout, version helpers and admission for the distributed executor plane"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[dependencies]
sha2.workspace = true
bcs-dist-encoding.workspace = true
async-trait = { workspace = true }
bcs-dist-model = { workspace = true }
bcs-db-api = { workspace = true }
bcs-service-api = { workspace = true }
bcs-store-api = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# hmac + hex are test-fixture-only: HMAC-SHA256 cursors for the S1.2 list
# pagination prototype (production cursor signing/keys are T8, out of layer).
hex.workspace = true
hmac.workspace = true
bcs-dist-connector-store.workspace = true
tokio = { workspace = true, features = ["test-util"] }
bcs-dist-projection = { workspace = true }
bcs-test-support = { workspace = true }
bcs-db-local = { workspace = true }
bcs-db-migrations = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
