id: run-archive
version: 1
title: 生成工作流运行档案

input:
  mode: mixed
  requiredParams: []
  sources:
    params: true
    message: true

identity:
  key: "{{input.message}}"
  label: "档案: {{input.message}}"
  duplicatePolicy: allow

outputs:
  archiveSummary:
    from: "{{nodeOutput.generate-archive.summary}}"
    public: true
    description: "档案摘要"

defaults:
  packRoot: /home/admin/openclawExt/clawmind/packs/run-archive
  progress:
    enabled: true
    sink: chat

messages:
  onCreated: "正在生成运行档案，请稍候…"
  onFinished: "运行档案生成完成。"

nodes:
  - id: generate-archive
    title: 生成运行档案
    phase: P1
    dependsOn: []
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        你是工作流运行档案生成助手。

        用户输入: {{input.message}}

        从用户输入中提取 flowId（通常是一串十六进制字符，如 00d87945）。
        如果用户输入中没有明确的 flowId，告诉用户需要提供 flowId。

        提取到 flowId 后，调用 generate_run_archive 工具，传入 flowId 参数。
        工具返回的 details.archive 就是完整的运行档案。

        请对档案内容做以下总结：
        1. 工作流基本信息（workflowId、状态、开始/结束时间）
        2. 失败节点列表（nodeId、error 摘要）
        3. 根因提示（rootCauseHints）
        4. 建议下一步操作

        严格输出 JSON：
        {
          "summary": "档案生成摘要",
          "flowId": "xxx",
          "workflowId": "xxx",
          "status": "failed/succeeded",
          "failedNodes": [{"nodeId": "xxx", "error": "xxx"}],
          "rootCauseHints": ["提示1", "提示2"],
          "suggestions": ["建议1", "建议2"]
        }
    outputContract:
      required: true
      schema:
        type: object
        required: [summary, flowId]
        properties:
          summary: { type: string }
          flowId: { type: string }
          workflowId: { type: string }
          status: { type: string }
          failedNodes:
            type: array
            items: { type: object }
          rootCauseHints:
            type: array
            items: { type: string }
          suggestions:
            type: array
            items: { type: string }
