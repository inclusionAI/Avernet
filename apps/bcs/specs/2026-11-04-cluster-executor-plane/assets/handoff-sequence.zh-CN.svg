<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">把桶 b 从正在排空的执行器 A 交接给后继 B</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">b 的空窗是第 3–6 步:一次 DB 写加一次节点间往返(几毫秒)。只有存活的持有者才能转移租约。</text>

  <rect x="80" y="72" width="170" height="40" rx="8" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="165" y="97" font-size="13" font-weight="bold" text-anchor="middle" fill="#9a6b0a">执行器 A(排空中)</text>
  <rect x="395" y="72" width="170" height="40" rx="8" fill="#eef2fa" stroke="#2457a6"/>
  <text x="480" y="97" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457a6">共享 DB</text>
  <rect x="710" y="72" width="170" height="40" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="795" y="97" font-size="13" font-weight="bold" text-anchor="middle" fill="#157a55">执行器 B(后继)</text>
  <line x1="165" y1="112" x2="165" y2="440" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="480" y1="112" x2="480" y2="440" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="795" y1="112" x2="795" y2="440" stroke="#b9c6bf" stroke-dasharray="3 4"/>

  <text x="24" y="146" font-size="11" font-weight="bold" fill="#5c6a62">1</text>
  <text x="165" y="146" font-size="11" text-anchor="middle" fill="#1c2420">B = HRW(b, 花名册 − 排空中)</text>
  <text x="24" y="180" font-size="11" font-weight="bold" fill="#5c6a62">2</text>
  <line x1="169" y1="176" x2="791" y2="176" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="480" y="170" font-size="11" text-anchor="middle" fill="#1c2420">PREPARE(b)</text>
  <text x="795" y="198" font-size="10.5" text-anchor="middle" fill="#157a55">加载 b 的热会话 —— 还不是所有者</text>
  <line x1="791" y1="214" x2="169" y2="214" stroke="#157a55" marker-end="url(#ag)"/>
  <text x="480" y="208" font-size="11" text-anchor="middle" fill="#157a55">READY(若 B 也在排空则拒绝 → 试下一位)</text>

  <text x="24" y="248" font-size="11" font-weight="bold" fill="#5c6a62">3</text>
  <rect x="85" y="232" width="160" height="34" rx="5" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="165" y="247" font-size="10.5" text-anchor="middle" fill="#9a6b0a">暂停 b:完成当前写入,</text>
  <text x="165" y="260" font-size="10.5" text-anchor="middle" fill="#9a6b0a">把发给 b 的新消息排队(几毫秒)</text>

  <text x="24" y="296" font-size="11" font-weight="bold" fill="#5c6a62">4</text>
  <line x1="169" y1="292" x2="476" y2="292" stroke="#5c6a62" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="320" y="286" font-size="11" text-anchor="middle" fill="#1c2420">TRANSFER: node_id = B, token n → n+1</text>
  <rect x="400" y="302" width="160" height="24" rx="5" fill="#ffffff" stroke="#157a55"/>
  <text x="480" y="318" font-size="11" text-anchor="middle" fill="#157a55">所有者 B · 令牌 n+1</text>

  <text x="24" y="352" font-size="11" font-weight="bold" fill="#5c6a62">5</text>
  <line x1="169" y1="348" x2="791" y2="348" stroke="#157a55" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="480" y="342" font-size="11" text-anchor="middle" fill="#157a55">COMMIT(b, n+1) + 步骤缓冲 —— 此后由 B 在其会话的频道上发布</text>
  <text x="795" y="370" font-size="10.5" text-anchor="middle" fill="#157a55">驱动 b 的会话;只有 write_seq</text>
  <text x="795" y="384" font-size="10.5" text-anchor="middle" fill="#157a55">变了的会话才重读</text>

  <text x="24" y="414" font-size="11" font-weight="bold" fill="#5c6a62">6</text>
  <line x1="169" y1="410" x2="791" y2="410" stroke="#5c6a62" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="480" y="404" font-size="11" text-anchor="middle" fill="#1c2420">把排队的消息(包括增量)交给 B · 之后到达 A 的请求得到 NOT_OWNER(B)</text>

  <rect x="24" y="452" width="912" height="92" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="44" y="476" font-size="13" font-weight="bold" fill="#1c2420">中途出错时,现有机制都能兜住</text>
  <text x="44" y="498" font-size="11.5" fill="#1c2420">B 在第 4 步之后死了 → 普通接管 · A 在第 4、5 步之间死了 → B 在下一次读取未采纳租约时发现 b ·</text>
  <text x="44" y="516" font-size="11.5" fill="#1c2420">A 在第 4 步后卡住又写入 → 被围栏挡掉;又发布 → 订阅者丢弃令牌 n。订阅者始终在会话的频道上。</text>
</svg>
