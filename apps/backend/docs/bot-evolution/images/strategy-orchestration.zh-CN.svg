<rect x="369" y="66" width="160" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="449.0" y="84.0" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">models.complete() · 诊断</text>
