<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Orchestration lives inside the strategy; the platform owns one fixed pipeline">
<title>Orchestration lives inside the strategy; the platform owns one fixed pipeline</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="1120" height="600" fill="#ffffff"/>
<rect x="20" y="16" width="1080" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="36" y="36" font-size="13" font-weight="600" fill="#334155" text-anchor="start" dominant-baseline="middle">Strategy side — ClawEvolve writes its own orchestration inside run(ctx). The platform does not know these stages exist.</text>
<text x="1084" y="36" font-size="11" font-weight="400" fill="#64748b" text-anchor="end" dominant-baseline="middle" font-style="italic">each row: one way to write run(ctx)</text>
<text x="30" y="77.5" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">bot_evolution</text>
<text x="30" y="90.5" font-size="11" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">diagnose-first (with sessions)</text>
<rect x="215" y="66" width="140" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="285.0" y="84.0" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">experience.sessions()</text>
<path d="M 355 84 L 369 84" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ahl)"/>
<rect x="369" y="66" width="160" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="449.0" y="84.0" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">models.complete() · diagnose</text>
<path d="M 529 84 L 543 84" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ahl)"/>
