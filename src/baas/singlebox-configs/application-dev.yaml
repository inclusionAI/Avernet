
workers: 1

module_config:
  web:
    # 本地模式，避免端口冲突，设置为 8890
    port: 8890
  mist:
    enabled: true
    tenant: "dev-tenant"
    mode: "dev"
    app_name: "secbaas"

user_config:
  workspace:
    env_folder: "aidesktop_singlebox"

  # 插件配置
  plugins:
    auth: "stub"
    sandbox:
      # local proc
      arca: local_proc
      desktop: stub
      teclaw: stub
      k8s: stub
      docker: stub
      poolab: stub
    database:
      plugin_database: "SQLITE_ORM"    # ZDAS_SQL (Production RAW SQL, migrating to orm) | ZDAS_ORM (production ORM) | SQLITE_ORM (test only)
      database_url: "sqlite:////tmp/secbaas_singlebox.db"
    secret: "stub"
    cache: "stub"
    bot_service: "local"
    engine_adapter: "stub"  # stub | real (singlebox 默认不连真实 engine)

  bot_service:
    adapter_port: 20003
    ws_path: "/api/openclaw/ws"
    connect_timeout: 10
    request_timeout: 300

  teamclaw:
    base_url: "https://teamclaw.example.net"
    timeout: 30

  # BCN 下行协议配置（开发环境）
  bcn:
    api_key:
      prefix: "9acXMLaU"  # BCN 专用 API Key 前缀
    uplink:
      base_url: ""
      provider_id: ""

  # API Gateway 配置
  api_gateway:
    admin_operators:
      - "operator-001"
      - "operator-002"
      - "operator-003"

  # agentclawproxy 代理服务主机名（开发环境）
  agentclawproxy:
    host:
      dev: "agentclawproxy-dev.example.com"

  # SecBaaS 回调服务器 URL（开发环境）
  secbaas:
    callback:
      host:
        dev: "https://secbaas-dev.example.com"

  # Arca 沙箱配置（开发环境）
  arca:
    enabled: true
    base_url: "http://arca.sandbox.dev:8080"
    template_id: "ARCA-TEMPLATE-00000000"
    oss_mount_id: "oss_mount_id"
    api_key: "@api_key"
    default_ttl_minutes: 1440 # 分钟 => 1 天
