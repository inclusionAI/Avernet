# ============================================================
# service-deployment.yaml — Generic K8s deployment template
#
# Rendered by docker/services/kube-deploy.sh into a service-specific
# manifest. Uses envsubst-compatible ${...} placeholders.
#
# Placeholders:
#   SERVICE     — service name (baas | gateway | proxy | bcs | bcsfuse | backend | frontend-nextgen)
#   NAMESPACE   — K8s namespace
#   IMAGE       — container image with tag
#   PORT        — container + service port
#   PROBE_PATH  — HTTP path both probes GET. Per-service, because the backend
#                 serves /api/health, frontend-nextgen serves /healthz, and
#                 the others serve /health.
#   REPLICAS    — number of pod replicas. Per-service: 2 for most, but 1 for
#                 backend, whose shipped defaults are per-process (pod-local
#                 /app/data, in-process cache lock). See DEFAULT_REPLICAS in
#                 docker/kube-deploy.sh.
#   CPU_REQUEST, CPU_LIMIT, MEMORY_REQUEST, MEMORY_LIMIT — resource spec
#   ENV_VARS    — rendered env var entries (one "- name: ..." block per line)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE}
  namespace: ${NAMESPACE}
  labels:
    app: ${SERVICE}
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: ${SERVICE}
  template:
    metadata:
      labels:
        app: ${SERVICE}
    spec:
      containers:
      - name: ${SERVICE}
        image: ${IMAGE}
        ports:
        - containerPort: ${PORT}
        __ENV_VARS__
        resources:
          requests:
            cpu: "${CPU_REQUEST}"
            memory: "${MEMORY_REQUEST}"
          limits:
            cpu: "${CPU_LIMIT}"
            memory: "${MEMORY_LIMIT}"
        # Startup probe: gates both probes below — they do not run until it
        # succeeds, so a slow start can no longer trip liveness. Budget is
        # periodSeconds × failureThreshold = 10s × 30 = up to 300s (5 min);
        # the slowest cold start today (baas) reaches /health in ~90s, while
        # the old liveness-only budget (30s delay + 3 failures × 10s ≈ 60s)
        # could kill it mid-start. Image pull time is not part of this budget:
        # probes begin only once the container has started. If the app is not
        # healthy within the budget the container is killed and restarted.
        startupProbe:
          httpGet:
            path: ${PROBE_PATH}
            port: ${PORT}
          periodSeconds: 10
          failureThreshold: 30
        # liveness/readiness run only after startupProbe succeeds, so their
        # delays no longer need to cover a slow start.
        livenessProbe:
          httpGet:
            path: ${PROBE_PATH}
            port: ${PORT}
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: ${PROBE_PATH}
            port: ${PORT}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE}
  namespace: ${NAMESPACE}
  labels:
    app: ${SERVICE}
spec:
  type: ClusterIP
  selector:
    app: ${SERVICE}
  ports:
  - name: http
    port: 80
    targetPort: ${PORT}
    protocol: TCP
