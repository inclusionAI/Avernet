id: privacy-odps-approval-v1
version: "0.1.0"
title: ODPS 隐私审批
description: |
  DGD 隐私办 ODPS 权限审批工作流。
  覆盖自动通过检查、确权推荐、行级过滤推荐、ABCD 完备性检查、风险分析、审批决策、人工确认、审批执行全流程。

workflows:
  - id: privacy-odps-approval-v1
    file: workflows/privacy-odps-approval-v1.yaml

actions:
  - id: odps
    type: python-scripts
    root: actions/scripts
    commands:
      odps.fetch_context: fetch_context.py
      odps.auto_check: auto_check.py
      odps.execute_approval: execute_approval.py
      odps.save_risk_verdict: save_risk_verdict.py

facades:
  - command: poa
    defaultWorkflow: privacy-odps-approval-v1
    defaultParams:
      configPath: /home/admin/openclawExt/clawmind/packs/privacy-odps-approval-v1/config/config.json
    help:
      title: ODPS 隐私审批
      summary: DGD 隐私办 ODPS 权限审批全流程
      examples:
        - "/poa run --applicationId 477225426"
        - "/poa state"
        - "/poa confirm 同意"
        - "/poa revise --feedback 需要调整"
        - "/poa reject"
        - "/poa help"

skills:
  required:
    - odps-recommend-authorize
    - odps-recommend-filter
    - odps-check-completeness
    - odps-request-supplement
    - odps-risk-analysis
    - odps-approval-decision