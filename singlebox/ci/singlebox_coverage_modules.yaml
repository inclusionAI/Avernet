modules:
  bot_dormant:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/bot_dormant
    core_paths:
      - src/agentclaw/community/core/bot_dormant/
    router_api:
      status: applicable
      reason: Internal activate-one duplicates the public path, unfreeze-passport-one is a repair-only operation, and trigger-scan is asynchronous ops tooling; they are outside this user-story denominator.
      items:
        - POST /api/bots/{bot_id}/activate
        - POST /api/bots/dormant-whitelist/batch
        - GET /api/internal/dormant/pending-notifications
        - POST /api/internal/dormant/mark-sent
        - POST /api/internal/dormant/recycle-one
    plugin_api:
      status: applicable
      reason: Recycle and reactivation must freeze and unfreeze the bot passport through the injected plugin boundary.
      items:
        - key: PassportPlugin.freeze_agent_passport
          evidence:
            path: src/agentclaw/community/plugins/local/passport.py
            symbol: LocalPassportPlugin.freeze_agent_passport
        - key: PassportPlugin.unfreeze_agent_passport
          evidence:
            path: src/agentclaw/community/plugins/local/passport.py
            symbol: LocalPassportPlugin.unfreeze_agent_passport
    thresholds:
      core_min_percent: 54.13
      router_min_percent: 100.0
      plugin_min_percent: 100.0

  tc_file_upload_integrations:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/tc_file_upload_integrations
    core_paths:
      - src/agentclaw/community/core/tc_file_upload_integrations/
    router_api:
      status: applicable
      reason: The authenticated internal context endpoint is the router surface owned by this integration; the session-resource polling route is the upstream trigger and remains in its owning module.
      items:
        - POST /api/internal/tc-resource-context
    plugin_api:
      status: not_applicable
      reason: Automatic TC conversation-file resource-ready publication was retired; the publisher and protocol remain only for compatibility, and no production session-file path invokes them.
      items: []
    thresholds:
      core_min_percent: 40.0
      router_min_percent: 100.0
      plugin_min_percent: 100.0

  auth:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/auth
    core_paths:
      - src/agentclaw/community/core/auth/
    router_api:
      status: not_applicable
      reason: Auth is a cross-cutting identity capability and owns no HTTP routes.
      items: []
    plugin_api:
      status: applicable
      reason: get_login_user is a legacy method with no production HTTP caller and is outside the runtime-reachable denominator.
      items:
        - key: AuthPlugin.resolve_user_from_request
          evidence:
            path: src/agentclaw/community/plugins/local/auth.py
            symbol: LocalAuth.resolve_user_from_request
        - key: AuthPlugin.is_operator_allowed
          evidence:
            path: src/agentclaw/community/plugins/local/auth.py
            symbol: LocalAuth.is_operator_allowed
        - key: AuthPlugin.authorize_entity_access
          evidence:
            path: src/agentclaw/community/plugins/local/auth.py
            symbol: LocalAuth.authorize_entity_access
    thresholds:
      core_min_percent: 100.0
      plugin_min_percent: 100.0
  devices:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/devices
    core_paths:
      - src/agentclaw/community/core/devices/
    router_api:
      items:
        - POST /api/v1/devices
        - POST /api/v1/devices/{binding_id:int}/release
        - GET /api/v1/devices
        - GET /api/v1/devices/provider-inventory
        - GET /api/v1/devices/{binding_id:int}
        - GET /api/v1/devices/by-id/{device_id}
        - GET /api/v1/devices/{binding_id:int}/connection
        - GET /api/v1/devices/bots/{bot_id}/connection
        - GET /api/v1/devices/connectable
        - GET /api/v1/devices/connectable_admin
        - POST /api/v1/devices/callback/alive
        - POST /api/v1/devices/callback/status
        - POST /api/v1/devices/callback/bootstrap-auth
        - POST /api/v1/devices/exec_shell
        - POST /api/v1/devices/batch/env
        - GET /api/v1/devices/bots/{bot_id}/instances
        - GET /api/v1/devices/{binding_id:int}/instances
        - POST /api/v1/devices/{binding_id:int}/restart
    plugin_api:
      status: not_applicable
      reason: Device lifecycle has no honestly attributable runtime Plugin API denominator yet.
      items: []
    thresholds:
      core_min_percent: 43.36
      router_min_percent: 44.44

  access:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/access
    core_paths:
      - src/agentclaw/community/core/access/
    router_api: &pending_router_denominator
      status: not_applicable
      reason: Router denominator audit has not been migrated to the Avernet manifest yet.
      items: []
    plugin_api: &pending_plugin_denominator
      status: not_applicable
      reason: Plugin boundary denominator audit has not been migrated to the Avernet manifest yet.
      items: []
    thresholds:
      core_min_percent: 42.80

  bot_chat:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/bot_chat
    core_paths:
      - src/agentclaw/community/core/bot_chat/
      # The two bot-chat repository bodies moved to the consolidated repository
      # package (spec 2026-08-05-core-repository-consolidation). They are the
      # same code, exercised by the same acceptance flows — only the module path
      # changed — so the denominator follows them rather than silently shrinking.
      # Listed per-file because implementations/chat/ also holds expert_chat and
      # channel repositories, which belong to other modules' denominators.
      - src/agentclaw/community/core/repository/implementations/chat/open.py
      - src/agentclaw/community/core/repository/implementations/chat/db.py
    router_api:
      status: applicable
      reason: The Langfuse health route is external-service dependent and is outside the local singlebox denominator.
      items:
        - POST /api/bot-chat/otel/traces
        - POST /api/bot-chat/log-relations
        - GET /api/v1/bot-chats
        - GET /api/v1/bot-chats/{trace_id}
    plugin_api:
      status: not_applicable
      reason: Bot chat currently has no independently attributable Plugin API boundary.
      items: []
    thresholds:
      core_min_percent: 67.48
      router_min_percent: 100.0

  bot_collaborator:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/bot_collaborator
    core_paths:
      - src/agentclaw/community/core/bot_collaborator/
    router_api: *pending_router_denominator
    plugin_api: *pending_plugin_denominator
    thresholds:
      # Existing non-regression threshold is unchanged by sync simplification.
      core_min_percent: 53.88

  manager_sync:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/bot_collaborator
    core_paths:
      - src/agentclaw/community/core/bot_collaborator/manager_sync/
    router_api: *pending_router_denominator
    plugin_api: *pending_plugin_denominator
    thresholds:
      # Preserve the existing manager-sync gate. Singlebox uses direct BCS
      # delivery with the same best-effort implementation as production;
      # no Redis or alternate coordination mode is required. A passing
      # coverage result alone does not prove the BCS roster is correct.
      core_min_percent: 54.03

  ownership_sync:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/bot_ownership_sync
    core_paths:
      - src/agentclaw/community/core/bot_management/ownership_sync/
    router_api:
      status: applicable
      reason: Authenticated administrator repair admits current ownership through the production sync runtime; handoff remains upstream.
      items:
        - POST /api/bots/owner-handoffs/bcn-repair
    plugin_api:
      status: applicable
      reason: Real direct BCS ownership delivery and its lifecycle release at stack shutdown.
      items:
        - key: BcsOwnershipPlugin.replace_ownership
          evidence:
            path: src/agentclaw/community/plugins/community/bcs_ownership.py
            symbol: HttpBcsOwnershipPlugin.replace_ownership
        - key: BcsOwnershipPlugin.aclose
          evidence:
            path: src/agentclaw/community/plugins/community/bcs_ownership.py
            symbol: HttpBcsOwnershipPlugin.aclose
    thresholds:
      # Initial live Backend floor: floor(87 / 132 * 10000) / 100.
      # Task 10 owner-enabled-live4 Backend report SHA-256:
      # e8e970a9f3f8127598cf4d5f1e721c1119fafb91f13dc826e893fbc206c84931
      # Includes repair and error paths; no unit/maintenance-driver coverage.
      core_min_percent: 65.90
      router_min_percent: 100.0
      plugin_min_percent: 100.0

  collaboration_repair:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/collaboration_repair
    core_paths:
      # The whole one-shot repair Core package (facts projection + Service API
      # contract + orchestration) — avatar_from_record/outbound_avatar_from_record
      # also run inside the real daily edit stories at stack runtime.
      - src/agentclaw/community/core/bot_management/collaboration_repair/
    router_api:
      status: applicable
      reason: The one owner-scoped repair POST this feature added; legacy queued repair operations are background workflows outside the user-story denominator.
      items:
        - POST /openapi/v1/bots/{bot_id}/collaboration/repair
    plugin_api:
      status: applicable
      reason: The request-scoped metadata delivery implementations for the repair route; the shared coverage stack now provisions an ephemeral BCN provider, so the live stories exercise the production community plugin (plugins/community/bcs_collaboration_metadata.py) itself.
      items:
        - key: BcsCollaborationMetadataPlugin.exists
          evidence:
            path: src/agentclaw/community/plugins/community/bcs_collaboration_metadata.py
            symbol: BcnCollaborationMetadataAdapter.exists
        - key: BcsCollaborationMetadataPlugin.update_profile
          evidence:
            path: src/agentclaw/community/plugins/community/bcs_collaboration_metadata.py
            symbol: BcnCollaborationMetadataAdapter.update_profile
        - key: BcsCollaborationMetadataPlugin.aclose
          evidence:
            path: src/agentclaw/community/plugins/community/bcs_collaboration_metadata.py
            symbol: BcnCollaborationMetadataAdapter.aclose
    thresholds:
      # Measured by `singlebox_coverage.sh --module collaboration_repair`
      # Baseline evidence is recorded in PR #3569.
      # router 1/1 live route hit by the repair stories. Since the shared
      # coverage stack provisions an ephemeral BCN provider, the stories
      # drive the route past the capability gate. The fresh focused run
      # measured core 71.11% (threshold floored to 70.0 to absorb one-line
      # run variance) and plugin 100%. The 2026-11-05 scope change removes
      # caller repair; the complete current Plugin API denominator is
      # exists/update_profile/aclose. Existing thresholds remain unchanged;
      # a fresh live run must still satisfy them.
      core_min_percent: 70.0
      router_min_percent: 100.0
      plugin_min_percent: 100.0


  cron:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/cron
    core_paths:
      - src/agentclaw/community/core/cron/
    router_api:
      status: applicable
      reason: Public auto-initiate routes are automation integrations and are outside the end-user cron lifecycle denominator.
      items:
        - GET /api/cron
        - GET /api/cron/status
        - GET /api/cron/running
        - GET /api/cron/{task_id}
        - POST /api/cron
        - PUT /api/cron/{task_id}
        - DELETE /api/cron/{task_id}
        - POST /api/cron/{task_id}/run
        - GET /api/cron/{task_id}/runs
    plugin_api:
      status: applicable
      reason: Cron execution reaches the local engine adapter through DeviceAdapterTransport.
      items:
        - key: DeviceAdapterTransport.invoke
          evidence:
            path: src/agentclaw/community/plugins/local/device_adapter_transport.py
            symbol: InMemoryDeviceAdapterTransport.invoke
    thresholds:
      core_min_percent: 41.84
      router_min_percent: 100.0
      plugin_min_percent: 100.0

  expert_chat:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/expert_chat
    core_paths:
      - src/agentclaw/community/core/expert_chat/
    router_api:
      status: applicable
      reason: Expert chat session and caller connection API endpoints. The caller-connection endpoint supports iam_token for caller identity exchange.
      items:
        - POST /api/v1/expert-chats
        - GET /api/v1/expert-chats
        - DELETE /api/v1/expert-chats/{bot_id}/{owner_id}
        - POST /api/v1/expert-chats/{bot_id}/{owner_id}/session
        - DELETE /api/v1/expert-chats/{bot_id}/{owner_id}/session
        - GET /api/v1/expert-chats/{bot_id}/{owner_id}/sessions
        - POST /api/v1/expert-chats/{bot_id}/{owner_id}/sessions
        - POST /api/v1/expert-chats/{bot_id}/{owner_id}/sessions/connect
        - DELETE /api/v1/expert-chats/{bot_id}/{owner_id}/sessions
        - POST /api/v1/expert-chats/caller-connection
        - POST /api/v1/expert-chats/app-caller-connection
    plugin_api:
      status: not_applicable
      reason: Expert chat uses core protocols (CallerIdentityTokenExchangeProtocol) without production plugin implementations in singlebox.
      items: []
    thresholds:
      # 63.49 -> 61.18: the unified Human-to-Agent OpenAPI added the
      # owned-session message/update/clear/favorite operations to Expert Chat
      # Core, and the full production paths remain in this denominator. The
      # existing live session story cannot reach those runtime calls in
      # singlebox today: BaaS invoke-http resolves local_proc through its
      # ARCA-only path and the story is explicitly xfailed in
      # test_chat_session_lifecycle.py. These branches are covered by the
      # endpoint and Core tests (and the >=80% changed-line gate); re-raise this
      # baseline when the documented local_proc/BaaS gap is closed.
      core_min_percent: 61.18
      router_min_percent: 100.0

  files:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/files
    core_paths:
      - src/agentclaw/community/core/services/resource_file_service.py
    router_api:
      status: applicable
      reason: Workspace file browsing and mutation routes owned by ResourceFileService.
      items:
        - GET /api/resources/files
        - POST /api/resources/files/upload
        - GET /api/resources/files/download
        - GET /api/resources/files/preview
        - DELETE /api/resources/files
        - POST /api/resources/files/mkdir
    plugin_api:
      status: not_applicable
      reason: DeviceFileSystem is a Core service seam, not a declared Plugin API protocol.
      items: []
    thresholds:
      core_min_percent: 63.52
      router_min_percent: 100.0

  harness:
    system: backend
    acceptance_targets:
      - tests/community/acceptance/harness
    core_paths:
      - src/agentclaw/community/core/harness/
    router_api: *pending_router_denominator
    plugin_api: *pending_plugin_denominator
    thresholds:
      # 41.30 → 40.86: fix(harness) slim D-TOOLS-002 prompt payload added the
      # _compact_tool_for_prompt / _compact_mcp_tools_for_prompt helpers to
      # mcp_format.py. These run only inside the D-TOOLS-002 prompt build, which
      # requires an activated MCP whose tools expose inputSchema. The singlebox
      # profile column does not bind a fixture-backed MCPCenterPlugin (no
      # CommunityMcpCenterModule / AcceptanceTestMCPCenter), so
      # mcp_center.get_mcp_detail returns nothing, the diagnostic falls back to
      # `tools: []` with no schema, and the helpers never execute under
      # acceptance — structurally uncoverable, same class as the 41.59→41.30
      # llm.py case below. Lower bound tracks the new source reality (measured
      # 40.86%); no production Core path excluded. Unit coverage for the helpers
      # lives in tests/community/core/harness/diagnostics/test_diagnostics.py
      # (flattening, malformed-param skip, non-list early return, per-MCP cap
      # with tools_omitted) — outside the acceptance denominator by design.
      # Update: singlebox now gains a fixture-backed MCPCenter — TestingMcpModule
      # serves CommunityMCPCenter when SINGLEBOX_ACCEPTANCE_MCP_FIXTURE_FILE is
      # set, and singlebox_coverage.sh passes the fixture catalog when starting
      # the backend — so the helpers are acceptance-coverable again; the floor
      # stays at the last measured value until CI re-measures with the fixture.
      #
      # 41.59 → 41.30: the LLM diagnostic refactor (refactor(LLM): 改进异常处理和日志记录)
      # added logging-only statements to services/llm.py that the read-only harness
      # acceptance smoke cannot reach — acceptance explicitly skips the LLM-dependent
      # write paths (diagnose / generate-patches / apply / rollback), so _exc_detail,
      # the _do_request POST except-and-reraise, and the elapsed/base_url log args are
      # structurally uncoverable by acceptance. Lower bound tracks the new source
      # reality (measured 41.34%); no production Core path excluded, no test-only call
      # added. Revisit when harness write-path acceptance lifts the LLM-disabled guard.
      core_min_percent: 40.86

pending_modules:
  bot_knowledge:
    acceptance_targets:
      - tests/community/acceptance/bot_knowledge
    reason: The AGENTS.md projection (agents_md_sync.py) added under core/bot_knowledge/ writes the enabled-knowledge section through the device-bound identity seam; the SQL-seeded selection story bots carry no device binding, so those statements stay outside the legacy acceptance path. Pending device-bound acceptance coverage; aligned with the resources pending pattern.
  skill_center:
    acceptance_targets:
      - tests/community/acceptance/skill_center
    reason: Latest BaaS-backed runtime run has three failing acceptance stories.
  bot_management:
    acceptance_targets:
      - tests/community/acceptance/bot_management
    reason: Live owner lifecycle still expects the retired local device provider.
  mcp:
    acceptance_targets:
      - tests/community/acceptance/mcp
    reason: Permission baseline and live engine connection assumptions need migration.
  resources:
    acceptance_targets:
      - tests/community/acceptance/resources/test_resource_metadata_lifecycle.py
      - tests/community/acceptance/resources/test_resource_lifecycle.py
    reason: openapi_v1 handler wiring added device_fs service methods (upload_file/download_resource/preview_resource/delete_resource) under core/resources/ that the legacy /api/resources acceptance path does not reach. Pending openapi_v1 acceptance coverage; aligned with bot_management pending pattern.
