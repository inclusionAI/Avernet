name: Agent evaluation contracts
on:
  pull_request:
    paths:
      - 'apps/evolverun/agent-evaluation/**'
      - '.github/workflows/agent-evaluation-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'apps/evolverun/agent-evaluation/**'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
        working-directory: apps/evolverun/agent-evaluation
