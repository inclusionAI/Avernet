<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="编排在进化策略内部；平台只拥有一条固定的流水线">
<title>编排在进化策略内部；平台只拥有一条固定的流水线</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="1120" height="600" fill="#ffffff"/>
<rect x="20" y="16" width="1080" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="36" y="36" font-size="13" font-weight="600" fill="#334155" text-anchor="start" dominant-baseline="middle">策略侧 —— ClawEvolve 在 run(ctx) 内部编写自己的编排。平台不知道这些 stage 的存在。</text>
<text x="1084" y="36" font-size="11" font-weight="400" fill="#64748b" text-anchor="end" dominant-baseline="middle" font-style="italic">每一行：run(ctx) 的一种写法</text>
<text x="30" y="77.5" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">bot_evolution</text>
<text x="30" y="90.5" font-size="11" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">先诊断（有会话）</text>
<rect x="215" y="66" width="140" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="285.0" y="84.0" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">experience.sessions()</text>
