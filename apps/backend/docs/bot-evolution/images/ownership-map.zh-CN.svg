<text x="46" y="710" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">OP-4（本指南 §7）  运行中途的人工输入：ClawEvolve 的 stage 可以向用户提问；平台的运行是无人值守的</text>
