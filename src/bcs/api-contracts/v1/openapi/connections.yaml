SessionConnectionToken:
  type: object
  additionalProperties: false
  required:
    - token
    - expires_at
  properties:
    token:
      type: string
      minLength: 1
      maxLength: 4096
    expires_at:
      type: integer
      format: int64
      minimum: 1

SessionConnectionTokenEnvelope:
  type: object
  additionalProperties: false
  required:
    - code
    - message
    - data
    - request_id
  properties:
    code:
      const: 20000
    message:
      type: string
    data:
      $ref: "#/SessionConnectionToken"
    request_id:
      $ref: ../shared.yaml#/RequestId

SessionConnectionTokenPath:
  post:
    operationId: issue_group_session_connection_token
    tags: ["Collaboration / Sessions"]
    summary: Issue a short-lived connection token for one Group Session.
    description: >-
      Derives the Human, Group, and Session scope on the server and returns a
      five-minute credential for the session-bound Workbench WebSocket.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - $ref: ../shared.yaml#/SessionIdPath
    responses:
      "200":
        description: Session-bound WebSocket credential.
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
          Pragma:
            schema:
              type: string
              const: no-cache
        content:
          application/json:
            schema:
              $ref: "#/SessionConnectionTokenEnvelope"
      "401":
        description: Gateway Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: The authenticated Human cannot connect to the Session.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Session is missing or intentionally hidden.
        x-error-codes:
          - session_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

GroupSessionWebSocketPath:
  get:
    operationId: connect_group_session_websocket
    tags: ["Collaboration / Sessions"]
    summary: Upgrade to a session-bound Workbench WebSocket.
    description: |
      Authenticates the five-minute BCN credential before Upgrade and exposes
      the existing Workbench frame protocol within the immutable token scope.

      The Workbench `connect` request accepts `params.view_actor_id`. Human-tab
      clients bind it to the authenticated Human actor; Bot-tab clients bind it
      to a Bot participant that the Human is authorized to operate. Clients
      cannot supply `message_view_scope`: the server resolves that value from
      the Session participant snapshot and returns both `view_actor_id` and
      `message_view_scope` in the successful `connect` response. Omitting
      `view_actor_id` preserves the legacy full-view connection: the server does
      not infer a participant projection from the authenticated Human.

      Human connections are projected per connection. `participant` receives
      public artifacts and directed artifacts whose audience contains that
      Human; `full` receives all artifacts. Chat-domain artifacts retain legacy
      visibility. Bot-tab connections are not affected by Human scope.

      A connection keeps the Session scope resolved during `connect`. After a
      Human's Session scope changes, the client must close the old connection
      and establish a new one so the server can bind the newly persisted scope.
      Existing connections are not guaranteed to observe scope changes. The
      scope projects only the Workbench message stream and is not a security
      boundary; StateMachine resource APIs keep their existing authorization
      semantics.
    x-avernet-protocol: websocket
    x-avernet-security: {}
    parameters:
      - name: token
        in: query
        required: true
        description: >-
          Sensitive BCN session connection credential. Implementations must
          redact its value from logs and error details.
        x-sensitive: true
        schema:
          type: string
          minLength: 1
          maxLength: 4096
    responses:
      "101":
        description: WebSocket protocol switched successfully.
      "401":
        description: Connection token is missing, invalid, expired, or has the wrong purpose.
        x-error-codes:
          - invalid_connection_token
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "503":
        description: Connection token verification is unavailable.
        x-error-codes:
          - token_service_unavailable
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
