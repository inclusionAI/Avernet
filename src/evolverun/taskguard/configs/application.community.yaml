# TaskGuard Community Default Configuration
# Open-source defaults — SQLite database, basic alerts, no internal endpoints.
#
# To switch to API mode (delegate persistence to a clawweb-compatible HTTP API),
# change `database.mode` from "sqlite" to "api" and fill in database.api.* values.
# You can also override these settings at runtime via environment variables
# (highest priority):
#   DATABASE_MODE=sqlite|prod|api
#   SQLITE_PATH=/path/to/engine.db
#   CLAWWEB_API_URL=https://your-clawweb.example.com
#   CLAWMIND_PRIVATE_KEY=base64-encoded-key
#   CLAWMIND_IAM_TOKEN=your-iam-token
#   CLAWWEB_API_TIMEOUT=5000
#   CLAWWEB_API_MAX_RETRIES=3

database:
  mode: sqlite
  sqlite:
    path: ~/.taskguard/workflow/engine.db

  # API mode settings. Uncomment and configure when database.mode: api.
  # api:
  #   baseUrl: "https://your-clawweb.example.com"
  #   privateKeyB64: "base64-encoded-key"
  #   iamtoken: "your-iam-token"
  #   timeout: 5000
  #   maxRetries: 3

alerts:
  dingtalk:
    enabled: false
    webhook_url: ""
  http_callback:
    enabled: true
    url: ""
    sign_secret: ""

approval:
  provider: basic

server:
  port: 3001
  host: "0.0.0.0"

execution:
  asyncRun: false
  runTimeoutMs: 600000
  flowTimeoutMinutes: 30
  maxConcurrentFlows: 10

contextCompression:
  enabled: true
  defaultMaxTokens: 8000

llm:
  defaultModel: "claude-sonnet-4-20250514"
  maxTokens: 16384

flowControl:
  maxRetries: 3
  retryDelayMs: 5000

scheduler:
  enabled: true
  checkIntervalMs: 30000

webhook:
  enabled: false
  port: 3002

# NOT included (internal-only, provided by corp extensions):
# - ZDAS/MySQL configuration
# - BaaS keys
# - YuQue knowledge source
# - AgentMind knowledge source
# - TeClaw configuration
# - clawweb URL / IAM token / corpId
# - DingTalk enterprise robot credentials
