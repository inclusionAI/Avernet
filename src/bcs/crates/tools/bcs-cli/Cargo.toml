[package]
name        = "bcs-cli"
description = "CLI tools for testing Bot Coordination Service"
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
rust-version = { workspace = true }
version     = { workspace = true }

[[bin]]
name = "bcs-cli"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

# OAuth extension point (link-time provider resolution; public builds link no
# Ant SDK, so these are neutral crates available to both OSS and internal builds)
inventory = { workspace = true }
async-trait = { workspace = true }

# Error handling
anyhow    = { workspace = true }

# Home directory
dirs = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# CLI
clap = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Async utilities
futures = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }

# URL encoding
urlencoding = "2"

# Charset detection for text uploads (see guess_charset helper).
chardetng = { workspace = true }
encoding_rs = { workspace = true }

# UUID
uuid = { workspace = true }

# Workspace crates
bcs-config     = { workspace = true }
bcs-config-api = { workspace = true }
bcs-protocol    = { workspace = true }

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = "3"
wiremock   = "0.6"
assert_cmd = "2.0"
predicates = "3.0"

[lints]
workspace = true
