RegisterTokenResult:
  type: object
  additionalProperties: false
  required:
    - token
    - expires_at
    - note
  properties:
    token:
      type: string
      minLength: 1
      description: >-
        HMAC register token signed with the deployment invite secret. Newly issued
        Provider-scoped v2 payloads include auth_mode from Provider configuration.
        Historical v2 payloads without this claim remain accepted by the server.
    expires_at:
      type: integer
      description: Absolute token expiry in milliseconds since the Unix epoch.
    note:
      type: string
    registration:
      type: object
      additionalProperties: false
      required: [token_version, provider_id, allowed_modes]
      description: Present only for scoped v2 tokens. Absence means legacy v1 issuance.
      properties:
        token_version:
          type: integer
          enum: [2]
        provider_id:
          type: string
        allowed_modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [plugin, gateway]

BotRegistrationResult:
  type: object
  additionalProperties: false
  required:
    - bot_name
    - bot_uuid
    - bot_token
  properties:
    bot_name:
      type: string
    bot_uuid:
      type: string
      description: Newly created Bot UUID. A duplicate scoped Provider/ref returns 409.
    bot_token:
      type: string
      description: New Bot runtime credential, returned only on successful creation; never replayed, and never a Provider-admin or shared downlink credential.
    registration:
      type: object
      additionalProperties: false
      required: [provider_id, provider_bot_ref, mode, webhook_url, effective_webhook_url, auth_mode, agent_code, bot_slug]
      description: Present only for Provider-scoped registration. Does not indicate bridge process readiness.
      properties:
        provider_id:
          type: string
        provider_bot_ref:
          type: string
        auth_mode:
          type: string
          enum: [static_bearer, provider_admin, agentpass, agentpass-subbots]
        agent_code:
          type: [string, "null"]
          description: Original AgentPass parent, never composed with the slug.
        bot_slug:
          type: [string, "null"]
        mode:
          type: string
          enum: [plugin, gateway]
        webhook_url:
          type: [string, "null"]
          description: Stored Bot override. Null means inherit Provider default for gateway; always null for plugin.
        effective_webhook_url:
          type: [string, "null"]
          description: Current resolved webhook endpoint; null for plugin and A2A gateway registration.

RegisterTokenPath:
  get:
    operationId: get_register_token
    tags: ["Collaboration / Register"]
    summary: Issue a short-lived bot-registration token for the authenticated Human.
    description: >-
      Human-Principal only. Only an authenticated Human may obtain a register
      token; Bot, App, and AccessKey principals are rejected with 403. The token
      is an HMAC document signed by the deployment's invite secret, valid for six
      hours, and is the sole credential consumed by the anonymous POST /register.
      Without provider_id this preserves the legacy v1 token and response.
      With provider_id, the caller must own the enabled Provider or the Provider
      must be explicitly approved for self-service registration by server config.
      A v2 token fixes Provider and Human ownership, allowed connection modes and
      Provider auth_mode at issuance; it can
      also be consumed by legacy POST /register, which preserves HTTP 200 and
      bare JSON. Legacy GET /register/token supports the same optional
      provider_id through its configured Human authentication boundary.
      Neither a webhook nor downlink credential
      readiness is required at token issuance.
    x-avernet-security:
      user: required
    parameters:
      - name: provider_id
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_.:-]+$'
    responses:
      "200":
        description: Register token issued.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/RegisterTokenEnvelope
      "401":
        description: Gateway Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: Principal has no Human identity, is not authorized for this Provider, or Provider is disabled.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse
      "400":
        description: Invalid or blank Provider identifier.
        x-error-codes: [invalid_request]
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Provider does not exist.
        x-error-codes: [provider_not_found]
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope

RegisterPath:
  post:
    operationId: register_bot
    tags: ["Collaboration / Register"]
    summary: Register a new Bot with a register token (no login required).
    description: >-
      Anonymous endpoint. The register token is the only credential; BCS verifies
      the HMAC token before creating the Bot. The Bot is onboarded under the
      human actor encoded in the token, establishing ownership.
      Mode defaults to plugin (upstream WebSocket/bridge connection), using the
      same plugin/gateway values as Provider administration and Bot storage.
      A v1 token cannot register gateway or Provider
      options. A v2 token requires provider_bot_ref; Provider/owner cannot be
      overridden by request parameters. Provider authorization is checked again
      on redemption. When the signed auth_mode claim is present, it must match
      the current Provider configuration before creation; a mismatch is invalid_request.
      Historical v2 tokens without this claim use the current Provider configuration.
      Plugin saves membership without HTTP delivery binding.
      Both modes support static_bearer, provider_admin and agentpass Providers.
      agentpass-subbots requires a complete provider_bot_ref in parent:slug form.
      BCS splits the last colon, validates both parts, stores the parent as
      agent_code and preserves the supplied ref. Existing Providers
      cannot change authentication mode.
      For AgentPass, provider_bot_ref must be the real AgentPass agent code;
      BCS saves it as the Bot's agent_code, as in Provider-admin registration.
      No separate agent_code parameter or AgentPass token is required to register.
      Gateway uses webhook_url override or Provider default. Callers authorized
      for Provider self-service registration may set an override. Delivery to
      either endpoint uses the shared Provider downlink credential. At least one usable
      endpoint is required, together with an existing, enabled
      downlink_bcs_to_provider credential with a nonblank secret. Gateway checks
      these prerequisites before creation; plugin does not read or require
      a downlink credential. Credential-store failures return 500, not a readiness
      error. Provider/ref is unique across modes and retained after soft deletion.
      Checks run inside registration; no separate availability-check API is provided.
      Any duplicate scoped ref returns 409, including an identical retry.
      A valid token can register multiple distinct refs. SQL Bot creation and
      gateway binding, Human identity, ownership, profile and audit creation are
      atomic. Optional agent_card_url or inline agent_card JSON selects A2A registration with a scoped v2
      token in gateway mode, without webhook_url. The signed Human must currently
      manage the Provider; self-service access alone cannot bind a remote Agent.
      BCS fetches and validates the public Card before opening the transaction,
      then atomically saves the complete Card, nullable source URL and revision
      with the Bot lifecycle records. Interfaces derive from current deployment
      policy and credentials from the trusted Provider binding. No webhook default is
      required or used for A2A. Card failure creates no Bot. Registration is not an
      endpoint-update or mode-migration API. Responses containing tokens must not
      be cached. No bridge process is started by this API.
    x-avernet-security: {}
    parameters:
      - name: token
        in: query
        required: true
        description: Register token previously issued by GET /register/token.
        schema:
          type: string
          minLength: 1
      - name: bot-name
        in: query
        required: false
        description: Required for legacy registration; optional A2A alias defaults to Card.name. The wire name keeps the legacy
          dashed form. Servers also accept `bot_name`.
        schema:
          type: string
          minLength: 2
          maxLength: 64
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum: [plugin, gateway]
          default: plugin
      - name: provider_bot_ref
        in: query
        required: false
        description: Required with a Provider-scoped v2 token; stable identity within the Provider. For agentpass, supply the real AgentPass agent code. For agentpass-subbots, supply the client-composed parent:slug ref; the last colon delimits a slug matching [a-z0-9][a-z0-9_-]{0,31}, and only the parent is stored as agent_code. The complete ref is limited to 128 bytes.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_.:-]+$'
      - name: webhook_url
        in: query
        required: false
        description: Optional gateway-only Bot override for authorized Provider registration callers. Delivery uses the shared Provider downlink credential. Blank is invalid; subject to outbound URL policy.
        schema:
          type: string
          format: uri
          minLength: 1
      - name: agent_card_url
        in: query
        required: false
        description: Public A2A Card source. Requires a scoped v2 gateway registration token belonging to a current Provider manager; mutually exclusive with webhook_url. Subject to outbound URL and Card declaration validation. Not accepted with legacy v1 tokens.
        schema:
          type: string
          format: uri
          minLength: 1
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              agent_card:
                type: object
                description: Complete inline AgentCard, mutually exclusive with agent_card_url. Uses the same declaration and egress validation without a Card GET. Scoped v2 gateway only.
                additionalProperties: true
              agent_card_url:
                type: string
                format: uri
              bot_name:
                type: string
                minLength: 2
                maxLength: 64
            description: Query/body duplicates are rejected. Omitted A2A name defaults from Card.name. URL-backed Cards can refresh; inline Cards require explicit updates.
    responses:
      "201":
        description: Bot registered with its credentials.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotRegistrationEnvelope
      "400":
        description: Missing or invalid parameters, invalid name length, or gateway endpoint/downlink credential not ready.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Register token failed verification (expired, wrong signature, malformed).
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse
      "403":
        description: Provider registration is not authorized, or requested mode is outside token scope.
        x-error-codes: [forbidden]
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Provider no longer exists.
        x-error-codes: [provider_not_found]
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: Registration identity or previously registered Bot/delivery state conflicts.
        x-error-codes: [registration_conflict]
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
