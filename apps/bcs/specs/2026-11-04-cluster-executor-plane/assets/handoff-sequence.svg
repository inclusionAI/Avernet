<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a6b0a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">Handoff of bucket b from draining executor A to successor B</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">Rounds and control events are retried until acknowledged; only deltas can go missing from the live view, and B recovers them from the agent.</text>

  <rect x="60" y="72" width="170" height="40" rx="8" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="145" y="97" font-size="13" font-weight="bold" text-anchor="middle" fill="#9a6b0a">Executor A (draining)</text>
  <rect x="300" y="72" width="170" height="40" rx="8" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="385" y="91" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#9a6b0a">Message queue</text>
  <text x="385" y="105" font-size="10.5" text-anchor="middle" fill="#5c6a62">delta channel deltas:{b}</text>
  <rect x="540" y="72" width="150" height="40" rx="8" fill="#eef2fa" stroke="#2457a6"/>
  <text x="615" y="97" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457a6">Shared DB</text>
  <rect x="760" y="72" width="170" height="40" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="845" y="97" font-size="13" font-weight="bold" text-anchor="middle" fill="#157a55">Executor B (successor)</text>
  <line x1="145" y1="112" x2="145" y2="520" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="385" y1="112" x2="385" y2="520" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="615" y1="112" x2="615" y2="520" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="845" y1="112" x2="845" y2="520" stroke="#b9c6bf" stroke-dasharray="3 4"/>

  <text x="24" y="144" font-size="11" font-weight="bold" fill="#5c6a62">1</text>
  <rect x="70" y="130" width="150" height="22" rx="5" fill="#ffffff" stroke="#9a6b0a"/>
  <text x="145" y="145" font-size="10.5" text-anchor="middle" fill="#9a6b0a">draining · stop claiming</text>

  <text x="24" y="184" font-size="11" font-weight="bold" fill="#5c6a62">2</text>
  <line x1="149" y1="180" x2="841" y2="180" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="495" y="174" font-size="11" text-anchor="middle" fill="#1c2420">PREPARE(b)</text>
  <text x="845" y="198" font-size="10.5" text-anchor="middle" fill="#157a55">loads b's warm sessions — not owner yet</text>
  <line x1="381" y1="214" x2="149" y2="214" stroke="#9a6b0a" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="265" y="208" font-size="10.5" text-anchor="middle" fill="#9a6b0a">deltas keep arriving</text>
  <text x="145" y="232" font-size="10.5" text-anchor="middle" fill="#9a6b0a">A processes and forwards them</text>

  <text x="24" y="270" font-size="11" font-weight="bold" fill="#5c6a62">3</text>
  <line x1="149" y1="266" x2="381" y2="266" stroke="#9a6b0a" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="265" y="260" font-size="10.5" text-anchor="middle" fill="#9a6b0a">unsubscribe</text>
  <rect x="60" y="276" width="170" height="22" rx="5" fill="#ffffff" stroke="#9a6b0a"/>
  <text x="145" y="291" font-size="10.5" text-anchor="middle" fill="#9a6b0a">finish deltas already received</text>

  <text x="24" y="332" font-size="11" font-weight="bold" fill="#5c6a62">4</text>
  <line x1="149" y1="328" x2="611" y2="328" stroke="#5c6a62" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="440" y="322" font-size="11" text-anchor="middle" fill="#1c2420">TRANSFER: owner of b = B, token n → n+1</text>
  <line x1="149" y1="356" x2="841" y2="356" stroke="#157a55" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="560" y="350" font-size="11" text-anchor="middle" fill="#157a55">COMMIT: you own b now, start driving it</text>

  <text x="24" y="392" font-size="11" font-weight="bold" fill="#5c6a62">5</text>
  <rect x="40" y="378" width="400" height="26" rx="5" fill="#f8e6e1" stroke="#b3402e"/>
  <text x="240" y="395" font-size="10.5" text-anchor="middle" fill="#b3402e">deadline (below the stop-hook timeout): transfer what is left at once</text>

  <text x="24" y="436" font-size="11" font-weight="bold" fill="#5c6a62">6</text>
  <line x1="841" y1="432" x2="619" y2="432" stroke="#157a55" marker-end="url(#ag)"/>
  <text x="730" y="426" font-size="10.5" text-anchor="middle" fill="#157a55">re-read what changed (write_seq)</text>
  <line x1="841" y1="458" x2="389" y2="458" stroke="#9a6b0a" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="615" y="452" font-size="10.5" text-anchor="middle" fill="#9a6b0a">subscribe deltas:{b}</text>
  <rect x="700" y="470" width="240" height="40" rx="5" fill="#ffffff" stroke="#157a55"/>
  <text x="820" y="486" font-size="10.5" text-anchor="middle" fill="#157a55">ask agents (via dispatch gateways)</text>
  <text x="820" y="501" font-size="10.5" text-anchor="middle" fill="#157a55">for missed output · republish append: false</text>

  <text x="24" y="508" font-size="11" font-weight="bold" fill="#5c6a62">7</text>
  <rect x="60" y="494" width="170" height="22" rx="5" fill="#ffffff" stroke="#5c6a62"/>
  <text x="145" y="509" font-size="10.5" text-anchor="middle" fill="#1c2420">stop hook done · A exits</text>

  <rect x="24" y="536" width="912" height="88" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="44" y="560" font-size="13" font-weight="bold" fill="#1c2420">If something fails midway, existing mechanisms cover it</text>
  <text x="44" y="582" font-size="11.5" fill="#1c2420">B dies → ordinary takeover · COMMIT lost → B finds b at its next unadopted-lease read · A writes after 4 → fenced out ·</text>
  <text x="44" y="600" font-size="11.5" fill="#1c2420">A publishes after 4 → subscribers drop token n · deltas between 3 and 6 reach no one live → B recovers them in 6.</text>
</svg>
