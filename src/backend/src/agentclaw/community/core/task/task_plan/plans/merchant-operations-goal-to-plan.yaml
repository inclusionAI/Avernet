template_id: merchant-operations-goal-to-plan
entry_bot_id: "${store_owner_bot_id}"
entry_name: 店主Bot
# 每个节点只描述本角色工作边界;上游正文由 StaticPlanRuntime 统一透传(接自/上游产出正文/本角色任务),
# 不在 task 里替下游预写专业 checklist。输入=上一Bot输出(handoff 接力)。
task_type: static_plan
input_schema:
  okr:
    type: string
    required: true

nodes:
  - id: set_redlines
    name: 店主Bot
    title: 店主·定红线封任务单
    type: bot
    bot_id: "${store_owner_bot_id}"
    depends_on: []
    input:
      okr: $.input.okr
      public_context: |
        背景：理发店为庆祝成立18周年，准备开展周年促销、护理套餐和会员权益活动，通过优化服务安排与营销协作，提升到店客流和护理业务，同时维护老客口碑并沉淀可复购会员。
        经营约束：促销预算 ≤ 20 万；备货新增现金占用 ≤ 8 万；活动窗口 2026.10.15—2026.11.15，共 32 天。
        经营目标：新客到店 1500；券核销 ≥ 1000；护理售卖 200 份（转化 ≥ 15%）；新增会员 ≥ 800；客诉差评 ≤ 日常水平的 1.2 倍。
    output:
      handoff: $.result
    task: |
      【接力执行·三步闭环】
      step1 接力上下文:你是店主侧经营负责人(入口/第一次出场),接自本次周年经营触发——触发方规划的起步任务=定公共约束红线、封任务单(OKR 与公共经营信息见上方"## 上游产出正文")。把下面公共经营信息当共同事实底稿,不依据"接自"一行猜测背景。
        背景:理发店18周年,开展周年促销、护理套餐、会员权益活动,提升到店客流与护理业务、沉淀可复购会员。
        经营约束:促销预算≤20万;备货新增现金占用≤8万;活动窗口2026.10.15—2026.11.15(32天)。
        经营目标:新客到店1500;券核销≥1000;护理售卖200份(转化≥15%);新增会员≥800;客诉差评≤日常1.2倍。
        职责边界:只定红线封任务单,不替门店运营/营销/评审/实施做专业判断。
      step2 执行产出:结合公共信息与触发消息,区分已知事实/待确认假设/需店主取舍事项;用自持成本账本算价格红线(补贴率/最低折扣/最低价)与平台合规红线,封成公共约束任务单:活动窗口、营业时段、促销预算上限、备货现金占用上限、价格红线、平台合规红线、客流目标。单品成本/毛利底线/授权清单自持不下发,留利润核算。
      step3 gap 与交接:本步执行产出完成后,对照经营目标计算 gap(还差:客流目标与产能关系未定,运营/营销/评审/实施等专业判断均未做);据此定下一步任务=测算门店能力画像与产能缺口,经搜推命中门店运营Bot,派发给门店运营Bot(workflow下一节点执行者)执行。产出末尾声明"公共约束任务单已封,交门店运营接力测产能"。

  - id: ops_capacity
    name: 门店运营Bot
    title: 门店运营·测产能出画像·带营销约束
    type: bot
    bot_id: "${store_ops_bot_id}"
    depends_on: [set_redlines]
    input:
      handoff: $.set_redlines.output.handoff
    output:
      handoff: $.result
    task: |
      【接力执行·三步闭环】
      step1 接力上下文:你接自店主Bot(店主Bot 执行完计算 gap 后规划的下一步任务=测门店能力画像与产能缺口,其交付=公共约束任务单见上方"## 上游产出正文")。你是门店运营Bot,承接该下一步任务执行。职责边界:只做门店能力画像与原样透传营销约束,不解读/不使用营销约束,不做营销方案。
      step2 执行产出:用运营相关子集(活动窗口、营业时段、备货现金占用上限、客流目标)测算门店能力画像:工位/员工、服务时长、各时段空余产能、按服务类型可接上限、库存耗材现状与可补量、可扩选项、目标vs产能缺口。营销约束(预算/价格红线/平台合规/客流目标)原样附在产出里。
      step3 gap 与交接:本步执行产出完成后,对照客流目标计算 gap(还差:高峰时段产能不足,营销方案与玩法未设计);据此定下一步任务=设计可公开营销方案,经搜推命中营销Bot,派发给营销Bot(workflow下一节点执行者)执行。产出末尾声明"能力画像+原样营销约束已出,交营销接力出方案"。

  - id: marketing_plan
    name: 营销Bot
    title: 营销·在能力内出方案
    type: bot
    bot_id: "${marketing_bot_id}"
    depends_on: [ops_capacity]
    input:
      handoff: $.ops_capacity.output.handoff
    output:
      handoff: $.result
    task: |
      【接力执行·三步闭环】
      step1 接力上下文:你接自门店运营Bot(门店运营Bot 执行完计算 gap 后规划的下一步任务=设计可公开营销方案,其交付=能力画像+原样营销约束见上方"## 上游产出正文")。你是营销Bot,承接该下一步任务执行。职责边界:在能力画像约束内设计可公开营销方案,不替评审/核算/实施下结论。
      step2 执行产出:设计营销方案:新客引流券(补贴率/折扣/放量分批按产能)、老客护理套餐(价格不低于红线、按库存产能限量、预约制)、会员机制、投放节奏(占用率阈值暂停)。无法确认的保留为条件或待决策。
      step3 gap 与交接:本步执行产出完成后,对照方案可公开性计算 gap(还差:展位报批、券有效期明示等需商场/平台评审);据此定下一步任务=商场与平台侧评审,经搜推命中评审群,派发给评审群(workflow下一节点执行者)执行。产出末尾声明"营销方案已出,交评审群接力过审"。

  - id: review_group
    name: 评审群
    title: 评审群·修订过审
    type: collaboration
    depends_on: [marketing_plan]
    collaboration:
      bot_ids: ["${mall_ops_bot_id}", "${online_platform_bot_id}"]
      bot_names: [商场运营Bot, 线上平台Bot]
      mode: chat
      completion: report
    input:
      handoff: $.marketing_plan.output.handoff
    output:
      handoff: $.result
    task: |
      【接力执行·三步闭环】
      step1 接力上下文:你接自营销Bot(营销Bot 执行完计算 gap 后规划的下一步任务=商场与平台侧评审,其交付=完整营销方案见上方"## 上游产出正文")。你是评审群(driver 商场运营企划 + 线上平台口碑风控),承接该下一步任务执行。职责边界:做商场与平台侧评审、给修订条件,默认不打回。
      step2 执行产出:逐项给修订条件——商场:展位报批、传单限入口、营业时段内执行;平台:券有效期与预约限制须活动页明示、禁止全城最低、设等待超时安抚、客诉超阈值暂停投放。处理不了的标明。
      step3 gap 与交接:本步执行产出完成后,对照合规要求计算 gap(还差:成本/毛利/授权待店主核算);据此定下一步任务=利润核算与授权划界,经搜推命中店主Bot,派发给店主Bot(workflow下一节点执行者,第二次出场)执行。产出末尾声明"过审方案+修订条件已出,交店主接力利润核算"。

  - id: profit_accounting
    name: 店主Bot
    title: 店主·利润核算·授权划界
    type: bot
    bot_id: "${store_owner_bot_id}"
    depends_on: [review_group]
    input:
      handoff: $.review_group.output.handoff
    output:
      handoff: $.result
    task: |
      【接力执行·三步闭环】
      step1 接力上下文:你接自评审群(评审群 执行完计算 gap 后规划的下一步任务=利润核算与授权划界,其交付=过审完整方案+修订条件见上方"## 上游产出正文";店主Bot第二次出场)。你是店主Bot,承接该下一步任务执行。职责边界:只做利润核算与授权划界,不替店主人决定取舍。
      step2 执行产出:用自持单品成本账本做利润核算:逐项算成本/售价/毛利是否达标,低于毛利底线标红。输出利润核算表、授权清单(哪些可自主、哪些需店主审批)、待取舍项。
      step3 gap 与交接:本步执行产出完成后,对照授权清单计算 gap(还差:待取舍/需审批项待店主决定,投放执行未做);据此定下一步任务=投放执行,经搜推命中投放实施,派发给投放实施(workflow下一节点执行者)执行。产出末尾声明"利润核算+授权划界已出,交投放实施接力执行"。

  - id: launch
    name: 投放实施
    title: 投放实施·执行
    type: bot
    bot_id: "${launch_bot_id}"
    depends_on: [profit_accounting]
    input:
      handoff: $.profit_accounting.output.handoff
    output:
      handoff: $.result
    task: |
      【接力执行·三步闭环】
      step1 接力上下文:你接自店主Bot(店主Bot 执行完计算 gap 后规划的下一步任务=投放执行,其交付=利润核算表+授权清单+待取舍项见上方"## 上游产出正文")。你是投放实施,承接该下一步任务执行。职责边界:投放执行(发券/传单/展位/推送),不做利润核算与取舍决策,不替研发预写技术实现。
      step2 执行产出:在授权可自主范围内执行投放并记实施记录;需审批项挂起、待取舍项标暂停。
      step3 gap 与交接:本步执行产出完成后,对照客流/核销目标计算 gap(还差:到店核销防重复领工具缺失,本节点无法补齐);据此定下一步任务=补齐周年活动券重复领取拦截能力,经搜推命中研发bot,派发给研发bot(workflow下一节点执行者,转BBS承接)执行;本节点无法补齐的能力在 unhandled_tasks 结构化上报(业务事实/影响/需补齐能力),不假装已完成。产出末尾声明"能力缺口交 BBS 研发接力,自主实施部分已完成"。

  - id: coupon_duplicate_claim_bbs
    name: 补齐周年活动券重复领取拦截能力
    title: 周年活动券重复领取拦截能力缺口
    type: bbs_handoff
    bot_id: "${coupon_dup_claim_bot_id}"
    depends_on: [launch]
    input:
      handoff: $.launch.output.handoff
      unhandled_tasks:
        - id: merchant-coupon-duplicate-claim
          title: 补齐周年活动券重复领取拦截能力
          task_source: 周年活动投放实施阶段
          business_context: 理发店成立18周年,活动窗口为2026.10.15—2026.11.15,经营目标包含新客到店1500、券核销不少于1000、护理售卖200份、新增会员800。
          constraints: 促销预算不超过20万元;备货新增现金占用不超过8万元。
          problem: 店方现有工具无法可靠判断同一用户是否已经领取过同类活动券,无法有效拦截重复领取。
          impact: 若直接投放,可能造成重复领券、促销预算超支、到店核销争议和用户体验下降,并放大客诉与周年活动口碑风险。
          current_owner_boundary: 投放实施角色只能配置和执行已有活动能力,没有开发新的领取状态判断或重复领取拦截能力。
          requested_capability: 补齐活动券领取过程中的重复领取拦截能力,先判断现有活动链路和数据是否具备承接条件。
          expected_result: 给出可实施的能力评估与实现结果,说明可用范围、接入方式、限制条件和验证结果;完成后回传投放实施环节继续活动执行。
    output:
      bbs_handed: $.result
      handoff: $.result
    task: |
      【接力执行·三步闭环】
      step1 接力上下文:你接自投放实施(投放实施 执行完计算 gap 后规划的下一步任务=补齐周年活动券重复领取拦截能力,其交付=能力缺口 unhandled_tasks 见上方"## 上游产出正文")。你认领 BBS 上"补齐周年活动券重复领取拦截能力"任务,承接该下一步任务执行。职责边界:评估并补齐领取状态判断/重复领取拦截能力,不把未验证能力当已完成。
      step2 执行产出:先了解现有领取链路、用户识别方式、历史领取记录是否可用;再给出可实施方案、接入方式、限制条件与验证结果。
      step3 gap 与交接:本步执行产出完成后,对照能力补齐验收标准计算 gap;本节点为接力终点——完成能力补齐并经验收通过后,周年活动券重复领取拦截能力缺口闭合,接力目标达成,终结接力、不再向下搜推派发;若验收仍有缺口,在产出中写明剩余 gap 由框架处置。产出末尾声明"能力缺口已闭合,验收通过,接力目标完成"。
