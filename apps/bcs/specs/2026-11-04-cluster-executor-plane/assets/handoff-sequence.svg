<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">Handoff of a session S from draining executor A to successor B</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">The gap for S is steps 3–6: one DB write plus one peer round trip (milliseconds). Only the live holder can transfer a lease.</text>

  <rect x="80" y="72" width="170" height="40" rx="8" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="165" y="97" font-size="13" font-weight="bold" text-anchor="middle" fill="#9a6b0a">Executor A (draining)</text>
  <rect x="395" y="72" width="170" height="40" rx="8" fill="#eef2fa" stroke="#2457a6"/>
  <text x="480" y="97" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457a6">Shared DB</text>
  <rect x="710" y="72" width="170" height="40" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="795" y="97" font-size="13" font-weight="bold" text-anchor="middle" fill="#157a55">Executor B (successor)</text>
  <line x1="165" y1="112" x2="165" y2="440" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="480" y1="112" x2="480" y2="440" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="795" y1="112" x2="795" y2="440" stroke="#b9c6bf" stroke-dasharray="3 4"/>

  <text x="24" y="146" font-size="11" font-weight="bold" fill="#5c6a62">1</text>
  <text x="165" y="146" font-size="11" text-anchor="middle" fill="#1c2420">B = HRW(S, roster − draining)</text>
  <text x="24" y="180" font-size="11" font-weight="bold" fill="#5c6a62">2</text>
  <line x1="169" y1="176" x2="791" y2="176" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="480" y="170" font-size="11" text-anchor="middle" fill="#1c2420">PREPARE(S)</text>
  <text x="795" y="198" font-size="10.5" text-anchor="middle" fill="#157a55">loads S (reads only) — not owner yet</text>
  <line x1="791" y1="214" x2="169" y2="214" stroke="#157a55" marker-end="url(#ag)"/>
  <text x="480" y="208" font-size="11" text-anchor="middle" fill="#157a55">READY (or refuse if B is draining → try next-ranked)</text>

  <text x="24" y="248" font-size="11" font-weight="bold" fill="#5c6a62">3</text>
  <rect x="85" y="232" width="160" height="34" rx="5" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="165" y="247" font-size="10.5" text-anchor="middle" fill="#9a6b0a">pause S: finish current write,</text>
  <text x="165" y="260" font-size="10.5" text-anchor="middle" fill="#9a6b0a">hold new rounds/events (ms)</text>

  <text x="24" y="296" font-size="11" font-weight="bold" fill="#5c6a62">4</text>
  <line x1="169" y1="292" x2="476" y2="292" stroke="#5c6a62" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="320" y="286" font-size="11" text-anchor="middle" fill="#1c2420">TRANSFER: node_id = B, token n → n+1</text>
  <rect x="400" y="302" width="160" height="24" rx="5" fill="#ffffff" stroke="#157a55"/>
  <text x="480" y="318" font-size="11" text-anchor="middle" fill="#157a55">owner B · token n+1</text>

  <text x="24" y="352" font-size="11" font-weight="bold" fill="#5c6a62">5</text>
  <line x1="169" y1="348" x2="791" y2="348" stroke="#157a55" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="480" y="342" font-size="11" text-anchor="middle" fill="#157a55">COMMIT(S, n+1) to B · MOVED(B) to S's subscribers</text>
  <text x="795" y="370" font-size="10.5" text-anchor="middle" fill="#157a55">drives S; if write_seq moved since</text>
  <text x="795" y="384" font-size="10.5" text-anchor="middle" fill="#157a55">PREPARE, re-reads only the change</text>

  <text x="24" y="414" font-size="11" font-weight="bold" fill="#5c6a62">6</text>
  <line x1="169" y1="410" x2="791" y2="410" stroke="#5c6a62" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="480" y="404" font-size="11" text-anchor="middle" fill="#1c2420">forward held rounds/events · later arrivals at A get NOT_OWNER(B) · gateways send the next event to B</text>

  <rect x="24" y="452" width="912" height="92" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="44" y="476" font-size="13" font-weight="bold" fill="#1c2420">If something fails midway, existing mechanisms cover it</text>
  <text x="44" y="498" font-size="11.5" fill="#1c2420">B dies after step 4 → ordinary takeover · A dies between 4 and 5 → B finds S at its next unadopted-lease read ·</text>
  <text x="44" y="516" font-size="11.5" fill="#1c2420">a MOVED is lost → periodic re-assertion · A stalls after 4 and writes → fenced out (token n). The PA's stream lives on a gateway and never notices.</text>
</svg>
