# Bot-Human-Bot 三节点协作模板。
# participants 只声明需要绑定实际 bot 的逻辑角色；Human 由群内当前用户参与，
# 因此 human_input 节点不配置 assignee，也不需要额外的 participant binding。

api_version: bcs.collaboration/v1
name: Bot-Human-Bot 三节点协作

metadata:
  description: Bot 先生成初稿，等待人工审核，再根据人工结论或修改意见生成最终结果。

participants:
  worker:
    display_name: 执行 Bot
    description: 负责生成初稿，并根据人工反馈输出最终结果。
    required: true

runtime:
  kind: state_machine
  state_machine:
    version: 1
    graph_mode: acyclic
    nodes:
      generate_draft:
        kind: bot_task
        display_name: 生成初稿
        assignee:
          type: bot_binding
          binding: worker
        instruction: 根据用户提出的任务生成一份简洁的初稿。
        transitions:
          complete:
            targets:
              - human_review

      human_review:
        kind: human_input
        display_name: 人工审核
        instruction: 请审核 Bot 生成的初稿。可以直接表示同意，也可以提出具体修改意见。
        node_timeout_ms: 86400000
        judge:
          type: llm
          criteria:
            - 判断用户是同意当前结果，还是要求 Bot 修改。
          outcomes:
            - approved
            - rejected
        transitions:
          approved:
            targets:
              - finalize
          rejected:
            targets:
              - finalize

      finalize:
        kind: bot_task
        display_name: 生成最终结果
        assignee:
          type: bot_binding
          binding: worker
        instruction: 阅读上游初稿和人工审核意见。如果人工同意，则整理并确认最终结果；如果人工提出了修改意见，则根据意见修改后输出最终结果。
        final_output: true
