<text x="46" y="659" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="middle">DS-6  ClawEvolve 是一个带参数的策略，还是三个（bot_evolution、skill_evolution、skill_hardening）</text>
