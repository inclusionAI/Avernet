<!doctype html><html lang="zh"><meta charset="utf-8"><title>Task asset browser contract fixture</title>
<link rel="stylesheet" href="/dist/task-panel.css">
<style>body{font:14px system-ui;margin:0;background:#f5f5f5}#controls{padding:12px;display:flex;gap:12px}#panel{height:calc(100vh - 60px);width:540px;background:white}#result{white-space:pre-wrap}</style>
<div id="controls"><button id="recover">恢复第二页卡片</button><button id="explicit">显式选择 T2</button><button id="close">关闭</button><span id="result"></span></div><div id="panel"></div>
<script src="/node_modules/react/umd/react.development.js"></script><script src="/node_modules/react-dom/umd/react-dom.development.js"></script><script src="/dist/index.umd.js"></script>
<script>
// Synthetic host contract fixture, not a claim of either product's E2E coverage.
const root=ReactDOM.createRoot(document.getElementById('panel'));let session={sessionId:'fixture-session',kind:'bot',botId:'fixture-bot'};let interactions=0;let pages=0;
const records=['T1','T2'].map(task_id=>({task_id,status:'DONE',execution_config:{main_session_id:'fixture-session'},task_spec:{context:{title:'测试任务 '+task_id}},gmt_modified:'2026-11-11 10:00:00'}));
const host={getViewer:()=>({userId:'fixture-viewer'}),getConversation:()=>session,
transport:{requestJson:async(path,signal)=>{signal.throwIfAborted();return{code:200000,data:path.includes('/by_session')?[]:path.includes('/list')?records:{task_id:new URL(path,location.origin).searchParams.get('task_id'),run_id:1,status:'DONE',needs_attention:false,tasks:[{node_id:'node-1',task_id:'T1',sequence:1,status:'DONE',task_spec:{metadata:{title:'验证节点'},goal:{objective:'测试共享任务副屏'}},run_info:{session_id:'fixture-child',run_mode:'single_bot',assignee:'fixture-bot'}}],relations:[]}}}},
history:{readPage:async(_ref,cursor,signal)=>{signal.throwIfAborted();pages++;return cursor?{messages:[{id:'declaration',timestamp:1,content:`<AixUI type="panel" component="taskPanel.TaskLoopView" params='{"taskId":"T1"}'/>`}],nextCursor:null}:{messages:[{id:'newer',timestamp:2,content:'普通消息'}],nextCursor:'page-2'}}},
artifacts:{readContent:async()=>new Blob(['fixture']),download:async()=>{}},captureOrigin:()=>({...session}),restoreOrigin:async(origin)=>{session=origin;return{status:'ready'}},navigate:async(target)=>{session=target;return{status:'ready'}},preservePanel:()=>{},recordInteraction:()=>{interactions++;show()},present:tab=>{root.render(React.createElement(taskPanel.TaskLoopView,{taskId:tab.params.taskId,apiBaseUrl:'',host,controller}));show()}};
const controller=taskPanel.createTaskPanelController(host);function show(){document.getElementById('result').textContent=JSON.stringify({task:controller.getSnapshot().activeTaskId,recovery:controller.getSnapshot().recovery.status,pages,interactions})}
controller.subscribe(show);document.getElementById('recover').onclick=()=>controller.enterConversation(session);document.getElementById('explicit').onclick=()=>controller.openTask({id:'task-T2',type:'taskPanel.TaskLoopView',title:'测试任务 T2',params:{taskId:'T2'},closable:true},'explicit');document.getElementById('close').onclick=()=>{controller.closeTask();root.render(null)};show();
</script></html>
