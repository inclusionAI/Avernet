# BCSFuse Open-Source Docker Compose
# OPENCORE-P1-G8 Docker Deployment Gate
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f bcsfuse
#   docker-compose down
#
# Test:
#   curl http://localhost:8765/health
#   curl http://localhost:8765/ready
#
# Run tests in container:
#   docker-compose exec bcsfuse python -m pytest tests/ -v

version: '3.8'

services:
  bcsfuse:
    build:
      context: ../..
      dockerfile: apps/bcsfuse/Dockerfile
    image: bcsfuse-opencore:p1-g8
    container_name: bcsfuse-opencore-g8
    ports:
      - "8765:8765"
    environment:
      - BCSFUSE_PROVIDER_MODE=dev_smoke
      - BCSFUSE_PORT=8765
      - QDRANT_MODE=server
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_GRPC_PORT=6334
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      # Mount tests for execution (read-only)
      - ./tests:/app/tests:ro
      - bcsfuse-data:/app/data
    restart: unless-stopped
    networks:
      - bcsfuse-network

  qdrant:
    image: qdrant/qdrant:v1.20.0
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
      - QDRANT__LOG_LEVEL=WARN
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - bcsfuse-network

volumes:
  bcsfuse-data:
  qdrant-data:

networks:
  bcsfuse-network:
    driver: bridge
