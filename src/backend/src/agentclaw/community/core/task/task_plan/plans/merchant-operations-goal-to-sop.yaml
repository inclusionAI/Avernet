template_id: merchant-operations-goal-to-sop
entry_bot_id: 20260901_kcvvkqqs
entry_name: 店主Bot
# execute 会根据 task_spec 的经营语义自动补入 static_plan_id；调用方无需传模板 id。
task_type: static_plan
input_schema:
  okr:
    type: string
    required: true

# 每个节点只描述本角色的工作边界；上游正文由 StaticPlanRuntime 统一透传，
# 不在 input/task 中替下游预写专业 checklist。
nodes:
  - id: frame_goal
    name: 明确经营目标
    title: 明确经营目标与约束
    type: bot
    bot_id: 20260901_kcvvkqqs
    depends_on: []
    input:
      okr: $.input.okr
    output:
      handoff: $.result
    task: |
      你是店主侧经营负责人。接收店主的原始经营目标，整理为目标卡：明确结果、周期、门店、客群、服务范围、已知约束，以及事实、假设和未知。只做目标澄清，不替营销、会员、产能、供应或风险角色预先完成专业判断。

  - id: design_marketing
    name: 设计营销打法
    title: 设计营销打法与公开承诺
    type: bot
    bot_id: 20260901_mylvdi1o
    depends_on: [frame_goal]
    input:
      handoff: $.frame_goal.output.handoff
    output:
      handoff: $.result
    task: |
      你接店主Bot的目标卡。把经营目标转成可解释、可公开的营销打法，并标出关键假设、依赖和无法确认的问题。你的职责是营销机制与公开承诺，不替会员服务、客流产能、供应履约或风险角色下结论。

  - id: design_membership_service
    name: 设计会员与服务承接
    title: 设计会员与服务承接
    type: bot
    bot_id: 20260901_5r6cdh02
    depends_on: [design_marketing]
    input:
      handoff: $.design_marketing.output.handoff
    output:
      handoff: $.result
    task: |
      你接营销Bot的营销方向与公开机制。判断这些承诺如何由会员分层、服务组合、权益兑现和服务边界承接；自行决定需要核验的专业信息，不假定上游已经列全。无法确认的内容保留为条件或待决策，不替客流、供应或风险角色完成判断。

  - id: assess_capacity
    name: 核验客流产能与排班
    title: 核验客流、产能与排班
    type: bot
    bot_id: 20260901_sesl8hmo
    depends_on: [design_membership_service]
    input:
      handoff: $.design_membership_service.output.handoff
    output:
      handoff: $.result
    task: |
      你接会员与服务Bot的服务承接方案。判断门店在目标周期内能否接住承诺，并提出必要的投放、预约、每日承接量或排班节奏调整。请自行拆解客流与产能侧所需事实；不要替供应履约确认资源，也不要替风险角色下最终结论。

  - id: assess_fulfillment
    name: 核验供应履约
    title: 核验供应、品质与履约
    type: bot
    bot_id: 20260901_4tn4mnnj
    depends_on: [assess_capacity]
    input:
      handoff: $.assess_capacity.output.handoff
    output:
      handoff: $.result
    task: |
      你接客流与产能Bot已经调整过的服务承诺、投放节奏或预约上限。判断当前方案能承诺到什么程度，哪些承诺需要条件、替代路径或延后确认。请自行决定供应履约侧的核验范围和专业方法，不接受上游替你列好的清单，也不能用猜测补齐未知事实。

  - id: risk_review_group
    name: 风险评审群
    title: 风险评审群
    type: collaboration
    depends_on: [assess_fulfillment]
    collaboration:
      bot_ids: [20260901_rpc6nx1i, 20260901_5rjroor8]
      bot_names: [业务风险Bot, 舆情Bot]
      mode: chat
      completion: report
    input:
      handoff: $.assess_fulfillment.output.handoff
    output:
      handoff: $.result
    task: |
      你是风险评审群(driver 业务风险Bot + 舆情Bot):基于上游带条件的经营承诺,做18周年店庆业务/合规/舆情风险评审,逐项给成因/等级/约束。
      处理不了的问题,按你的判断标明。
