# =============================================================================
# G2 Conflict Dimensions Taxonomy
# =============================================================================
#
# 定义 G2 结构化冲突分析所使用的冲突维度。
# 每个维度描述一个经典的业务/技术权衡场景。
#
# =============================================================================

# 冲突维度定义
dimensions:
  # 速度 vs 质量
  speed_vs_quality:
    name: "速度与质量"
    description: "快速交付与质量保障之间的权衡"
    axis_a:
      label: "speed"
      description: "追求快速交付、敏捷迭代"
      keywords:
        - "快速"
        - "紧急"
        - "尽快"
        - "加速"
        - "抢先"
        - "抢占市场"
        - "时间紧迫"
        - "立即上线"
        - "快速迭代"
        - "敏捷"
        - "冲刺"
        - "效率优先"
        - "速度优先"
        - "时间敏感"
        - "周发布"
        - "日发布"
    axis_b:
      label: "quality"
      description: "追求质量保障、稳定可靠"
      keywords:
        - "质量"
        - "稳定"
        - "可靠"
        - "测试"
        - "验证"
        - "充分测试"
        - "质量保障"
        - "零缺陷"
        - "高标准"
        - "品质"
        - "严格"
        - "仔细"
        - "审慎"
        - "稳健"
        - "质量优先"
        - "长期稳定"

  # 成本 vs 安全
  cost_vs_security:
    name: "成本与安全"
    description: "成本控制与安全投入之间的权衡"
    axis_a:
      label: "cost"
      description: "追求成本控制、资源优化"
      keywords:
        - "成本"
        - "预算"
        - "节约"
        - "节省"
        - "降本"
        - "控制支出"
        - "资源优化"
        - "成本控制"
        - "经济效益"
        - "投入产出"
        - "性价比"
        - "精简"
        - "压缩"
        - "削减"
        - "成本优先"
    axis_b:
      label: "security"
      description: "追求安全合规、风险控制"
      keywords:
        - "安全"
        - "防护"
        - "加固"
        - "风控"
        - "合规"
        - "安全投入"
        - "安全加固"
        - "风险控制"
        - "数据安全"
        - "信息安全"
        - "隐私保护"
        - "安全审计"
        - "漏洞修复"
        - "安全优先"
        - "零信任"

  # 短期 vs 长期
  short_term_vs_long_term:
    name: "短期与长期"
    description: "短期收益与长期发展之间的权衡"
    axis_a:
      label: "short_term"
      description: "关注短期目标、快速见效"
      keywords:
        - "短期"
        - "近期"
        - "当下"
        - "眼前"
        - "本季度"
        - "今年"
        - "快速见效"
        - "短期收益"
        - "立竿见影"
        - "短期目标"
        - "紧急任务"
        - "眼前利益"
        - "即时回报"
        - "短期业绩"
    axis_b:
      label: "long_term"
      description: "关注长期发展、可持续增长"
      keywords:
        - "长期"
        - "未来"
        - "持续"
        - "可持续"
        - "长远"
        - "战略"
        - "长期价值"
        - "长期发展"
        - "长期规划"
        - "可持续增长"
        - "长期投入"
        - "技术债务"
        - "架构演进"
        - "基础设施建设"
        - "长期投资"

  # 增长 vs 稳定
  growth_vs_stability:
    name: "增长与稳定"
    description: "业务增长与系统稳定之间的权衡"
    axis_a:
      label: "growth"
      description: "追求业务增长、规模扩张"
      keywords:
        - "增长"
        - "扩张"
        - "扩展"
        - "规模"
        - "快速扩张"
        - "业务增长"
        - "用户增长"
        - "市场份额"
        - "增长优先"
        - "规模效应"
        - "快速增长"
        - "扩张速度"
        - "增长目标"
        - "GMV"
        - "用户数"
    axis_b:
      label: "stability"
      description: "追求系统稳定、风险可控"
      keywords:
        - "稳定"
        - "稳健"
        - "可控"
        - "平稳"
        - "稳定运行"
        - "系统稳定"
        - "风险可控"
        - "稳定性"
        - "可靠运行"
        - "平稳运行"
        - "稳定优先"
        - "鲁棒性"
        - "容灾"
        - "高可用"
        - "稳定性保障"

  # 合规 vs 转化
  compliance_vs_conversion:
    name: "合规与转化"
    description: "监管合规与业务转化之间的权衡"
    axis_a:
      label: "compliance"
      description: "追求合规达标、风险规避"
      keywords:
        - "合规"
        - "监管"
        - "牌照"
        - "法规"
        - "合规要求"
        - "监管要求"
        - "风险规避"
        - "合规审查"
        - "合规优先"
        - "法律风险"
        - "政策风险"
        - "合规准入"
        - "红线"
        - "严禁"
        - "合规底线"
    axis_b:
      label: "conversion"
      description: "追求业务转化、用户体验"
      keywords:
        - "转化"
        - "转化率"
        - "用户体验"
        - "便捷"
        - "流畅"
        - "无障碍"
        - "低门槛"
        - "转化优先"
        - "业务增长"
        - "用户留存"
        - "活跃度"
        - "转化漏斗"
        - "用户满意度"
        - "体验优化"
        - "降低门槛"

# 维度冲突判定阈值
thresholds:
  # 判定为 conflict 的最低强度差
  conflict_strength_threshold: 0.6
  # 判定为 alignment 的最高强度差
  alignment_strength_threshold: 0.3
  # 判定为 tension 的强度范围
  tension_strength_min: 0.3
  tension_strength_max: 0.6
  # 最低置信度阈值
  min_confidence_threshold: 0.4