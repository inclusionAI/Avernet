RegisterTokenResult:
  type: object
  additionalProperties: false
  required:
    - token
    - expires_at
    - note
  properties:
    token:
      type: string
      minLength: 1
      description: HMAC register token signed with the deployment invite secret.
    expires_at:
      type: integer
      description: Absolute token expiry in milliseconds since the Unix epoch.
    note:
      type: string
    registration:
      type: object
      additionalProperties: false
      required: [token_version, provider_id, allowed_modes]
      description: Present only for scoped v2 tokens. Absence means legacy v1 issuance.
      properties:
        token_version:
          type: integer
          enum: [2]
        provider_id:
          type: string
        allowed_modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [upstream, gateway]

BotRegistrationResult:
  type: object
  additionalProperties: false
  required:
    - bot_name
    - bot_uuid
    - bot_token
  properties:
    bot_name:
      type: string
    bot_uuid:
      type: string
      description: Bot UUID, stable across identical scoped registration retries.
    bot_token:
      type: string
      description: Bot runtime credential. Scoped retries return the same credential; never a Provider-admin or shared downlink credential.
    registration:
      type: object
      additionalProperties: false
      required: [provider_id, provider_bot_ref, mode, webhook_url, effective_webhook_url]
      description: Present only for Provider-scoped registration. Does not indicate bridge process readiness.
      properties:
        provider_id:
          type: string
        provider_bot_ref:
          type: string
        mode:
          type: string
          enum: [upstream, gateway]
        webhook_url:
          type: [string, "null"]
          description: Stored Bot override. Null means inherit Provider default for gateway; always null for upstream.
        effective_webhook_url:
          type: [string, "null"]
          description: Current resolved gateway endpoint; null for upstream.

RegisterTokenPath:
  get:
    operationId: get_register_token
    tags: ["Collaboration / Register"]
    summary: Issue a short-lived bot-registration token for the authenticated Human.
    description: >-
      Human-Principal only. Only an authenticated Human may obtain a register
      token; Bot, App, and AccessKey principals are rejected with 403. The token
      is an HMAC document signed by the deployment's invite secret, valid for six
      hours, and is the sole credential consumed by the anonymous POST /register.
      Without provider_id this preserves the legacy v1 token and response.
      With provider_id, the caller must own the enabled Provider or the Provider
      must be explicitly approved for self-service registration by server config.
      A v2 token fixes Provider and Human ownership and allowed modes; it cannot
      be consumed by legacy /register. Neither a webhook nor downlink credential
      readiness is required at token issuance.
    x-avernet-security:
      user: required
    parameters:
      - name: provider_id
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_.:-]+$'
    responses:
      "200":
        description: Register token issued.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/RegisterTokenEnvelope
      "401":
        description: Gateway Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: Principal has no Human identity, is not authorized for this Provider, or Provider is disabled.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse
      "400":
        description: Invalid or blank Provider identifier.
        x-error-codes: [invalid_request]
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Provider does not exist.
        x-error-codes: [provider_not_found]
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope

RegisterPath:
  post:
    operationId: register_bot
    tags: ["Collaboration / Register"]
    summary: Register a new Bot with a register token (no login required).
    description: >-
      Anonymous endpoint. The register token is the only credential; BCS verifies
      the HMAC token before creating the Bot. The Bot is onboarded under the
      human actor encoded in the token, establishing ownership.
      Mode defaults to upstream. A v1 token cannot register gateway or Provider
      options. A v2 token requires provider_bot_ref; Provider/owner cannot be
      overridden by request parameters. Provider authorization is checked again
      on redemption. Upstream saves membership without HTTP delivery binding.
      Gateway uses webhook_url override or Provider default; only the Provider
      creator/owners may set an override because delivery uses a shared Provider
      credential. Self-service callers must use the Provider default. At least one usable
      endpoint is required, together with an existing, enabled
      downlink_bcs_to_provider credential with a nonblank secret. Gateway checks
      these prerequisites before reservation; upstream does not read or require
      a downlink credential. Credential-store failures return 500, not a readiness
      error. Identical scoped retries reuse identity and credentials;
      changed owner, name, mode or override conflicts. Registration is not an
      endpoint-update or mode-migration API. Responses containing tokens must not
      be cached. No bridge process is started by this API.
    x-avernet-security: {}
    parameters:
      - name: token
        in: query
        required: true
        description: Register token previously issued by GET /register/token.
        schema:
          type: string
          minLength: 1
      - name: bot-name
        in: query
        required: true
        description: Display name of the new Bot; the wire name keeps the legacy
          dashed form. Servers also accept `bot_name`.
        schema:
          type: string
          minLength: 2
          maxLength: 64
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum: [upstream, gateway]
          default: upstream
      - name: provider_bot_ref
        in: query
        required: false
        description: Required with a Provider-scoped v2 token; stable identity within the Provider.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_.:-]+$'
      - name: webhook_url
        in: query
        required: false
        description: Optional gateway-only Bot override, restricted to Provider creator/owners. Self-service callers must omit it and inherit Provider default. Blank is invalid; subject to outbound URL policy.
        schema:
          type: string
          format: uri
          minLength: 1
    responses:
      "201":
        description: Bot registered with its credentials.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotRegistrationEnvelope
      "400":
        description: Missing or invalid parameters, invalid name length, or gateway endpoint/downlink credential not ready.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Register token failed verification (expired, wrong signature, malformed).
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse
      "403":
        description: Provider registration or webhook override is not authorized, or requested mode is outside token scope.
        x-error-codes: [forbidden]
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Provider no longer exists.
        x-error-codes: [provider_not_found]
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: Registration identity or previously registered Bot/delivery state conflicts.
        x-error-codes: [registration_conflict]
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
