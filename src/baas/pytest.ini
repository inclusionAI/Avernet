[pytest]

asyncio_mode = auto

# suppress third-party deprecation warnings
filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince20:sofapy_base
    ignore::DeprecationWarning:starlette
    ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited
    ignore:coroutine 'Event.wait' was never awaited

# source
pythonpath = src

# markers
markers =
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests (requires running server)
    e2e_asgi: marks e2e tests using in-process ASGI transport
    e2e_boot: marks e2e boot-level tests
    
    mock_paas_hook_failure: marks tests for mock hook execution failure
    mock_paas_create_failure: marks tests for mock device creation failure
    mock_paas_destroy_failure: marks tests for mock device destroy failure
    mock_paas_device_not_found: marks tests for mock device not found (idempotent destroy)
    paas_operations: marks tests for PaaS service layer operations
    bot_run_lifecycle: marks tests for bot run lifecycle (start -> run -> stop)
    bot_run_concurrency: marks tests for bot run concurrency patterns
    health_check: marks tests for health check provider behavior
    dispatcher: marks tests for dispatcher integration
    start: marks tests for bot start workflow

# exclude integration and e2e by default (UT only)
addopts = -m "not integration and not e2e"