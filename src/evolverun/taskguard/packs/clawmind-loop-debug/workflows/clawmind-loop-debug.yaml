id: clawmind-loop-debug
version: "9"
title: 闭环调试

input:
  mode: mixed
  requiredParams:
    - workflowId
  optionalParams:
    - key: debugParams
      description: "目标 workflow 的业务参数 JSON，如 '{\"topic\":\"AI\"}'。启动前通过 workflow_engine_dispatch detail <workflowId> 获取参数定义并确认后填入"
    - key: examples
      description: "业务示例文件路径或内联 JSON"
    - key: maxRounds
      default: "5"
  sources:
    params: true
    message: true

identity:
  key: "{{input.digest}}"
  label: "闭环调试 {{input.params.workflowId}}"
  duplicatePolicy: allow

outputs:
  loopResult:
    from: "{{nodeOutput.report}}"
    public: true
    description: 调试结果与运行报告

defaults:
  progress:
    enabled: true
    sink: chat

messages:
  onCreated: "闭环调试已启动，目标: {{input.params.workflowId}}"
  onFinished: 闭环调试已完成

nodes:
  # ═══════════════════════════════════════════
  # P1: 版本检查 + 同步
  # ═══════════════════════════════════════════
  - id: version-check
    title: 版本检查
    phase: P1
    dependsOn: []
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        检查目标 workflow 的远端和本地版本差异。

        ⚠️ 关键：引擎进程会注入 CLAWWEB_BASE_URL 环境变量（指向本地网关端口），但脚本需要的是远端 ClawWeb URL。
        执行脚本前必须清除该环境变量，让脚本走 env_config.py 动态推导链
        （env.conf → .env.derived 缓存 → application.yaml 推导 → 硬编码默认值兜底）。
        所有 python3 调用前加: env -u CLAWWEB_BASE_URL -u CLAWWEB_API_URL

        **Step 1: 解析 workflowId**
        用 Bash 执行:
        env -u CLAWWEB_BASE_URL -u CLAWWEB_API_URL OPENCLAW_HOME="$HOME/.openclaw" PLUGIN_HOME="$HOME/openclawExt/clawmind" SKILL_DIR="$HOME/.openclaw/workspace/skills/clawmind-workflow" python3 $HOME/.openclaw/workspace/skills/clawmind-workflow/scripts/debug/resolve-workflow-id.py "{{input.params.workflowId}}"
        输出即 resolvedId。

        **Step 2: 检查版本差异**
        用 Bash 执行:
        env -u CLAWWEB_BASE_URL -u CLAWWEB_API_URL OPENCLAW_HOME="$HOME/.openclaw" PLUGIN_HOME="$HOME/openclawExt/clawmind" SKILL_DIR="$HOME/.openclaw/workspace/skills/clawmind-workflow" python3 $HOME/.openclaw/workspace/skills/clawmind-workflow/scripts/debug/check-workflow-update.py <resolvedId>

        脚本输出 JSON，按 status 输出判定结果:

        | 脚本 status | 含义 | 输出 sync_action | 处理 |
        |-------------|------|-----------------|------|
        | up_to_date | 本地=远端，已是最新 | "none" | 无需操作，--debug 读本地 |
        | not_on_remote | 本地有，远端没有 | "none" | 无需操作，--debug 读本地；调试完由 skill 引导用户决策是否部署 |
        | no_local_file | 本地没有，远端有 | "pull_from_remote" | 从远端拉取到本地 |
        | update_available | 两边都有，远端更新 | "version_conflict" | 退出循环，输出 diff+时间，由 skill 透出用户决策 |
        | api_unreachable / api_auth_error | API不可达/鉴权失败 | "api_error" | 退出循环 |

        输出格式:
        - sync_action=none: {"sync_action": "none", "resolvedId": "<id>"}
        - sync_action=pull_from_remote: {"sync_action": "pull_from_remote", "resolvedId": "<id>"}
        - sync_action=version_conflict: {"sync_action": "version_conflict", "resolvedId": "<id>", "local_time": "<localMtimeReadable>", "remote_time": "<remoteUpdatedAtReadable>", "diff": "<diff内容前50行>", "summary": "<变更摘要>"}
        - sync_action=api_error: {"sync_action": "api_error", "error": "<api_unreachable或api_auth_error>", "fix_hint": "远端 API 不可达或鉴权失败，请检查网络和 IAM Token 配置"}

        如果 resolvedId 无法解析:
        {"sync_action": "error", "error": "workflow_not_found", "fix_hint": "目标 workflow 不存在，请确认 workflowId 或先部署后再调试"}

        ⚠️ 不要自行执行同步，只做检查和判定
        ⚠️ 输出纯 JSON
    outputContract:
      required: true
      schema:
        type: object
        required: [sync_action]
        properties:
          sync_action: {type: string}
          resolvedId: {type: string}
          local_time: {type: string}
          remote_time: {type: string}
          diff: {type: string}
          summary: {type: string}
          error: {type: string}
          fix_hint: {type: string}
    onResult:
      branches:
        - match: {sync_action: "none"}
          branchId: sync-none
        - match: {sync_action: "pull_from_remote"}
          branchId: sync-pull
        - match: {sync_action: "version_conflict"}
          branchId: sync-conflict
        - match: {sync_action: "api_error"}
          branchId: sync-api-error
        - match: {sync_action: "error"}
          branchId: sync-error

  - id: version-error
    title: 版本检查失败
    phase: P1
    dependsOn: [version-check]
    branchId: sync-error
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        版本检查失败。

        错误: {{nodeOutput.version-check.error}}
        修复建议: {{nodeOutput.version-check.fix_hint}}

        输出: {"status": "version_error", "error": "...", "fix_hint": "..."}

        ⚠️ 输出纯 JSON
    outputContract:
      required: true
      schema:
        type: object
        required: [status, error]
        properties:
          status: {type: string}
          error: {type: string}
          fix_hint: {type: string}

  - id: version-conflict
    title: 版本冲突
    phase: P1
    dependsOn: [version-check]
    branchId: sync-conflict
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        远端和本地都存在此 workflow，且远端版本更新。需要用户选择使用哪个版本。

        - 本地版本时间: {{nodeOutput.version-check.local_time}}
        - 远端版本时间: {{nodeOutput.version-check.remote_time}}
        - 变更摘要: {{nodeOutput.version-check.summary}}
        - Diff（前50行）: {{nodeOutput.version-check.diff}}

        输出（不要自行选择，交给用户决策）:
        {"status": "version_conflict", "resolvedId": "{{nodeOutput.version-check.resolvedId}}", "local_time": "...", "remote_time": "...", "diff": "...", "summary": "..."}

        ⚠️ 不要自行决定版本，输出信息让用户选择
        ⚠️ 输出纯 JSON
    outputContract:
      required: true
      schema:
        type: object
        required: [status, resolvedId, local_time, remote_time]
        properties:
          status: {type: string}
          resolvedId: {type: string}
          local_time: {type: string}
          remote_time: {type: string}
          diff: {type: string}
          summary: {type: string}

  - id: version-api-error
    title: API不可达
    phase: P1
    dependsOn: [version-check]
    branchId: sync-api-error
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        远端 API 不可达或鉴权失败，无法检查版本。

        错误: {{nodeOutput.version-check.error}}
        修复建议: {{nodeOutput.version-check.fix_hint}}

        输出: {"status": "api_error", "error": "...", "fix_hint": "..."}

        ⚠️ 输出纯 JSON
    outputContract:
      required: true
      schema:
        type: object
        required: [status, error, fix_hint]
        properties:
          status: {type: string}
          error: {type: string}
          fix_hint: {type: string}

  - id: version-none-ok
    title: 无需同步
    phase: P1
    dependsOn: [version-check]
    branchId: sync-none
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        本地已有此 workflow，可直接用 --debug 调试。无需同步。
        输出: {"ok": true, "resolvedId": "{{nodeOutput.version-check.resolvedId}}"}
        ⚠️ 输出纯 JSON
    outputContract:
      required: true
      schema:
        type: object
        required: [ok]
        properties:
          ok: {type: boolean}
          resolvedId: {type: string}

  - id: version-pull-from-remote
    title: 从远端拉取
    phase: P1
    dependsOn: [version-check]
    branchId: sync-pull
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        本地不存在此 workflow 的 YAML 文件，远端有部署记录。从远端拉取到本地。

        ⚠️ 清除引擎注入的错误环境变量，走 env_config.py 动态推导:
        用 Bash 执行:
        env -u CLAWWEB_BASE_URL -u CLAWWEB_API_URL OPENCLAW_HOME="$HOME/.openclaw" PLUGIN_HOME="$HOME/openclawExt/clawmind" SKILL_DIR="$HOME/.openclaw/workspace/skills/clawmind-workflow" python3 $HOME/.openclaw/workspace/skills/clawmind-workflow/scripts/debug/check-workflow-update.py {{nodeOutput.version-check.resolvedId}} --apply-update --local-file $HOME/openclawExt/clawmind/packs/{{nodeOutput.version-check.resolvedId}}/workflows/{{nodeOutput.version-check.resolvedId}}.yaml

        同步结果判定:
        - 脚本退出码 0 且输出含 "updated" 或 "success" → {"ok": true, "resolvedId": "{{nodeOutput.version-check.resolvedId}}"}
        - 脚本退出码非 0 或输出含 "error"/"failed"/"update_failed" → {"ok": false, "error": "<脚本报错信息>"}
        - 脚本无输出 → {"ok": false, "error": "拉取脚本未返回结果"}

        ⚠️ 必须根据脚本实际退出码和输出判定成功/失败，不要假设成功
        ⚠️ 输出纯 JSON
    outputContract:
      required: true
      schema:
        type: object
        required: [ok]
        properties:
          ok: {type: boolean}
          resolvedId: {type: string}
          error: {type: string}
    onResult:
      branches:
        - match: {ok: true}
          branchId: sync-ok
        - match: {ok: false}
          branchId: sync-fail

  - id: version-sync-fail
    title: 拉取失败
    phase: P1
    dependsOn: [version-pull-from-remote]
    branchId: sync-fail
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        从远端拉取 workflow 失败。

        错误: {{nodeOutput.version-pull-from-remote.error}}

        输出: {"status": "sync_failed", "error": "...", "fix_hint": "拉取失败，可能原因: 1) 本地目录不存在且脚本无法创建 2) 远端 API 不可达 3) IAM Token 无效。请检查 error 字段定位具体原因"}

        ⚠️ 输出纯 JSON
    outputContract:
      required: true
      schema:
        type: object
        required: [status, error]
        properties:
          status: {type: string}
          error: {type: string}
          fix_hint: {type: string}

  - id: version-sync-ok
    title: 拉取成功
    phase: P1
    dependsOn: [version-pull-from-remote]
    branchId: sync-ok
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        从远端拉取 workflow 成功。继续校验。
        输出: {"ok": true, "resolvedId": "{{nodeOutput.version-pull-from-remote.resolvedId}}"}
        ⚠️ 输出纯 JSON
    outputContract:
      required: true
      schema:
        type: object
        required: [ok]
        properties:
          ok: {type: boolean}
          resolvedId: {type: string}

  # ═══════════════════════════════════════════
  # P1.5: 静态校验（单节点，内含修复循环）
  # ═══════════════════════════════════════════
  - id: validate-and-fix
    title: 校验与修复
    phase: P1
    dependsOn: [version-none-ok, version-sync-ok]
    triggerRule: one_success
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        对目标 workflow 做静态校验，如果失败则自动修复，最多修复 3 轮。

        resolvedId: {{nodeOutput.version-check.resolvedId}}

        ⚠️ 清除引擎注入的错误环境变量，走 env_config.py 动态推导。
        所有 python3 调用前加: env -u CLAWWEB_BASE_URL -u CLAWWEB_API_URL

        ═══ Step 1: 静态校验 ═══

        用 Bash 执行（将 <resolvedId> 替换为上面取到的值）:
        env -u CLAWWEB_BASE_URL -u CLAWWEB_API_URL OPENCLAW_HOME="$HOME/.openclaw" PLUGIN_HOME="$HOME/openclawExt/clawmind" SKILL_DIR="$HOME/.openclaw/workspace/skills/clawmind-workflow" python3 $HOME/.openclaw/workspace/skills/clawmind-workflow/scripts/deploy/deploy_workflow.py --name <resolvedId> --dry-run

        - 校验通过 → 输出: {"ok": true, "resolvedId": "<id>"}
        - 校验失败 → 进入 Step 2

        ═══ Step 2: 自动修复（最多3轮）═══

        1. 读取 $HOME/.openclaw/workspace/skills/clawmind-workflow/modules/builder.md 的 Fix-Only 入口段
        2. 根据错误类型做最小修复（目标 YAML 在 $HOME/openclawExt/clawmind/packs/ 下）:
           - yaml_syntax → 修复 YAML 语法
           - missing_field → 补充缺失字段
           - structural_error → 修复节点结构（dependsOn 引用、node ID 重复等）
           - validation_failed → 按错误详情修复
        3. 用 Edit 做最小修改
        4. 自检: outputContract/dependsOn/模板变量/identity.key/onSuccess id
        5. 重新执行 Step 1 校验
        6. 如果仍然失败，重复 Step 2（最多3轮修复）

        如果 3 轮修复后仍失败:
        输出: {"ok": false, "resolvedId": "<id>", "error": "<最后一轮错误类型>", "detail": "<错误详情>"}

        如果在任意轮修复后校验通过:
        输出: {"ok": true, "resolvedId": "<id>"}

        ⚠️ 禁止生成 spec.md
        ⚠️ 输出纯 JSON
      timeoutSeconds: 360
    outputContract:
      required: true
      schema:
        type: object
        required: [ok]
        properties:
          ok: {type: boolean}
          resolvedId: {type: string}
          error: {type: string}
          detail: {type: string}
    onResult:
      branches:
        - match: {ok: true}
          branchId: validate-ok
        - match: {ok: false}
          branchId: validate-fail

  - id: validate-fail
    title: 校验失败
    phase: P1
    dependsOn: [validate-and-fix]
    branchId: validate-fail
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        静态校验 3 轮自动修复后仍未通过。

        错误: {{nodeOutput.validate-and-fix.error}}
        详情: {{nodeOutput.validate-and-fix.detail}}

        输出: {"status": "validation_failed", "error": "...", "detail": "...", "fix_hint": "请手动检查 YAML 配置"}

        ⚠️ 输出纯 JSON
    outputContract:
      required: true
      schema:
        type: object
        required: [status, error]
        properties:
          status: {type: string}
          error: {type: string}
          detail: {type: string}
          fix_hint: {type: string}

  # ═══════════════════════════════════════════
  # P2: 闭环调试主循环
  # ═══════════════════════════════════════════
  - id: debug-loop
    title: 闭环调试
    phase: P2
    dependsOn: [validate-and-fix]
    branchId: validate-ok
    executor:
      type: loop-group
      maxIterations: 5
      iterationVar: round
      until:
        node: run-and-judge
        path: ok
        equals: true
      body:
        - id: run-and-judge
          title: 运行与判定
          phase: P2
          dependsOn: []
          executor:
            type: embedded-agent
            outputMode: json
            prompt: |
              第 {{round}} 轮闭环调试。

              ═══ 目标 ═══
              - workflowId: {{input.params.workflowId}}
              - 示例: {{input.params.examples}}
              - 用户输入: {{input.message}}

              **如果上一轮修复了 YAML，本轮用 --debug 重跑验证修复效果。**

              ═══ Step 1: 启动目标 workflow ═══

              业务参数来源: {{input.params.debugParams}}（JSON 格式，如 {"topic":"AI","activityId":"6500116"}）
              如果 debugParams 为空，从 {{input.message}} 中提取。

              将 debugParams 解析为 --key value 命令行参数，排除 workflowId/examples/maxRounds/debugParams，调用 workflow_engine_dispatch:
                command: "run {{input.params.workflowId}} <解析后的业务参数> --debug"

              遇 duplicatePolicy 错误 → reopen 重试:
                command: "reopen {{input.params.workflowId}} <业务参数> --debug"
              遇 权限/工具/MCP 缺失 → 不自行绕过！立即输出:
                {"ok": true, "needs_human": true, "error": "<具体缺失的工具或权限>", "fix_hint": "<用户需要做的操作>"}
              其他启动错误 → 同上 needs_human

              ═══ Step 2: 等待完成 ═══

              用 Bash 执行:
              env -u CLAWWEB_BASE_URL -u CLAWWEB_API_URL OPENCLAW_HOME="$HOME/.openclaw" SKILL_DIR="$HOME/.openclaw/workspace/skills/clawmind-workflow" python3 $HOME/.openclaw/workspace/skills/clawmind-workflow/scripts/debug/poll-progress.py <flowId> --follow

              🚫 **绝对禁止调用 sessions_yield！** sessions_yield 会让节点挂起但不产生 outputContract 要求的 JSON 输出，导致整个节点判定失败。
              🚫 禁止自己拼接 HTTP URL 查询状态（端口不确定）。如果 poll-progress.py 失败，直接进入 Step 3 用 debug-analyze.py 轮询结果。

              ═══ Step 3: 分析结果 ═══

              用 Bash 执行:
              env -u CLAWWEB_BASE_URL -u CLAWWEB_API_URL OPENCLAW_HOME="$HOME/.openclaw" SKILL_DIR="$HOME/.openclaw/workspace/skills/clawmind-workflow" python3 $HOME/.openclaw/workspace/skills/clawmind-workflow/scripts/debug/debug-analyze.py <flowId> --format text

              ═══ Step 4: 示例对比（仅当有 examples）═══

              用 Bash 执行:
              env -u CLAWWEB_BASE_URL -u CLAWWEB_API_URL OPENCLAW_HOME="$HOME/.openclaw" PLUGIN_HOME="$HOME/openclawExt/clawmind" SKILL_DIR="$HOME/.openclaw/workspace/skills/clawmind-workflow" python3 $HOME/.openclaw/workspace/skills/clawmind-workflow/scripts/debug/analyze-embedded-sessions.py <flowId> {{input.params.workflowId}} --examples <examplesPath>

              退出码 0=全过，1=有 MISMATCH/MISSING。

              ═══ Step 5: 判定 ═══

              | 判定 | 输出 |
              |------|------|
              | 全 succeeded + 示例全 PASS（或无示例） | {"ok": true, "needs_human": false, "summary": "第X轮通过"} |
              | 权限/工具/MCP 缺失 | {"ok": true, "needs_human": true, "error": "<具体问题>", "fix_hint": "<用户操作>"} ← ok=true 让循环立即退出 |
              | 代码/配置问题（prompt错、模板变量错、dependsOn错、outputContract违反、示例MISMATCH） | {"ok": false, "fix_needed": true, "failures": ["..."], "summary": "..."} |
              | 429限流/网络抖动 | {"ok": false, "retry": true, "summary": "临时错误，重试"} |

              ⚠️ 禁止调 deploy，禁止生成 spec.md
              🚫 绝对禁止调用 sessions_yield —— 会让节点挂起、无法产出 JSON、导致整个节点失败！
              ⚠️ 工具/MCP/权限缺失必须 needs_human=true + ok=true，让循环立即退出
              ⚠️ 配置/参数问题 fix_needed=true，让 fix-yaml 自动修复
              ⚠️ 输出纯 JSON
            timeoutSeconds: 300
          outputContract:
            required: true
            schema:
              type: object
              required: [ok]
              properties:
                ok: {type: boolean}
                needs_human: {type: boolean}
                fix_needed: {type: boolean}
                retry: {type: boolean}
                error: {type: string}
                fix_hint: {type: string}
                failures: {type: array, items: {type: string}}
                summary: {type: string}

        - id: fix-yaml
          title: 修复YAML
          phase: P2
          dependsOn: [run-and-judge]
          executor:
            type: embedded-agent
            outputMode: json
            prompt: |
              根据判定结果决定是否修复。

              上游判定: {{nodeOutput.run-and-judge}}

              - ok=true → 不修改: {"fixed": false, "reason": "已通过"}
              - needs_human=true → 不修改: {"fixed": false, "reason": "需人工介入"}
              - fix_needed=true → 执行 Fix-Only 修复:
                  1. 读取 $HOME/.openclaw/workspace/skills/clawmind-workflow/modules/builder.md 的 Fix-Only 入口段
                  2. 用 Edit 做最小修改（目标 YAML 在 $HOME/openclawExt/clawmind/packs/ 下）
                  3. 自检: outputContract/dependsOn/模板变量/identity.key/onSuccess id
                  → {"fixed": true, "changes": "..."}
              - retry=true → 不修改: {"fixed": false, "reason": "环境重试"}

              ⚠️ 禁止生成 spec.md
              ⚠️ 参数/配置问题主动自动修复，不等人工
              ⚠️ ok=true 或 needs_human=true 时不修改 YAML
              ⚠️ 输出纯 JSON
            timeoutSeconds: 120
          outputContract:
            required: true
            schema:
              type: object
              required: [fixed]
              properties:
                fixed: {type: boolean}
                reason: {type: string}
                changes: {type: string}

      onMaxIterations:
        action: fail
        saveLastIteration: true

  # ═══════════════════════════════════════════
  # P3: 运行报告（最终节点）
  # ═══════════════════════════════════════════
  - id: report
    title: 运行报告
    phase: P3
    dependsOn: [debug-loop]
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        闭环调试已结束，生成运行报告。

        目标 workflow: {{input.params.workflowId}}

        **Step 1: 判定结果**
        检查 debug-loop 退出原因和最后一轮判定:
        - until 条件满足 + needs_human=false → 调试通过
        - until 条件满足 + needs_human=true → 需要人工介入（工具/权限/MCP缺失）
        - maxIterations 达上限 → 调试未通过

        **Step 2: 示例比对结果**
        如果有 examples，回顾最后一轮的示例对比结果（PASS/MISMATCH/MISSING）。

        **Step 3: 生成报告，输出 JSON:**

        调试通过:
        {
          "status": "passed",
          "summary": "第X轮通过",
          "example_result": "all_pass / has_mismatch / no_examples"
        }

        需要人工介入:
        {
          "status": "needs_human",
          "error": "具体的工具/权限/MCP缺失问题",
          "fix_hint": "用户需要做的操作"
        }

        调试未通过（达上限）:
        {
          "status": "exhausted",
          "summary": "N轮未通过",
          "example_result": "...",
          "rounds_summary": [{"round": 1, "failure": "...", "fix": "..."}, ...],
          "suggestions": ["建议1", "建议2"]
        }

        ⚠️ 禁止自动调 deploy
        ⚠️ 输出纯 JSON
    outputContract:
      required: true
      schema:
        type: object
        required: [status]
        properties:
          status: {type: string}
          summary: {type: string}
          example_result: {type: string}
          error: {type: string}
          fix_hint: {type: string}
          rounds_summary: {type: array, items: {type: object}}
          suggestions: {type: array, items: {type: string}}