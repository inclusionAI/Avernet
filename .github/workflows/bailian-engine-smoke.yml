name: Bailian Engine Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  # Allows the initial workflow to run before it exists on the default branch.
  push:
    branches: [codex/bailian-engine-smoke]
    paths:
      - .github/workflows/bailian-engine-smoke.yml
      - singlebox/compat/bailian/**

permissions:
  contents: read

concurrency:
  group: bailian-engine-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp
      - run: python -m unittest discover -s singlebox/compat/bailian/tests

  smoke:
    name: ${{ matrix.engine }} / qwen3.8-flash
    # Codex's bwrap sandbox needs unprivileged user namespaces; newer Ubuntu
    # hosted images can reject its uid-map setup through AppArmor policy.
    runs-on: ${{ matrix.engine == 'codex' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - engine: openclaw
            package: openclaw
            version: '2026.5.12'
          - engine: deepseek-harness
            package: '@deepseek-ai/dsh'
            version: '0.2.1-alpha.2'
          - engine: claude-code
            package: '@anthropic-ai/claude-code'
          - engine: codex
            package: '@openai/codex'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check required provider configuration
        env:
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          BAILIAN_OPENAI_BASE_URL: ${{ vars.BAILIAN_OPENAI_BASE_URL }}
        run: |
          if [ -z "$BAILIAN_API_KEY" ] || [ -z "$BAILIAN_OPENAI_BASE_URL" ]; then
            echo '::error::UNKNOWN: configure Secret BAILIAN_API_KEY and Variable BAILIAN_OPENAI_BASE_URL'
            exit 1
          fi
      - name: Resolve and install selected engine version
        env:
          ENGINE_PACKAGE: ${{ matrix.package }}
          ENGINE_VERSION_SPEC: ${{ matrix.version || 'latest' }}
        run: |
          version="$(npm view "$ENGINE_PACKAGE@$ENGINE_VERSION_SPEC" version)"
          mkdir -p reports
          ENGINE_VERSION="$version" python - <<'PY'
          import json, os
          from pathlib import Path
          Path('reports/version.json').write_text(json.dumps({
              'package': os.environ['ENGINE_PACKAGE'],
              'version': os.environ['ENGINE_VERSION'],
              'selection': os.environ['ENGINE_VERSION_SPEC'],
              'commit': os.environ['GITHUB_SHA'],
          }, indent=2))
          PY
          npm install --global "$ENGINE_PACKAGE@$version"
      - name: Generate isolated provider configuration
        env:
          BAILIAN_OPENAI_BASE_URL: ${{ vars.BAILIAN_OPENAI_BASE_URL }}
        run: |
          python singlebox/compat/bailian/configure.py \
            --output "$RUNNER_TEMP/bailian-profile" \
            --base-url "$BAILIAN_OPENAI_BASE_URL" --model qwen3.8-flash
      - name: Verify real model and file tool round trip
        env:
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          ENGINE: ${{ matrix.engine }}
        run: |
          python singlebox/compat/bailian/smoke.py --engine "$ENGINE" \
            --profile "$RUNNER_TEMP/bailian-profile" --report reports/result.json
      - name: Publish scoped result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('reports/result.json')
          result = json.loads(path.read_text()) if path.exists() else {
              'status': 'UNKNOWN', 'reason': 'setup_failed', 'bcs_certified': False,
          }
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Engine/model smoke only; BCS integration is not certified.\n\n')
              summary.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bailian-smoke-${{ matrix.engine }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove runtime state
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/bailian-profile"

  build-bcs:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/bcs
          key: bailian-e2e
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build real BCS and bridge
        working-directory: apps/bcs
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo build --locked -p bcs -p bcs-bridge-cli
      - uses: actions/upload-artifact@v4
        with:
          name: bailian-bcs-binaries
          path: |
            apps/bcs/target/debug/bcs
            apps/bcs/target/debug/bcs-bridge
          retention-days: 2

  e2e:
    needs: build-bcs
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - engine: openclaw
            package: openclaw
            version: '2026.5.12'
            plugin: '@avernet-plugin/openclaw-channel-bcn'
          - engine: deepseek-harness
            package: '@deepseek-ai/dsh'
            version: '0.2.1-alpha.2'
            plugin: '@avernet-plugin/deepseek-harness-channel-bcn'
          - engine: claude-code
            package: '@anthropic-ai/claude-code'
            plugin: ''
          - engine: codex
            package: '@openai/codex'
            plugin: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/download-artifact@v4
        with:
          name: bailian-bcs-binaries
          path: .bailian-bin
      - run: |
          chmod +x .bailian-bin/*
          python -m pip install tomli-w PyYAML aiohttp
      - name: Generate isolated configuration
        env:
          BAILIAN_OPENAI_BASE_URL: ${{ vars.BAILIAN_OPENAI_BASE_URL }}
        run: |
          python singlebox/compat/bailian/configure.py --output "$RUNNER_TEMP/bailian-e2e" \
            --base-url "$BAILIAN_OPENAI_BASE_URL" --model qwen3.8-flash
      - name: Install selected engine and latest published plugin
        env:
          ENGINE: ${{ matrix.engine }}
          ENGINE_PACKAGE: ${{ matrix.package }}
          ENGINE_VERSION_SPEC: ${{ matrix.version || 'latest' }}
          PLUGIN_PACKAGE: ${{ matrix.plugin }}
        run: |
          python singlebox/compat/bailian/install.py --profile "$RUNNER_TEMP/bailian-e2e" \
            --report reports/versions.json
      - name: Real BCS E2E cases
        env:
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          ENGINE: ${{ matrix.engine }}
        run: |
          python singlebox/compat/bailian/e2e.py --engine "$ENGINE" \
            --profile "$RUNNER_TEMP/bailian-e2e" --binaries .bailian-bin --report reports/e2e.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bailian-e2e-${{ matrix.engine }}
          path: reports/*.json
          retention-days: 7
      - name: Publish E2E report
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('reports/e2e.json')
          if not p.exists():
              p = Path('reports/install.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + (p.read_text() if p.exists() else '{"status":"UNKNOWN","reason":"setup_failed"}') + '\n```\n')
          PY
      - name: Remove runtime state
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/bailian-e2e"

  readiness:
    if: always()
    needs: [harness-tests, smoke, build-bcs, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: bailian-smoke-*
          path: compatibility-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: bailian-e2e-*
          path: compatibility-artifacts
      - name: Summarize readiness without skipping missing evidence
        env:
          HARNESS_RESULT: ${{ needs.harness-tests.result }}
          BUILD_RESULT: ${{ needs.build-bcs.result }}
        run: python singlebox/compat/bailian/readiness.py --artifacts compatibility-artifacts --output reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bailian-readiness
          path: reports/*
          retention-days: 30

  notify-dingtalk:
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: [harness-tests, smoke, build-bcs, e2e, readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download current evidence if available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bailian-readiness
          path: notification/current
      - name: Find previous scheduled report for version comparison
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_BRANCH: ${{ github.ref_name }}
        run: |
          previous=$(gh run list --workflow bailian-engine-smoke.yml --event schedule \
            --branch "$RUN_BRANCH" --status completed --limit 20 \
            --json databaseId --jq "[.[] | select(.databaseId < $RUN_ID)][0].databaseId // empty")
          if [ -n "$previous" ]; then
            gh run download "$previous" --name bailian-readiness --dir notification/previous
          fi
      - name: Send DingTalk daily report
        if: always()
        env:
          BCS_ENGINE_COMPAT_DINGTALK_WEBHOOK: ${{ secrets.BCS_ENGINE_COMPAT_DINGTALK_WEBHOOK }}
          BCS_ENGINE_COMPAT_DINGTALK_SIGN_SECRET: ${{ secrets.BCS_ENGINE_COMPAT_DINGTALK_SIGN_SECRET }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python singlebox/compat/bailian/notify_dingtalk.py \
            --report notification/current/readiness.json \
            --previous notification/previous/readiness.json
