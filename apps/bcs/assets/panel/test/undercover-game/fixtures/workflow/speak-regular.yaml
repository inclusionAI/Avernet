name: "谁是卧底 第1轮 发言"
metadata:
  description: "存活玩家按座位顺序各说一句话描述自己的词语"
participants:
  seat2:
    display_name: "2号 小甲"
    required: true
  seat3:
    display_name: "3号 小乙"
    required: true
  seat4:
    display_name: "4号 小丙"
    required: true
  seat5:
    display_name: "5号 小丁"
    required: true
  referee:
    display_name: "主持人"
    required: true
runtime:
  kind: state_machine
  state_machine:
    version: 1
    graph_mode: acyclic
    defaults:
      node_timeout_ms: 420000
      max_attempts: 1
    nodes:
      speak_1:
        kind: human_input
        display_name: "👤 你的发言（1号 · 人类玩家）"
        node_timeout_ms: 900000
        transitions:
          complete:
            targets: [speak_2, speak_3, speak_4, speak_5, collect]
      speak_2:
        kind: bot_task
        display_name: "2号发言"
        assignee:
          type: bot_binding
          binding: seat2
        transitions:
          complete:
            targets: [speak_3, speak_4, speak_5, collect]
      speak_3:
        kind: bot_task
        display_name: "3号发言"
        assignee:
          type: bot_binding
          binding: seat3
        transitions:
          complete:
            targets: [speak_4, speak_5, collect]
      speak_4:
        kind: bot_task
        display_name: "4号发言"
        assignee:
          type: bot_binding
          binding: seat4
        transitions:
          complete:
            targets: [speak_5, collect]
      speak_5:
        kind: bot_task
        display_name: "5号发言"
        assignee:
          type: bot_binding
          binding: seat5
        transitions:
          complete:
            targets: [collect]
      collect:
        kind: bot_task
        display_name: "本轮发言汇总"
        assignee:
          type: bot_binding
          binding: referee
        node_timeout_ms: 600000
        final_output: true
