id: trade-risk-analysis-flow
version: 2
title: 交易风险分析流程（v9 - 规范化版）
nodes:
  - id: intent-recognition
    title: 1️⃣ 意图识别与路由
    executor:
      type: embedded-agent
      skillName: intent-classifier
      outputMode: json
      prompt: |
        请识别用户意图并进行参数提取和校验。

        ⚠️ **CRITICAL: 表名拼写必须保持原样，禁止自动纠正！**
        从 SQL 中提取表名时，必须逐字复制用户输入的原始拼写，禁止进行任何拼写纠正！
        例如：如果用户输入包含 `game_centre`，你必须原样提取为 `game_centre`，绝不能自动改为 `game_center`。

        用户输入：{{input.params.userInput}}
        用户补充信息：{{workflowData.supplementInfo | default: ""}}

        需要完成：
        1. 意图识别与路由判断
        2. 参数提取（uid, tradeNo, sampleSql等）- **extractedParams.tables 必须保持原始拼写**
        3. DIMA字段提取（background, value, priority等）
        4. 参数校验

        ⚠️ **CRITICAL: extractedParams.sceneAbbr 必须仅含 ASCII [a-zA-Z0-9_]！**
        sceneAbbr 会用于 MaxCompute 建表，禁止包含中文字符。中文场景名须转为拼音：
        - "小游戏" → "xiaoyouxi"，"游戏代刷" → "youxi_daishua"，"代充" → "daichong"

        输出JSON结构（严格遵守）：
        {
          "displayMarkdown": "🎯 意图识别结果\n- 路由路径：...\n- 意图类型：...",
          "route_path": "path1_dima|path2_risk_analysis|path3_supplement",
          "intent_type": "...",
          "is_complete": true/false,
          "confidence": 0.0-1.0,
          "missing_fields": [],
          "dimaFields": {...},
          "preValidation": {...},
          "validationSummary": "...",
          "extractedParams": {...},
          "businessScene": {...},
          "riskType": ""
        }
      timeoutSeconds: 120
      contextPolicy:
        history: tail
        tailMessages: 12
    phase: P1
    dependsOn: []
    triggerRule: all_success
    retry:
      maxAttempts: 1
      backoffMs: 0
      on:
        - executor-failed
    outputContract:
      required: true
      schema:
        type: object
        required:
          - route_path
          - intent_type
          - is_complete
          - extractedParams
        properties:
          route_path:
            type: string
          intent_type:
            type: string
          is_complete:
            type: boolean
          missing_fields:
            type: array
          dimaFields:
            type: object
          preValidation:
            type: object
          extractedParams:
            type: object
    onResult:
      branches:
        - branchId: path1_dima
          match:
            route_path: path1_dima
          complete: false
        - branchId: path2_risk_analysis
          match:
            route_path: path2_risk_analysis
          complete: false
        - branchId: path3_supplement
          match:
            route_path: path3_supplement
          complete: false
  - id: param-extractor
    title: 🔧 参数提取与补全
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        你是参数提取专家。从用户输入和上游意图识别结果中提取/补全结构化参数。
        你只做参数提取，不做意图判断。

        ## 输入数据
        用户输入：{{input.params.userInput}}
        意图识别结果：{{nodeOutput.intent-recognition}}
        用户补充信息：{{workflowData.supplementInfo | default: ""}}

        ## 提取规则（必须严格遵守）

        ### ⚠️ SQL 日期提取（最关键！）
        从文本中提取日期，无论 SQL 是否标准：
        - `dt = 20260408` → dateStart="20260408", dateEnd="20260408"
        - `dt = '2026-04-08'` → dateStart="20260408", dateEnd="20260408"（标准化为 YYYYMMDD）
        - `dt BETWEEN 20260401 AND 20260408` → dateStart="20260401", dateEnd="20260408"
        - `dt >= 20260401 AND dt <= 20260408` → dateStart="20260401", dateEnd="20260408"
        - "查2026年4月8号的数据" → dateStart="20260408", dateEnd="20260408"
        - "最近一周" → 根据当前日期推断起止日期，格式 YYYYMMDD
        - 没有找到任何日期条件 → dateStart="", dateEnd=""
        - ⚠️ dateStart/dateEnd 必须为 yyyyMMdd 格式（8位纯数字），禁止带连字符

        ### UID 提取
        - `user_id = 2088302454098292` → uid="2088302454098292"
        - 自然语言中的 uid/user_id/用户ID
        - 找不到则 uid=""

        ### sampleSql 提取
        - 如果用户输入包含完整 SELECT 语句 → 原样输出
        - 如果用户输入以 `distinct`/`DISTINCT` 开头（缺少 SELECT）→ 自动补全为 `SELECT distinct ...`
        - 如果只是 WHERE 条件 → 组合为 `SELECT trade_no FROM <tables> WHERE <条件>`
        - 如果不是 SQL 片段 → 保留原文

        ### 表名提取
        - `FROM table_name` / `JOIN table_name` 中提取，**保持原始拼写**，禁止自动纠正
        - ⚠️ 如 `game_centre` 绝不能改为 `game_center`

        ### ⚠️ sceneAbbr 提取（表名安全约束）
        - sceneAbbr 会用于 MaxCompute 建表，**必须仅包含 ASCII 字母、数字和下划线 [a-zA-Z0-9_]**
        - 中文场景名必须转为拼音或英文缩写，绝不能包含中文字符！
        - 示例：
          - "小游戏" → sceneAbbr="xiaoyouxi"
          - "游戏代刷" → sceneAbbr="youxi_daishua"
          - "代充" → sceneAbbr="daichong"
          - "App小游戏" → sceneAbbr="app_xiaoyouxi"
          - 英文场景如 "game_centre" → sceneAbbr="game_centre"（原样保留）
        - 找不到明确场景 → sceneAbbr=""

        ### 补全逻辑
        - 优先使用 intent-recognition 的 extractedParams 已有值
        - 对 intent-recognition 漏提的字段（尤其是 dateStart/dateEnd），从原始输入中解析补全
        - 如果 uid 为空，从 SQL 的 user_id 条件或自然语言中补全

        ## 输出 JSON（严格遵守，不要输出其他字段）
        {
          "uid": "",
          "tradeNo": "",
          "digitalPoiId": [],
          "sampleSql": "",
          "dateRange": "",
          "dateStart": "",
          "dateEnd": "",
          "tables": [],
          "sceneAbbr": "",
          "riskDescription": ""
        }
      timeoutSeconds: 60
      contextPolicy:
        history: tail
        tailMessages: 4
    outputContract:
      required: true
      schema:
        type: object
        required:
          - dateStart
          - dateEnd
          - sampleSql
          - tables
        properties:
          uid:
            type: string
          tradeNo:
            type: string
          sampleSql:
            type: string
          dateStart:
            type: string
          dateEnd:
            type: string
          dateRange:
            type: string
          tables:
            type: array
          sceneAbbr:
            type: string
    phase: P1
    dependsOn:
      - intent-recognition
    triggerRule: all_success
  - id: supplement-prompt
    title: 📝 补充信息
    executor:
      type: human
      prompt: |
        ⚠️ 信息不完备，请补充以下缺失信息：

        {{nodeOutput.intent-recognition.validationSummary | default: ""}}

        已识别意图：{{nodeOutput.intent-recognition.intent_type | default: "意图不明"}}
        缺失字段：{{nodeOutput.intent-recognition.missing_fields | default: ""}}
      inputSchema:
        type: object
        properties:
          feedback:
            type: string
            title: 补充信息
            description: 请用自然语言描述需要补充的信息
      actions:
        confirm:
          saveAs:
            workflowData.supplementConfirm: "true"
          next: succeed-current
        revise:
          feedbackPath: workflowData.supplementInfo
          feedbackMode: append-line
          target: intent-recognition
          reset: target-and-descendants
          next: rerun-target
        reject:
          next: fail-flow
      commandHints:
        confirm:
          label: ⏭️ 跳过补充，结束流程
        revise:
          label: 📝 revise <补充信息>
        reject:
          label: ❌ 结束流程
    phase: P1
    dependsOn:
      - intent-recognition
    branchId: path3_supplement
    triggerRule: all_success
  - id: supplement-complete
    title: ⏭️ 流程结束（跳过补充）
    executor:
      type: embedded-agent
      outputMode: text
      prompt: |
        用户已选择跳过信息补充，请输出一条简洁的结束消息。

        当前识别结果：{{nodeOutput.intent-recognition.intent_type | default: "意图不明"}}
        缺失字段：{{nodeOutput.intent-recognition.missing_fields | default: ""}}

        请用友好语气告知：由于关键信息不完整且用户选择跳过，本次风险分析流程已结束。如需继续请重新发起流程并提供完整信息。

        直接输出纯文本，不要 JSON 格式。
      timeoutSeconds: 30
      contextPolicy:
        history: tail
        tailMessages: 4
    phase: P1
    dependsOn:
      - supplement-prompt
    branchId: path3_supplement
    triggerRule: all_success
    retry:
      maxAttempts: 1
      backoffMs: 2000
      on:
        - executor-failed
  - id: dima-after-intent
    title: 1️⃣-D DIMA直通路由
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        用户走DIMA直通路径。输出：{"path": "dima-direct", "ready": true}
      timeoutSeconds: 30
    phase: P2
    dependsOn:
      - intent-recognition
    branchId: path1_dima
    triggerRule: all_success
  - id: deep-analysis
    title: 2️⃣ 深度分析
    executor:
      type: embedded-agent
      skillName: alipaygame-daishua-risk-analysis
      outputMode: json
      prompt: >
        请对以下样本进行深度风险分析。


        用户输入：{{input.params.userInput}}

        样本范围：{{nodeOutput.param-extractor.sampleSql | default: ""}}

        uid：{{nodeOutput.param-extractor.uid | default: ""}}

        trade_no：{{nodeOutput.param-extractor.tradeNo | default: ""}}

        日期范围：{{nodeOutput.param-extractor.dateRange | default: ""}}


        输出JSON：{reportSummary, deepRiskTechniques, deepRiskFeatures, riskConclusion}
      timeoutSeconds: 300
      contextPolicy:
        history: tail
        tailMessages: 12
    phase: P2
    dependsOn:
      - intent-recognition
    branchId: path2_risk_analysis
    triggerRule: all_success
    retry:
      maxAttempts: 2
      backoffMs: 3000
      on:
        - executor-failed
    outputContract:
      required: true
      schema:
        type: object
  - id: deep-analysis-formatter
    title: 📄 格式化深度分析报告
    executor:
      type: embedded-agent
      outputMode: text
      prompt: |
        请将以下深度分析原始输出格式化为 Markdown 报告。

        原始输出：
        {{nodeOutput.deep-analysis}}

        格式化要求：
        1. 用 ## 做分组标题，用 - 做列表项
        2. 基础指标：关联账户数、风险证据数、可疑上游数、资金闭环、风险结论
        3. 风险手法、风险特征、资金闭环详情各一段，内容完整不省略
        4. 分析摘要和完整报告完整呈现
        5. 风险结论醒目标记：风险漏过/误伤 → ⚠️，无风险 → ✅

        直接输出 Markdown，不要 JSON，不要代码块。
      timeoutSeconds: 60
      contextPolicy:
        history: tail
        tailMessages: 2
    phase: P2
    dependsOn:
      - deep-analysis
    branchId: path2_risk_analysis
    triggerRule: all_success
    retry:
      maxAttempts: 1
      backoffMs: 2000
      on:
        - executor-failed
  - id: deep-analysis-review
    title: 🔍 深度分析报告审核
    executor:
      type: human
      prompt: |
        请审核深度分析报告：

        **风险结论**：{{nodeOutput.deep-analysis.riskConclusion | default: ""}}
        **分析报告**：{{nodeOutput.deep-analysis.reportFull | default: ""}}

        💡 确认将继续进入DIMA工单创建流程。
      inputSchema:
        type: object
        properties:
          decision:
            type: string
            enum:
              - risk_miss
              - false_positive
              - no_risk
            title: 审核决定
            description: 请选择风险判定
      actions:
        confirm:
          saveAs:
            workflowData.reviewDecision: "{{input.decision}}"
          next: succeed-current
        revise:
          feedbackPath: workflowData.deepAnalysisFeedback
          feedbackMode: append-line
          target: deep-analysis
          reset: target-and-descendants
          next: rerun-target
        reject:
          next: fail-flow
      commandHints:
        confirm:
          label: ✅ 确认通过
        revise:
          label: 📝 revise <修改意见>
        reject:
          label: ❌ 驳回结束
    phase: P2
    dependsOn:
      - deep-analysis-formatter
    branchId: path2_risk_analysis
    triggerRule: all_success
    onResult:
      branches:
        - branchId: review_ok
          match:
            decision: ok
          complete: true
        - branchId: review_need_dima
          match: {}
          complete: false
  - id: dima-after-review
    title: 3️⃣-D 审核后DIMA路由
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        请根据深度分析审核决定，输出对应 DIMA 路由信息。

        审核决定：{{workflowData.reviewDecision | default: ""}}

        规则：
        - 若 reviewDecision=risk_miss → route="review_risk_miss", original_request="漏过"
        - 若 reviewDecision=false_positive → route="review_false_positive", original_request="误伤"
        - 其他 → route="unknown"

        直接输出 JSON：
        {"confirmed": true, "route": "...", "original_request": "..."}
    outputContract:
      schema:
        type: object
        properties:
          confirmed:
            type: boolean
          route:
            type: string
          original_request:
            type: string
    phase: P2
    dependsOn:
      - deep-analysis-review
    branchId: review_need_dima
    triggerRule: all_success
  - id: dima-preparator
    title: 3️⃣ DIMA需求准备
    executor:
      type: embedded-agent
      skillName: dima-preparator
      outputMode: json
      prompt: |
        准备DIMA工单字段，整合场景分析。

        ## 数据源
        - 路径A：{{nodeOutput.intent-recognition.dimaFields | default: {}}}
        - 路径B：{{nodeOutput.deep-analysis | default: {}}}
        - reviewDecision：{{workflowData.reviewDecision | default: ""}}
        - 覆盖分析（如已完成）：{{nodeOutput.coverage-analysis | default: {}}}

        ## 输出格式
        draft_data：
        {
          "需求背景": {"业务目标": "...", "核心痛点": "..."},
          "需求价值": {"预计挽回月资金": "...", "计算逻辑": "...", "提升目标": "..."},
          "风险DSL定义": {"风险名称": [], "DSL逻辑": {}},
          "处置优先级": {"优先级": "...", "手法类型": "..."},
          "样本口径": {"数据源样本口径": "...", "口径类型": "..."},
          "场景分析": {"样本类型": "...", "场景": "...", "风险手法": "..."},
          "原始迭代诉求": "...",
          "is_ready": true/false
        }
      timeoutSeconds: 120
      contextPolicy:
        history: tail
        tailMessages: 10
    phase: P2
    dependsOn:
      - dima-after-intent
      - dima-after-review
    triggerRule: one_success
    retry:
      maxAttempts: 2
      backoffMs: 3000
      on:
        - executor-failed
    outputContract:
      required: true
      schema:
        type: object
  - id: dima-formatter
    title: 📄 格式化DIMA需求数据
    executor:
      type: embedded-agent
      outputMode: text
      prompt: |
        将 {{nodeOutput.dima-preparator}} 格式化为用户可读Markdown报告。
      timeoutSeconds: 60
    phase: P2
    dependsOn:
      - dima-preparator
    triggerRule: all_success
  - id: dima-check
    title: 4️⃣ DIMA结果审核
    executor:
      type: human
      prompt: |
        ## DIMA需求数据确认

        {{nodeOutput.dima-formatter}}
      inputSchema:
        type: object
        properties:
          feedback:
            type: string
            title: 备注/修改意见
      actions:
        confirm:
          saveAs:
            workflowData.dimaApproved: "true"
          next: succeed-current
        revise:
          feedbackPath: workflowData.dimaSupplementInfo
          feedbackMode: append-line
          target: dima-preparator
          reset: target-and-descendants
          next: rerun-target
        reject:
          next: fail-flow
      commandHints:
        confirm:
          label: ✅ 确认并创建工单
        revise:
          label: 📝 revise <修改意见>
        reject:
          label: ❌ 驳回结束
    phase: P2
    dependsOn:
      - dima-formatter
    triggerRule: all_success
  - id: dima-creator
    title: 5️⃣ DIMA工单创建
    executor:
      type: embedded-agent
      skillName: dima-creator
      outputMode: json
      prompt: |
        使用 dima-creator skill 创建 DIMA 工单。

        draft_data: {{nodeOutput.dima-preparator.draft_data}}

        输出JSON：{workItemId, status, url, message}
      timeoutSeconds: 120
    phase: P2
    dependsOn:
      - dima-check
    triggerRule: all_success
    retry:
      maxAttempts: 2
      backoffMs: 3000
      on:
        - executor-failed
    outputContract:
      required: true
      schema:
        type: object
        required:
          - workItemId
          - status
        properties:
          workItemId:
            type: string
          status:
            type: string
          url:
            type: string
          message:
            type: string
  - id: coverage-sql-exec
    title: 6️⃣ 覆盖分析-SQL执行
    executor:
      type: cli-script
      command: bash
        /home/admin/openclawExt/clawmind/packs/trade-risk-analysis-flow/scripts/coverage-sql-exec.sh
      env:
        USER_INPUT: "{{input.params.userInput}}"
        ALIPAY_UID: '{{nodeOutput.param-extractor.uid | default: ""}}'
        TRADE_NO: '{{nodeOutput.param-extractor.tradeNo | default:
          ""}}'
        SAMPLE_SCOPE: '{{nodeOutput.param-extractor.sampleSql |
          default: ""}}'
        DIMA_SAMPLE_SQL_QUERY: '{{nodeOutput.intent-recognition.dimaFields.sample_scope.sql_query
          | default: ""}}'
        DATE_RANGE: '{{nodeOutput.param-extractor.dateRange |
          default: ""}}'
        DATE_START: '{{nodeOutput.param-extractor.dateStart |
          default: ""}}'
        DATE_END: '{{nodeOutput.param-extractor.dateEnd | default:
          ""}}'
        TABLES: '{{nodeOutput.param-extractor.tables | default: ""}}'
        RISK_TYPE: '{{nodeOutput.intent-recognition.riskType | default: ""}}'
        SCENE_ABBR: '{{nodeOutput.param-extractor.sceneAbbr |
          default: ""}}'
        DIMA_WORKITEM_ID: '{{nodeOutput.dima-creator.workItemId | default: ""}}'
        PROJECT_ID: "410894"
        DEBUG: "1"
      outputMode: json
      timeoutMs: 900000
    phase: P3
    dependsOn:
      - dima-creator
    triggerRule: all_success
    retry:
      maxAttempts: 2
      backoffMs: 3000
      on:
        - executor-failed
    outputContract:
      required: true
      schema:
        type: object
        required:
          - success
          - sampleTable
          - allinTable
          - sampleCount
        properties:
          success:
            type: boolean
          sampleTable:
            type: string
          allinTable:
            type: string
          sampleCount:
            type: number
  - id: coverage-analysis
    title: 7️⃣ 覆盖分析报告
    executor:
      type: embedded-agent
      skillName: bussiness-scene-cheat-cover-analyzer
      outputMode: json
      prompt: >
        执行完整覆盖分析流程（Step 5~8）。


        ## 前置数据

        样本表：{{nodeOutput.coverage-sql-exec.sampleTable}}

        宽表：{{nodeOutput.coverage-sql-exec.allinTable}}

        样本总量：{{nodeOutput.coverage-sql-exec.sampleCount}}

        有风险标签数：{{nodeOutput.coverage-sql-exec.riskCount}}


        ## DIMA工单信息

        workItemId: {{nodeOutput.dima-creator.workItemId}}


        ## 执行任务

        1. Step 5-7: 生成覆盖分析报告

        2. Step 8: 调用 MCP updateTask 回填场景分析到DIMA


        输出：{total, covered, coverageRate, sceneAnalysisMarkdown, dimaUpdateResult}
      timeoutSeconds: 600
      contextPolicy:
        history: tail
        tailMessages: 12
    phase: P3
    dependsOn:
      - coverage-sql-exec
    triggerRule: all_success
    retry:
      maxAttempts: 2
      backoffMs: 3000
      on:
        - executor-failed
    outputContract:
      required: true
      schema:
        type: object
        required:
          - total
          - covered
          - coverageRate
          - dimaUpdateResult
        properties:
          total:
            type: number
          covered:
            type: number
          coverageRate:
            type: number
          dimaUpdateResult:
            type: object
  - id: coverage-analysis-formatter
    title: 📄 格式化覆盖分析报告
    executor:
      type: embedded-agent
      outputMode: text
      prompt: |
        将覆盖分析结果格式化为用户可读的Markdown报告。
        输入：{{nodeOutput.coverage-analysis}}
      timeoutSeconds: 60
    phase: P3
    dependsOn:
      - coverage-analysis
    triggerRule: all_success
  - id: iteration-judgment
    title: 8️⃣ 能力迭代判断
    executor:
      type: embedded-agent
      skillName: iteration-decision-maker
      outputMode: json
      prompt: >
        基于覆盖分析结果判断是否需要能力迭代。


        覆盖率：{{nodeOutput.coverage-analysis.coverageRate}}

        原始诉求：{{nodeOutput.intent-recognition.dimaFields.original_request | default: "漏过"}}


        输出：{needIteration: true/false, reason: "..."}
      timeoutSeconds: 60
    phase: P3
    dependsOn:
      - coverage-analysis-formatter
    triggerRule: all_success
    onResult:
      branches:
        - branchId: need_iteration
          match:
            needIteration: true
          complete: false
        - branchId: no_iteration
          match:
            needIteration: false
          complete: true
  - id: card-generation
    title: 9️⃣ 生成知识卡片
    executor:
      type: embedded-agent
      skillName: anticheat-generate-card
      outputMode: json
      prompt: |
        生成风险界定知识卡片。

        深度分析：{{nodeOutput.deep-analysis}}
        覆盖分析：{{nodeOutput.coverage-analysis}}
        迭代判断：{{nodeOutput.iteration-judgment}}

        输出：{card_id, metadata, raw_input}
      timeoutSeconds: 120
      contextPolicy:
        history: tail
        tailMessages: 10
    phase: P4
    dependsOn:
      - iteration-judgment
    branchId: need_iteration
    triggerRule: all_success
    retry:
      maxAttempts: 2
      backoffMs: 3000
      on:
        - executor-failed
    outputContract:
      required: false
      schema:
        type: object
  - id: card-formatter
    title: 📄 格式化知识卡片
    executor:
      type: embedded-agent
      outputMode: text
      prompt: |
        格式化知识卡片为Markdown：{{nodeOutput.card-generation}}
      timeoutSeconds: 60
    phase: P4
    dependsOn:
      - card-generation
    branchId: need_iteration
    triggerRule: all_success
  - id: card-review
    title: 📝 卡片结果审核
    executor:
      type: human
      prompt: |
        确认知识卡片：

        {{nodeOutput.card-formatter}}
      inputSchema:
        type: object
        properties:
          feedback:
            type: string
            title: 修改意见
      actions:
        confirm:
          saveAs:
            workflowData.cardApproved: "true"
          next: succeed-current
        revise:
          feedbackPath: workflowData.cardFeedback
          feedbackMode: append-line
          target: card-generation
          reset: target-and-descendants
          next: rerun-target
        reject:
          next: fail-flow
      commandHints:
        confirm:
          label: ✅ 确认推送
        revise:
          label: 📝 revise <修改意见>
        reject:
          label: ❌ 不推送
    phase: P4
    dependsOn:
      - card-formatter
    triggerRule: all_success
  - id: card-push
    title: 🔟 推送卡片
    executor:
      type: embedded-agent
      skillName: task-publisher-skill
      outputMode: json
      prompt: |
        推送知识卡片任务。

        cardId: {{nodeOutput.card-generation.card_id}}
        cardData: {{nodeOutput.card-generation}}

        调用 submitTask：
        {
          "taskCode": "RISK_ANALYSIS",
          "content": "卡片内容Markdown",
          "extraData": {"cardId": "...", "flowId": "..."}
        }
      timeoutSeconds: 120
    phase: P4
    dependsOn:
      - card-review
    triggerRule: all_success
    retry:
      maxAttempts: 2
      backoffMs: 3000
      on:
        - executor-failed
  - id: complete-done
    title: ✅ 流程完成
    executor:
      type: done
    phase: P4
    dependsOn:
      - card-push
    triggerRule: all_success
input:
  mode: mixed
  requiredParams:
    - userInput
  sources:
    params: true
    message: true
    files:
      maxCount: 3
      allowedExtensions:
        - .sql
        - .json
        - .txt
identity:
  key: "{{input.params.userInput}}"
  label: 风险分析-{{input.params.userInput}}
  duplicatePolicy: allow
outputs:
  intentResult:
    from: "{{nodeOutput.intent-recognition}}"
    public: true
    description: 意图识别与路由结果
  deepAnalysisResult:
    from: "{{nodeOutput.deep-analysis}}"
    public: true
    description: 深度分析结果
  dimaTicketId:
    from: "{{nodeOutput.dima-creator.workItemId}}"
    public: true
    description: DIMA 工单号
  sqlExecResult:
    from: "{{nodeOutput.coverage-sql-exec}}"
    public: true
    description: 覆盖分析SQL执行结果
  coverageResult:
    from: "{{nodeOutput.coverage-analysis}}"
    public: true
    description: 现有能力覆盖分析结果
  iterationJudgmentResult:
    from: "{{nodeOutput.iteration-judgment}}"
    public: true
    description: 能力迭代判断结果
  riskCardResult:
    from: "{{nodeOutput.card-generation}}"
    public: true
    description: 风险卡片生成结果
  taskPublishResult:
    from: "{{nodeOutput.card-push}}"
    public: true
    description: 任务发布结果
defaults:
  progress:
    enabled: true
    sink: chat
  contextPolicy:
    embeddedAgent:
      history: tail
      tailMessages: 12
messages:
  onCreated: |
    🚀 交易风险分析流程已创建（v9 - 规范化版）

    用户输入：{{input.params.userInput}}

    流程将自动路由：
    1️⃣ DIMA需求 → 直接进入DIMA工单创建
    2️⃣ 风险分析 → 深度分析 → DIMA工单 → 覆盖分析（自动回填场景分析）→ 卡片生成
    3️⃣ 信息缺失 → 补充信息 → 重新识别
  onFinished: >
    ✅ 交易风险分析流程已完成


    📊 意图路由：{{nodeOutput.intent-recognition.route_path | default: ""}}

    📋 DIMA 工单：{{nodeOutput.dima-creator.workItemId | default: "未创建"}}

    🔗 工单链接：{{nodeOutput.dima-creator.url | default: "无"}}

    📈 覆盖分析：{{nodeOutput.coverage-analysis.coverageRate | default: "-"}}%

    🔄 能力迭代：{{nodeOutput.iteration-judgment.needIteration | default: "-"}}

    📤 场景分析回填：{{nodeOutput.coverage-analysis.dimaUpdateResult.status | default: "-"}}
description: |
  交易风险分析完整流程：意图识别→深度分析→DIMA工单→覆盖分析（自动回填）→
  能力迭代判断→知识卡片生成。支持自动场景分析回填DIMA工单。
facade:
  command: trade-risk-analysis-flow
