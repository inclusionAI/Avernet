id: approval-web-demo
version: 1
title: 审批卡片网页通道演示

input:
  mode: mixed
  requiredParams: [budgetTitle, budgetAmount]
  sources:
    params: true
    message: true

identity:
  key: "{{input.params.budgetTitle}}"
  label: "审批(web): {{input.params.budgetTitle}}"
  duplicatePolicy: allow

outputs:
  approved:
    from: "{{nodeOutput.approve-budget.approved}}"
    public: true
    description: "是否通过审批"
  approvalResult:
    from: "{{nodeOutput.approve-budget}}"
    public: true
    description: "审批结果详情"

defaults:
  progress:
    enabled: true
    sink: chat

messages:
  onCreated: "审批流程已创建：{{input.params.budgetTitle}}"
  onFinished: "审批流程已完成。"

nodes:
  # ──── P1: 数据准备 ────────────────────────────────────────
  - id: prepare-data
    title: 准备审批数据
    phase: P1
    dependsOn: []
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        根据用户输入整理审批数据。

        用户输入参数：
        - 方案名称：{{input.params.budgetTitle}}
        - 预算金额：{{input.params.budgetAmount}}
        - 活动周期：{{input.params.budgetPeriod | default: "本季度"}}

        严格输出 JSON（不输出 Markdown，不输出解释）：
        {
          "budgetTitle": "方案名称",
          "budgetAmount": "预算金额",
          "budgetPeriod": "活动周期",
          "applicant": "{{input.params.userName | default: "系统"}}",
          "department": "{{input.params.department | default: ""}}",
          "summary": "简要描述"
        }

  # ──── P2: 预算审批（card-web 网页通道） ──────────────────
  #
  # card-web 交付方式：
  # - 私聊模式 (private): 向每个审批人发送钉钉消息，包含
  #   侧边栏链接，点击后在钉钉PC右侧面板打开clawweb审批页面
  # - 群聊模式 (dingtalkGroup): 在群中发送包含每人独立链接的消息
  # - 审批页面无需登录，通过HMAC签名token验证身份
  - id: approve-budget
    title: 预算审批
    phase: P2
    dependsOn: [prepare-data]
    executor:
      type: approval
      skillName: budget-approval
      approvalType: BUDGET_APPROVE
      message: "请审批以下预算申请：{{budgetTitle}}"
      approvers:
        - empId: "103892"
          name: "楚生"
          role: "部门主管"
        - empId: "100123"
          name: "明远"
          role: "财务审核"
      cardFields:
        - label: "方案名称"
          value: "{{budgetTitle}}"
        - label: "预算金额"
          value: "{{budgetAmount}}"
        - label: "活动周期"
          value: "{{budgetPeriod}}"
      delivery:
        private:
          primary: card-web
        dingtalkGroup:
          primary: card-web
        collaboration:
          primary: bcs-route
      route:
        to:
          - type: name
            value: "审批Bot"
        reason: "预算审批"
      approvalPolicy: any
    onResult:
      branches:
        - branchId: approved
          match: { approved: true }
          complete: false
        - branchId: rejected
          match: { approved: false }
          complete: false
      default:
        complete: false

  # ──── P3A: 审批通过 → 执行 ────────────────────────────────
  - id: execute-approved
    title: 执行已批准的预算
    phase: P3
    branchId: approved
    dependsOn: [approve-budget]
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        预算已通过审批，开始执行。

        审批详情：
        {{nodeOutput.approve-budget}}

        请生成执行计划，严格输出 JSON（不输出 Markdown，不输出解释）：
        {
          "status": "executing",
          "budgetTitle": "方案名称",
          "budgetAmount": "预算金额",
          "executionPlan": "执行计划摘要",
          "estimatedCompletion": "预计完成时间"
        }

  # ──── P3B: 审批驳回 → 通知 ────────────────────────────────
  - id: reject-notification
    title: 驳回通知
    phase: P3
    branchId: rejected
    dependsOn: [approve-budget]
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        预算审批已被驳回，请通知申请人。

        驳回详情：
        {{nodeOutput.approve-budget}}

        严格输出 JSON（不输出 Markdown，不输出解释）：
        {
          "status": "rejected",
          "budgetTitle": "方案名称",
          "reason": "驳回原因",
          "suggestedAction": "建议下一步操作"
        }

  # ──── P4: 完成 ────────────────────────────────────────────
  - id: finalize
    title: 流程结束
    phase: P4
    dependsOn: [execute-approved, reject-notification]
    triggerRule: one_success
    executor:
      type: done