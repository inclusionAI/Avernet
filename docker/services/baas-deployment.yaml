# ============================================================
# baas-deployment.yaml — Avernet BaaS platform service K8s template
#
# Deploys the SecBaaS Community Edition service.
# Override ${...} placeholders by sed/envsubst or kustomize.
#
# Usage (envsubst):
#   envsubst < baas-deployment.yaml | kubectl apply -f -
#
# Required env vars for envsubst:
#   NAMESPACE       — K8s namespace (e.g. avernet)
#   BAAS_IMAGE      — container image (e.g. registry/baas:latest)
#   BAAS_PORT       — service port (default 8888)
#   BAAS_REDIS_URL  — Redis connection string
#   BAAS_DB_URL     — database connection string
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: baas-config
  namespace: ${NAMESPACE}
data:
  application.yaml: |
    secbaas:
      community:
        web:
          port: ${BAAS_PORT}
        redis:
          url: "${BAAS_REDIS_URL}"
        database:
          url: "${BAAS_DB_URL}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baas
  namespace: ${NAMESPACE}
  labels:
    app: baas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baas
  template:
    metadata:
      labels:
        app: baas
    spec:
      containers:
      - name: baas
        image: ${BAAS_IMAGE}
        ports:
        - containerPort: ${BAAS_PORT}
        env:
        - name: BAAS_PORT
          value: "${BAAS_PORT}"
        - name: BAAS_REDIS_URL
          value: "${BAAS_REDIS_URL}"
        - name: BAAS_DB_URL
          value: "${BAAS_DB_URL}"
        volumeMounts:
        - name: config
          mountPath: /app/configs
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: ${BAAS_PORT}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: ${BAAS_PORT}
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: baas-config
---
apiVersion: v1
kind: Service
metadata:
  name: baas
  namespace: ${NAMESPACE}
  labels:
    app: baas
spec:
  type: ClusterIP
  selector:
    app: baas
  ports:
  - name: http
    port: ${BAAS_PORT}
    targetPort: ${BAAS_PORT}
    protocol: TCP
