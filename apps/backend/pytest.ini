[pytest]
# 查找测试文件的路径模式
testpaths = tests
# 匹配文件名：任何以 test_ 开头或以 _test 结尾的 .py 文件
python_files = test_*.py *_test.py
# 匹配测试类名（可选）
python_classes = Test*
# 匹配测试函数名（可选）
python_functions = test_*

# openocb 是社区独立仓库：`tests` 是普通包（regular package），`agentclaw`
# 是 PEP 420 命名空间包。`.`=src/backend 让 `tests` / `tests.community` 可导入，
# `src`=src/backend/src 让 `agentclaw.community` 可导入。无 corp、无 submodule，
# 因此不需要 __path__ 桥接，也不需要 consider_namespace_packages。
pythonpath = . src

# 默认隐式收集时排除 acceptance（路 B，real backend + 真磁盘 artifact）。
# 需要在 CI 容器里 spawn baas / mosn / sofa-registry，CI 容器不具备该能力。
#   RUN_ACCEPTANCE=1 uv run pytest tests/community/acceptance/ -v
addopts = --ignore=tests/community/acceptance
