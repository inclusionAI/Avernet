<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">skill_center — target architecture: Installation as the single source of truth</text>

  <!-- policy consultation bus -->
  <path d="M 195 58 L 195 48 L 830 48 L 830 58 M 520 58 L 520 48" fill="none" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="700" y="43" text-anchor="middle" font-size="10.5" fill="#b45309">writers consult the ownership rules (R1–R3)</text>

  <!-- Band 1: writers + policy -->
  <rect x="40" y="58" width="310" height="96" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="195" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">SkillSetControlPlaneService</text>
  <text x="195" y="99" text-anchor="middle" font-size="11" fill="#475569">SkillSet lifecycle &amp; membership commands</text>
  <text x="195" y="114" text-anchor="middle" font-size="11" fill="#475569">MCP direct activate / deactivate</text>
  <text x="195" y="129" text-anchor="middle" font-size="11" fill="#475569">ACL · audit · runtime-reconcile orchestration</text>

  <rect x="380" y="58" width="280" height="96" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="520" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">LocalSkillStateService</text>
  <text x="520" y="99" text-anchor="middle" font-size="11" fill="#475569">(behind BotSkillAssetService.set_active)</text>
  <text x="520" y="114" text-anchor="middle" font-size="11" fill="#475569">direct skill activate / deactivate</text>
  <text x="520" y="129" text-anchor="middle" font-size="11" fill="#475569">writes Installation rows directly</text>

  <rect x="700" y="58" width="260" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="830" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">CapabilityOwnershipPolicy · new</text>
  <text x="830" y="99" text-anchor="middle" font-size="11" fill="#78350f">R1  Set-managed ⇒ no direct control</text>
  <text x="830" y="114" text-anchor="middle" font-size="11" fill="#78350f">R2  direct-active ⇒ cannot join a Set</text>
  <text x="830" y="129" text-anchor="middle" font-size="11" fill="#78350f">R3  one ordinary Set per capability</text>

  <!-- writers -> repositories -->
  <line x1="195" y1="154" x2="195" y2="186" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="520" y1="154" x2="640" y2="186" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Band 2: repositories -->
  <rect x="40" y="190" width="460" height="76" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="270" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">SkillSetControlPlaneRepository — unit of work</text>
  <text x="270" y="231" text-anchor="middle" font-size="11" fill="#475569">Set state + membership + Installation in one transaction</text>
  <text x="270" y="246" text-anchor="middle" font-size="11" fill="#475569">repair_bot_skillset_installations(bot) = the lazy flush (skills + MCPs)</text>

  <rect x="540" y="190" width="250" height="76" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="665" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">SkillInstallationRepository</text>
  <text x="665" y="231" text-anchor="middle" font-size="11" fill="#475569">direct Installation rows</text>
  <text x="665" y="246" text-anchor="middle" font-size="11" fill="#475569">install · uninstall · list</text>

  <!-- repositories -> tables -->
  <line x1="160" y1="266" x2="160" y2="302" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="440" y1="266" x2="600" y2="302" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="665" y1="266" x2="665" y2="302" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Band 3: tables -->
  <rect x="40" y="306" width="340" height="84" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="210" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">SkillSet configuration</text>
  <text x="210" y="347" text-anchor="middle" font-size="11" fill="#475569">ac_skill_set (is_active · is_default)</text>
  <text x="210" y="362" text-anchor="middle" font-size="11" fill="#475569">ac_skill_set_skill · ac_skill_set_mcp</text>
  <text x="210" y="377" text-anchor="middle" font-size="11" fill="#475569">ac_default_skillset_*_exclusion</text>

  <rect x="560" y="306" width="340" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="730" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Installation — single source of truth</text>
  <text x="730" y="347" text-anchor="middle" font-size="11" fill="#1e40af">ac_bot_skill_installation</text>
  <text x="730" y="362" text-anchor="middle" font-size="11" fill="#1e40af">ac_bot_mcp_installation</text>
  <text x="730" y="377" text-anchor="middle" font-size="11" fill="#1e40af">active-only desired state · not backfilled</text>

  <!-- flush arrow between table groups -->
  <text x="468" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">lazy flush (repair)</text>
  <text x="468" y="346" text-anchor="middle" font-size="10.5" fill="#2563eb">Installation agrees with Set state</text>
  <line x1="384" y1="356" x2="552" y2="356" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <!-- tables -> reader -->
  <line x1="730" y1="390" x2="730" y2="426" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="748" y="412" font-size="10.5" fill="#2563eb">read</text>

  <!-- Band 4: reader -->
  <rect x="560" y="430" width="340" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="730" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">BotInstallationReader · new</text>
  <text x="730" y="471" text-anchor="middle" font-size="11" fill="#1e40af">flush(bot) first → then read Installation only</text>
  <text x="730" y="486" text-anchor="middle" font-size="11" fill="#1e40af">active_skill_assets · active_mcp_server_codes</text>

  <!-- reader -> consumers -->
  <line x1="730" y1="506" x2="730" y2="542" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Band 5: consumers -->
  <rect x="40" y="546" width="920" height="86" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="500" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">One projection everywhere — every consumer goes through the reader</text>
  <text x="60" y="589" font-size="11" fill="#475569">· BotRuntimeProjectionReconciler → engine runtime   · skills_pool convergence / recovery / reconcile   · Service-Bot build stage</text>
  <text x="60" y="605" font-size="11" fill="#475569">· OpenAPI skills listing &amp; detail   · SkillSetService.get_active_skills → symlink mappings, teclaw config-compose</text>
  <text x="60" y="621" font-size="11" fill="#475569">· collect_bot_active_mcps = default MCP policy (engine/template − exclusions) ∪ installed MCPs</text>
</svg>
