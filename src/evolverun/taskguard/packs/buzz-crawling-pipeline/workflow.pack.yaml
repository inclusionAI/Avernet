id: buzz-crawling-pipeline
version: "0.4.0"
title: 外部舆情策略更新全流程
description: |
  外部舆情信号获取、数据圈选、风险复核、知识入库至关键词策略补防端到端工作流外置 pack。
  六个 embedded-agent 节点通过按 flowId 隔离的 TeClaw workspace 文件协议串行协作。

workflows:
  - id: buzz-crawling-pipeline
    file: workflows/buzz-crawling-pipeline.yaml

facades:
  - command: buzz-crawling
    defaultWorkflow: buzz-crawling-pipeline
    help:
      title: 外部舆情策略更新全流程
      summary: /buzz-crawling run 启动外部舆情策略更新全流程

skills:
  required:
    - buzz-crawling-signal
    - buzz-data-collect
    - buzz-risk-review
    - buzz-instruction-update
    - buzz-keywords-update
    - buzz-summary-report

compat:
  schemaVersion: 1
