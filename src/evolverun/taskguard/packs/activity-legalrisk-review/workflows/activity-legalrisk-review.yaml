id: activity-legalrisk-review
version: 1
title: 活动法务风险评审

input:
  mode: mixed
  requiredParams:
    - docUrl
    - projectName
  optionalParams:
    - subTaskId
  sources:
    params: true
    message: true

identity:
  key: "{{input.params.projectName}}"
  label: "法务评审: {{input.params.projectName}}"
  duplicatePolicy: allow

outputs:
  finalResult:
    from: "{{nodeOutput.format-output.result}}"
    public: true
    description: "格式化法务评审结果"
  yuqueDocUrl:
    from: "{{nodeOutput.create-yuque-doc.result.docUrl}}"
    public: true
    description: "语雀存档文档URL"

defaults:
  progress:
    enabled: true
    sink: chat
  user:
    id: system
    name: System

messages:
  onCreated: "法务评审流程已创建：{{workflow.title}}"
  onFinished: "法务评审流程已完成：{{workflow.title}}"

workflow:
  onStart: []

nodes:
  # ═══════════════════════════════════════════════════
  # P1: 读取活动规则文档
  # ═══════════════════════════════════════════════════
  - id: fetch-doc
    title: 读取活动规则文档
    phase: P1
    dependsOn: []
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        执行文档读取：解析活动规则文档


        项目名称：{{input.params.projectName}}
        文档URL：{{input.params.docUrl}}


        执行步骤：


        1. 判断文档类型：
           - 如果URL以 https://yuque. 开头，使用语雀MCP读取：
             a. 使用 MCP 工具 skylark_resolve_url 解析语雀URL，获取 doc_id
             b. 使用 MCP 工具 skylark_doc_detail 获取主文档内容
             c. 扫描主文档中所有语雀子链接，递归获取
           - 其他URL，使用 WebFetch 读取文档内容

        2. 将完整内容写入文件：~/.openclaw/workspace/workspace/{{input.params.projectName}}/complete_content.md

        3. 注意：禁止使用 web_fetch/browser 读取语雀文档，必须使用 MCP


        完成后输出 JSON：
        {
          "status": "completed",
          "contentFile": "workspace/{{input.params.projectName}}/complete_content.md",
          "sourceType": "yuque或web",
          "contentLength": 内容字数
        }
      timeoutSeconds: 180
      contextPolicy:
        history: tail
    outputContract:
      required: true
      schema:
        type: object
        required: [status, contentFile, sourceType]
        properties:
          status:
            type: string
          contentFile:
            type: string
          sourceType:
            type: string
          contentLength:
            type: number
            nullable: true

  # ═══════════════════════════════════════════════════
  # P2: 关键词命中检测
  # ═══════════════════════════════════════════════════
  - id: keyword-check
    title: 关键词命中检测
    phase: P2
    dependsOn: [fetch-doc]
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        执行关键词命中检测：判断活动是否需要法务评审


        读取文件：~/.openclaw/workspace/workspace/{{input.params.projectName}}/complete_content.md


        检测关键词：奖品、抽奖、有概率获得、竞猜


        判断逻辑：
        - 扫描文档内容，检测是否包含以上关键词或语义相近的表述
        - 匹配方式：关键词精确匹配 + 语义理解（如"抽签"、"摇号"、"概率获取"、"赢取"等均视为命中）
        - 对每个命中关键词，记录原文出处


        如果命中任意关键词 → 需要法务评审
        如果全部未命中 → "需要进行人工审核"


        完成后输出 JSON：
        {
          "status": "completed",
          "keywordsHit": true或false,
          "hitKeywords": ["关键词1", "关键词2"],
          "evidence": [{"keyword": "关键词", "quote": "原文引用"}]
        }
      timeoutSeconds: 60
    outputContract:
      required: true
      schema:
        type: object
        required: [status, keywordsHit]
        properties:
          status:
            type: string
          keywordsHit:
            type: boolean
          hitKeywords:
            type: array
            items:
              type: string
          evidence:
            type: array
            items:
              type: object
    onResult:
      if:
        path: keywordsHit
        equals: false
      then:
        complete: true

  # ═══════════════════════════════════════════════════
  # P3: 9类法务风险全面审查
  # ═══════════════════════════════════════════════════
  - id: legal-review
    title: 9类法务风险全面审查
    phase: P3
    dependsOn: [keyword-check]
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        执行9类法务风险全面审查


        读取文件：~/.openclaw/workspace/workspace/{{input.params.projectName}}/complete_content.md


        【审查原则】
        1. 基于以下9类指标进行全面审查
        2. 对每个风险点，必须清晰指出：风险类别、原文证据、风险原因、修改建议
        3. 所有风险点必须引用原文证据，禁止主观臆断
        4. 每个风险点必须经过两次验证：关键词匹配验证 + 语义理解验证
        5. 必须使用规定的判断逻辑和输出格式


        【9类风险检测规则】


        **禁止行为（1-7）**

        1. 虚假宣传：检测关于奖项/奖品/价值/中奖率的虚构、夸大或无法验证的陈述

        2. 非公平投放：
           识别奖品是否未全部投放、仅特定渠道/区域投放且未公平告知、或实际未投放
           例：宣称100台但只投放了90台；不同区域数量/时间不同且未在规则中说明

        3. 不明确时间：
           检查是否隐藏关键时间节点（大奖投放/开奖/活动起止时间）
           good: "开奖时间：兑奖结果实时公布"、"有效期限详见红包权益详情页"
           bad: "不定时开奖"、"奖品敬请期待"（用于关键时间信息时）

        4. 不兑奖：
           审查兑奖条款是否存在不合理或过于严苛的兑奖条件
           关键词: "兑奖需满足额外条件"、"主办方保留调整奖品的权利"

        5. 内定中奖：
           - 寻找暗示或明确允许内部员工/关联方/特定人员参与并中奖的条款
           - 明确"内部员工不得参与"是合规的
           - 识别促销主体是否为药品/医疗器械（法律禁止有奖销售）
           关键词: "内部员工可参与"、"欢迎合作单位参加"
           药品关键词: 药品名、医疗器械名、"药"、"治疗"、"康复"等与"抽奖"、"买赠"、"有奖销售"结合

        7. 最终解释权：
           不应包含"最终解释权归XX所有"或类似霸王条款
           关键词: "最终解释权"、"本公司保留最终解释权"、"解释权"
           注意: "在法律允许范围内"这种表述不属于最终解释权


        **金额限制（8）**

        8. 奖品金额超限：
           特殊奖品（无需标注金额）：演唱会门票、演出票、体育赛事门票、电影票等票务类
           特殊商品：
           - 票务类 → 无需标注价值，需说明场次/实名要求
           - 定制/限量类 → 可不标价格，标注"定制""限量"
           - 虚拟权益类 → 以券面金额为准

           检测逻辑：
           IF 最高奖金额 > 50,000元 → 违规
           IF 单次抽奖总金额 > 50,000元 → 违规
           IF 同一奖券可获奖次数 ≥ 2次 AND 累计金额 > 50,000元 → 违规
           IF 非现金奖品市场折算价 > 50,000元 → 违规
           注意：计算单项价值只识别单价是否高于5万，不需要乘数量


        **信息展示完备性（9）**

        9.1 奖项（种类/数量/条件/范围/方式）：
           通过条件：已说明"随机发放"/"先到先得"/"抽奖"等任一方式即可
           若"积分兑换+随机发放"模式，"随机发放"已说明抽奖方式

        9.2 奖品（金额/品名/数量）：
           实物奖品要注明价值
           例外：票务类可不标注金额但应标注票务信息；限量款可标注"定制款"/"非卖品"

        9.3 发奖/兑奖（时间/条件/方式/交付）

        9.4 主办方信息（名称/联系方式）

        9.5 弃奖条件：
           已明确"逾期未填写视为放弃"即可，不强制写明具体天数
           若活动本身周期较短（如5天），活动结束时间本身已隐含兑奖时限
           good example: "中奖者需在活动规则规定的兑奖期限内完成兑奖手续。逾期未要求兑付的奖项，将视为自动放弃"

        9.6 多账号获奖限制：
           参考表述：同一身份证号、同一支付宝账号、同一手机号码、同一设备终端，满足以上任一条件均视为同一用户


        【风险输出规则】

        - 风险类型1、2、5、9.6：
          ■ 若发现疑似风险 → 输出法务调整意见
          ■ 若未发现风险 → "本次活动未发现明显风险，请业务侧在实际展业过程中重点关注"

        - 风险类型3、4、6、7、8、9.1、9.2、9.4：
          ■ 若检测到关键词或相似表述 → 输出法务调整建议
          ■ 若未发现风险 → "未发现明显风险"

        - 风险类型3、9.3、9.5：
          ■ 若发现风险 → 输出法务调整建议，并提示"明确的表述可以降低客诉及监管问询"（加粗）
          ■ 若未发现风险 → "未发现明显风险"


        【双重验证】
        每个风险点必须经过：
        1. 关键词匹配验证 — 在原文中找到对应关键词或相似表述
        2. 语义理解验证 — 上下文语义确认确实存在风险


        将审查结果写入文件：~/.openclaw/workspace/workspace/{{input.params.projectName}}/legal_review.md


        完成后输出 JSON：
        {
          "status": "completed",
          "riskCount": 发现的风险点数量,
          "riskTypes": ["风险类型1", "风险类型2"],
          "noRiskTypes": ["无风险类型1", "无风险类型2"]
        }
      timeoutSeconds: 300
    outputContract:
      required: true
      schema:
        type: object
        required: [status, riskCount, riskTypes, noRiskTypes]
        properties:
          status:
            type: string
          riskCount:
            type: number
          riskTypes:
            type: array
            items:
              type: string
          noRiskTypes:
            type: array
            items:
              type: string

  # ═══════════════════════════════════════════════════
  # P4: 格式化评审输出
  # ═══════════════════════════════════════════════════
  - id: format-output
    title: 格式化评审输出
    phase: P4
    dependsOn: [legal-review]
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        执行格式化输出：严格按照规定格式输出评审结果


        读取文件：
        - ~/.openclaw/workspace/workspace/{{input.params.projectName}}/legal_review.md
        - ~/.openclaw/workspace/workspace/{{input.params.projectName}}/complete_content.md


        【输出格式 — 严格按照以下格式输出】


        ━━━━━━━━━━━━━━━━━━━━━━━━
        【法务评审意见】

        若1-9.6都未发现明显风险，则输出"未发现明显风险"

        若1-9.6中发现明显风险，则输出"存在风险"，详情请见【风险列表】
        ━━━━━━━━━━━━━━━━━━━━━━━━


        ━━━━━━━━━━━━━━━━━━━━━━━━
        【风险列表】

        输出"存在风险"的项，格式如下：

        + 风险类型: {具体风险类型1}
            - 提审材料原文：
                * 风险原文材料1
                * 风险原文材料2
            - 风险描述/说明：
                * 说明1
                * 说明2
            - 法务调整建议：
                * 建议1
                * 建议2

        具体例子：

        + 雇险类型：发奖/兑奖信息不完备
            - 提审材料原文：
                * 闪购鲜花生日礼满25减24.9元专享红包，将直接发放至【支付宝App-淘宝闪购-红包-我的红包】，使用规则、有效期限详见红包权益详情页。
            - 风险描述/说明：
                * 缺少奖品发放的具体时间节点说明，用户无法知晓何时能收到权益
            - 法务调整建议：
                * 建议补充发放时效说明。参考表述：红包将在领取后24小时内发放至用户账户。明确的表述可以降低客诉及监管问询
        ━━━━━━━━━━━━━━━━━━━━━━━━


        ━━━━━━━━━━━━━━━━━━━━━━━━
        【文案瑕疵】

        文案中若有缺字、少字、漏字、错别字可列为文案瑕疵单独提示
        ━━━━━━━━━━━━━━━━━━━━━━━━


        ━━━━━━━━━━━━━━━━━━━━━━━━
        【其他审查项说明】

        列出"未发现明显风险"的风险类型及审查结果。

        | 风险类型 | 提审材料原文 | 审查结果 |
        |---|---|---|
        | ... | ... | ... |
        ━━━━━━━━━━━━━━━━━━━━━━━━


        【重要提醒】
        - 风险类型3、9.3、9.5的法务调整建议中，必须加粗提示"明确的表述可以降低客诉及监管问询"
        - 风险类型1、2、5、9.6若未发现风险，输出"本次活动未发现明显风险，请业务侧在实际展业过程中重点关注"
        - 风险类型3、4、6、7、8、9.1、9.2、9.4若未发现风险，输出"未发现明显风险"
        - 严格按照markdown规范语法格式输出


        将格式化输出写入文件：~/.openclaw/workspace/workspace/{{input.params.projectName}}/formatted_review.md


        完成后输出 JSON：
        {
          "status": "completed",
          "verdict": "存在风险或未发现明显风险",
          "riskCount": 风险点数量,
          "textFlawCount": 文案瑕疵数量
        }
      timeoutSeconds: 120
    outputContract:
      required: true
      schema:
        type: object
        required: [status, verdict]
        properties:
          status:
            type: string
          verdict:
            type: string
          riskCount:
            type: number
            nullable: true
          textFlawCount:
            type: number
            nullable: true
    saveAs:
      workflowData.reviewVerdict: "{{nodeOutput.format-output.result.verdict}}"

  # ═══════════════════════════════════════════════════
  # P5: 用户确认（只有/confirm算确认）
  # ═══════════════════════════════════════════════════
  - id: human-confirm
    title: 用户确认评审结果
    phase: P5
    dependsOn: [format-output]
    executor:
      type: human
      prompt: |
        法务评审结果如下：

        【法务评审意见】{{workflowData.reviewVerdict}}

        请查看完整评审结果文件确认是否满意：
        ~/.openclaw/workspace/workspace/{{input.params.projectName}}/formatted_review.md
      actions:
        confirm:
          inputSchema:
            type: object
            properties:
              feedback:
                type: string
          saveAs:
            workflowData.confirmed: "true"
          next: succeed-current
        revise:
          inputSchema:
            type: object
            properties:
              feedback:
                type: string
          feedbackPath: "workflowData.revisionFeedback"
          feedbackMode: append-line
          target: legal-review
          reset: target-and-descendants
          next: rerun-target
        reject:
          inputSchema:
            type: object
            properties:
              feedback:
                type: string
          next: fail-flow
      commandHints:
        confirm:
          label: "✅ 确认通过"
        revise:
          label: "📝 需要修改"
        reject:
          label: "❌ 驳回终止"

  # ═══════════════════════════════════════════════════
  # P6: 结果上报（task-worker-skill）
  # ═══════════════════════════════════════════════════
  - id: report-result
    title: 评审结果上报
    phase: P6
    dependsOn: [human-confirm]
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        执行结果上报：将法务评审结果上报到任务步骤


        读取文件：~/.openclaw/workspace/workspace/{{input.params.projectName}}/formatted_review.md


        执行步骤：

        1. 从 formatted_review.md 中摘取以下内容：
           - 【法务评审意见】
           - 【风险列表】
           - 【文案瑕疵】

        2. 注意：不包含【其他审查项说明】，严格按照markdown规范语法格式输出给主任务

        3. 调用 task-worker-skill 将结果上报到该任务步骤中去

        4. 如果提供了 subTaskId（{{input.params.subTaskId}}），同时推进风控评审子任务状态

        完成后输出 JSON：
        {
          "status": "completed",
          "reported": true,
          "subTaskUpdated": true或false
        }
      timeoutSeconds: 120
    outputContract:
      required: true
      schema:
        type: object
        required: [status, reported]
        properties:
          status:
            type: string
          reported:
            type: boolean
          subTaskUpdated:
            type: boolean
            nullable: true

  # ═══════════════════════════════════════════════════
  # P6: 创建语雀存档文档
  # ═══════════════════════════════════════════════════
  - id: create-yuque-doc
    title: 创建语雀存档文档
    phase: P6
    dependsOn: [human-confirm]
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        执行语雀文档创建：在同一知识库创建评审记录文档


        读取文件：~/.openclaw/workspace/workspace/{{input.params.projectName}}/formatted_review.md


        执行步骤：

        1. 参考模板：https://yuque.antfin.com/tht5sm/kg7h1z/yfo16zlxv0ic2xh7?singleDoc# 《刘若英活动评审记录》

        2. 使用语雀MCP工具：
           - 先用 skylark_resolve_url 解析模板文档URL，获取知识库信息
           - 再用 skylark_create_doc 在同一知识库创建同级的文档

        3. 将以下内容写入新创建的语雀文档：
           - 【法务评审意见】
           - 【风险列表】
           - 【文案瑕疵】
           - 【其他审查项说明】

        4. 文档标题格式：{项目名}-法务评审记录

        完成后输出 JSON：
        {
          "status": "completed",
          "docUrl": "新建语雀文档的URL",
          "docId": 新建文档ID
        }
      timeoutSeconds: 120
    outputContract:
      required: true
      schema:
        type: object
        required: [status, docUrl]
        properties:
          status:
            type: string
          docUrl:
            type: string
          docId:
            type: number
            nullable: true

  # ═══════════════════════════════════════════════════
  # P7: 流程完成
  # ═══════════════════════════════════════════════════
  - id: done
    title: 评审完成
    phase: P7
    dependsOn: [report-result, create-yuque-doc]
    join: any
    executor:
      type: done