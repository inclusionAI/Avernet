<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="560" fill="#fafbf9"/>
  <text x="24" y="34" font-size="16" font-weight="bold" fill="#1c2420">System overview — Cloud track</text>

  <!-- User + personal agent -->
  <rect x="30" y="80" width="150" height="40" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="105" y="105" font-size="13" text-anchor="middle" fill="#1c2420">User</text>
  <line x1="105" y1="120" x2="105" y2="168" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="115" y="148" font-size="11" fill="#5c6a62">chat (L1)</text>

  <rect x="30" y="172" width="150" height="66" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="105" y="198" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2420">Personal agent</text>
  <text x="105" y="216" font-size="11" text-anchor="middle" fill="#5c6a62">owns clock + L1 memory</text>

  <!-- A2A arrow -->
  <line x1="180" y1="205" x2="276" y2="205" stroke="#157a55" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="228" y="192" font-size="11" text-anchor="middle" fill="#157a55">A2A (JSON-RPC + SSE)</text>
  <text x="228" y="222" font-size="10" text-anchor="middle" fill="#5c6a62">no standing connection;</text>
  <text x="228" y="234" font-size="10" text-anchor="middle" fill="#5c6a62">ids carry the session</text>

  <!-- BCN cloud -->
  <rect x="280" y="60" width="340" height="330" rx="12" fill="#ffffff" stroke="#157a55" stroke-dasharray="6 4"/>
  <text x="296" y="84" font-size="13" font-weight="bold" fill="#157a55">BCN cloud (N nodes)</text>

  <rect x="300" y="180" width="70" height="50" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="335" y="209" font-size="12" text-anchor="middle" fill="#1c2420">LB</text>

  <rect x="410" y="100" width="190" height="64" rx="8" fill="#e3f0e9" stroke="#157a55" stroke-width="1.5"/>
  <text x="505" y="124" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">Node A</text>
  <text x="505" y="142" font-size="10.5" text-anchor="middle" fill="#157a55">warm: task T (active episode)</text>
  <text x="505" y="155" font-size="10" text-anchor="middle" fill="#5c6a62">holds lease for T (fenced)</text>

  <rect x="410" y="190" width="190" height="44" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="505" y="216" font-size="12" text-anchor="middle" fill="#1c2420">Node B</text>

  <rect x="410" y="260" width="190" height="44" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="505" y="286" font-size="12" text-anchor="middle" fill="#1c2420">Node C</text>

  <line x1="370" y1="195" x2="406" y2="140" stroke="#5c6a62" marker-end="url(#ar)"/>
  <line x1="370" y1="205" x2="406" y2="210" stroke="#5c6a62" marker-end="url(#ar)"/>
  <line x1="370" y1="218" x2="406" y2="278" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="372" y="330" font-size="10" fill="#5c6a62">hash(user_id, task_id)</text>
  <text x="372" y="342" font-size="10" fill="#5c6a62">= placement preference</text>

  <!-- Shared DB -->
  <rect x="330" y="430" width="280" height="86" rx="10" fill="#ffffff" stroke="#1c2420" stroke-width="1.5"/>
  <text x="470" y="454" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2420">Shared DB (MySQL HA) + Redis</text>
  <text x="470" y="474" font-size="11" text-anchor="middle" fill="#5c6a62">sessions · runs · checkpoints · queues</text>
  <text x="470" y="490" font-size="11" text-anchor="middle" fill="#5c6a62">task leases + fencing tokens</text>
  <text x="470" y="506" font-size="10" text-anchor="middle" fill="#157a55">source of truth — write-through, before ack</text>
  <line x1="470" y1="390" x2="470" y2="426" stroke="#5c6a62" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="480" y="412" font-size="10" fill="#5c6a62">write-through / rehydrate</text>

  <!-- BCSFuse -->
  <rect x="60" y="430" width="200" height="70" rx="10" fill="#ffffff" stroke="#9a6b0a" stroke-dasharray="5 4"/>
  <text x="160" y="454" font-size="12" font-weight="bold" text-anchor="middle" fill="#9a6b0a">BCSFuse</text>
  <text x="160" y="472" font-size="10.5" text-anchor="middle" fill="#5c6a62">search / recommendation</text>
  <text x="160" y="486" font-size="10" text-anchor="middle" fill="#5c6a62">off the execution path (cached)</text>
  <line x1="280" y1="380" x2="222" y2="426" stroke="#9a6b0a" stroke-dasharray="4 4" marker-end="url(#ar)"/>

  <!-- Supply agents -->
  <rect x="660" y="60" width="236" height="330" rx="12" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="676" y="84" font-size="13" font-weight="bold" fill="#1c2420">Supply agents</text>

  <rect x="676" y="100" width="204" height="56" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="778" y="120" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1c2420">Dial-in (WS, duplex)</text>
  <text x="778" y="136" font-size="10.5" text-anchor="middle" fill="#5c6a62">bcs-bridge · OpenClaw plugin</text>
  <text x="778" y="149" font-size="10.5" text-anchor="middle" fill="#5c6a62">DeepSeek Harness plugin</text>

  <rect x="676" y="180" width="204" height="56" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="778" y="200" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1c2420">Dial-out (HTTP + SSE)</text>
  <text x="778" y="216" font-size="10.5" text-anchor="middle" fill="#5c6a62">engine adapter (in-house)</text>
  <text x="778" y="229" font-size="10.5" text-anchor="middle" fill="#5c6a62">external providers</text>

  <rect x="676" y="262" width="204" height="110" rx="8" fill="#f2f5f3" stroke="#b9c6bf" stroke-dasharray="4 3"/>
  <text x="778" y="284" font-size="11" font-weight="bold" text-anchor="middle" fill="#1c2420">Agent-side task store</text>
  <text x="778" y="302" font-size="10" text-anchor="middle" fill="#5c6a62">A2A Tasks, queryable (GetTask)</text>
  <text x="778" y="316" font-size="10" text-anchor="middle" fill="#5c6a62">idempotency seen-set (profile)</text>
  <text x="778" y="330" font-size="10" text-anchor="middle" fill="#5c6a62">retention window agreed up front</text>
  <text x="778" y="352" font-size="10" text-anchor="middle" fill="#157a55">holds results even while BCN is down</text>

  <!-- arrows BCN <-> agents -->
  <line x1="672" y1="124" x2="604" y2="124" stroke="#5c6a62" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="638" y="112" font-size="10" text-anchor="middle" fill="#5c6a62">agent dials in</text>
  <line x1="604" y1="208" x2="672" y2="208" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="638" y="196" font-size="10" text-anchor="middle" fill="#5c6a62">BCN dials out</text>
  <text x="638" y="222" font-size="10" text-anchor="middle" fill="#5c6a62">SSE streams back</text>
</svg>
