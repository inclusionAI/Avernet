name: ClawWeb CI

on:
  push:
    paths:
      - "src/evolverun/clawweb/**"
      - ".github/workflows/clawweb-ci.yml"
  pull_request:
    paths:
      - "src/evolverun/clawweb/**"
      - ".github/workflows/clawweb-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawweb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/evolverun/clawweb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: src/evolverun/clawweb/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build packages
        run: npm run ci:build

      - name: Check packages
        run: npm run ci:check

      - name: Verify test runner
        run: node --test scripts/ci/run-tests.test.mjs

      - name: Test packages with coverage (observation period)
        continue-on-error: true
        run: npm run test:ci

      - name: Publish test summary
        if: always()
        run: |
          if [ -f test-results/summary.md ]; then
            cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Tests NOT_RUN or interrupted: no summary generated; inspect preceding steps.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clawweb-test-results
          path: src/evolverun/clawweb/test-results/
          if-no-files-found: warn
