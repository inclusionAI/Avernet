id: ai-interpreted-branch
version: 1
title: AI解读分支（L0 回退）

description: |
  hint-guided Agent 回退演示：人工节点不定义 keywordAliases，用户的自然语言
  由 AI Agent 通过 workflow_choice 工具解读意图后触发分支。
  当 isExactMatch 未匹配时，hint 会通过 chatInject 注入到 Agent 上下文中，
  告知 Agent 当前有工作流等待决策。
  适用于分支选项难以枚举关键词的场景（如"同意，走方案A"）。

input:
  mode: mixed
  requiredParams: [reviewTarget]
  sources:
    params: true
    message: true

identity:
  key: "{{input.params.reviewTarget}}"
  label: "AI解读: {{input.params.reviewTarget}}"
  duplicatePolicy: allow

outputs:
  reviewDecision:
    from: "{{nodeOutput.review-decision.decision}}"
    public: true
    description: "审核决定"

defaults:
  progress:
    enabled: true
    sink: chat

messages:
  onCreated: "AI解读分支流程已启动：{{input.params.reviewTarget}}"
  onFinished: "审核流程已完成。"

nodes:
  # ──── P1: 收集审核信息 ──────────────────────────────────────
  - id: collect-info
    title: 收集审核信息
    phase: P1
    dependsOn: []
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        收集并整理 {{input.params.reviewTarget}} 的审核信息。

        用户描述：{{input.message}}

        严格输出 JSON：
        {
          "target": "审核对象",
          "summary": "审核摘要",
          "riskLevel": "high/medium/low"
        }

  # ──── P2: AI解读审核决定 ─────────────────────────────────────
  # 无 keywordAliases — L1 关键词匹配不触发，由 AI Agent 通过
  # workflow_choice 工具解读用户自然语言后调用
  - id: review-decision
    title: 审核决定
    phase: P2
    dependsOn: [collect-info]
    executor:
      type: human
      waitKind: review-decision
      prompt: "请对 {{input.params.reviewTarget}} 做出审核决定"
      inputSchema:
        type: object
        required: [decision]
        properties:
          decision:
            type: string
            enum: [approve, reject, revise]
      saveAs:
        workflowData.reviewDecision: "{{input.decision}}"

  # ──── P3A: 批准 ─────────────────────────────────────────────
  - id: approve-action
    title: 执行批准
    phase: P3
    branchId: approve
    dependsOn: [review-decision]
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        审核已批准，执行上线操作。

        审核信息：{{nodeOutput.collect-info}}

        严格输出 JSON：
        {
          "status": "approved",
          "action": "已上线",
          "timestamp": "执行时间"
        }

  # ──── P3B: 驳回 ─────────────────────────────────────────────
  - id: reject-action
    title: 执行驳回
    phase: P3
    branchId: reject
    dependsOn: [review-decision]
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        审核已驳回，发送驳回通知。

        审核信息：{{nodeOutput.collect-info}}

        严格输出 JSON：
        {
          "status": "rejected",
          "reason": "驳回原因",
          "nextStep": "建议修改后重新提交"
        }

  # ──── P3C: 修改 ─────────────────────────────────────────────
  - id: revise-action
    title: 执行修改
    phase: P3
    branchId: revise
    dependsOn: [review-decision]
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        审核要求修改，生成修改建议。

        审核信息：{{nodeOutput.collect-info}}

        严格输出 JSON：
        {
          "status": "revision-required",
          "suggestions": ["修改建议1", "修改建议2"],
          "deadline": "修改截止时间"
        }

  # ──── P4: 完成 ──────────────────────────────────────────────
  - id: finalize
    title: 流程结束
    phase: P4
    dependsOn: [approve-action, reject-action, revise-action]
    triggerRule: one_success
    executor:
      type: done