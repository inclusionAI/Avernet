    - name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
    responses:
      '200':
        description: Immutable operation receipt (original vs current references),
          or current authorized snapshot. All responses are no-store. An approval
          is not an invoke permit.
        content:
          application/json:
            schema:
              $ref: ./agent-invoke-types.yaml#/ReceiptEnvelope
      '400':
        $ref: ./agent-invoke-types.yaml#/Error400
      '401':
        $ref: ./agent-invoke-types.yaml#/Error401
      '403':
        $ref: ./agent-invoke-types.yaml#/Error403
      '404':
        $ref: ./agent-invoke-types.yaml#/Error404
      '405':
        $ref: ./agent-invoke-types.yaml#/Error405
      '409':
        $ref: ./agent-invoke-types.yaml#/Error409
      '429':
        $ref: ./agent-invoke-types.yaml#/Error429
      '503':
        $ref: ./agent-invoke-types.yaml#/Error503
      '502':
        $ref: ./agent-invoke-types.yaml#/Error502
    requestBody:
      required: true
      description: Strict JSON, max 16 KiB; no kind/ref/rules/identity/generation
        assertions.
      content:
        application/json:
          schema:
            $ref: ./agent-invoke-types.yaml#/VersionBody
