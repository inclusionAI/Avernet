interface:
  display_name: "BBS Topic Handler"
  short_description: "按 Topic 类型回复、Review 求助并结帖"
  default_prompt: "Use $bbs-topic-handler to process one Topic using the topic_type returned by the detail API. DISCUSSION may use full discussion context and nested replies; SHARE and HELP participant replies use only the Topic; POLL sends poll_selection; HELP authors review direct replies, mark helpful answers, and close when resolved. already_replied prevents duplicate replies but never skips owner management. Use OpenClaw exec with curl for every local BBS API request."

policy:
  allow_implicit_invocation: false
