<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="600" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">Draining node A (group G restarts in place)</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">Move ownership before the process stops; keep serving until the move. Draining never means refusing.</text>

  <!-- phase lanes -->
  <rect x="24" y="72" width="912" height="62" rx="8" fill="#ffffff" stroke="#5c6a62"/>
  <text x="44" y="96" font-size="13" font-weight="bold" fill="#1c2420">1 · Stop signal</text>
  <text x="44" y="118" font-size="11.5" fill="#1c2420">roster state = draining (peers stop placing on A) · readiness red (LB stops new connections) · stop claiming · keep serving owned sessions</text>

  <rect x="24" y="146" width="912" height="210" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="44" y="170" font-size="13" font-weight="bold" fill="#157a55">2 · Sessions, cheapest first (a session that just received a round jumps the queue)</text>
  <rect x="44" y="184" width="200" height="156" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="144" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">Cold</text>
  <text x="58" y="230" font-size="11" fill="#1c2420">nothing in memory</text>
  <text x="58" y="254" font-size="11.5" font-weight="bold" fill="#157a55">→ RELEASE</text>
  <text x="58" y="274" font-size="11" fill="#5c6a62">node_id = '', 1 statement;</text>
  <text x="58" y="290" font-size="11" fill="#5c6a62">next round's preferred node</text>
  <text x="58" y="306" font-size="11" fill="#5c6a62">claims it (normal cold start)</text>
  <rect x="262" y="184" width="200" height="156" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="362" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">Warm / resumable wait</text>
  <text x="276" y="230" font-size="11" fill="#1c2420">between steps · A2A task id</text>
  <text x="276" y="246" font-size="11" fill="#1c2420">recorded · bot socket anywhere</text>
  <text x="276" y="270" font-size="11.5" font-weight="bold" fill="#157a55">→ HANDOFF now</text>
  <text x="276" y="290" font-size="11" fill="#5c6a62">PREPARE · pause · transfer ·</text>
  <text x="276" y="306" font-size="11" fill="#5c6a62">COMMIT (successor is warm)</text>
  <rect x="480" y="184" width="210" height="156" rx="8" fill="#ffffff" stroke="#9a6b0a"/>
  <text x="585" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#9a6b0a">Non-resumable step</text>
  <text x="494" y="230" font-size="11" fill="#1c2420">Provider 2.0 SSE, Message-only</text>
  <text x="494" y="246" font-size="11" fill="#1c2420">agent: output only on that stream</text>
  <text x="494" y="270" font-size="11.5" font-weight="bold" fill="#9a6b0a">→ finish the step, then hand off</text>
  <text x="494" y="290" font-size="11" fill="#5c6a62">A stays owner meanwhile and</text>
  <text x="494" y="306" font-size="11" fill="#5c6a62">does not start the next step</text>
  <rect x="708" y="184" width="212" height="156" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="814" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">About to dispatch</text>
  <text x="722" y="230" font-size="11" fill="#1c2420">this is a safe point</text>
  <text x="722" y="254" font-size="11.5" font-weight="bold" fill="#157a55">→ hand off first</text>
  <text x="722" y="274" font-size="11" fill="#5c6a62">the new step starts on the</text>
  <text x="722" y="290" font-size="11" fill="#5c6a62">successor, never on A</text>
  <text x="722" y="314" font-size="11" fill="#5c6a62">(successor ∉ G: a draining</text>
  <text x="722" y="330" font-size="11" fill="#5c6a62">node refuses PREPARE)</text>

  <rect x="24" y="368" width="912" height="62" rx="8" fill="#ffffff" stroke="#5c6a62"/>
  <text x="44" y="392" font-size="13" font-weight="bold" fill="#1c2420">3 · Bot sockets on A, last</text>
  <text x="44" y="414" font-size="11.5" fill="#1c2420">no new sends · "please reconnect" to idle bots · wait for busy bots' in-flight runs · close. New work stays queued with each session's owner.</text>

  <rect x="24" y="442" width="912" height="62" rx="8" fill="#ffffff" stroke="#5c6a62"/>
  <text x="44" y="466" font-size="13" font-weight="bold" fill="#1c2420">4 · Relay and redirect · 5 · Deadline (25 s, inside the platform stop timeout)</text>
  <text x="44" y="488" font-size="11.5" fill="#1c2420">keep relaying open PA streams; answer NOT_OWNER(B) · at the deadline release the rest (read-only: cancel and redo; side-effecting: reconcile)</text>

  <rect x="24" y="516" width="440" height="64" rx="8" fill="#ffffff" stroke="#5c6a62"/>
  <text x="44" y="540" font-size="13" font-weight="bold" fill="#1c2420">6 · Delete roster row, exit</text>
  <text x="44" y="562" font-size="11.5" fill="#5c6a62">peer port stays open until the last handoff</text>
  <line x1="464" y1="548" x2="490" y2="548" stroke="#5c6a62" marker-end="url(#ar)"/>
  <rect x="496" y="516" width="440" height="64" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="516" y="540" font-size="13" font-weight="bold" fill="#157a55">7 · Restart: same address, new node_id</text>
  <text x="516" y="562" font-size="11.5" fill="#1c2420">leftovers claimable at once · same member_name → same placement</text>
</svg>
