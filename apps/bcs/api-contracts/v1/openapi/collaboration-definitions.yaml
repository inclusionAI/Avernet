CollaborationDefinitionValidateRequest:
  type: object
  additionalProperties: false
  required: [definition_yaml]
  description: >-
    Body of the V1 collaboration-definition validation request. The legacy
    handler additionally accepted a `yaml` serde alias; the V1 contract does not
    carry that alias — callers posting `{"yaml": ...}` receive `400
    invalid_request` and must use `definition_yaml`.
  properties:
    definition_yaml:
      type: string
      minLength: 1
      description: Raw collaboration-definition YAML document to validate.

CollaborationDefinitionValidationDiagnostic:
  type: object
  additionalProperties: false
  required: [code, path, message]
  properties:
    code:
      type: string
      minLength: 1
    path:
      type: string
    message:
      type: string
    hint:
      type: string

CollaborationDefinitionValidationSummary:
  type: object
  additionalProperties: false
  required: [participants, nodes]
  properties:
    participants:
      type: integer
      minimum: 0
    nodes:
      type: integer
      minimum: 0
    initial_nodes:
      type: array
      items:
        type: string
        minLength: 1
    final_output_node:
      type: string
      minLength: 1

CollaborationDefinitionParticipantSlot:
  type: object
  additionalProperties: false
  required: [binding, required, assigned]
  properties:
    binding:
      type: string
      minLength: 1
    display_name:
      type: string
    description:
      type: string
    required:
      type: boolean
    assigned:
      type: boolean

CollaborationDefinitionBotBindingAssignee:
  type: object
  additionalProperties: false
  required: [type, binding]
  description: >-
    Participant-bound assignee. Mirrors the legacy
    `StateMachineAssignee::BotBinding { binding }` variant, which serializes as
    `{"type":"bot_binding","binding":...}`.
  properties:
    type:
      type: string
      enum: [bot_binding]
    binding:
      type: string
      minLength: 1

CollaborationDefinitionRuntimeActorAssignee:
  type: object
  additionalProperties: false
  required: [type, actor]
  description: >-
    Runtime-resolved actor assignee. Mirrors the legacy
    `StateMachineAssignee::RuntimeActor { actor }` variant, which serializes as
    `{"type":"runtime_actor","actor":...}`.
  properties:
    type:
      type: string
      enum: [runtime_actor]
    actor:
      type: string
      minLength: 1

StateMachineNodeExecutionMetadata:
  type: object
  additionalProperties: false
  required: [definition_node_id, loop_id, iteration, max_iterations]
  properties:
    definition_node_id:
      type: string
      minLength: 1
    loop_id:
      type: string
      minLength: 1
    iteration:
      type: integer
      minimum: 1
    max_iterations:
      type: integer
      minimum: 1

StateMachineLoopRoute:
  type: object
  additionalProperties: false
  description: >-
    Static compiler metadata for a result control exit. The edge outcome remains
    the actual result outcome; exhausted only changes this logical projection.
    Ordinary edges omit this field. This is not an edge execution status.
  required: [kind, logical_outcome]
  properties:
    kind:
      type: string
      enum: [continue, break, exhausted]
    logical_outcome:
      type: string
      minLength: 1

CollaborationDefinitionGraphNode:
  type: object
  additionalProperties: false
  required: [node_id, display_name, kind, final_output, judge]
  properties:
    node_id:
      type: string
      minLength: 1
    display_name:
      type: string
    kind:
      type: string
      minLength: 1
    assignee:
      oneOf:
        - $ref: "#/CollaborationDefinitionBotBindingAssignee"
        - $ref: "#/CollaborationDefinitionRuntimeActorAssignee"
    final_output:
      type: boolean
    judge:
      type: boolean
    execution:
      $ref: "#/StateMachineNodeExecutionMetadata"

CollaborationDefinitionGraphEdge:
  type: object
  additionalProperties: false
  required: [source, target, outcome]
  properties:
    display_name:
      type: string
      minLength: 1
      pattern: "\\S"
      description: Optional author-defined label for display only. Does not change outcomes or routing; omitted for legacy definitions.
    source:
      type: string
      minLength: 1
    target:
      type: string
      minLength: 1
    outcome:
      type: string
      minLength: 1
    loop_route:
      $ref: "#/StateMachineLoopRoute"

StateMachineLoopGraphView:
  type: object
  additionalProperties: false
  description: Logical Loop display descriptor from validated authoring or the immutable Run snapshot. Body IDs are logical IDs. This does not introduce a Loop Node Run.
  required: [display_name, max_iterations, entry_node_id, result_node_id, body_node_ids, continue_outcomes, break_outcomes, exhausted_outcome]
  properties:
    continue_display_name:
      type: string
      minLength: 1
      pattern: "\\S"
      description: Optional author-defined label for display only. Does not change outcomes or routing; omitted for legacy definitions.
    display_name:
      type: string
    max_iterations:
      type: integer
      minimum: 1
    entry_node_id:
      type: string
      minLength: 1
    result_node_id:
      type: string
      minLength: 1
    body_node_ids:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
    continue_outcomes:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
    break_outcomes:
      type: array
      uniqueItems: true
      items:
        type: string
        minLength: 1
    exhausted_outcome:
      type: string
      minLength: 1

CollaborationDefinitionGraphPreview:
  type: object
  additionalProperties: false
  required: [graph_mode, nodes, edges]
  properties:
    loops:
      type: object
      additionalProperties:
        $ref: "#/StateMachineLoopGraphView"
      description: Optional logical Loop descriptors; v1 omits this field.
    graph_mode:
      type: string
      minLength: 1
      description: Authoring mode; hierarchical for a fixed Loop definition.
    execution_graph_mode:
      type: string
      enum: [acyclic]
      description: Present for compiled v2 previews. Preview IDs are scoped to this response.
    nodes:
      type: array
      items:
        $ref: "#/CollaborationDefinitionGraphNode"
    edges:
      type: array
      items:
        $ref: "#/CollaborationDefinitionGraphEdge"

CollaborationDefinitionValidationOutcome:
  type: object
  additionalProperties: false
  required: [valid, summary]
  description: >-
    Validation result for an authoring collaboration-definition YAML. Mirrors the
    legacy `CollaborationDefinitionValidationOutcome` serde projection verbatim
    (byte-compatible). A document that fails to compile or violates a
    validation rule is still returned as `200` with `valid: false` and populated
    `errors`; it is not surfaced as an HTTP error. Fixed Loop v2 returns a
    VALIDATION_ONLY_FEATURE warning when execution is disabled in this deployment.
    Explicit experimental execution opt-in removes that warning and allows
    creation and execution through the same runtime. v1 wire fields remain unchanged.
  properties:
    valid:
      type: boolean
    errors:
      type: array
      items:
        $ref: "#/CollaborationDefinitionValidationDiagnostic"
    warnings:
      type: array
      items:
        $ref: "#/CollaborationDefinitionValidationDiagnostic"
    summary:
      $ref: "#/CollaborationDefinitionValidationSummary"
    participants:
      type: array
      items:
        $ref: "#/CollaborationDefinitionParticipantSlot"
    graph:
      $ref: "#/CollaborationDefinitionGraphPreview"

CollaborationDefinitionValidationEnvelope:
  type: object
  additionalProperties: false
  required: [code, message, data, request_id]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      $ref: "#/CollaborationDefinitionValidationOutcome"
    request_id:
      $ref: ../shared.yaml#/RequestId

BadRequestResponse:
  description: Invalid validation request.
  x-error-codes:
    - invalid_request
  content:
    application/json:
      schema:
        $ref: ../shared.yaml#/ErrorEnvelope

UnauthenticatedResponse:
  description: Gateway Principal is missing or invalid.
  x-error-codes: [unauthenticated]
  content:
    application/json:
      schema:
        $ref: ../shared.yaml#/ErrorEnvelope

CollaborationDefinitionValidatePath:
  post:
    operationId: validate_definition
    tags: ["Collaboration / Definitions"]
    summary: Validate a collaboration-definition YAML document.
    description: >-
      Versioned projection of legacy `POST
      /collaboration/definitions/validate`. Compiles and validates an authoring
      collaboration-definition YAML without persisting or executing it. The
      validation is not scoped to a Bot or Session, so the request carries no
      caller principal policy beyond the protected-boundary Gateway Principal.
      `judge_available` is a server-side runtime configuration injected into
      the facade at construction; it is not a request field. An invalid
      document is returned as `200` with `valid: false` and detailed diagnostics
      — it is not surfaced as an HTTP error, preserving legacy behavior.
    x-avernet-security:
      user: optional
      app: optional
      bot: optional
    x-avernet-behavior:
      legacy_equivalent: /collaboration/definitions/validate
      result_kind: validation
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/CollaborationDefinitionValidateRequest"
    responses:
      "200":
        description: >-
          Validation outcome wrapped in the standard envelope. `valid` is the
          authoritative field; invalid YAML still yields `200` with
          `valid: false`.
        content:
          application/json:
            schema:
              $ref: "#/CollaborationDefinitionValidationEnvelope"
      "400": { $ref: "#/BadRequestResponse" }
      "401": { $ref: "#/UnauthenticatedResponse" }
      "500": { $ref: ../shared.yaml#/InternalErrorResponse }
