RegisterCheckPath:
  post:
    operationId: check_provider_bot_registration
    tags:
    - Collaboration / Register
    summary: Validate scoped registration and check Provider/ref occupancy without
      creating a Bot.
    description: Requires a Provider-scoped registration token. Returns normalized
      identity and authoritative occupancy, including tombstones. Formal registration
      still enforces uniqueness atomically; no AgentPass proof is required by this
      registration API.
    x-avernet-security: {}
    parameters:
    - name: token
      in: query
      required: true
      description: Register token previously issued by GET /register/token.
      schema:
        type: string
        minLength: 1
    - name: bot-name
      in: query
      required: true
      description: Display name of the new Bot; the wire name keeps the legacy dashed
        form. Servers also accept `bot_name`.
      schema:
        type: string
        minLength: 2
        maxLength: 64
    - name: mode
      in: query
      required: false
      schema:
        type: string
        enum:
        - plugin
        - gateway
        default: plugin
    - name: provider_bot_ref
      in: query
      required: false
      description: Required with a Provider-scoped v2 token; stable identity within
        the Provider. For AgentPass Providers, supply the real AgentPass agent code,
        which is also stored as the Bot's agent_code in both modes.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]+$
    - name: bot_slug
      in: query
      required: false
      description: Required for agentpass-subbots; ignored by other modes. Unique
        under Provider and parent, including tombstones.
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
    - name: webhook_url
      in: query
      required: false
      description: Optional gateway-only Bot override for authorized Provider registration
        callers. Delivery uses the shared Provider downlink credential. Blank is invalid;
        subject to outbound URL policy.
      schema:
        type: string
        format: uri
        minLength: 1
    responses:
      '400':
        description: Missing or invalid parameters, invalid name length, or gateway
          endpoint/downlink credential not ready.
        x-error-codes:
        - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      '401':
        description: Register token failed verification (expired, wrong signature,
          malformed).
        x-error-codes:
        - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      '500':
        $ref: ../shared.yaml#/InternalErrorResponse
      '403':
        description: Provider registration is not authorized, or requested mode is
          outside token scope.
        x-error-codes:
        - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      '404':
        description: Provider no longer exists.
        x-error-codes:
        - provider_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      '409':
        description: Registration identity or previously registered Bot/delivery state
          conflicts.
        x-error-codes:
        - registration_conflict
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      '200':
        description: Registration selection metadata and slug availability.
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - message
              - data
              - request_id
              properties:
                code:
                  type: integer
                  const: 20000
                message:
                  type: string
                request_id:
                  type: string
                data:
                  type: object
                  required:
                  - provider_id
                  - auth_mode
                  - agent_code
                  - provider_bot_ref
                  - bot_slug
                  - available
                  - reason
                  - identity_version
                  properties:
                    provider_id:
                      type: string
                    auth_mode:
                      type: string
                    agent_code:
                      type:
                      - string
                      - 'null'
                    provider_bot_ref:
                      type: string
                    bot_slug:
                      type:
                      - string
                      - 'null'
                    available:
                      type: boolean
                    reason:
                      type:
                      - string
                      - 'null'
                    identity_version:
                      type: integer
                      const: 1
