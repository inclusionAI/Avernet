<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2457a6"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a6b0a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="680" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">两层:网关持有连接,执行器持有租约并负责扇出</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">输出路径:智能体 → 网关 → 增量频道 → 所有者 → 会话频道 → 订阅的网关 → PA。两层之间没有负载均衡器。</text>

  <!-- top row -->
  <rect x="40" y="76" width="170" height="50" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="125" y="98" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2420">个人智能体</text>
  <text x="125" y="115" font-size="11" text-anchor="middle" fill="#5c6a62">A2A SSE / WS / gRPC 流</text>
  <rect x="270" y="76" width="170" height="50" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="355" y="98" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2420">负载均衡器</text>
  <text x="355" y="115" font-size="11" text-anchor="middle" fill="#5c6a62">任一就绪网关</text>
  <line x1="210" y1="101" x2="266" y2="101" stroke="#5c6a62" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="540" y="76" width="180" height="50" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="630" y="98" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2420">A2A 智能体 A</text>
  <text x="630" y="115" font-size="11" text-anchor="middle" fill="#5c6a62">由网关拨出访问</text>
  <rect x="750" y="76" width="180" height="50" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="840" y="98" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2420">A2A 智能体 B</text>
  <text x="840" y="115" font-size="11" text-anchor="middle" fill="#5c6a62">由网关拨出访问</text>

  <!-- gateway tier -->
  <rect x="24" y="160" width="912" height="150" rx="12" fill="#eef2fa" stroke="#2457a6" stroke-width="1.6"/>
  <text x="44" y="182" font-size="13.5" font-weight="bold" fill="#2457a6">网关层</text>
  <text x="870" y="182" font-size="11.5" text-anchor="end" fill="#2457a6">所有长连接 · 无持久状态</text>
  <rect x="44" y="194" width="420" height="102" rx="8" fill="#ffffff" stroke="#2457a6"/>
  <text x="254" y="214" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1c2420">网关 GW1</text>
  <text x="60" y="236" font-size="11" fill="#1c2420">• 会话 S 的 PA 流(读 S 的 Stream)</text>
  <text x="60" y="254" font-size="11" fill="#1c2420">• 执行派发 D:到供给智能体的流</text>
  <text x="60" y="272" font-size="11" fill="#1c2420">• 把 D 的增量发布到 deltas:{b};控制事件发给所有者</text>
  <text x="60" y="288" font-size="10.5" fill="#5c6a62">保留 D 的输出,直到所有者确认结果</text>
  <rect x="496" y="194" width="420" height="102" rx="8" fill="#ffffff" stroke="#2457a6"/>
  <text x="706" y="214" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1c2420">网关 GW2</text>
  <text x="512" y="236" font-size="11" fill="#1c2420">• 执行一个到 A2A 智能体 B 的派发</text>
  <text x="512" y="254" font-size="11" fill="#1c2420">• 其增量发到该桶的增量频道</text>
  <text x="512" y="272" font-size="11" fill="#1c2420">• S 的一个观看者,也在读 S 的 Stream</text>
  <text x="512" y="288" font-size="10.5" fill="#5c6a62">按会话读取,绝不按所有者读取</text>

  <line x1="355" y1="126" x2="300" y2="190" stroke="#5c6a62" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="560" y1="130" x2="420" y2="190" stroke="#5c6a62" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="470" y="148" font-size="10.5" fill="#5c6a62">流</text>
  <line x1="900" y1="190" x2="900" y2="130" stroke="#5c6a62" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- pub/sub -->
  <rect x="560" y="326" width="356" height="44" rx="8" fill="#f7eed7" stroke="#9a6b0a" stroke-width="1.4"/>
  <text x="738" y="345" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#9a6b0a">消息队列(Redis,分片)</text>
  <text x="738" y="361" font-size="10.5" text-anchor="middle" fill="#5c6a62">每个桶一个增量频道 · 每个会话一个 Redis Stream</text>
  <line x1="600" y1="326" x2="430" y2="300" stroke="#9a6b0a" stroke-width="1.8" marker-start="url(#ao)" marker-end="url(#ao)"/>
  <line x1="820" y1="326" x2="800" y2="300" stroke="#9a6b0a" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="612" y="320" font-size="10.5" fill="#9a6b0a">增量流入 · S 的事件 + 增量流出</text>

  <!-- executor tier -->
  <rect x="24" y="384" width="912" height="110" rx="12" fill="#e3f0e9" stroke="#157a55" stroke-width="1.6"/>
  <text x="44" y="406" font-size="13.5" font-weight="bold" fill="#157a55">执行器层</text>
  <text x="916" y="406" font-size="11.5" text-anchor="end" fill="#157a55">租约 · 运行 · 编排 · 扇出 · 无长连接</text>
  <rect x="44" y="418" width="280" height="64" rx="8" fill="#ffffff" stroke="#157a55" stroke-width="1.6"/>
  <text x="184" y="438" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#157a55">执行器 E3 —— S 的所有者</text>
  <text x="58" y="458" font-size="11" fill="#1c2420">拥有 bucket(S)(令牌 n)· 带围栏的写入</text>
  <text x="58" y="474" font-size="11" fill="#1c2420">决定谁看到什么 · 在 S 上发布</text>
  <rect x="340" y="418" width="280" height="64" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="480" y="438" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1c2420">执行器 E4</text>
  <text x="354" y="458" font-size="11" fill="#1c2420">拥有其他桶;对 b 排名第二</text>
  <text x="354" y="474" font-size="11" fill="#5c6a62">E3 死了就接管 S</text>
  <rect x="636" y="418" width="280" height="64" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="776" y="438" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1c2420">执行器 E5 …</text>
  <text x="650" y="458" font-size="11" fill="#1c2420">放置 = 会合哈希</text>
  <text x="650" y="474" font-size="11" fill="#5c6a62">把桶分配到执行器</text>

  <line x1="150" y1="296" x2="150" y2="414" stroke="#2457a6" stroke-width="1.8" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="158" y="330" font-size="10.5" fill="#2457a6">控制通道:Submit ·</text>
  <text x="158" y="344" font-size="10.5" fill="#2457a6">控制事件 · StartDispatch · Ack</text>
  <line x1="300" y1="418" x2="600" y2="372" stroke="#9a6b0a" stroke-width="1.8" marker-start="url(#ao)" marker-end="url(#ao)"/>
  <text x="330" y="372" font-size="10.5" fill="#9a6b0a">订阅 deltas:{b} · 发布(令牌 n)</text>

  <!-- DB -->
  <rect x="24" y="520" width="912" height="140" rx="12" fill="#ffffff" stroke="#2457a6" stroke-width="1.6"/>
  <text x="480" y="646" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#2457a6">共享高可用数据库(OceanBase;单节点模式下为 SQLite)—— 执行器唯一的交汇处</text>
  <rect x="44" y="534" width="270" height="92" rx="8" fill="#ffffff" stroke="#2457a6"/>
  <text x="179" y="554" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1c2420">bcs_node_roster</text>
  <text x="58" y="574" font-size="11" fill="#1c2420">node_id · member_name · role · state</text>
  <text x="58" y="590" font-size="11" fill="#1c2420">last_heartbeat_at · advertise_addr</text>
  <text x="58" y="612" font-size="10.5" fill="#5c6a62">网关和执行器都写心跳</text>
  <rect x="345" y="534" width="270" height="92" rx="8" fill="#e3f0e9" stroke="#157a55" stroke-width="1.6"/>
  <text x="480" y="554" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#157a55">bcs_task_leases</text>
  <text x="359" y="574" font-size="11" fill="#1c2420">bucket · node_id · fencing_token · adopted</text>
  <text x="359" y="590" font-size="11" fill="#1c2420">4,096 行,每桶一行</text>
  <text x="359" y="612" font-size="10.5" fill="#157a55">权威:每个桶归谁所有</text>
  <rect x="646" y="534" width="270" height="92" rx="8" fill="#ffffff" stroke="#2457a6"/>
  <text x="781" y="554" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1c2420">会话数据</text>
  <text x="660" y="574" font-size="11" fill="#1c2420">会话(bucket、待处理标记、write_seq)</text>
  <text x="660" y="590" font-size="11" fill="#1c2420">运行 · 派发记录 · Task 记录</text>
  <text x="660" y="612" font-size="10.5" fill="#5c6a62">只经由围栏写入</text>
  <line x1="184" y1="482" x2="420" y2="530" stroke="#157a55" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="260" y1="482" x2="740" y2="530" stroke="#157a55" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="560" y="510" font-size="10.5" fill="#157a55">围栏步骤 + 持久写入,同一事务</text>
</svg>
