[pytest]

asyncio_mode = auto

# suppress third-party deprecation warnings
filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince20:sofapy_base
    ignore::DeprecationWarning:starlette
    ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited
    ignore:coroutine 'Event.wait' was never awaited

# source
pythonpath = src

# markers
markers =
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests (requires running server)
    baseline: marks tests for consolidated baseline test suite (crud + sync + async)
    mock_paas_hook_failure: marks e2e tests for mock hook execution failure
    mock_paas_create_failure: marks e2e tests for mock device creation failure
    mock_paas_destroy_failure: marks e2e tests for mock device destroy failure
    mock_paas_device_not_found: marks e2e tests for mock device not found (idempotent destroy)
    transactional: marks tests that use db_transaction rollback for automatic cleanup

# exclude integration and e2e by default (UT only)
addopts = -m "not integration and not e2e"