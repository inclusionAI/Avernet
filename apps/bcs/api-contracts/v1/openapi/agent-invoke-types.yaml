Error400:
  description: Closed failure; no partial result or raw dependency detail. Commit
    unknown requires receipt recovery with the SAME canonical command and key.
  x-error-codes:
  - agent_invoke_invalid_input
  content:
    application/json:
      schema:
        $ref: ../shared.yaml#/ErrorEnvelope
