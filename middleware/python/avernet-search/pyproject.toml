[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avernet-search"
version = "0.1.0"
description = "Business-neutral search contracts, ranking and HTTP adapters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
http = ["fastapi>=0.100.0", "pydantic>=2.0.0"]
test = ["pytest>=7", "httpx>=0.24.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
