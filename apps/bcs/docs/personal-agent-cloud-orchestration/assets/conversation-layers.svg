<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="560" fill="#fafbf9"/>
  <text x="24" y="34" font-size="16" font-weight="bold" fill="#1c2420">The three conversation layers</text>

  <!-- L1 -->
  <rect x="40" y="58" width="560" height="100" rx="10" fill="#eef1ef" stroke="#b9c6bf"/>
  <text x="56" y="82" font-size="13" font-weight="bold" fill="#1c2420">L1 — user ↔ personal agent</text>
  <rect x="70" y="98" width="110" height="40" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="125" y="122" font-size="12" text-anchor="middle" fill="#1c2420">User</text>
  <line x1="180" y1="118" x2="256" y2="118" stroke="#5c6a62" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <rect x="260" y="98" width="150" height="40" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="335" y="122" font-size="12" text-anchor="middle" fill="#1c2420">Personal agent</text>
  <text x="435" y="115" font-size="10.5" fill="#5c6a62">months of chat;</text>
  <text x="435" y="129" font-size="10.5" fill="#5c6a62">the user's life context</text>

  <text x="630" y="92" font-size="11" font-weight="bold" fill="#5c6a62">Owner: personal agent</text>
  <text x="630" y="110" font-size="11" fill="#b3402e">BCN: never sees it raw</text>

  <!-- projection L1 -> L2 -->
  <line x1="335" y1="158" x2="335" y2="200" stroke="#157a55" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="350" y="182" font-size="10.5" fill="#157a55">downward projection: delegation-relevant context only</text>

  <!-- L2 -->
  <rect x="40" y="204" width="560" height="100" rx="10" fill="#e3f0e9" stroke="#157a55"/>
  <text x="56" y="228" font-size="13" font-weight="bold" fill="#1c2420">L2 — delegation thread (personal agent ↔ BCN)</text>
  <text x="70" y="252" font-size="11" fill="#1c2420">requests ("plan trip", "revise: 5 days, cheaper hotel") · results (the plan)</text>
  <text x="70" y="270" font-size="11" fill="#1c2420">input-required questions surfaced to the user · lifecycle: continue / close / expire</text>
  <text x="70" y="292" font-size="10" fill="#157a55">makes "make it cheaper" resolvable — the caller-facing contract surface</text>

  <text x="630" y="238" font-size="11" font-weight="bold" fill="#5c6a62">Owner: BCN</text>
  <text x="630" y="256" font-size="11" fill="#5c6a62">tens of messages, task-level</text>
  <text x="630" y="274" font-size="11" fill="#157a55">retained for the task's lifetime</text>
  <text x="630" y="292" font-size="11" fill="#157a55">(guarantees resumability)</text>

  <!-- projection L2 <-> L3 -->
  <line x1="300" y1="304" x2="300" y2="348" stroke="#157a55" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="312" y="324" font-size="10.5" fill="#157a55">compose step dispatches</text>
  <line x1="480" y1="348" x2="480" y2="304" stroke="#5c6a62" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="492" y="338" font-size="10.5" fill="#5c6a62">upward: results + questions only</text>

  <!-- L3 -->
  <rect x="40" y="352" width="560" height="150" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="56" y="376" font-size="13" font-weight="bold" fill="#1c2420">L3 — collaboration workspace (BCN ↔ supply agents)</text>
  <text x="70" y="400" font-size="11" fill="#1c2420">group transcript (chat.send / chat.inject, [from:HotelExpert] …)</text>
  <text x="70" y="418" font-size="11" fill="#1c2420">run events: thinking, tool calls, partial output · HITL interactions</text>
  <text x="70" y="436" font-size="11" fill="#1c2420">workflow run state: node, attempts, judge decisions, dispatch records</text>

  <rect x="70" y="452" width="500" height="38" rx="8" fill="#f2f5f3" stroke="#b9c6bf" stroke-dasharray="4 3"/>
  <text x="320" y="468" font-size="10.5" text-anchor="middle" fill="#1c2420">experts' own working context (candidate lists, held quotes) — held provider-side per session_id</text>
  <text x="320" y="483" font-size="10" text-anchor="middle" fill="#b3402e">never enters BCN at all</text>

  <text x="630" y="386" font-size="11" font-weight="bold" fill="#5c6a62">Owner: BCN + providers</text>
  <text x="630" y="404" font-size="11" fill="#5c6a62">hundreds of events, step-level</text>
  <text x="630" y="422" font-size="11" fill="#9a6b0a">compactable / expirable:</text>
  <text x="630" y="440" font-size="11" fill="#9a6b0a">retention buys revision quality,</text>
  <text x="630" y="458" font-size="11" fill="#9a6b0a">never correctness</text>

  <text x="40" y="534" font-size="11" fill="#5c6a62">Privacy posture: BCN retains task working state, not the user's conversational life. The L2/L3 boundary is a projection in both directions.</text>
</svg>
