<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a6b0a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="580" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">会话频道挺过所有者崩溃</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">每个会话一个 Redis Stream。先提交,再用显式 id 追加;网关从自己最后的 id 继续读,所以所有者变化不可见。</text>

  <rect x="30" y="72" width="150" height="40" rx="8" fill="#eef2fa" stroke="#2457a6"/>
  <text x="105" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2457a6">网关 GW1</text>
  <rect x="230" y="72" width="160" height="40" rx="8" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="310" y="91" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#9a6b0a">Stream</text>
  <text x="310" y="105" font-size="10.5" text-anchor="middle" fill="#5c6a62">session:{S}</text>
  <rect x="440" y="72" width="150" height="40" rx="8" fill="#f8e6e1" stroke="#b3402e"/>
  <text x="515" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#b3402e">执行器 E3(所有者)</text>
  <rect x="630" y="72" width="150" height="40" rx="8" fill="#ffffff" stroke="#2457a6"/>
  <text x="705" y="91" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2457a6">会话行(数据库)</text>
  <text x="705" y="105" font-size="10.5" text-anchor="middle" fill="#5c6a62">last_event_seq · unpublished</text>
  <rect x="810" y="72" width="130" height="40" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="875" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#157a55">执行器 E4</text>
  <line x1="105" y1="112" x2="105" y2="430" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="310" y1="112" x2="310" y2="430" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="515" y1="112" x2="515" y2="260" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="705" y1="112" x2="705" y2="430" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="875" y1="112" x2="875" y2="430" stroke="#b9c6bf" stroke-dasharray="3 4"/>

  <line x1="109" y1="134" x2="306" y2="134" stroke="#9a6b0a" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="208" y="128" font-size="10.5" text-anchor="middle" fill="#9a6b0a">从最后的 id 读</text>
  <line x1="519" y1="158" x2="701" y2="158" stroke="#157a55" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="610" y="152" font-size="10.5" text-anchor="middle" fill="#157a55">提交 #41(Task、发件箱)</text>
  <line x1="511" y1="176" x2="314" y2="176" stroke="#9a6b0a" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="412" y="170" font-size="10.5" text-anchor="middle" fill="#9a6b0a">XADD 41-0 (token n)</text>
  <line x1="306" y1="190" x2="109" y2="190" stroke="#9a6b0a" stroke-width="1.6" marker-end="url(#ao)"/>
  <line x1="519" y1="214" x2="701" y2="214" stroke="#157a55" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="610" y="208" font-size="10.5" text-anchor="middle" fill="#157a55">提交 #42(Task、发件箱)</text>
  <rect x="440" y="226" width="150" height="34" rx="5" fill="#f8e6e1" stroke="#b3402e"/>
  <text x="515" y="241" font-size="10.5" text-anchor="middle" fill="#b3402e">在 XADD 42-0</text>
  <text x="515" y="254" font-size="10.5" text-anchor="middle" fill="#b3402e">之前崩溃</text>

  <rect x="10" y="216" width="190" height="42" rx="6" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="105" y="234" font-size="10.5" text-anchor="middle" fill="#1c2420">PA 的流保持打开;</text>
  <text x="105" y="248" font-size="10.5" text-anchor="middle" fill="#1c2420">输出暂停</text>

  <rect x="800" y="276" width="150" height="34" rx="5" fill="#ffffff" stroke="#157a55"/>
  <text x="875" y="291" font-size="10.5" text-anchor="middle" fill="#157a55">认领 b(令牌 n+1),</text>
  <text x="875" y="304" font-size="10.5" text-anchor="middle" fill="#157a55">为该步骤 FetchBuffer</text>
  <line x1="871" y1="328" x2="709" y2="328" stroke="#157a55" marker-end="url(#ag)"/>
  <text x="790" y="322" font-size="10.5" text-anchor="middle" fill="#157a55">读 unpublished:[#42]</text>
  <line x1="871" y1="356" x2="314" y2="356" stroke="#9a6b0a" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="600" y="350" font-size="10.5" text-anchor="middle" fill="#9a6b0a">Owner(n+1) · XADD 42-0 · 步骤输出作为 append: false(令牌 n+1)</text>
  <line x1="306" y1="372" x2="109" y2="372" stroke="#9a6b0a" stroke-width="1.6" marker-end="url(#ao)"/>
  <rect x="10" y="384" width="190" height="42" rx="6" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="105" y="402" font-size="10.5" text-anchor="middle" fill="#9a6b0a">41-0 之后的条目,按顺序;</text>
  <text x="105" y="416" font-size="10.5" text-anchor="middle" fill="#9a6b0a">丢弃更低的令牌</text>
  <text x="510" y="402" font-size="10.5" text-anchor="middle" fill="#5c6a62">Stream 里已有的 id 会被拒绝:重新发布无害</text>

  <rect x="24" y="444" width="912" height="120" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="44" y="468" font-size="13" font-weight="bold" fill="#1c2420">保证</text>
  <text x="44" y="490" font-size="11.5" fill="#1c2420">每个已提交的事件都会按顺序、至少一次送达每个正在读 S 的 Stream 的网关;重复的会因 id 被拒绝。</text>
  <text x="44" y="508" font-size="11.5" fill="#1c2420">增量在故障后可能被替换;最终结果精确。</text>
  <text x="44" y="528" font-size="11.5" fill="#1c2420">规则:先提交(Task 记录、last_event_seq、unpublished)再追加 · 显式 id · 先写 Owner(token) 标记 · 每个步骤结束时写快照条目。</text>
  <text x="44" y="548" font-size="11" fill="#5c6a62">要求 Stream 提供方具备法定多数持久性(故障切换不丢失已确认的条目)。</text>
</svg>
