GroupsPath:
  get:
    operationId: list_groups
    tags: ["Collaboration / Groups"]
    summary: List Groups for the selected View Actor.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - $ref: ../shared.yaml#/ViewBotIdQuery
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: q
        in: query
        schema:
          type: string
      - name: membership
        in: query
        schema:
          type: string
          enum:
            - all
            - direct
            - session_only
          default: all
      - name: kind
        in: query
        schema:
          type: string
          enum:
            - normal
            - dm
            - all
          default: normal
      - name: strategy
        in: query
        schema:
          type: string
          enum:
            - chat
            - manager_worker
            - state_machine
    responses:
      "200":
        description: >-
          Groups ordered by created_at descending (group_id ascending
          tie-breaker) after selected View Actor relation, strategy, kind, and
          search filtering and deduplication, then paginated with offset/limit.
          Omitting view_bot_id selects the authenticated Human Actor. An explicit
          Human Actor must be that same User; an explicit Bot must be owned by
          the authenticated User. Both items and total are scoped before
          pagination. An authorized View Actor with no matching Group relation
          receives an empty page.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/GroupPageEnvelope
      "400":
        description: Invalid filter combination.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: >-
          The selected View Actor is not authorized for the authenticated Human.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse
  post:
    operationId: create_group
    tags: ["Collaboration / Groups"]
    summary: Create a collaboration group or direct-message group.
    x-avernet-security:
      user: required
      app: required
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/CreateCollaborationGroup"
              - $ref: "#/CreateDirectMessageGroup"
            discriminator:
              propertyName: group_kind
    responses:
      "200":
        description: Existing direct-message group detail when the actor pair is reused.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/GroupDetailEnvelope
      "201":
        description: Created group detail.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/CreatedGroupDetailEnvelope
      "400":
        description: Invalid group definition.
        x-error-codes:
          - invalid_request
          - invalid_participant
          - invalid_participant_binding
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: A selected Bot is not collaboration-eligible.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: A referenced Bot Actor is missing.
        x-error-codes:
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: Group conflicts with an existing resource.
        x-error-codes:
          - conflict
          - non_public_participant
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

GroupPath:
  get:
    operationId: get_group
    tags: ["Collaboration / Groups"]
    summary: Get target-independent group detail.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - $ref: ../shared.yaml#/GroupIdPath
    responses:
      "200":
        description: Group detail.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/GroupDetailEnvelope
      "400":
        description: Invalid group identifier encoding.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: >-
          Neither the authenticated User's Human Actor nor a Bot created by
          that Human is a Group Participant.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Group is missing or intentionally hidden.
        x-error-codes:
          - group_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: Persisted state-machine configuration is incomplete.
        x-error-codes:
          - state_machine_definition_missing
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse
  patch:
    operationId: update_group
    tags: ["Collaboration / Groups"]
    summary: Update the explicitly mutable group properties.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - $ref: ../shared.yaml#/GroupIdPath
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/UpdateGroup"
    responses:
      "200":
        description: Updated group detail.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/GroupDetailEnvelope
      "400":
        description: Invalid patch.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: >-
          Principal cannot manage the group. A Human Principal may manage when
          it can act as at least one Group management actor: the driver,
          originator, or ManagerWorker manager participant. Human-to-actor authority is
          checked only against these target actors: direct human_{user.id}, a
          Bot whose created_by equals the Human user id, or a creator relation
          edge from human_{user.id} to that Bot. The server does not enumerate
          every Bot created by the Human for this authorization decision.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Group is missing or intentionally hidden, or a persisted participant Bot is missing.
        x-error-codes:
          - group_not_found
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: Patch conflicts with current group state.
        x-error-codes:
          - conflict
          - non_public_participant
          - state_machine_definition_missing
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse
  delete:
    operationId: delete_group
    tags: ["Collaboration / Groups"]
    summary: Delete a group using the authenticated Principal as caller.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - $ref: ../shared.yaml#/GroupIdPath
      - $ref: ../shared.yaml#/ActingBotIdQuery
    responses:
      "200":
        description: Idempotent delete result.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/DeleteResultEnvelope
      "400":
        description: Invalid group identifier encoding.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: >-
          Principal cannot delete the group. A Human Principal may delete when
          it can act as at least one Group management actor: the driver,
          originator, or ManagerWorker manager participant. Human-to-actor authority is
          checked only against these target actors rather than by enumerating
          all Bots created by the Human.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: The group kind or state cannot be deleted.
        x-error-codes:
          - conflict
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

CreateParticipant:
  type: object
  additionalProperties: false
  required:
    - actor_id
    - role
  properties:
    actor_id:
      type: string
    role:
      type: string
      enum:
        - driver
        - consultant
        - manager
        - worker
        - observer

AddGroupParticipantRequest:
  type: object
  additionalProperties: false
  required:
    - actor_id
  properties:
    actor_id:
      type: string

CreateDeliveryPolicy:
  type: object
  additionalProperties: false
  required:
    - bot_final_delivery
  properties:
    bot_final_delivery:
      type: string
      enum:
        - send_to_driver
        - inject_observers
      default: send_to_driver

CreateChatConfiguration:
  type: object
  additionalProperties: false
  required:
    - strategy
  properties:
    strategy:
      const: chat
    delivery_policy:
      $ref: "#/CreateDeliveryPolicy"
      default:
        bot_final_delivery: send_to_driver

CreateManagerWorkerConfiguration:
  type: object
  additionalProperties: false
  required:
    - strategy
  properties:
    strategy:
      const: manager_worker

CreateStateMachineDefinitionContent:
  type: object
  additionalProperties: false
  required:
    - content_yaml
  properties:
    content_yaml:
      type: string
      minLength: 1

CreateStateMachineConfiguration:
  type: object
  additionalProperties: false
  required:
    - strategy
    - definition
    - participant_bindings
  properties:
    strategy:
      const: state_machine
    definition:
      $ref: "#/CreateStateMachineDefinitionContent"
    participant_bindings:
      type: array
      items:
        $ref: ../domain-models.yaml#/StateMachineParticipantBinding

CreateCollaborationConfiguration:
  oneOf:
    - $ref: "#/CreateChatConfiguration"
    - $ref: "#/CreateManagerWorkerConfiguration"
    - $ref: "#/CreateStateMachineConfiguration"
  discriminator:
    propertyName: strategy

CreateCollaborationGroup:
  type: object
  additionalProperties: false
  required:
    - group_kind
    - driver_bot_uuid
    - participants
    - collaboration
  properties:
    group_kind:
      const: normal
    name:
      type: string
    context:
      type: string
    driver_bot_uuid:
      type: string
    participants:
      type: array
      items:
        $ref: "#/CreateParticipant"
    collaboration:
      $ref: "#/CreateCollaborationConfiguration"

CreateDirectMessageGroup:
  type: object
  additionalProperties: false
  required:
    - group_kind
    - target_actor_id
  properties:
    group_kind:
      const: dm
    target_actor_id:
      type: string
      description: First-phase target must resolve to a Bot Actor.
    name:
      type: string
    context:
      type: string

UpdateGroup:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
    visibility:
      type: string
      enum:
        - private
        - public
    delivery_policy:
      $ref: ../domain-models.yaml#/DeliveryPolicy

UpdateGroupParticipantRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    mode:
      $ref: ../domain-models.yaml#/ParticipantMode

AddGroupParticipantPath:
  post:
    operationId: add_group_participant
    tags: ["Collaboration / Groups"]
    summary: Add a Human or Bot actor as a Group participant.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - $ref: ../shared.yaml#/GroupIdPath
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/AddGroupParticipantRequest"
    responses:
      "200":
        description: Added participant.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/ParticipantEnvelope
      "400":
        description: Invalid participant definition.
        x-error-codes:
          - invalid_request
          - invalid_participant
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: >-
          Principal cannot manage the group. A Human Principal may manage when
          it can act as at least one Group management actor: the driver,
          originator, or ManagerWorker manager participant. Human-to-actor authority is
          checked only against these target actors: direct human_{user.id}, a
          Bot whose created_by equals the Human user id, or a creator relation
          edge from human_{user.id} to that Bot. The server does not enumerate
          every Bot created by the Human for this authorization decision.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Group or referenced actor is missing or hidden.
        x-error-codes:
          - group_not_found
          - bot_not_found
          - actor_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: Participant conflicts with current group state.
        x-error-codes:
          - conflict
          - participant_already_exists
          - non_public_participant
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

GroupParticipantPath:
  delete:
    operationId: remove_group_participant
    tags: ["Collaboration / Groups"]
    summary: Remove a participant or let an actor leave the group.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - $ref: ../shared.yaml#/GroupIdPath
      - $ref: ../shared.yaml#/ActorIdPath
    responses:
      "200":
        description: Idempotent remove result.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/DeleteResultEnvelope
      "400":
        description: Invalid identifier encoding.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: Principal cannot remove the participant.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Group is missing or hidden; a missing participant removes idempotently.
        x-error-codes:
          - group_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: A required role cannot be removed before it is transferred.
        x-error-codes:
          - conflict
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse
