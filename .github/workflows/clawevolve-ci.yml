name: Clawevolve CI

on:
  pull_request:
    paths:
      - "src/evolverun/clawevolve/**"
      - ".github/workflows/clawevolve-ci.yml"
  push:
    branches:
      - dev
    paths:
      - "src/evolverun/clawevolve/**"
      - ".github/workflows/clawevolve-ci.yml"

jobs:
  clawevolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/evolverun/clawevolve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/evolverun/clawevolve/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
