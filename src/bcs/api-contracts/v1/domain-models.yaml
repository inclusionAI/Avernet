ActorKind:
  type: string
  enum:
    - human
    - bot

Actor:
  type: object
  additionalProperties: false
  required:
    - actor_id
    - actor_kind
  properties:
    actor_id:
      type: string
    actor_kind:
      $ref: "#/ActorKind"
    name:
      type: string

Participant:
  type: object
  additionalProperties: false
  required:
    - actor_id
    - actor_kind
    - role
    - mode
  properties:
    actor_id:
      type: string
    actor_kind:
      $ref: "#/ActorKind"
    name:
      type: string
    role:
      type: string
      enum:
        - driver
        - consultant
        - manager
        - worker
        - observer
    mode:
      type: string
      enum:
        - auto
        - muted
        - present
        - absent

DeliveryPolicy:
  type: object
  additionalProperties: false
  required:
    - bot_final_delivery
  properties:
    bot_final_delivery:
      type: string
      enum:
        - send_to_driver
        - inject_observers

GroupStatus:
  type: string
  enum:
    - active
    - completed
    - error
    - closed
    - inactive

GroupVisibility:
  type: string
  enum:
    - private
    - public

Membership:
  type: string
  enum:
    - direct
    - session_only

NormalGroupSummary:
  type: object
  additionalProperties: false
  required:
    - group_id
    - version
    - kind
    - status
    - visibility
    - membership
    - originator_actor_id
    - participant_count
    - driver_bot_uuid
    - strategy
    - created_at
    - updated_at
  properties:
    group_id:
      type: string
    version:
      type: integer
    name:
      type: string
    kind:
      const: normal
    status:
      $ref: "#/GroupStatus"
    visibility:
      $ref: "#/GroupVisibility"
    membership:
      $ref: "#/Membership"
    originator_actor_id:
      type: string
    participant_count:
      type: integer
      minimum: 1
    driver_bot_uuid:
      type: string
    strategy:
      type: string
      enum:
        - chat
        - manager_worker
        - state_machine
    created_at:
      type: integer
      minimum: 0
    updated_at:
      type: integer
      minimum: 0

DirectMessageGroupSummary:
  type: object
  additionalProperties: false
  required:
    - group_id
    - version
    - kind
    - status
    - visibility
    - membership
    - originator_actor_id
    - participant_count
    - created_at
    - updated_at
  properties:
    group_id:
      type: string
    version:
      type: integer
    name:
      type: string
    kind:
      const: dm
    status:
      $ref: "#/GroupStatus"
    visibility:
      $ref: "#/GroupVisibility"
    membership:
      $ref: "#/Membership"
    originator_actor_id:
      type: string
    participant_count:
      const: 2
    peer_actor:
      $ref: "#/Actor"
    created_at:
      type: integer
      minimum: 0
    updated_at:
      type: integer
      minimum: 0

GroupSummary:
  oneOf:
    - $ref: "#/NormalGroupSummary"
    - $ref: "#/DirectMessageGroupSummary"
  discriminator:
    propertyName: kind
    mapping:
      normal: "#/NormalGroupSummary"
      dm: "#/DirectMessageGroupSummary"

ChatConfiguration:
  type: object
  additionalProperties: false
  required:
    - strategy
    - delivery_policy
  properties:
    strategy:
      const: chat
    delivery_policy:
      $ref: "#/DeliveryPolicy"

ManagerWorkerConfiguration:
  type: object
  additionalProperties: false
  required:
    - strategy
  properties:
    strategy:
      const: manager_worker

StateMachineDefinitionReference:
  type: object
  additionalProperties: false
  required:
    - definition_id
    - version
  properties:
    definition_id:
      type: string
    version:
      type: integer
      minimum: 1

StateMachineParticipantBinding:
  type: object
  additionalProperties: false
  required:
    - binding
    - actor_ids
  properties:
    binding:
      type: string
    actor_ids:
      type: array
      minItems: 1
      items:
        type: string

StateMachineConfiguration:
  type: object
  additionalProperties: false
  required:
    - strategy
    - definition
    - participant_bindings
  properties:
    strategy:
      const: state_machine
    definition:
      $ref: "#/StateMachineDefinitionReference"
    participant_bindings:
      type: array
      items:
        $ref: "#/StateMachineParticipantBinding"

CollaborationConfiguration:
  oneOf:
    - $ref: "#/ChatConfiguration"
    - $ref: "#/ManagerWorkerConfiguration"
    - $ref: "#/StateMachineConfiguration"
  discriminator:
    propertyName: strategy
    mapping:
      chat: "#/ChatConfiguration"
      manager_worker: "#/ManagerWorkerConfiguration"
      state_machine: "#/StateMachineConfiguration"

CollaborationGroupDetail:
  type: object
  additionalProperties: false
  required:
    - group_id
    - version
    - kind
    - status
    - visibility
    - originator_actor_id
    - participants
    - driver_bot_uuid
    - collaboration
    - created_at
    - updated_at
  properties:
    group_id:
      type: string
    version:
      type: integer
    name:
      type: string
    kind:
      const: normal
    status:
      $ref: "#/GroupStatus"
    visibility:
      $ref: "#/GroupVisibility"
    context:
      type: string
    originator_actor_id:
      type: string
    participants:
      type: array
      minItems: 1
      items:
        $ref: "#/Participant"
    driver_bot_uuid:
      type: string
    collaboration:
      $ref: "#/CollaborationConfiguration"
    created_at:
      type: integer
      minimum: 0
    updated_at:
      type: integer
      minimum: 0

DirectMessageGroupDetail:
  type: object
  additionalProperties: false
  required:
    - group_id
    - version
    - kind
    - status
    - visibility
    - originator_actor_id
    - participants
    - created_at
    - updated_at
  properties:
    group_id:
      type: string
    version:
      type: integer
    name:
      type: string
    kind:
      const: dm
    status:
      $ref: "#/GroupStatus"
    visibility:
      $ref: "#/GroupVisibility"
    context:
      type: string
    originator_actor_id:
      type: string
    participants:
      type: array
      minItems: 2
      maxItems: 2
      items:
        $ref: "#/Participant"
    created_at:
      type: integer
      minimum: 0
    updated_at:
      type: integer
      minimum: 0

GroupDetail:
  oneOf:
    - $ref: "#/CollaborationGroupDetail"
    - $ref: "#/DirectMessageGroupDetail"
  discriminator:
    propertyName: kind
    mapping:
      normal: "#/CollaborationGroupDetail"
      dm: "#/DirectMessageGroupDetail"

GroupPage:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - offset
    - limit
  properties:
    items:
      type: array
      items:
        $ref: "#/GroupSummary"
    total:
      type: integer
      minimum: 0
    offset:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1

GroupPageEnvelope:
  type: object
  additionalProperties: false
  required:
    - code
    - message
    - data
    - request_id
  properties:
    code:
      const: 20000
    message:
      type: string
    data:
      $ref: "#/GroupPage"
    request_id:
      type: string

GroupDetailEnvelope:
  type: object
  additionalProperties: false
  required:
    - code
    - message
    - data
    - request_id
  properties:
    code:
      const: 20000
    message:
      type: string
    data:
      $ref: "#/GroupDetail"
    request_id:
      type: string

CreatedGroupDetailEnvelope:
  type: object
  additionalProperties: false
  required:
    - code
    - message
    - data
    - request_id
  properties:
    code:
      const: 20100
    message:
      type: string
    data:
      $ref: "#/GroupDetail"
    request_id:
      type: string

DeleteResult:
  type: object
  additionalProperties: false
  required:
    - group_id
    - deleted
  properties:
    group_id:
      type: string
    deleted:
      type: boolean

DeleteResultEnvelope:
  type: object
  additionalProperties: false
  required:
    - code
    - message
    - data
    - request_id
  properties:
    code:
      const: 20000
    message:
      type: string
    data:
      $ref: "#/DeleteResult"
    request_id:
      type: string
