<path d="M1000 440 H1120" fill="none" stroke="#667085" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<text x="1008" y="423" class="label">群 ID 匹配</text>
<path d="M1330 528 V690" fill="none" stroke="#667085" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<text x="1190" y="609" class="label">1 : N* · 原绑定 → 卡片</text>
<path d="M1000 780 H1120" fill="none" stroke="#667085" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<text x="1003" y="761" class="label">Run 条件匹配*</text>
<path d="M450 655 H555 V824 H590" fill="none" stroke="#667085" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<text x="220" y="861" class="label">触发 Run 可定位 0..1 条索引*</text>
<rect x="40" y="920" width="1500" height="163" rx="8" fill="#fafafa" stroke="#d9d9d9"/>
<text x="60" y="950" font-size="17" font-weight="bold">关联键与边界</text>
<text x="60" y="981" font-size="16">① 钉群：channel_type 为钉群时，channel_instance_id = open_conversation_id；群 ID 非唯一，不能据此确定具体旧会话行。</text>
<text x="60" y="1009" font-size="16">② 旧绑定 → 卡片：仅在语义一致时按 (session_key, bot_id, open_conversation_id) 匹配；发卡 Bot 不等于执行 Bot。</text>
<text x="60" y="1037" font-size="16">③ Run：委派按 (父会话, Run 来源, Run ID) 定位；卡片也须先确认会话及来源映射，不能仅凭 runId 关联。</text>
<text x="60" y="1065" font-size="16">④ 一个执行会话最多绑定一个需求，冲突拒绝覆盖。DIMA 为外部系统；现有 Bot / Session / Run 权威表尚未确认。</text>
</svg>