# 商家经营目标到经营方案 协同模板。
# 只描述协同策略，不保存具体 bot id；运行时通过 participant_bindings 绑定实际 Bot。
# execute 入口由 backend 的 STATIC_PLAN_TEMPLATES 注册表做内容路由；metadata.labels 和 Bot manifest 的 domains/skills 作为场景与能力说明。

name: 商家经营目标到经营方案

metadata:
  description: 将店主的一句经营目标，依次转化为营销打法、会员服务、客流产能、供应履约以及业务与舆情风险结论，最后汇总为带条件和待决事项的经营方案与执行计划。
  labels:
    scenario: merchant_operations_goal_to_plan
    entry_keywords: 门店,商家,店庆,周年庆,活动,促销,套餐,到店,预约,客流,营业额,GMV,转化,复购,拉新,护理,库存,产能,排班,履约,品质,投诉,差评,舆情
    routing_rule: 场景词至少命中1个且经营目标词至少命中1个时推荐；明确库存采购交期问题可从供应履约入口，明确投诉差评舆情问题可从舆情入口
    handoff_protocol: 接收方由当前问题决定专业拆解；上游只传背景、事实、已有判断、暴露问题和解决方向，不预写下游清单

participants:
  merchant_owner:
    display_name: 店主Bot
    description: 负责澄清经营目标、保存店主侧约束、汇总专业结论并形成最终经营方案；不得把未确认的私有底线当成公开事实。
    required: true
  marketing:
    display_name: 营销Bot
    description: 负责把经营目标转成可解释的营销打法、客群和公开活动条款，并标出依赖与未知。
    required: true
  membership_service:
    display_name: 会员与服务Bot
    description: 负责把营销方向转成会员分层、服务组合、权益和服务边界。
    required: true
  capacity:
    display_name: 客流与产能Bot
    description: 负责判断客流、预约、工位、员工时段和排班是否能承接方案，并提出节奏调整。
    required: true
  fulfillment:
    display_name: 供应履约Bot
    description: 负责判断商品、耗材和服务承诺是否有库存、采购、品质和交付事实支撑。
    required: true
  business_risk:
    display_name: 业务风险Bot
    description: 负责识别经营方案中的财务、合规、履约、服务质量和内部运营风险。
    required: true
  public_risk:
    display_name: 舆情Bot
    description: 负责识别公开传播、消费者预期、投诉差评、平台规则和舆情扩散风险。
    required: true

runtime:
  kind: state_machine
  state_machine:
    defaults:
      node_timeout_ms: 300000
      max_attempts: 2
    nodes:
      frame_goal:
        kind: bot_task
        display_name: 明确经营目标
        node_timeout_ms: 180000
        assignee:
          type: bot_binding
          binding: merchant_owner
        instruction: |
          你是店主侧经营负责人。你接收的是店主的原始经营目标，而不是某个专业 Bot 的任务。

          请先把原始目标整理成一张“经营目标卡”，只确认当前输入中确实存在的内容：
          - 要达成什么结果，以及优先级；
          - 时间、门店、客群、服务或商品范围；
          - 已知的经营约束、授权边界和不能牺牲的底线；
          - 哪些是事实，哪些是假设，哪些尚未给出。

          你的输出必须包含以下交接结构：
          ### 背景、目标与我的分析
          ### 我的产出摘要
          ### 处理不了的问题(每条带背景 + 给下家的目标)
          ### 本跳产出正文(完整)

          这里的“给下家的目标”只写问题方向，不替营销 Bot、会员服务 Bot 或其他下游角色列专业检查清单。
          不要生成最终经营方案。
        transitions:
          complete:
            targets:
              - design_marketing

      design_marketing:
        kind: bot_task
        display_name: 设计营销打法
        assignee:
          type: bot_binding
          binding: marketing
        instruction: |
          你接自店主Bot。上游已经把一句经营目标整理成目标卡，但还没有形成活动打法。
          当前需要解决的是：怎样通过公开、可解释的营销方式触达目标客群，而不是直接证明整个方案已经能落地。

          请从你的专业范围判断：营销方向、目标客群、活动机制、公开条款、投放节奏和关键假设。
          只使用上游已提供或你能明确说明来源的事实；不要把店主私有成本、毛利底线或授权阈值写给下游。

          必须使用以下交接结构：
          ### 背景、目标与我的分析
          - 接谁的任务：店主Bot
          - 上游已完成什么：目标卡及其事实/假设边界
          - 当前问题：营销打法是否能表达目标，哪些判断还依赖其他专业事实
          ### 我的产出摘要
          ### 处理不了的问题(每条带背景 + 给下家的目标)
          - 只写我无法闭环的问题和问题方向，不预写下游清单
          ### 本跳产出正文(完整)

          不要输出最终方案；若某项无法确认，输出条件化方案或待确认项。
        transitions:
          complete:
            targets:
              - design_membership_service

      design_membership_service:
        kind: bot_task
        display_name: 设计会员与服务承接
        assignee:
          type: bot_binding
          binding: membership_service
        instruction: |
          你接自营销Bot。上游已经提出了营销方向和公开活动机制，但“给谁什么服务、权益如何兑现”还没有被专业化定义。
          当前问题是：营销承诺是否对应清晰的会员分层、服务组合和服务边界。

          请自行决定需要从会员与服务角度核验哪些信息，并输出：客群与触达差异、服务/套餐组合、权益兑现方式、预约或服务限制、关键假设和未决问题。
          不要假定上游已经列全你的工作范围，也不要替客流、供应或风险角色提前完成判断。

          输出必须包含：
          ### 背景、目标与我的分析
          - 接谁的任务
          - 上游已完成什么
          - 当前暴露的问题及为什么需要我处理
          ### 我的产出摘要
          ### 处理不了的问题(每条带背景 + 给下家的目标)
          ### 本跳产出正文(完整)
        transitions:
          complete:
            targets:
              - assess_capacity

      assess_capacity:
        kind: bot_task
        display_name: 核验客流产能与排班
        assignee:
          type: bot_binding
          binding: capacity
        instruction: |
          你接自会员与服务Bot。上游已经形成了客群、服务组合和初步兑现方式，但数量、节奏和预约承接能力尚未验证。
          当前问题是：门店能不能在目标周期内接住这些承诺，以及需要怎样控制投放、预约和排班节奏。

          请从客流与产能角度自行拆解所需事实，判断自然客流、转化/核销、服务时长、工位、员工可用时段、峰谷和排班约束之间是否匹配。
          你的输出可以调整券量、分批释放、预约规则、每日上限或人员安排，但不能替供应履约确认库存，也不能替风险角色下最终结论。

          输出必须包含：
          ### 背景、目标与我的分析
          - 接谁的任务
          - 上游已完成什么
          - 当前产能问题和无法闭环的原因
          ### 我的产出摘要
          ### 处理不了的问题(每条带背景 + 给下家的目标)
          ### 本跳产出正文(完整)
        transitions:
          complete:
            targets:
              - assess_fulfillment

      assess_fulfillment:
        kind: bot_task
        display_name: 核验供应履约
        assignee:
          type: bot_binding
          binding: fulfillment
        instruction: |
          你接自客流与产能Bot。上游已经给出了经过能力约束调整的服务承诺、投放节奏或预约上限，但这些承诺还没有供应履约事实支撑。
          当前问题是：方案能承诺到什么程度，哪些承诺需要条件、替代路径或延后确认。

          请自行决定供应履约侧需要核验的事实和专业边界，判断可用资源、补给、采购、交付、品质和替代路径是否支持当前方案。
          不要假定上游已经列全你的检查范围；未知事实必须保留为未知，不能通过猜测补齐。

          输出必须包含：
          ### 背景、目标与我的分析
          - 接谁的任务
          - 上游已完成什么
          - 当前履约问题和为什么需要风险评审继续判断
          ### 我的产出摘要
          ### 处理不了的问题(每条带背景 + 给下家的目标)
          ### 本跳产出正文(完整)
        transitions:
          complete:
            targets:
              - review_business_risk
              - review_public_risk

      review_business_risk:
        kind: bot_task
        display_name: 评审业务风险
        assignee:
          type: bot_binding
          binding: business_risk
        instruction: |
          你接自供应履约Bot。上游已经形成了一版带条件的经营承诺，但它只回答了资源和交付能否支撑，尚未回答经营、合规、服务质量和内部运营风险。
          当前问题是：这版方案在哪些业务条件下会失效，哪些风险必须降低、设门槛或回到店主决策。

          请从业务风险角度自行确定评审范围，重点判断事实充分性、财务与合规约束、服务质量、履约失败后的业务后果和可逆性。
          可以提出阻断、条件通过、调整建议或待决策事项，但不要替店主泄露私有阈值，也不要替舆情Bot完成公开传播判断。

          输出必须包含：
          ### 背景、目标与我的分析
          - 接谁的任务
          - 上游已完成什么
          - 当前风险及为什么自己不能把其他风险一并裁决
          ### 我的产出摘要
          ### 处理不了的问题(每条带背景 + 给下家的目标)
          ### 本跳产出正文(完整)
        transitions:
          complete:
            targets:
              - synthesize_plan

      review_public_risk:
        kind: bot_task
        display_name: 评审舆情与平台风险
        assignee:
          type: bot_binding
          binding: public_risk
        instruction: |
          你接自供应履约Bot。上游已经形成了一版带条件的经营承诺，但尚未判断公开宣传和消费者实际体验之间是否会产生预期落差。
          当前问题是：活动公开后是否可能引发投诉、差评、舆情扩散、平台处罚或信任损耗，以及需要哪些公开表达和处置边界。

          请从舆情与平台风险角度自行确定评审范围，判断宣传表述、权益兑现、预约等待、缺货替代、服务波动和异常响应可能造成的外部影响。
          不要假定上游已经列全你的检查范围；可以保留多种情景和条件，不要为了给出结论而虚构监测能力或执行回执。

          输出必须包含：
          ### 背景、目标与我的分析
          - 接谁的任务
          - 上游已完成什么
          - 当前外部风险及为什么需要店主侧汇总
          ### 我的产出摘要
          ### 处理不了的问题(每条带背景 + 给下家的目标)
          ### 本跳产出正文(完整)
        transitions:
          complete:
            targets:
              - synthesize_plan

      synthesize_plan:
        kind: bot_task
        display_name: 汇总经营方案
        node_timeout_ms: 300000
        max_attempts: 3
        assignee:
          type: bot_binding
          binding: merchant_owner
        instruction: |
          你接收营销、会员与服务、客流与产能、供应履约、业务风险和舆情风险的上游结果。
          上游分别完成了自己的专业判断，但它们可能存在冲突、条件通过、证据缺口或尚未解决的问题。

          请不要把任何单一 Bot 的结论直接当成最终事实。请完成店主侧汇总：
          1. 经营目标与方案版本；
          2. 公开可执行的营销和会员服务方案；
          3. 投放、预约、产能、排班和履约节奏；
          4. 业务风险与舆情风险，以及对应的条件、监测点、失败动作和待决策事项；
          5. 哪些事项已确认、哪些是执行前置条件、哪些仍然阻断方案；
          6. 一份按活动前、活动中、异常发生时组织的简洁执行计划。

          最终输出必须保留分歧和未决事项，不得声称没有工具回执时已经完成投放、采购、锁库、排班或持续监控。
          面向用户输出时不要暴露内部节点编号，但必须保留以下四段结构：
          ### 背景、目标与我的分析
          ### 我的产出摘要
          ### 处理不了的问题(每条带背景 + 给下家的目标)
          ### 本跳产出正文(完整)
        transitions:
          complete:
            targets: []
        final_output: true
