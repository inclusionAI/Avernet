# ============================================================
# Avernet Engine + OpenClaw — supervisord configuration
# ============================================================
# Reference: ocb/dockers/desktop-openclaw/supervisord.conf
#
# Process model:
#   supervisord (PID 1)
#   ├── engine    (autostart=true)   Python engine adapter, port 20003
#   └── openclaw  (autostart=false)  OpenClaw gateway, port 18789
#
# Engine starts openclaw on demand via:
#   sudo supervisorctl start openclaw
# (see engine.json: engines.openclaw.process.start_cmd)
# ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ──────────────────────── Engine ────────────────────────
; The engine adapter is a Python FastAPI server (uvicorn).
; It manages openclaw's lifecycle via `sudo supervisorctl start openclaw`
; when a bot session is requested.
[program:engine]
command=/bin/bash -c "source /opt/.venv/bin/activate && /opt/engine/scripts/run.sh -e openclaw --port 20003"
user=admin
directory=/opt/engine
autostart=true
autorestart=true
priority=100
stdout_logfile=/home/admin/logs/engine_out.log
stderr_logfile=/home/admin/logs/engine_err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=HOME="/home/admin",
    USER="admin",
    PATH="%(ENV_PATH)s",
    VIRTUAL_ENV="/opt/.venv",
    PYTHONPATH="/opt/engine/src",
    PYTHONDONTWRITEBYTECODE="1",
    NODE_EXTRA_CA_CERTS="/etc/ssl/certs/ca-bundle.crt"

; ──────────────────────── OpenClaw ────────────────────────
; OpenClaw gateway is NOT auto-started.
; The engine starts it on-demand via `sudo supervisorctl start openclaw`.
; Once started, supervisord manages restart/cleanup.
[program:openclaw]
command=/usr/local/bin/openclaw gateway run --verbose --port 18789
user=admin
directory=/home/admin
autostart=false
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/home/admin/logs/openclaw_out.log
stderr_logfile=/home/admin/logs/openclaw_err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=HOME="/home/admin",
    USER="admin",
    PATH="%(ENV_PATH)s",
    OPENCLAW_CONFIG_PATH="/home/admin/.openclaw/openclaw.json",
    OPENCLAW_STATE_DIR="/home/admin/.openclaw"
