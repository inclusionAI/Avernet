id: run-archive
version: "1.0.0"
title: 工作流运行档案
description: |
  为指定工作流实例生成完整运行档案，聚合所有执行数据（含 console 日志、Langfuse trace）用于 BUG 分析。

workflows:
  - id: run-archive
    file: workflows/run-archive.yaml

facades:
  - command: archive
    defaultWorkflow: run-archive
    aliases: [run-archive, gen-archive]
    help:
      title: 运行档案生成
      summary: 为指定工作流实例生成完整运行档案
      examples:
        - "/archive 00d87945"
        - "/archive flowId=00d87945"
