id: workflow-dispatcher
version: "1"
title: 工作流调度
nodes:
  - id: data-prepare
    title: 数据预处理
    executor:
      type: cli-script
      command: python3
      args:
        - $HOME/.openclaw/workspace/skills/skills-local/data-preprocessing/scripts/data_prepare.py
        - --raw-message
        - "{{input.params.raw_message}}"
        - --metadata
        - "{{input.params.metadata}}"
      outputMode: json
      timeoutMs: 30000
    phase: P1
    dependsOn: []
    outputContract:
      required: true
      schema:
        type: object
        required:
          - terminate
          - allowed
          - query
          - source
          - source_detail
          - task_source
          - entity_info
          - dialogue_task_id
          - history
          - boundary_triggered
        properties:
          terminate:
            type: boolean
          allowed:
            type: boolean
          permission_reason:
            type: string
          query:
            type: string
          source:
            type: string
          source_detail:
            type: object
          task_source:
            type: object
          receive_time:
            type: string
          entity_info:
            type: object
          url_list:
            type: array
          dialogue_task_id:
            type: string
          history:
            type: array
          boundary_triggered:
            type: boolean
          boundary_type:
            type: string
    onResult:
      branches:
        - match:
            boundary_triggered: true
          branchId: boundary
        - match:
            boundary_triggered: false
          branchId: normal
  - id: boundary-reply
    title: 边界回复
    executor:
      type: embedded-agent
      skillName: boundary-reply-user
      outputMode: json
      prompt: |
        执行 boundary-reply-user SKILL，向用户回复边界提示。

        上游数据： - source: {{nodeOutput.data-prepare.source}} - source_detail: {{nodeOutput.data-prepare.source_detail}} - boundary_type: {{nodeOutput.data-prepare.boundary_type}} - permission_reason: {{nodeOutput.data-prepare.permission_reason}} - query: {{nodeOutput.data-prepare.query}} - task_source: {{nodeOutput.data-prepare.task_source}}

        根据 boundary_type 回复对应的边界提示消息，然后输出： {"replied": true, "boundary_type": "{{nodeOutput.data-prepare.boundary_type}}"}
        ⚠️ 输出要求：直接输出纯 JSON 对象。禁止使用 Markdown code fence 包裹。
      timeoutSeconds: 30
    phase: P1
    dependsOn:
      - data-prepare
    branchId: boundary
  - id: boundary-done
    title: 边界流程完成
    executor:
      type: done
    phase: P1
    dependsOn:
      - boundary-reply
  - id: context-enrichment
    title: 上下文整合
    executor:
      type: embedded-agent
      outputMode: json
      prompt: |
        你是上下文整合模块。基于上游提供的历史对话和当前查询，完成以下任务： 1. 视觉分析（如有图片） 2. COT推理判断对话延续性 3. 保存本轮查询 4. 最终实体提取

        ═══ 上游数据 ═══
        - query: {{nodeOutput.data-prepare.query}} - source: {{nodeOutput.data-prepare.source}} - entity_info: {{nodeOutput.data-prepare.entity_info}} - history: {{nodeOutput.data-prepare.history}} - url_list: {{nodeOutput.data-prepare.url_list}} - dialogue_task_id: {{nodeOutput.data-prepare.dialogue_task_id}}

        ═══ 步骤1: 视觉分析（仅当 url_list 非空时执行）═══
        如果 url_list 非空，使用 read 工具读取每张图片（禁止使用 image 工具）， 提取所有文字并总结为一段连贯描述，保存为 visual_analysis。
        本轮查询构建： - 有图片: 本轮查询 = query + "[图片内容: visual_analysis]" - 无图片: 本轮查询 = query

        ═══ 步骤2: COT推理判断对话延续性 ═══
        输入：上游 history 数组 + 当前查询 query
        如果 history 为空，直接设置 combined_text = "用户: " + 本轮查询，跳到步骤3。
        如果 history 非空，使用以下推理框架：
        【历史对话】 {history数组内容}
        【当前查询】 用户: {本轮查询} 主要实体: {entity_info中的实体}
        【推理任务】 判断： 1. 当前查询是否在回应历史对话中的内容？ 2. 实体是否一致？ 3. 是否是追问/追问链的延续？ 4. 哪些历史轮次与当前查询相关？
        【快捷判断规则】
        | 场景 | relevant_turns | 说明 | |------|----------------|------| | 同一问题链 | [1,2,3] | 追问、补充信息，话题连贯 | | 账户切换 | [] | 历史讨论A账户，当前查询B账户 | | 话题跳转 | [] | 历史话题与当前无关 | | 中间有闲聊 | [1,3] | 排除闲聊/情绪表达轮次 | | 补充描述型追问 | [最近轮次] | 当前查询无实体，仅描述问题症状 |
        【拼接 combined_text】
        - relevant_turns 非空：从 history 筛选相关轮次，格式 "用户: {query}\n助手: {response}"，最后追加当前查询 - relevant_turns 为空：combined_text = "用户: " + 本轮查询
        【去重与改写】对筛选后的历史进行整合： - 同一账户多次询问 → 保留账户信息，合并问题描述 - 补充信息型追问 → 将补充内容整合到主查询中 - 重复追问同一问题 → 合并为一条通顺描述

        ═══ 步骤3: 保存本轮查询 ═══
        COT推理完成后，调用脚本保存本轮查询：
        python3 $HOME/.openclaw/workspace/skills/skills-local/data-preprocessing/scripts/save_user_query.py
          --task-id "{{nodeOutput.data-prepare.dialogue_task_id}}"
          --user-query "<当前query>"
          --entity-info '<最终entity_info的JSON>'


        ═══ 步骤4: 最终实体提取 ═══
        从 combined_text 中识别所有实体：
        | 实体类型 | 识别规则 | |---------|---------| | USER_ID | 2088开头的16位数字 | | PHONE | 11位手机号 | | LOGON_ID | 邮箱格式 | | IDENTITY_CARD | 15位或18位身份证号 | | COMPANY_NAME | 包含"公司""企业""集团""店铺"的名称 | | TRADE_NO | 交易号 |
        如果当前查询无实体但 COT 关联了历史轮次，从历史轮次的 entity_info 中继承实体。

        ═══ 输出要求 ═══
        直接输出纯 JSON 对象。禁止使用 Markdown code fence 包裹，禁止添加自然语言解释或注释。
      timeoutSeconds: 60
    phase: P1
    dependsOn:
      - data-prepare
    branchId: normal
    outputContract:
      required: true
      schema:
        type: object
        required:
          - combined_text
          - entity_info
        properties:
          combined_text:
            type: string
          visual_analysis:
            type: string
          entity_info:
            type: object
  - id: intent-recognition
    title: 意图识别
    executor:
      type: embedded-agent
      skillName: intent-recognition
      outputMode: json
      prompt: |
        执行 intent-recognition SKILL 进行意图识别。

        上游数据： - combined_text: {{nodeOutput.context-enrichment.combined_text}} - source: {{nodeOutput.data-prepare.source}} - source_detail.type: {{nodeOutput.data-prepare.source_detail.type}}
        边界检测：intent == "其它" → boundary_triggered=true，boundary_type="other_intent"，调用 boundary-reply-user skill
        ⚠️ 输出要求：直接输出纯 JSON 对象。禁止使用 Markdown code fence 包裹，禁止添加自然语言解释或注释。
    phase: P1
    dependsOn:
      - context-enrichment
    outputContract:
      required: true
      schema:
        type: object
        required:
          - intent
          - confidence
          - boundary_triggered
        properties:
          thought:
            type: string
          intent:
            type: string
          confidence:
            type: number
          boundary_triggered:
            type: boolean
          boundary_type:
            type: string
    onResult:
      branches:
        - match:
            boundary_triggered: true
          branchId: intent-boundary
        - match:
            boundary_triggered: false
          branchId: intent-normal
  - id: intent-boundary-reply
    title: 意图边界回复
    executor:
      type: embedded-agent
      skillName: boundary-reply-user
      outputMode: json
      prompt: |
        执行 boundary-reply-user SKILL，向用户回复边界提示。

        上游数据： - source: {{nodeOutput.data-prepare.source}} - source_detail: {{nodeOutput.data-prepare.source_detail}} - boundary_type: {{nodeOutput.intent-recognition.boundary_type}} - query: {{nodeOutput.data-prepare.query}} - task_source: {{nodeOutput.data-prepare.task_source}}

        根据 boundary_type 回复对应的边界提示消息，然后输出： {"replied": true, "boundary_type": "{{nodeOutput.intent-recognition.boundary_type}}"}
        ⚠️ 输出要求：直接输出纯 JSON 对象。禁止使用 Markdown code fence 包裹。
      timeoutSeconds: 30
    phase: P2
    dependsOn:
      - intent-recognition
    branchId: intent-boundary
  - id: intent-boundary-done
    title: 意图边界流程完成
    executor:
      type: done
    phase: P2
    dependsOn:
      - intent-boundary-reply
  - id: task-generation
    title: 任务生成
    executor:
      type: cli-script
      command: python3
      args:
        - $HOME/.openclaw/workspace/skills/skills-local/task-generator/scripts/task_generation_orchestrator.py
        - --source
        - "{{nodeOutput.data-prepare.source}}"
        - --source-detail
        - "{{nodeOutput.data-prepare.source_detail}}"
        - --task-source
        - "{{nodeOutput.data-prepare.task_source}}"
        - --entity-info
        - "{{nodeOutput.context-enrichment.entity_info}}"
        - --intent
        - "{{nodeOutput.intent-recognition.intent}}"
        - --combined-text
        - "{{nodeOutput.context-enrichment.combined_text}}"
        - --url-list
        - "{{nodeOutput.data-prepare.url_list}}"
        - --receive-time
        - "{{nodeOutput.data-prepare.receive_time}}"
        - --sender-id
        - "{{nodeOutput.data-prepare.source_detail.sender_id}}"
        - --sender-name
        - "{{nodeOutput.data-prepare.source_detail.sender_name}}"
        - --group-id
        - "{{nodeOutput.data-prepare.source_detail.group_id}}"
        - --group-name
        - "{{nodeOutput.data-prepare.source_detail.group_name}}"
        - --user-query
        - "{{nodeOutput.data-prepare.query}}"
        - --boundary-triggered
        - "false"
        - --boundary-type
        - ""
      outputMode: json
      timeoutMs: 180000
    phase: P2
    dependsOn:
      - intent-recognition
    branchId: intent-normal
    outputContract:
      required: true
      schema:
        type: object
        required:
          - task_list
          - sub_task_id_list
        properties:
          task_id:
            type: string
          task_list:
            type: array
          sub_task_id_list:
            type: array
          bot_task_file:
            type: string
          duty_task_file:
            type: string
          task_round:
            type: number
          domain_list:
            type: array
          is_boundary:
            type: boolean
  - id: task-dispatch
    title: 任务分发
    executor:
      type: embedded-agent
      skillName: task-dispatcher
      outputMode: json
      prompt: |
        执行 task-dispatcher SKILL，完成 Bot 任务分发、Duty 任务分发和子任务状态更新。

        上游数据： - bot_task_file: {{nodeOutput.task-generation.bot_task_file}} - duty_task_file: {{nodeOutput.task-generation.duty_task_file}} - task_id: {{nodeOutput.task-generation.task_id}} - task_round: {{nodeOutput.task-generation.task_round}} - sub_task_id_list: {{nodeOutput.task-generation.sub_task_id_list}}
        执行要求： - 严格按照 task-dispatcher SKILL 文档执行 4.1 Bot分发 + 4.2 Duty分发 + 4.3 状态更新 - Bot分发：Fire and Forget 后台运行，python3 $HOME/.openclaw/workspace/skills/skills-local/task-dispatcher/scripts/bcs_task_dispatcher.py - Duty分发：从 stderr 解析 __HITL_PAYLOAD__ 调用 hitl_request，python3 $HOME/.openclaw/workspace/skills/skills-local/task-dispatcher/scripts/duty_task_notifier.py - 状态更新：python3 $HOME/.openclaw/workspace/skills/skills-local/task-dispatcher/scripts/update_subtask_status.py - ⚠️ Fire and Forget：BCS 调用启动后即视为完成，禁止等待确认
        ⚠️ 输出要求：直接输出纯 JSON 对象。禁止使用 Markdown code fence 包裹，禁止添加自然语言解释或注释。
    phase: P3
    dependsOn:
      - task-generation
    retry:
      maxAttempts: 2
      backoffMs: 3000
      on:
        - executor-failed
  - id: done
    title: 流程完成
    executor:
      type: done
    phase: P3
    dependsOn:
      - task-dispatch
input:
  mode: mixed
  requiredParams:
    - raw_message
    - metadata
  sources:
    params: true
    message: true
identity:
  key: "{{input.digest}}"
  label: 工作流调度
  duplicatePolicy: allow
outputs:
  taskResult:
    from: "{{nodeOutput.task-dispatch.result}}"
    public: true
    description: 任务分发结果
defaults:
  progress:
    enabled: true
    sink: chat
messages:
  onCreated: 工作流已创建，开始处理请求
  onFinished: 工作流已完成处理
facade:
  command: workflow-dispatcher
