openapi: 3.1.0
info:
  title: BCN Internal API
  version: 1.0.0
  description: Versioned internal contract for trusted BCN collaboration services.
paths:
  /api/v1/collaboration/bots/me:
    $ref: ./internal/bot-self.yaml#/BotSelfPath
  /api/v1/collaboration/bots/{bot_id}/candidates/search:
    $ref: ./openapi/bots.yaml#/BotCandidateSearchPath
  /api/v1/collaboration/templates:
    $ref: ./openapi/collaboration-templates.yaml#/CollaborationTemplatesPath
  /api/v1/collaboration/templates/{template_id}:
    $ref: ./openapi/collaboration-templates.yaml#/CollaborationTemplatePath
  /api/v1/collaboration/sessions/{session_id}/files:
    $ref: ./openapi/session-files.yaml#/SessionFilesPath
  /api/v1/collaboration/sessions/{session_id}/files/{file_id}:
    $ref: ./openapi/session-files.yaml#/SessionFilePath
  /api/v1/collaboration/sessions/{session_id}/files/{file_id}/content:
    $ref: ./openapi/session-files.yaml#/SessionFileContentPath
  /api/v1/collaboration/sessions/{session_id}/files/{file_id}/complete:
    $ref: ./openapi/session-files.yaml#/CompleteSessionFilePath
  /api/v1/collaboration/sessions/{session_id}/files/{file_id}/share:
    $ref: ./openapi/session-files.yaml#/ShareSessionFilePath
  /api/v1/collaboration/sessions/shared-file/content:
    $ref: ./openapi/session-files.yaml#/SharedSessionFileContentPath
  /api/v1/collaboration/state-machine-runs/{run_id}:
    $ref: ./openapi/state-machine-runs.yaml#/StateMachineRunPath
  /api/v1/collaboration/state-machine-runs/{run_id}/graph:
    $ref: ./openapi/state-machine-runs.yaml#/StateMachineRunGraphPath
  /api/v1/collaboration/state-machine-runs/{run_id}/reruns:
    $ref: ./openapi/state-machine-runs.yaml#/RerunStateMachineRunPath
  /api/v1/collaboration/state-machine-runs/{run_id}/nodes/{node_id}:
    $ref: ./openapi/state-machine-runs.yaml#/StateMachineNodeRunPath
  /api/v1/collaboration/state-machine-runs/{run_id}/nodes/{node_id}/respond:
    $ref: ./openapi/state-machine-runs.yaml#/RespondHumanNodePath
  /api/v1/collaboration/state-machine-runs/{run_id}/pending-human-nodes:
    $ref: ./openapi/state-machine-runs.yaml#/PendingHumanNodesPath
  /api/v1/collaboration/state-machine-runs/{run_id}/cancel:
    $ref: ./openapi/state-machine-runs.yaml#/CancelStateMachineRunPath
  /api/v1/collaboration/manifest:
    $ref: ./openapi/manifest.yaml#/ManifestPath
  /api/v1/collaboration/assets/{bundle_name}/{file_name}:
    $ref: ./openapi/manifest.yaml#/ManifestAssetPath
  /api/v1/collaboration/definitions/validate:
    $ref: ./openapi/collaboration-definitions.yaml#/CollaborationDefinitionValidatePath
  /api/v1/bots/{bot_id}/manager-sources/teams/{team_id}:
    $ref: ./internal/team-manager-sources.yaml#/TeamManagerSourcesPath
  /api/v1/bots/{bot_id}/manager-sources/teams/{team_id}/members:
    $ref: ./internal/team-manager-sources.yaml#/TeamManagerMemberRepairPath
components:
  securitySchemes:
    AgentIdentityBearer:
      type: http
      scheme: bearer
      description: Agent identity token verified by the injected BCS identity verifier, independent of Bot registration.
    TeamManagerServiceCredential:
      type: http
      scheme: bearer
      description: >-
        Trusted platform team-manager service credential (dedicated
        signed purpose, plan Task 13 / spec §6.1): verified by the
        injected credential verifier and bound to a service id, env, and
        the allowed Bot/team/operation scopes. NOT a Human Principal and
        NOT anonymous; the raw credential never reaches audit rows,
        business logs, or persisted commands.
