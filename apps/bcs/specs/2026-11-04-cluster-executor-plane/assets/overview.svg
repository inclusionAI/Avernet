<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2457a6"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a6b0a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">Two tiers: gateways hold connections, executors hold leases</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">Tokens go agent → gateway → PA and never touch an executor. Control traffic goes gateway ↔ owner executor directly, no load balancer.</text>

  <!-- top row: PA, LB, agents -->
  <rect x="40" y="76" width="170" height="50" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="125" y="98" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2420">Personal agent</text>
  <text x="125" y="115" font-size="11" text-anchor="middle" fill="#5c6a62">A2A SSE / WS / gRPC stream</text>
  <rect x="270" y="76" width="170" height="50" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="355" y="98" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2420">Load balancer</text>
  <text x="355" y="115" font-size="11" text-anchor="middle" fill="#5c6a62">any ready gateway</text>
  <line x1="210" y1="101" x2="266" y2="101" stroke="#5c6a62" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="540" y="76" width="180" height="50" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="630" y="98" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2420">Supply agent (A2A)</text>
  <text x="630" y="115" font-size="11" text-anchor="middle" fill="#5c6a62">gateway dials out to it</text>
  <rect x="750" y="76" width="180" height="50" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="840" y="98" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2420">Bot X (dial-in)</text>
  <text x="840" y="115" font-size="11" text-anchor="middle" fill="#5c6a62">WebSocket via the LB</text>

  <!-- gateway tier -->
  <rect x="24" y="160" width="912" height="150" rx="12" fill="#eef2fa" stroke="#2457a6" stroke-width="1.6"/>
  <text x="44" y="182" font-size="13.5" font-weight="bold" fill="#2457a6">Gateway tier</text>
  <text x="870" y="182" font-size="11.5" text-anchor="end" fill="#2457a6">every long-lived connection · no durable state</text>
  <rect x="44" y="194" width="420" height="102" rx="8" fill="#ffffff" stroke="#2457a6"/>
  <text x="254" y="214" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1c2420">Gateway GW1</text>
  <text x="60" y="236" font-size="11" fill="#1c2420">• PA's stream for session S (entry gateway, subscriber)</text>
  <text x="60" y="254" font-size="11" fill="#1c2420">• runs dispatch D: stream to the supply agent</text>
  <text x="60" y="272" font-size="11" fill="#1c2420">• deltas go straight into the PA's stream + step buffer</text>
  <text x="60" y="288" font-size="10.5" fill="#5c6a62">control events and results → owner, retried until acked</text>
  <rect x="496" y="194" width="420" height="102" rx="8" fill="#ffffff" stroke="#2457a6"/>
  <text x="706" y="214" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1c2420">Gateway GW2</text>
  <text x="512" y="236" font-size="11" fill="#1c2420">• bot X's socket (transport only)</text>
  <text x="512" y="254" font-size="11" fill="#1c2420">• forwards X's events to each session's current owner</text>
  <text x="512" y="272" font-size="11" fill="#1c2420">• other PAs' streams, other dispatches</text>
  <text x="512" y="288" font-size="10.5" fill="#5c6a62">any gateway can subscribe to any session</text>

  <line x1="355" y1="126" x2="300" y2="190" stroke="#5c6a62" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="560" y1="130" x2="420" y2="190" stroke="#9a6b0a" stroke-width="1.8" marker-start="url(#ao)" marker-end="url(#ao)"/>
  <text x="470" y="148" font-size="10.5" fill="#9a6b0a">tokens</text>
  <line x1="900" y1="126" x2="900" y2="190" stroke="#5c6a62" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/>

  <!-- executor tier -->
  <rect x="24" y="344" width="912" height="110" rx="12" fill="#e3f0e9" stroke="#157a55" stroke-width="1.6"/>
  <text x="44" y="366" font-size="13.5" font-weight="bold" fill="#157a55">Executor tier</text>
  <text x="916" y="366" font-size="11.5" text-anchor="end" fill="#157a55">leases · runs · orchestration · no long-lived connections</text>
  <rect x="44" y="378" width="280" height="64" rx="8" fill="#ffffff" stroke="#157a55" stroke-width="1.6"/>
  <text x="184" y="398" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#157a55">Executor E3 — owner of S</text>
  <text x="58" y="418" font-size="11" fill="#1c2420">holds S's lease (token n) · S is warm</text>
  <text x="58" y="434" font-size="11" fill="#1c2420">every durable write for S is fenced</text>
  <rect x="340" y="378" width="280" height="64" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="480" y="398" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1c2420">Executor E4</text>
  <text x="354" y="418" font-size="11" fill="#1c2420">owns other sessions; next-ranked for S</text>
  <text x="354" y="434" font-size="11" fill="#5c6a62">takes S over if E3 dies</text>
  <rect x="636" y="378" width="280" height="64" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="776" y="398" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1c2420">Executor E5 …</text>
  <text x="650" y="418" font-size="11" fill="#1c2420">placement = rendezvous hash</text>
  <text x="650" y="434" font-size="11" fill="#5c6a62">over executors only</text>

  <line x1="200" y1="296" x2="190" y2="374" stroke="#2457a6" stroke-width="1.8" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="206" y="322" font-size="10.5" fill="#2457a6">control channel: Submit · Subscribe ·</text>
  <text x="206" y="336" font-size="10.5" fill="#2457a6">events · StartDispatch · results (no tokens)</text>
  <line x1="660" y1="296" x2="300" y2="376" stroke="#2457a6" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ab)"/>
  <text x="560" y="330" font-size="10.5" fill="#2457a6">bot X's events for S</text>

  <!-- DB -->
  <rect x="24" y="480" width="912" height="140" rx="12" fill="#ffffff" stroke="#2457a6" stroke-width="1.6"/>
  <text x="480" y="606" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#2457a6">Shared HA database (OceanBase; SQLite in single-node mode) — the only place executors meet</text>
  <rect x="44" y="494" width="270" height="92" rx="8" fill="#ffffff" stroke="#2457a6"/>
  <text x="179" y="514" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1c2420">bcs_node_roster</text>
  <text x="58" y="534" font-size="11" fill="#1c2420">node_id · member_name · role · state</text>
  <text x="58" y="550" font-size="11" fill="#1c2420">last_heartbeat_at · advertise_addr</text>
  <text x="58" y="572" font-size="10.5" fill="#5c6a62">gateways and executors heartbeat</text>
  <rect x="345" y="494" width="270" height="92" rx="8" fill="#e3f0e9" stroke="#157a55" stroke-width="1.6"/>
  <text x="480" y="514" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#157a55">bcs_task_leases</text>
  <text x="359" y="534" font-size="11" fill="#1c2420">session_id · node_id · fencing_token</text>
  <text x="359" y="550" font-size="11" fill="#1c2420">bucket · adopted · pending flags</text>
  <text x="359" y="572" font-size="10.5" fill="#157a55">authoritative: who owns each session</text>
  <rect x="646" y="494" width="270" height="92" rx="8" fill="#ffffff" stroke="#2457a6"/>
  <text x="781" y="514" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1c2420">Session data</text>
  <text x="660" y="534" font-size="11" fill="#1c2420">runs · checkpoints · dispatch records</text>
  <text x="660" y="550" font-size="11" fill="#1c2420">session event log (event_seq)</text>
  <text x="660" y="572" font-size="10.5" fill="#5c6a62">written only through the fence</text>
  <line x1="184" y1="442" x2="420" y2="490" stroke="#157a55" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="260" y1="442" x2="740" y2="490" stroke="#157a55" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="560" y="470" font-size="10.5" fill="#157a55">fence step + durable writes, one transaction</text>
</svg>
