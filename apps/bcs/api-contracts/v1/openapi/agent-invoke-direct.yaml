# Runtime acceptance only; no positive authorization/check endpoint.
InternalInvokePath:
  post:
    operationId: invoke_agent_direct
    tags: [Collaboration / Agent Invocation]
    summary: Start one explicitly authorized direct Agent invocation
    description: >-
      Requires a verified scoped Bot principal, never a general App or Human
      acting as a Bot; a separate Human+Bot principal is refused as ambiguous
      delegated lineage. Bot owner display metadata is not a separate Human
      principal. The current physical Bot UUID and AgentCode must match
      byte-exact; current identity and qualification epochs are pinned and
      revalidated before effects and actual transport. No anonymous registration,
      auto-claim, delegated/group/tool operation or public/friend fallback.
      This operation is not idempotent and MUST NOT be automatically retried
      after a response or transport failure. Acceptance is not completion.
      Production capability is default-off; missing injection returns 503.
      Run polling/cancellation through a new V1 invocation resource is not
      part of this operation and remains an explicit follow-up contract.
    x-avernet-security:
      principal: required
      resource_authorization: agent_invoke_application
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/InvokeBody'
    responses:
      '202':
        description: >-
          The direct runtime accepted the operation; it may be queued or sent.
          No-store envelope, current request ID. No credential, source epochs
          or reusable invocation permit is returned.
        content:
          application/json:
            schema:
              $ref: '#/AcceptedEnvelope'
      '400':
        $ref: ./agent-invoke-types.yaml#/Error400
      '401':
        $ref: ./agent-invoke-types.yaml#/Error401
      '403':
        $ref: ./agent-invoke-types.yaml#/Error403
      '404':
        $ref: ./agent-invoke-types.yaml#/Error404
      '405':
        $ref: ./agent-invoke-types.yaml#/Error405
      '409':
        $ref: ./agent-invoke-types.yaml#/Error409
      '502':
        $ref: ./agent-invoke-types.yaml#/Error502
      '503':
        $ref: ./agent-invoke-types.yaml#/Error503
ExternalInvokePath:
  post:
    $ref: '#/InternalInvokePath/post'
    operationId: invoke_agent_direct_external
InvokeBody:
  type: object
  additionalProperties: false
  required: [to_bot_id, message]
  properties:
    to_bot_id:
      type: string
      minLength: 1
    message:
      type: string
      minLength: 1
    session_id:
      anyOf:
      - type: string
        minLength: 1
        maxLength: 128
      - type: 'null'
      description: Optional direct session; a2a-test namespace is reserved.
    timeout_ms:
      anyOf:
      - type: integer
        minimum: 1
        maximum: 86400000
      - type: 'null'
      description: Bounded by the injected finite runtime limits; no silent clamp.
AcceptedEnvelope:
  type: object
  additionalProperties: false
  required: [code, message, data, request_id]
  properties:
    code:
      const: 20200
    message:
      type: string
    request_id:
      type: string
    data:
      type: object
      additionalProperties: false
      required: [run_id, bot_uuid, session_id, status, expires_at_ms]
      properties:
        run_id:
          type: string
          format: uuid
        bot_uuid:
          type: string
        session_id:
          type: string
        status:
          type: string
        expires_at_ms:
          type: integer
          minimum: 1
        delivery:
          type: object
          description: Existing managed-delivery status projection, if queued.
          additionalProperties: true
