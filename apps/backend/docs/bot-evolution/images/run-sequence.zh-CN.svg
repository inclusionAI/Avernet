<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="960" viewBox="0 0 1160 960" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="一次运行的端到端过程：业务流水线使用 A 层，ClawEvolve 使用 B 层">
<title>一次运行的端到端过程：业务流水线使用 A 层，ClawEvolve 使用 B 层</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="1160" height="960" fill="#ffffff"/>
<path d="M 10 24 L 10 18 L 360 18 L 360 24" fill="none" stroke="#0d9488" stroke-width="1.5"/>
<text x="185.0" y="10" font-size="11" font-weight="700" fill="#0d9488" text-anchor="middle" dominant-baseline="middle">A 层 —— 公共进化 API（OpenAPI）</text>
<path d="M 400 24 L 400 18 L 720 18 L 720 24" fill="none" stroke="#2563eb" stroke-width="1.5"/>
<text x="560.0" y="10" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle">B 层 —— 作业协议（/evolution/v1）</text>
<path d="M 740 24 L 740 18 L 1140 18 L 1140 24" fill="none" stroke="#64748b" stroke-width="1.5"/>
<text x="940.0" y="10" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle" dominant-baseline="middle">平台内部（无公共调用）</text>
<rect x="-5.0" y="34" width="150" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="70.0" y="50.25" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">调用方</text>
<text x="70.0" y="64.81" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">业务 CI · UI 后端</text>
<line x1="70" y1="80" x2="70" y2="930" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="215.0" y="34" width="150" height="46" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="290.0" y="50.25" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">进化 API</text>
<text x="290.0" y="64.81" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">gateway · /openapi/v1</text>
<line x1="290" y1="80" x2="290" y2="930" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="385.0" y="34" width="150" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="460.0" y="50.25" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">ClawEvolve worker</text>
<text x="460.0" y="64.81" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">job_worker 容器</text>
<line x1="460" y1="80" x2="460" y2="930" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="585.0" y="34" width="150" height="46" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="660.0" y="50.25" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">进化运行</text>
<text x="660.0" y="64.81" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">apps/evolution</text>
<line x1="660" y1="80" x2="660" y2="930" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="735.0" y="34" width="150" height="46" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="810.0" y="50.25" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">验证</text>
<text x="810.0" y="64.81" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">apps/evolution</text>
<line x1="810" y1="80" x2="810" y2="930" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="890.0" y="34" width="120" height="46" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="950.0" y="50.25" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">晋升</text>
<text x="950.0" y="64.81" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">Backend</text>
<line x1="950" y1="80" x2="950" y2="930" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="1020.0" y="34" width="120" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="1080.0" y="50.25" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">基因组 → bot</text>
<text x="1080.0" y="64.81" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">Backend · 引擎</text>
<line x1="1080" y1="80" x2="1080" y2="930" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 70 112 L 290 112" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="180.0" y="92" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">1  PUT …/evolution/bindings</text>
<text x="180.0" y="104" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">If-Match · 一次性，由 bot 所有者完成</text>
<path d="M 290 146 L 660 146" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="475.0" y="138" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">绑定检查 · 带 ETag 存储</text>
<path d="M 70 192 L 290 192" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="180.0" y="172" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">2  POST …/evolution/runs {binding}</text>
<text x="180.0" y="184" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">Idempotency-Key · 非所有者时带 entity_id</text>
<path d="M 290 226 L 660 226" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="475.0" y="206" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">冻结策略@版本、参数、预算</text>
<text x="475.0" y="218" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">漂移检查 · 父版本 active → r41</text>
<path d="M 660 256 L 1080 256" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="870.0" y="248" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">解析 active → r41（sha256:a90b…）</text>
<path d="M 290 286 L 70 286" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<text x="180.0" y="278" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">202 {run_id: run_7f3, status: queued}</text>
<path d="M 460 330 L 660 330" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="560.0" y="310" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">3  POST /evolution/v1/jobs:claim</text>
<text x="560.0" y="322" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">→ 作业 id、fencing token、参数、父版本、预算、授予的能力</text>
<path d="M 460 372 L 660 372" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="560.0" y="352" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">4  GET …/experience/sessions?days=7</text>
<text x="560.0" y="364" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">POST …/evaluations/cases · 每次运行一次（诊断、规划）</text>
<rect x="400" y="394" width="320" height="126" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="412" y="406" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="start" dominant-baseline="middle">ClawEvolve 第 n 轮 —— 它自己的编排</text>
<path d="M 460 436 L 660 436" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="560.0" y="428" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">POST …/workspaces {revision: r41, key}</text>
<path d="M 460 470 L 660 470" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="560.0" y="450" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">POST …/agents:start → 202 op_19a</text>
<text x="560.0" y="462" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">轮询 GET …/operations/op_19a 直到 succeeded</text>
<path d="M 460 504 L 660 504" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="560.0" y="484" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">POST …/evaluations:train → 202 op_1b2</text>
<text x="560.0" y="496" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">仅训练划分：分数 + 点评</text>
<path d="M 460 548 L 660 548" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="560.0" y="528" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">5  POST …/candidates {patch, rationale}</text>
<text x="560.0" y="540" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">→ 候选 id sha256:c41e…</text>
<path d="M 660 578 L 1080 578" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="870.0" y="570" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">记录 r42 = candidate/run_7f3/1</text>
<path d="M 660 606 L 950 606" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="805.0" y="598" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">底线检查（schema、基因与固定项、扫描）</text>
<path d="M 660 634 L 810 634" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="735.0" y="626" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">verify(c41e, default@1)</text>
<path d="M 810 662 L 950 662" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="880.0" y="654" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">判定：accept</text>
<path d="M 460 702 L 660 702" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="560.0" y="682" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">6  GET …/candidates/c41e → accept</text>
<text x="560.0" y="694" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">只有汇总 · 下一轮基于 r42</text>
<path d="M 460 734 L 660 734" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="560.0" y="714" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">7  POST /evolution/v1/jobs/{id}/complete</text>
<text x="560.0" y="726" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">{summary} → 运行 completed</text>
<path d="M 70 772 L 290 772" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="180.0" y="752" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">8  GET …/runs/run_7f3 → completed</text>
<text x="180.0" y="764" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">GET …/runs/run_7f3/candidates</text>
<path d="M 70 812 L 290 812" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="180.0" y="792" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">9  GET …/candidates/c41e → 报告</text>
<text x="180.0" y="804" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">判定 accept · 门禁 needs_review（T2）</text>
<path d="M 70 852 L 290 852" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="180.0" y="832" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">10  POST …/candidates/c41e:approve</text>
<text x="180.0" y="844" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">所有者，或在其策略范围内的流水线</text>
<path d="M 290 880 L 950 880" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="620.0" y="872" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">审批 → 门禁决定晋升</text>
<path d="M 950 910 L 1080 910" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1015.0" y="890" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">11  active → r42 · previous → r41</text>
<text x="1015.0" y="902" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">Manifest apply → 引擎</text>
<text x="1080" y="944" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">12  新的片段标注 r42</text>
</svg>
