<text x="693.0" y="204.45" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">must-pass · grows from prod</text>
<rect x="796" y="160" width="182" height="70" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
<text x="887.0" y="187.23749999999998" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">safety</text>
<text x="887.0" y="204.45" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">must-pass · zero tolerance</text>
<text x="500" y="254" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle" font-style="italic">Only validation decides improvement; regression and safety can only block.</text>
