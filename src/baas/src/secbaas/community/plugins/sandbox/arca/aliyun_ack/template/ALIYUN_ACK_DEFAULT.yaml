apiVersion: v1
kind: ConfigMap
metadata:
  name: api-key-proxy-config-${UID}
  namespace: ${NAMESPACE}
data:
  default.conf: |
    server {
        listen 8080;
        location / {
            proxy_pass https://dashscope.aliyuncs.com/compatible-mode/v1;
            proxy_set_header Authorization "Bearer sk-xxxxxxxxxxxxxxxxxxxxxxxx";
            proxy_set_header Host "";
            proxy_ssl_server_name on;
            proxy_pass_request_headers on;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-${UID}
  namespace: ${NAMESPACE}
  labels:
    app: openclaw
    biz-id: "${UID}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
      biz-id: "${UID}"
  template:
    metadata:
      labels:
        app: openclaw
        biz-id: "${UID}"
    spec:
      initContainers:
      - name: init-dir
        image: ${INIT_IMAGE}
        command: ["sh", "-c", "mkdir -p /mnt/data/${STORAGE_ID}"]
        volumeMounts:
        - name: data
          mountPath: /mnt/data
      containers:
      - name: openclaw
        image: ${OPENCLAW_IMAGE}
        ports:
        - containerPort: 20003
        env:
        - name: LLM_API_BASE_URL
          value: "http://127.0.0.1:8080"
        volumeMounts:
        - name: data
          mountPath: ${MOUNT_PATH}
          subPath: ${STORAGE_ID}
        resources:
          requests:
            cpu: "${CPU_REQUEST}"
            memory: "${MEMORY_REQUEST}"
          limits:
            cpu: "${CPU_LIMIT}"
            memory: "${MEMORY_LIMIT}"
      - name: api-key-proxy
        image: ${API_KEY_PROXY_IMAGE}
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: proxy-config
          mountPath: /etc/nginx/conf.d
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: data
        nfs:
          server: 011yhkvtf9l5avlm4ty-gks56.cn-beijing.nas.aliyuncs.com
          path: /
      - name: proxy-config
        configMap:
          name: api-key-proxy-config-${UID}