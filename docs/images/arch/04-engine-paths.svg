<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1040" width="1360" height="1040" role="img" aria-label="two onboarding paths for an engine, decided by who controls the runtime">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
    .title{font-size:25px;font-weight:600;fill:#1F1E1C}
    .sub{font-size:13.5px;fill:#75736E}
    .bt{font-size:15px;font-weight:600}
    .bm{font-size:12.5px;fill:#33322E}
    .bd{font-size:11.5px;fill:#5E5C57}
    .lbl{font-size:11.5px;font-weight:600;fill:#8A8781;letter-spacing:.05em}
    .cap{font-size:16px;font-weight:600}
    .capd{font-size:12px;fill:#75736E}
    .arw{font-size:11px;fill:#8A8781}
    .edge{font-size:11px;font-weight:600;fill:#A1762E;letter-spacing:.04em}
  </style>
  <rect width="1360" height="1040" fill="#FAF9F7"/>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8781"/></marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#F1EFEA"/><line x1="0" y1="0" x2="0" y2="7" stroke="#DEDAD2" stroke-width="2.5"/>
    </pattern>
  </defs>
  <g class="t">
    <text x="44" y="50" class="title">接一个新引擎，有两条路 —— 分岔点是「运行时归谁控制」</text>
    <text x="44" y="78" class="sub">调用方只认最上面那套标准引擎协议。两条路的区别是那条橙色虚线画在哪：线以上是我们写的代码，线以下是引擎那边的。</text>

    <rect x="44" y="104" width="1272" height="84" rx="6" fill="#E3EDE4" stroke="#3F7350" stroke-width="1.6"/>
    <text x="64" y="132" class="bt" fill="#26452F">调用方　·　相对 Engine 来说的外部系统</text>
    <text x="64" y="156" class="bd">长连接：会话里的对话与流式事件　｜　引擎 API 客户端：创建会话 · 下发技能 · 装 MCP · 建定时任务 · 读写文件</text>
    <text x="64" y="178" class="bd">它们看到的只有下面这套协议 —— 从这里往下，换引擎不会传上来</text>
    <line x1="680" y1="188" x2="680" y2="200" stroke="#8A8781" stroke-width="1.8" marker-end="url(#m)"/>

    <rect x="44" y="204" width="1272" height="86" rx="6" fill="#E4EBF5" stroke="#3C6198" stroke-width="2"/>
    <text x="64" y="232" class="bt" fill="#22405F">标准引擎协议</text>
    <text x="64" y="256" class="bd">会话 · 对话 · 技能 · MCP · 定时 · 审批 · 文件 · 节点 · 模型 · 命令行工具　｜　外加一组引擎自身的状态与能力查询接口</text>
    <text x="64" y="278" class="bd">这是我们定义的一套协议 —— 谁想作为引擎被这套系统使用，最终都要让这套协议成立</text>

    <line x1="352" y1="348" x2="352" y2="302" stroke="#8A8781" stroke-width="1.8" marker-end="url(#m)"/>
    <line x1="1008" y1="348" x2="1008" y2="302" stroke="#8A8781" stroke-width="1.8" marker-end="url(#m)"/>

    <text x="44" y="336" class="cap" fill="#7A4B22">① 运行时不归我们控制</text>
    <text x="44" y="358" class="capd">容器在对方那边，自己拉取配置，我们没有进程可以放代码 —— 整套标准引擎协议只能引擎自己实现</text>

    <text x="700" y="336" class="cap" fill="#3E315F">② 运行时是我们起的</text>
    <text x="700" y="358" class="capd">容器我们创建、镜像我们构建、进程我们拉起 —— 于是可以把适配层放进去，替引擎做翻译</text>

    <line x1="44" y1="386" x2="660" y2="386" stroke="#A1762E" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="44" y="404" class="edge">我们的代码到此为止</text>

    <rect x="44" y="414" width="616" height="388" rx="6" fill="url(#hatch)" stroke="#A39F97" stroke-width="1.4"/>
    <text x="64" y="446" class="bt" fill="#33322E">引擎自己的运行时</text>
    <text x="64" y="472" class="bm">上面那套标准引擎协议，自己实现一遍。</text>
    <text x="64" y="504" class="bd">· 会话、对话、技能、MCP、定时、审批、文件 —— 一条不落</text>
    <text x="64" y="532" class="bd">· 能力声明与降级，要自己按矩阵报上来</text>
    <text x="64" y="560" class="bd">· 统一的应答信封与失败语义，要自己对齐</text>
    <text x="64" y="588" class="bd">· 我们只递过去一份冻结的配置，内容对我们不透明</text>
    <text x="64" y="630" class="bm" fill="#7A4B22">换来的是：不依赖我们的任何进程 ——</text>
    <text x="64" y="654" class="bm" fill="#7A4B22">能跑在我们根本部署不到的地方。</text>
    <text x="64" y="696" class="bd">这不是「成本高低」的选择题。对这类运行时，</text>
    <text x="64" y="720" class="bd">第 ② 条路压根不存在：没有地方放适配层。</text>
    <text x="64" y="762" class="lbl">典型：teclaw 这类外部拉取式运行时</text>

    <rect x="700" y="386" width="616" height="252" rx="6" fill="#E3EDE4" stroke="#3F7350" stroke-width="1.6"/>
    <text x="720" y="418" class="bt" fill="#26452F">引擎适配层　·　在我们自己的 Engine 进程里</text>
    <text x="720" y="446" class="bd">· 能力声明与降级 —— 支持什么、什么受限、什么没有</text>
    <text x="720" y="474" class="bd">· 会话与对话的统一形状 —— 会话标识、历史、流式事件归一</text>
    <text x="720" y="502" class="bd">· 技能与命令行工具的落盘 —— 安装、更新、清理</text>
    <text x="720" y="530" class="bd">· 定时任务 · 审批 · 文件操作</text>
    <text x="720" y="558" class="bd">· 统一的应答信封与失败语义 —— 传输成功不等于业务成功</text>
    <text x="720" y="586" class="bd">· 每引擎一套，是领域内核里唯一认识具体引擎的地方</text>
    <text x="720" y="618" class="bm" fill="#26452F">这一整块，引擎那边不用写。</text>

    <line x1="1008" y1="638" x2="1008" y2="676" stroke="#8A8781" stroke-width="1.5" marker-end="url(#m)"/>
    <text x="1024" y="662" class="arw">按适配层协议对话</text>

    <line x1="700" y1="698" x2="1316" y2="698" stroke="#A1762E" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="700" y="716" class="edge">我们的代码到此为止</text>

    <rect x="700" y="726" width="616" height="76" rx="6" fill="url(#hatch)" stroke="#A39F97" stroke-width="1.4"/>
    <text x="720" y="756" class="bt" fill="#33322E">引擎自己的运行时</text>
    <text x="720" y="782" class="bd">只实现我们的「适配层协议」—— 按引擎自己本来的形状定义的一层，翻译交给适配层。</text>

    <rect x="44" y="836" width="1272" height="166" rx="6" fill="#F1EFEA" stroke="#D8D5CF"/>
    <text x="64" y="866" class="bt" fill="#33322E">所以，判据只有一条：那个跑引擎的进程，是不是我们拉起来的</text>
    <text x="64" y="898" class="bm">· 是 —— 容器由我们创建、镜像由我们构建、进程由我们拉起，适配层就有地方待。走 ②。仓库里的 claude_code、openclaw 都是这条。</text>
    <text x="64" y="926" class="bm">· 不是 —— 容器在对方那边、配置自己拉取、进程我们碰不到，适配层无处安放。只能走 ①。teclaw 就是这一类。</text>
    <text x="64" y="958" class="bd">注意这跟「哪条路更省事」无关：走 ① 不是因为嫌适配层麻烦，而是因为对外部运行时来说，② 在物理上不成立。</text>
    <text x="64" y="984" class="bd">两条路对调用方完全一样：都只暴露标准引擎协议，都要声明能力矩阵，上层据此派发或隐藏。</text>
  </g>
</svg>
