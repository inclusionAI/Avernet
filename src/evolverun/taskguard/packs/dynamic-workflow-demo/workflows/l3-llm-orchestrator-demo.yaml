# ============================================================================
# L3: LLM 动态编排 (LLM Orchestrator)
# ============================================================================
# LLM 从 availableActions 菜单中选择动作，引擎为每步注入运行时节点。
# 支持对抗性验证、预算追踪和 injectNodes 外部注入。
# 节点 ID 模式: ${orchestratorId}__step${N}__${actionName}
#
# 场景：风险评估 — LLM 编排器根据目标自主选择动作序列，
# 如先收集数据、再评估风险、必要时请求人工审核。
# ============================================================================
id: l3-llm-orchestrator-demo
version: 1
title: L3 LLM 动态编排演示

input:
  mode: mixed
  requiredParams: [goal]
  sources:
    params: true
    message: true

identity:
  key: "{{input.params.goal}}"
  label: "L3演示: {{input.params.goal}}"
  duplicatePolicy: allow

outputs:
  orchestratorResult:
    from: "{{nodeOutput.orchestrator}}"
    public: true
    description: "编排器最终结果"
  stepsTaken:
    from: "{{nodeOutput.orchestrator.stepsTaken}}"
    public: true
    description: "执行步骤记录"

defaults:
  progress:
    enabled: true
    sink: chat

messages:
  onCreated: "L3 LLM 动态编排演示已启动：{{input.params.goal}}"
  onFinished: "L3 演示已完成。"

nodes:
  # ── P1: LLM 编排器 ──
  # 编排器从 availableActions 中选择动作，每步生成一个运行时节点
  # 循环执行直到目标达成、预算耗尽或达到 maxIterations
  - id: orchestrator
    title: LLM 风险评估编排器
    phase: P1
    dependsOn: []
    executor:
      type: llm-orchestrator
      goal: "{{input.params.goal}}"
      maxIterations: 5
      # 可用动作菜单 — LLM 每轮从中选择
      availableActions:
        - name: collect-data
          title: 收集数据
          description: 收集与风险评估相关的数据和上下文信息
          node:
            type: embedded-agent
            outputMode: json
            prompt: >
              收集与以下目标相关的数据和上下文: {{input.params.goal}}

              输出 JSON:
              {
                "data": "收集到的数据摘要",
                "sources": ["数据来源1", "数据来源2"],
                "completeness": "完整/部分/不足"
              }

        - name: assess-risk
          title: 评估风险
          description: 基于收集到的数据评估风险等级和影响
          node:
            type: embedded-agent
            outputMode: json
            prompt: >
              基于以下数据评估风险:
              目标: {{input.params.goal}}
              已收集数据: {{nodeOutput.orchestrator}}

              输出 JSON:
              {
                "riskLevel": "high/medium/low",
                "findings": [{"area": "...", "risk": "...", "impact": "..."}],
                "confidence": 0.0-1.0
              }

        - name: human-review
          title: 请求人工审核
          description: 当风险等级为 high 或置信度不足时请求人工审核
          node:
            type: embedded-agent
            outputMode: json
            prompt: >
              风险评估需要人工审核。

              当前评估结果: {{nodeOutput.orchestrator}}

              生成审核请求摘要 JSON:
              {
                "reviewType": "risk-assessment",
                "summary": "需要人工审核的原因",
                "recommendation": "建议操作"
              }

        - name: generate-report
          title: 生成报告
          description: 当评估完成且无需人工介入时生成最终报告
          node:
            type: embedded-agent
            outputMode: json
            prompt: >
              生成风险评估最终报告。

              目标: {{input.params.goal}}
              所有步骤数据: {{nodeOutput.orchestrator}}

              输出 JSON:
              {
                "status": "completed",
                "riskLevel": "high/medium/low",
                "summary": "风险概述",
                "recommendations": ["建议1", "建议2"],
                "stepsTaken": 0
              }

  # ── P2: 完成 ──
  - id: finalize
    title: 编排完成
    phase: P2
    dependsOn: [orchestrator]
    executor:
      type: done
      message: "L3 LLM 动态编排演示完成"