[package]
name         = "bcs-provider-http"
description  = "Outbound HTTP Provider transport for BCS downlink"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bcs-observability = { workspace = true }
async-trait     = { workspace = true }
bcs-domain      = { workspace = true }
bcs-protocol    = { workspace = true }
bcs-route-security = { workspace = true }
bcs-service-api = { workspace = true }
futures         = { workspace = true }
reqwest         = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry   = { workspace = true }
opentelemetry-http = { workspace = true }
uuid            = { workspace = true }

[dev-dependencies]
axum               = { workspace = true }
tower              = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true }
opentelemetry_sdk  = { workspace = true, features = ["testing"] }
