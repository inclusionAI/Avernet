<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 860" width="1360" height="860" role="img" aria-label="two onboarding paths for an engine">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
    .title{font-size:25px;font-weight:600;fill:#1F1E1C}
    .sub{font-size:13.5px;fill:#75736E}
    .bt{font-size:14px;font-weight:600}
    .bm{font-size:12px;fill:#33322E}
    .bd{font-size:11px;fill:#5E5C57}
    .lbl{font-size:11.5px;font-weight:600;fill:#8A8781;letter-spacing:.05em}
    .chip{font-size:10.5px}
    .arw{font-size:11px;fill:#8A8781}
  </style>
  <rect width="1360" height="860" fill="#FAF9F7"/>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8781"/></marker></defs>
  <g class="t">
    <text x="44" y="50" class="title">接一个新引擎，有两条路</text>
    <text x="44" y="78" class="sub">两条路通向同一组标准接口。区别只在：整组自己实现，还是只实现原生接口协议、把翻译交给适配层。</text>
    <rect x="44" y="104" width="1272" height="92" rx="6" fill="#E4EBF5" stroke="#3C6198" stroke-width="2"/>
    <text x="64" y="132" class="bt" fill="#22405F">标准引擎接口</text>
    <text x="64" y="156" class="bd">会话 · 对话 · 技能 · MCP · 定时 · 审批 · 文件 · 节点 · 模型 · 命令行工具　｜　外加一组引擎自身的状态与能力查询接口</text>
    <text x="64" y="178" class="bd">前端与 Backend 只面向这组接口编程 —— 换引擎，它们一行不改</text>
    <line x1="352" y1="256" x2="352" y2="202" stroke="#8A8781" stroke-width="1.8" marker-end="url(#m)"/>
    <line x1="1008" y1="256" x2="1008" y2="202" stroke="#8A8781" stroke-width="1.8" marker-end="url(#m)"/>
    <text x="368" y="232" class="arw">注册即可用</text>
    <text x="1024" y="232" class="arw">由适配层翻译上来</text>
    <rect x="44" y="262" width="616" height="120" rx="6" fill="#FFFFFF" stroke="#3F7350"/>
    <text x="64" y="292" class="bt" fill="#26452F">① 直接实现标准引擎接口</text>
    <text x="64" y="318" class="bm">运行时把上面那组接口自己实现一遍，然后注册进来。</text>
    <text x="64" y="342" class="bd">自由度最大：接口怎么实现、内部怎么组织，完全自己说了算。</text>
    <text x="64" y="364" class="bd">代价：那组接口要自己实现一遍，能力降级、失败语义也要自己对齐。</text>
    <rect x="700" y="262" width="616" height="120" rx="6" fill="#FFFFFF" stroke="#69539B"/>
    <text x="720" y="292" class="bt" fill="#3E315F">② 只实现原生接口协议</text>
    <text x="720" y="318" class="bm">运行时按自己本来的接口形状实现一份原生接口协议。</text>
    <text x="720" y="342" class="bd">适配层负责把它翻译成标准接口。</text>
    <text x="720" y="364" class="bd">代价：多一层翻译。换来的是下面这些不用自己做。</text>
    <line x1="1008" y1="386" x2="1008" y2="424" stroke="#8A8781" stroke-width="1.5" marker-end="url(#m)"/>
    <rect x="700" y="430" width="616" height="230" rx="6" fill="#E3EDE4" stroke="#3F7350"/>
    <text x="720" y="458" class="bt" fill="#26452F">引擎适配层替你做掉的事</text>
    <text x="720" y="486" class="bd">· 能力声明与降级 —— 支持什么、什么受限、什么没有</text>
    <text x="720" y="514" class="bd">· 会话与对话的统一形状 —— 会话标识、历史、流式事件归一</text>
    <text x="720" y="542" class="bd">· 技能与命令行工具的落盘 —— 安装、更新、清理</text>
    <text x="720" y="570" class="bd">· 定时任务 · 审批 · 文件操作</text>
    <text x="720" y="598" class="bd">· 统一的应答信封与失败语义 —— 传输成功不等于业务成功</text>
    <text x="720" y="626" class="bd">· 每引擎一套，是领域内核里唯一认识具体引擎的地方</text>
    <rect x="44" y="430" width="616" height="230" rx="6" fill="#F1EFEA" stroke="#D8D5CF"/>
    <text x="64" y="458" class="bt" fill="#33322E">两条路的取舍</text>
    <text x="64" y="486" class="bd">· 接入成本：① 高，② 低</text>
    <text x="64" y="514" class="bd">· 自由度：① 高，② 受原生接口协议约束</text>
    <text x="64" y="542" class="bd">· 上层感知：两条完全一样 —— 都只看到标准接口</text>
    <text x="64" y="570" class="bd">· 能力矩阵：两条都要声明，上层据此派发或隐藏</text>
    <text x="64" y="598" class="bd">· 仓库里现有的两个引擎走的都是第 ② 条</text>
    <text x="44" y="706" class="lbl">现有的两条链路</text>
    <rect x="44" y="716" width="616" height="104" rx="6" fill="#DFEDEC" stroke="#3B7A73"/>
    <text x="64" y="744" class="bt" fill="#234945">claude_code</text>
    <text x="64" y="768" class="bd">原生接口协议 + 传输实现 + 组装根</text>
    <text x="64" y="790" class="bd">网关随仓库分发 · 桥接官方 SDK 或命令行 —— 开源可直接跑通</text>
    <rect x="700" y="716" width="616" height="104" rx="6" fill="#DFEDEC" stroke="#3B7A73"/>
    <text x="720" y="744" class="bt" fill="#234945">openclaw</text>
    <text x="720" y="768" class="bd">同样的四件套，另一套绑定</text>
    <text x="720" y="790" class="bd">网关外部部署，不随仓库分发 —— 需自备</text>
  </g>
</svg>