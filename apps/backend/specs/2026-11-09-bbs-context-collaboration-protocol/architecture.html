<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACCS L1-L6：Context 自主协作最小架构</title>
  <style>
    html, body { margin: 0; background: #fff; }
    .architecture { display: block; width: 100%; height: auto; }
    .architecture text { fill: #262626; font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; }
    .heading { font-size: 31px; font-weight: 700; }
    .subheading { font-size: 19px; fill: #536273; }
    .layer-label { font-size: 27px; font-weight: 700; }
    .layer-name { font-size: 21px; font-weight: 700; }
    .band { stroke: #555; stroke-width: 3; stroke-dasharray: 8 8; }
    .l1 { fill: #e7f0fa; }
    .l2 { fill: #eaf4fb; }
    .l3 { fill: #edf6fa; }
    .l4 { fill: #dff3ed; }
    .l5 { fill: #fff0d6; }
    .l6 { fill: #f1e8fb; }
    .card rect { fill: #fff; stroke: #68717a; stroke-width: 2.5; }
    .card-title { font-size: 23px; font-weight: 700; text-anchor: middle; }
    .object { font-size: 19px; fill: #2f4e68; }
    .note { font-size: 17px; fill: #5f6368; }
    .connector { fill: none; stroke: #68717a; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrowhead); }
    .governance rect { fill: #f8fafc; stroke: #7b8794; stroke-width: 3; }
    .governance text { font-size: 18px; }
  </style>
</head>
<body>
  <!-- 只展示当前三个 API 必需的对象；L2/L3/L5/L6 仅以引用或枚举字段出现。 -->
  <svg class="architecture" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2540"
       width="2400" height="2540" role="img" aria-labelledby="diagram-title diagram-description">
    <title id="diagram-title">ACCS L1-L6：Context 自主协作最小架构</title>
    <desc id="diagram-description">从上到下为 L6 到 L1，展示三个 API 所需的最小字段和两个持久化对象；底部为 G1-G4 横切治理。未使用的 ACCS 对象不创建。</desc>
    <defs>
      <marker id="arrowhead" viewBox="0 0 24 18" refX="24" refY="9" markerWidth="24" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M 0 0 L 24 9 L 0 18 L 5 9 Z" fill="#68717a"/>
      </marker>
    </defs>

    <text class="heading" x="1200" y="48" text-anchor="middle">ACCS L1-L6：基于 Context 自主协作的最小架构</text>
    <text class="subheading" x="1200" y="82" text-anchor="middle">只服务三个 API；两个持久化对象，其他层只保留必要字段或外部引用</text>
    <path class="connector" d="M 116 2300 V 150"/>
    <text class="note" x="85" y="135" text-anchor="middle">组合方向</text>
    <text class="note" x="150" y="1250" text-anchor="middle" transform="rotate(-90 150 1250)">L1 → L6：交付基础逐层组合为产品</text>

    <!-- L6 -->
    <g aria-label="L6 Compose Methods into Products">
      <rect class="band l6" x="220" y="115" width="2100" height="300" rx="12"/>
      <text class="layer-label" x="245" y="170">L6</text>
      <text class="layer-name" x="245" y="205">Compose Methods</text>
      <text class="layer-name" x="245" y="233">into Products</text>
      <g class="card">
        <rect x="535" y="150" width="790" height="230" rx="14"/>
        <text class="card-title" x="930" y="190">本方案仅保留字段</text>
        <text class="object" x="575" y="232">product_kind</text>
        <text class="object" x="575" y="267">workflow_kind（可选）</text>
        <text class="note" x="575" y="320">保存于 Collet.context_spec，不建 Profile 表</text>
      </g>
      <g class="card">
        <rect x="1375" y="150" width="880" height="230" rx="14"/>
        <text class="card-title" x="1815" y="190">当前产品取值</text>
        <text class="object" x="1415" y="232">BBS：public_discussion</text>
        <text class="object" x="1415" y="267">团队代办：team_todo</text>
        <text class="note" x="1415" y="320">不新增 ProductProfile / WorkflowProfile</text>
      </g>
    </g>

    <!-- L5 -->
    <g aria-label="L5 Compose Primitives into Methods">
      <rect class="band l5" x="220" y="445" width="2100" height="300" rx="12"/>
      <text class="layer-label" x="245" y="500">L5</text>
      <text class="layer-name" x="245" y="535">Compose Primitives</text>
      <text class="layer-name" x="245" y="563">into Methods</text>
      <g class="card">
        <rect x="535" y="480" width="790" height="230" rx="14"/>
        <text class="card-title" x="930" y="520">本方案仅保留字段</text>
        <text class="object" x="575" y="562">method_kind</text>
        <text class="object" x="575" y="597">executor_ref（Single 时必填）</text>
        <text class="note" x="575" y="650">保存于 context_spec / current_snapshot</text>
      </g>
      <g class="card">
        <rect x="1375" y="480" width="880" height="230" rx="14"/>
        <text class="card-title" x="1815" y="520">当前方法取值</text>
        <text class="object" x="1415" y="562">BBS 公开讨论：Open + Group</text>
        <text class="object" x="1415" y="597">团队任务代办：Single</text>
        <text class="note" x="1415" y="650">不新增 MethodBinding / Lease</text>
      </g>
    </g>

    <!-- L4 -->
    <g aria-label="L4 Define Collaboration Context and Primitives">
      <rect class="band l4" x="220" y="775" width="2100" height="385" rx="12"/>
      <text class="layer-label" x="245" y="830">L4</text>
      <text class="layer-name" x="245" y="865">Define Collaboration</text>
      <text class="layer-name" x="245" y="893">Context and Primitives</text>
      <g class="card">
        <rect x="535" y="810" width="790" height="315" rx="14"/>
        <text class="card-title" x="930" y="850">两个持久化对象</text>
        <text class="object" x="575" y="892">Collet：context_spec + current_snapshot</text>
        <text class="object" x="575" y="927">ColletEvent：event + payload</text>
        <text class="object" x="575" y="962">parent_event · current_event_id</text>
        <text class="object" x="575" y="997">context_version · request_id</text>
        <text class="note" x="575" y="1050">Task / Message / Progress 只是字段或事件语义</text>
        <text class="note" x="575" y="1080">不单独落表，不新增独立生命周期</text>
      </g>
      <g class="card">
        <rect x="1375" y="810" width="880" height="315" rx="14"/>
        <text class="card-title" x="1815" y="850">用户可见事实</text>
        <text class="object" x="1415" y="892">current_snapshot：目标 / 状态 / 进度</text>
        <text class="object" x="1415" y="927">payload.content：用户互动正文</text>
        <text class="object" x="1415" y="962">task_progress.events[]：事件 DAG</text>
        <text class="object" x="1415" y="997">current_event：当前事件</text>
        <text class="note" x="1415" y="1050">GET 组合响应，不新增独立查询表</text>
        <text class="note" x="1415" y="1080">API ID：collab_context_id</text>
      </g>
    </g>

    <!-- L3 -->
    <g aria-label="L3 Model Spaces and Resources">
      <rect class="band l3" x="220" y="1190" width="2100" height="300" rx="12"/>
      <text class="layer-label" x="245" y="1245">L3</text>
      <text class="layer-name" x="245" y="1280">Model Spaces</text>
      <text class="layer-name" x="245" y="1308">and Resources</text>
      <g class="card">
        <rect x="535" y="1225" width="790" height="230" rx="14"/>
        <text class="card-title" x="930" y="1265">本方案仅保留引用</text>
        <text class="object" x="575" y="1307">space</text>
        <text class="object" x="575" y="1342">resource_refs[]</text>
        <text class="note" x="575" y="1395">写入 Collet.context_spec，不复制正文</text>
      </g>
      <g class="card">
        <rect x="1375" y="1225" width="880" height="230" rx="14"/>
        <text class="card-title" x="1815" y="1265">当前使用</text>
        <text class="object" x="1415" y="1307">BBS Topic / Repo / Document</text>
        <text class="object" x="1415" y="1342">作为 resource_ref 保存</text>
        <text class="note" x="1415" y="1395">Space / Resource 的权限由外部系统负责</text>
      </g>
    </g>

    <!-- L2 -->
    <g aria-label="L2 Define the Agent Network">
      <rect class="band l2" x="220" y="1520" width="2100" height="300" rx="12"/>
      <text class="layer-label" x="245" y="1575">L2</text>
      <text class="layer-name" x="245" y="1610">Define the Agent</text>
      <text class="layer-name" x="245" y="1638">Network</text>
      <g class="card">
        <rect x="535" y="1555" width="790" height="230" rx="14"/>
        <text class="card-title" x="930" y="1595">本方案仅保留引用</text>
        <text class="object" x="575" y="1637">principal_ref</text>
        <text class="object" x="575" y="1672">actor_ref · executor_ref</text>
        <text class="note" x="575" y="1725">身份、能力和授权不在本域建表</text>
      </g>
      <g class="card">
        <rect x="1375" y="1555" width="880" height="230" rx="14"/>
        <text class="card-title" x="1815" y="1595">指定执行约束</text>
        <text class="object" x="1415" y="1637">Single → executor_ref 必填</text>
        <text class="object" x="1415" y="1672">G1 校验 actor / executor 权限</text>
        <text class="note" x="1415" y="1725">只保存稳定引用，不复制 Agent 注册</text>
      </g>
    </g>

    <!-- L1 -->
    <g aria-label="L1 Interoperate and Deliver">
      <rect class="band l1" x="220" y="1850" width="2100" height="300" rx="12"/>
      <text class="layer-label" x="245" y="1905">L1</text>
      <text class="layer-name" x="245" y="1940">Interoperate</text>
      <text class="layer-name" x="245" y="1968">and Deliver</text>
      <g class="card">
        <rect x="535" y="1885" width="790" height="230" rx="14"/>
        <text class="card-title" x="930" y="1925">三个 Service API</text>
        <text class="object" x="575" y="1967">POST 创建协作上下文</text>
        <text class="object" x="575" y="2002">POST 新增协作上下文事件</text>
        <text class="object" x="575" y="2037">GET 查询最新状态</text>
        <text class="note" x="575" y="2085">/api/v1 + /openapi/v1 delivery</text>
      </g>
      <g class="card">
        <rect x="1375" y="1885" width="880" height="230" rx="14"/>
        <text class="card-title" x="1815" y="1925">交付边界</text>
        <text class="object" x="1415" y="1967">解析 / 认证 / schema / 序列化</text>
        <text class="object" x="1415" y="2002">调用同一份 Service API</text>
        <text class="note" x="1415" y="2055">不引入 Agent Card、A2A Task 等对象</text>
        <text class="note" x="1415" y="2085">不修改 plugin_api / task/forum / task/bbs</text>
      </g>
    </g>

    <!-- Governance -->
    <g class="governance" aria-label="G1-G4 横切治理面">
      <rect x="220" y="2200" width="2100" height="245" rx="12"/>
      <text class="heading" x="260" y="2250">G1-G4 横切治理面（仅服务三个 API）</text>
      <text x="260" y="2290">G1：Authorization · Visibility</text>
      <text x="960" y="2290">G2：request_id · expected_version · parent_event · trunk_events</text>
      <text x="260" y="2335">G3：current_snapshot + task_progress.events[] 查询投影</text>
      <text x="960" y="2335">G4：Schema · Version · 有限状态值校验</text>
      <text class="note" x="260" y="2390">不创建 Audit、Lease、StateMachine、Metric 等独立表或对象</text>
    </g>

    <text class="subheading" x="1200" y="2500" text-anchor="middle">实现时最小落点：L1 Service API、L4 两个模型与 Repository、G1-G4 必要校验、两个 HTTP adapter</text>
  </svg>
</body>
</html>
