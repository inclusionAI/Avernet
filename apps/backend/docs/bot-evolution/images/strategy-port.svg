<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Strategy port, context, and binding">
<title>Strategy port, context, and binding</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="1000" height="450" fill="#ffffff"/>
<rect x="40" y="20" width="920" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="500.0" y="43.2375" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">Run Orchestrator (platform)</text>
<text x="500.0" y="60.45" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">fires bindings · freezes strategy version, params, parent, budget · builds ctx</text>
<rect x="40" y="125" width="300" height="150" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="190.0" y="175.7" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">EvolutionStrategy</text>
<text x="190.0" y="193.25" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">run(ctx) — the only method</text>
<text x="190.0" y="209.45000000000002" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">black box: ClawEvolve, GEPA-style, …</text>
<text x="190.0" y="225.65" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">composed: platform/composed</text>
