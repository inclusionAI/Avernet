BotCandidateSearchPath:
  get:
    operationId: search_bot_candidates
    tags: ["Collaboration / Bots"]
    summary: >-
      Search candidate physical Bots from a managed Bot's perspective (including Human Actor).
    description: >-
      Human control-plane projection of legacy /actors/search. The path bot_id
      replaces legacy current_bot_uuid, while purpose maps to legacy
      cooperatable_only. Search first uses the configured semantic worker
      recommendation service with a fixed top-K of 20. If recommendation is
      unavailable, empty, or yields no visible Bots, the operation falls back
      to a trimmed case-insensitive Bot-name substring search. Results contain
      physical Bots only and preserve recommendation ordering when available.
      An omitted, empty, or whitespace-only q returns an empty successful
      result without invoking semantic or name search. Gateway route admission
      does not require a User, App, or Bot Principal. BCS still requires a
      usable Human identity and authorizes the selected perspective.
    x-avernet-security:
      user: optional
      app: optional
      bot: optional
    x-avernet-behavior:
      legacy_equivalent: /actors/search
      acting_bot:
        - managed_physical_bot
        - current_human_actor
      result_kind: bot
      purpose_mapping:
        discovery:
          cooperatable_only: false
        collaboration:
          cooperatable_only: true
      top_k: 20
      primary_ordering: recommendation_score_desc
      fallback: trimmed_case_insensitive_name_substring
      empty_query:
        equivalent_inputs:
          - omitted
          - empty
          - whitespace
        downstream_search: skip
      search_modes:
        - empty_query
        - semantic
        - name_fallback
    parameters:
      - $ref: ../shared.yaml#/BotIdPath
      - name: q
        in: query
        description: >-
          Optional natural-language candidate search query. Omitted, empty,
          and whitespace-only values have identical empty-query semantics.
        schema:
          type: string
      - name: purpose
        in: query
        description: >-
          discovery returns public and protected Bots. collaboration returns
          public Bots plus accepted friends regardless of non-public visibility.
        schema:
          type: string
          enum:
            - discovery
            - collaboration
          default: discovery
    responses:
      "200":
        description: >-
          Candidate Bots in recommendation order, or legacy name-fallback order
          when semantic recommendation does not produce a usable result.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotCandidateSearchEnvelope
      "400":
        description: Invalid candidate-search query.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: A supplied Gateway Principal is invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: >-
          BCS requires a usable Human identity; the current Human must manage
          the selected physical Bot, or the selected Human Actor must represent
          that Human.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Acting Bot is missing, deleted, or unonboarded.
        x-error-codes:
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

QueryBotsPath:
  post:
    operationId: query_bots
    tags: ["Collaboration / Bots"]
    summary: Query Bot domain objects by explicit identifiers.
    description: >-
      Human control-plane operation for deterministic explicit-ID hydration.
      Both physical Bot and Human rows can be returned. The operation does not
      apply ownership or visibility filtering. Duplicate IDs are collapsed at
      their first occurrence; missing, deleted, and unonboarded rows are
      silently omitted. An empty bot_ids array returns an empty items array.
    x-avernet-security:
      user: required
      app: required
    x-avernet-behavior:
      result_kinds:
        - bot
        - human
      authorization_filter: none
      visibility_filter: none
      deduplicate: first_occurrence
      ordering: request_order
      missing: omit
      deleted: omit
      unonboarded: omit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/QueryBotsRequest"
    responses:
      "200":
        description: Bot objects in first-occurrence request order.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotListEnvelope
      "400":
        description: Invalid JSON body, identifier, or batch size.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: Authenticated Principal is not a Human control-plane caller.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

BotPath:
  get:
    operationId: get_bot
    tags: ["Collaboration / Bots"]
    summary: Get one Bot domain object by exact identifier.
    description: >-
      Human control-plane exact-ID lookup for either a physical Bot or a Human
      row. No acting Bot, ownership filter, or visibility filter is applied;
      visibility controls directory discovery rather than explicit hydration.
    x-avernet-security:
      user: required
      app: required
    x-avernet-behavior:
      result_kinds:
        - bot
        - human
      visibility_filter: none
    parameters:
      - $ref: ../shared.yaml#/BotIdPath
    responses:
      "200":
        description: Full Bot domain object selected by kind.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotEnvelope
      "400":
        description: Invalid Bot identifier encoding.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: Authenticated Principal is not a Human control-plane caller.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Bot is missing, deleted, or unonboarded.
        x-error-codes:
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse
  patch:
    operationId: update_bot
    tags: ["Collaboration / Bots"]
    summary: Update the explicitly mutable Bot properties.
    description: >-
      Human control-plane owner update. The current Human staff_no must equal
      the target row's created_by; a missing created_by is not special-cased and
      is therefore forbidden. descriptor is a nested partial update available
      only for a physical Bot. Descriptor arrays replace their complete stored
      arrays. bot_id, kind, env, created_by, timestamps, reachability, provider,
      and agent_code are immutable through this operation.
    x-avernet-security:
      user: required
      app: required
    x-avernet-behavior:
      authorization: created_by_matches_current_staff_no
      missing_created_by: forbidden
      descriptor_kind: bot_only
      descriptor_arrays: replace
    parameters:
      - $ref: ../shared.yaml#/BotIdPath
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/UpdateBotRequest"
    responses:
      "200":
        description: Updated full Bot domain object with refreshed updated_at.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotEnvelope
      "400":
        description: >-
          Empty or invalid patch, or a descriptor patch targeting a Human row.
        x-error-codes:
          - invalid_request
          - invalid_bot_kind
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: Current Human is not the target row's created_by.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Bot is missing, deleted, or unonboarded.
        x-error-codes:
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

MyBotsPath:
  get:
    operationId: list_my_bots
    tags: ["Collaboration / Bots"]
    summary: List the Bot rows the current Human controls, with an explicit access relation.
    description: >-
      Human control-plane operation. The result is the physical Bot
      union of the caller's CURRENT approved owner and manager role
      edges (deduplicated per Bot: owner wins when both exist), plus the
      caller's own Human self row as an explicit `owner`-labeled
      self-identity compatibility projection (it carries no
      transferrable authority). `created_by` is creation provenance only
      and never decides membership or the label: a self-created Bot
      whose authority was transferred away (without a retained manager
      edge) is NOT returned, while someone else's creation transferred
      TO the caller is. Every item carries the REQUIRED
      `access_relation` label (`owner` | `manager`) computed from the
      current edges; the label is a per-read permission snapshot. Omitting
      kind means all kinds; reachability only matches physical Bots, so
      combining kind=human with reachability produces an empty page.
    x-avernet-security:
      user: required
      app: required
    x-avernet-behavior:
      ownership_source: current_owner_manager_union
      deduplicate: per_bot_owner_priority
      human_self_row: explicit_owner_compat_projection
      omitted_kind: all
      reachability_applies_to: bot
      strictness: fail_closed_on_uninitialized_or_corrupt_authority
      ordering:
        - created_at_desc
        - bot_id_asc
    parameters:
      - name: kind
        in: query
        description: Bot kind filter; omission returns both kinds.
        schema:
          type: string
          enum:
            - bot
            - human
      - name: name
        in: query
        description: >-
          Optional trimmed, case-insensitive name substring; empty is absent.
        schema:
          type: string
      - name: status
        in: query
        description: Raw persisted status filter.
        schema:
          $ref: ../domain-models.yaml#/BotStatus
      - name: reachability
        in: query
        description: Computed reachability filter for physical Bots only.
        schema:
          $ref: ../domain-models.yaml#/BotReachability
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: >-
          Controllable rows (owner ∪ manager union plus the Human self
          row, one item per Bot) ordered by created_at descending with
          bot_id ascending as the deterministic tie-breaker, then
          paginated. Each item carries the REQUIRED access_relation
          label; it is never null, omitted, or defaulted.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/MyBotPageEnvelope
      "400":
        description: Invalid filter or pagination parameter.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: Authenticated Principal is not a Human control-plane caller.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

QueryBotsRequest:
  type: object
  additionalProperties: false
  required:
    - bot_ids
  properties:
    bot_ids:
      type: array
      maxItems: 100
      description: >-
        Explicit IDs. Duplicates are accepted and collapsed at their first
        occurrence. An empty array is valid.
      items:
        type: string
        minLength: 1

UpdateBotDescriptor:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    summary:
      type: string
      description: New summary; omission keeps the stored value.
    domains:
      type: array
      description: Complete replacement; an empty array clears the value.
      items:
        type: string
    skills:
      type: array
      description: Complete replacement; an empty array clears the value.
      items:
        $ref: ../domain-models.yaml#/BotSkill
    scopes:
      type: array
      description: Complete replacement; an empty array clears the value.
      items:
        type: string

UpdateBotRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
    visibility:
      $ref: ../domain-models.yaml#/BotVisibility
    status:
      $ref: ../domain-models.yaml#/BotStatus
    descriptor:
      $ref: "#/UpdateBotDescriptor"
    task_claim_mode:
      type: boolean
      description: >-
        Task-claim opt-in toggle. Omit to leave the stored value unchanged;
        defaults to false when never set. Physical bots only.
    task_dream_mode:
      type: boolean
      description: >-
        Task-dream opt-in toggle. Omit to leave the stored value unchanged;
        defaults to false when never set. Physical bots only.
    user_visibility:
      $ref: ../domain-models.yaml#/UserVisibility
    friend_ext:
      type: object
      additionalProperties: true
      description: Friend connection policy extension, including department scopes.
    friend_check_in_strategy:
      $ref: ../domain-models.yaml#/FriendCheckInStrategy

# Task 13 manager list API (spec §6): Human-only control plane; the
# current owner is projected as a separate read-only field; grants and
# revokes are idempotent DIRECT-lane mutations that never touch team/*
# sources and never change the owner.

BotManagersPath:
  get:
    operationId: list_bot_managers
    tags: ["Collaboration / Bots"]
    summary: List the explicit managers of one Bot.
    description: >-
      Human control-plane read for the current owner/managers of one Bot
      (initialized ownership only): the owner in the separate read-only
      owner_user_id field plus one user-deduplicated, user_id-ASC-sorted
      page of explicit managers. Positional pagination with limit 1..100
      (default 20). The caller must hold a current owner-or-manager role.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - $ref: ../shared.yaml#/BotIdPath
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: >-
          The manager page, with the current owner in its own field (the
          owner never mixes into items).
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotManagerPageEnvelope
      "400":
        description: Invalid Bot identifier or pagination window.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: The caller holds no current owner/manager role on the Bot.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Bot is missing, deleted, or unonboarded.
        x-error-codes:
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: The Bot's ownership has not been initialized yet.
        x-error-codes:
          - ownership_not_initialized
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

BotManagerPath:
  put:
    operationId: grant_bot_manager
    tags: ["Collaboration / Bots"]
    summary: Idempotently grant one Human the direct manager source.
    description: >-
      Idempotent DIRECT-lane grant under a Human owner/manager caller;
      the subject must be a live Human of the same environment and never
      the current owner. The request carries NO business body: a team
      field (or any other body content) is rejected, and the direct API
      never grows a team parameter. Managers may re-grant/revoke other
      managers (Gate 0); edges granted to third parties do not cascade
      when their grantor loses the role.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - $ref: ../shared.yaml#/BotIdPath
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    responses:
      "200":
        description: The idempotent grant result (changed=false when already granted).
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotManagerGrantedEnvelope
      "400":
        description: >-
          Body content on a bodyless request (including a team field), a
          blank identity, or a subject that is not a resolvable live Human.
        x-error-codes:
          - invalid_request
          - invalid_subject
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: The caller holds no current owner/manager role on the Bot.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Bot is missing, deleted, or unonboarded.
        x-error-codes:
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: >-
          The subject IS the current owner (the owner moves only through
          the ownership-transfer flow), or the Bot's ownership is not
          initialized.
        x-error-codes:
          - owner_role_requires_transfer
          - ownership_not_initialized
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse
  delete:
    operationId: revoke_bot_manager
    tags: ["Collaboration / Bots"]
    summary: Idempotently revoke one Human's non-team manager sources.
    description: >-
      Idempotent revoke of the subject's direct and ownership_transfer
      manager sources ONLY: team/* sources stay exactly as they are and
      are reported in remaining_team_sources (the platform's team sync
      owns them). revoked=true is NOT total loss of management rights; a
      concurrent revocation of the caller never permits this idempotent
      lane to change state.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - $ref: ../shared.yaml#/BotIdPath
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    responses:
      "200":
        description: >-
          The idempotent revoke result with the untouched team sources
          the direct lane does not govern.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotManagerRevokedEnvelope
      "400":
        description: Blank identity or a malformed request.
        x-error-codes:
          - invalid_request
          - invalid_subject
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: The caller holds no current owner/manager role on the Bot.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Bot is missing, deleted, or unonboarded.
        x-error-codes:
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: >-
          The subject IS the current owner (the owner moves only through
          the ownership-transfer flow), or the Bot's ownership is not
          initialized.
        x-error-codes:
          - owner_role_requires_transfer
          - ownership_not_initialized
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

# Task 14 ownership view/transfer API (spec §9-§11, plan Task 14): the
# confirmation-based ownership transfer with an idempotent create, the
# both-party inbox/outbox reads, and the bodyless accept/reject/cancel
# decisions. Every operation is behind the Human Gateway Principal.

BotOwnershipPath:
  get:
    operationId: get_bot_ownership
    tags: ["Collaboration / Bots"]
    summary: Read the current owner and ownership version of one Bot.
    description: >-
      Human control-plane read for callers holding a current
      owner-or-manager role on the Bot (the same read family as the
      manager list): the single effective owner user id and the
      optimistic-concurrency ownership version an initiate request must
      snapshot. Uninitialized ownership returns 409
      ownership_not_initialized and is never auto-claimed.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - $ref: ../shared.yaml#/BotIdPath
    responses:
      "200":
        description: The current ownership state of the Bot.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotOwnershipEnvelope
      "400":
        description: Blank or malformed Bot identifier.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: >-
          The caller holds no current owner/manager role on the Bot, or
          the Principal carried no trusted User (Bot/App/AccessKey-only
          principals can never stand in for a User).
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Bot is missing, deleted, or unonboarded.
        x-error-codes:
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: The Bot's ownership has not been initialized yet.
        x-error-codes:
          - ownership_not_initialized
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

BotOwnershipTransfersPath:
  post:
    operationId: create_bot_ownership_transfer
    tags: ["Collaboration / Bots"]
    summary: Initiate one ownership transfer.
    description: >-
      The CURRENT owner initiates one confirmation-based transfer: only
      a pending is created — the target receives NO resource grant
      until they accept (spec §9). URI-scoped idempotency: the caller
      carries a UUID client_request_id and the ownership_version
      snapshot they just read; the FIRST committed creation answers
      201, a same-payload replay of the same key answers 200 with the
      ORIGINAL receipt and never re-executes, and a same-key
      different-payload request is 409 idempotency_conflict. A stale
      expected_owner_version (both parties legal, no valid pending) is
      409 ownership_changed and NOTHING is persisted — re-read ownership
      and retry with the fresh version. The transfer moves BCS
      ownership ONLY: 原发起人接受后保留 manager(来源
      ownership_transfer/<transfer_id>), 部署与凭据不迁移
      (this scope statement belongs on every acceptance UI, spec §11.1).
    x-avernet-security:
      user: required
      app: required
    parameters:
      - $ref: ../shared.yaml#/BotIdPath
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../domain-models.yaml#/CreateOwnershipTransferRequest
    responses:
      "201":
        description: >-
          The FIRST creation committed: the pending receipt (expires in
          7 days from the database clock).
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/OwnershipTransferEnvelope
      "200":
        description: >-
          The same-key same-payload replay returns the ORIGINAL
          historical receipt without re-execution (this also serves
          replayed receipts after the transfer was decided and after
          the initiator lost the owner role).
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/OwnershipTransferEnvelope
      "400":
        description: >-
          Malformed shape (non-UUID idempotency key, non-positive
          version, blank recipient), a self-transfer, OR — for an
          already-authorized initiator — a recipient that is not a
          resolvable current-scope Human (invalid_transfer_recipient).
        x-error-codes:
          - invalid_request
          - invalid_transfer_recipient
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: >-
          The authenticated User is not the Bot's current owner (a
          manager initiating is the canonical case), or the Principal
          carried no trusted User.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Bot is missing, deleted, or unonboarded.
        x-error-codes:
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: >-
          A valid pending already occupies the Bot's single pending
          slot, the expected_owner_version snapshot was stale (nothing
          persisted), the idempotency key was replayed with a different
          payload, or the Bot's ownership is not initialized.
        x-error-codes:
          - ownership_transfer_pending
          - ownership_changed
          - idempotency_conflict
          - ownership_not_initialized
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

OwnershipTransfersPath:
  get:
    operationId: list_bot_ownership_transfers
    tags: ["Collaboration / Bots"]
    summary: List the caller's transfer inbox or outbox.
    description: >-
      The authenticated Human's own inbox (direction=received, the
      default) or outbox (direction=sent) page; the read NEVER accepts
      an arbitrary user_id and NEVER materializes anything — the
      effective-status rule (a physically-pending row past its deadline
      projects expired) runs in the filter BEFORE paging, and count and
      page share one read snapshot so they never disagree across an
      expiry boundary. Ordered gmt_create DESC, transfer_id ASC;
      positional offset/limit with limit 1..100 (default 20).
    x-avernet-security:
      user: required
      app: required
    parameters:
      - name: direction
        in: query
        description: >-
          received lists transfers addressed TO the authenticated User;
          sent lists those initiated by them. Default received.
        schema:
          type: string
          enum:
            - received
            - sent
          default: received
      - name: status
        in: query
        description: >-
          Optional effective-status filter; omitted means all states.
          The filter is expiry-aware: querying expired also surfaces
          physically-pending rows whose deadline already lapsed.
        schema:
          type: string
          enum:
            - pending
            - accepted
            - rejected
            - cancelled
            - expired
            - invalidated
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: The viewer's page of transfer receipts.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/OwnershipTransferPageEnvelope
      "400":
        description: Out-of-range pagination or an unknown filter value.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: The Principal carried no trusted User.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

OwnershipTransferPath:
  get:
    operationId: get_bot_ownership_transfer
    tags: ["Collaboration / Bots"]
    summary: Read one transfer receipt as one of its two parties.
    description: >-
      Only the recorded initiator and the designated recipient may read
      the transfer and its receipt — unrelated callers share ONE 404
      branch with missing ids and can never enumerate transfer records
      by id (spec §11.1/§11.2). Receipts are HISTORY: they never name a
      current owner and a pending receipt carries only the
      confirmation-scope projection (bot id, creation-time name
      snapshot, both parties, status, deadline, the version facts) —
      never summary, prompt, groups, sessions, files, credentials or
      the manager list. The expired projection is read-only: a
      physically-pending row past its deadline reads expired with the
      system decider and decided_at = expires_at, and no GET ever
      writes the database.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - name: transfer_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    responses:
      "200":
        description: The (possibly projected) transfer receipt.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/OwnershipTransferEnvelope
      "400":
        description: Blank or malformed transfer identifier.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: The Principal carried no trusted User.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: >-
          The transfer id does not exist OR the caller is not one of its
          two recorded parties — one indistinguishable branch.
        x-error-codes:
          - ownership_transfer_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

OwnershipTransferAcceptPath:
  post:
    operationId: accept_bot_ownership_transfer
    tags: ["Collaboration / Bots"]
    summary: The recipient confirms the transfer.
    description: >-
      The designated recipient accepts: the store commits the
      all-or-nothing owner switch in ONE transaction (previous owner
      revoked to the ownership_transfer/manager source, the recipient's
      non-team sources revoked, version CAS +1, the accepted receipt).
      The request carries NO business body — an absent or empty JSON
      object is the contract; unknown fields are rejected. Response-loss
      retries observe the ALREADY-COMMITTED outcome: the same recipient
      retrying an accepted transfer receives the ORIGINAL historical
      receipt even after ownership moved on, an invalidated
      (owner_changed) accept answers 409 ownership_changed with the
      SAME code on every retry (OT12), and a lapsed deadline answers
      409 ownership_transfer_expired. Acceptance moves BCS ownership
      ONLY: 原发起人保留 manager, BCS 不迁移部署和凭据 — the acceptance UI
      must present this scope statement (spec §11.1).
    x-avernet-security:
      user: required
      app: required
    parameters:
      - name: transfer_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    responses:
      "200":
        description: >-
          The accept committed (or its historical receipt for the same
          recipient's retry), status accepted with the committed
          result_owner_version.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/OwnershipTransferEnvelope
      "400":
        description: >-
          Any body content on the bodyless action, or a malformed
          transfer identifier.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: >-
          Caller is a recorded party whose role forbids the action (the
          initiator accepting), or the Principal carried no trusted
          User.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: >-
          The transfer id does not exist OR the caller is not one of its
          two recorded parties — one indistinguishable branch.
        x-error-codes:
          - ownership_transfer_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: >-
          The owner/version snapshot moved (the pending was committed as
          invalidated(owner_changed); retries keep the same code), the
          deadline lapsed, the row is already terminal for this
          incompatible action, the recipient cannot be resolved, or the
          Bot's ownership is not initialized.
        x-error-codes:
          - ownership_changed
          - ownership_transfer_expired
          - ownership_transfer_not_pending
          - invalid_transfer_recipient
          - ownership_not_initialized
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

OwnershipTransferRejectPath:
  post:
    operationId: reject_bot_ownership_transfer
    tags: ["Collaboration / Bots"]
    summary: The recipient rejects the transfer.
    description: >-
      The designated recipient rejects: only the transfer row terminates
      to rejected — role edges never change. NO business body (an
      absent or empty JSON object is the contract). Same-action retries
      return the ORIGINAL rejected receipt.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - name: transfer_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    responses:
      "200":
        description: The rejected receipt (or the ORIGINAL receipt on retry).
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/OwnershipTransferEnvelope
      "400":
        description: Body content on the bodyless action, or a malformed identifier.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: >-
          Caller is a recorded party whose role forbids the action (the
          initiator rejecting), or the Principal carried no trusted
          User.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: >-
          The transfer id does not exist OR the caller is not one of its
          two recorded parties — one indistinguishable branch.
        x-error-codes:
          - ownership_transfer_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: >-
          The deadline lapsed, the row is already terminal for this
          incompatible action (an accepted transfer cannot be rejected),
          the parties moved (invalidated/owner_changed keeps its code on
          retry), or the ownership is not initialized.
        x-error-codes:
          - ownership_changed
          - ownership_transfer_expired
          - ownership_transfer_not_pending
          - ownership_not_initialized
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

OwnershipTransferCancelPath:
  post:
    operationId: cancel_bot_ownership_transfer
    tags: ["Collaboration / Bots"]
    summary: The initiating owner cancels the pending transfer.
    description: >-
      The recorded INITIATOR cancels — and only while the initiating
      owner is STILL the current owner (spec §9: the ownership facts at
      decision time decide): only the row terminates to cancelled, role
      edges never change. NO business body. Same-action retries return
      the ORIGINAL cancelled receipt; if ownership already moved, the
      pending was committed as invalidated(owner_changed) and the
      cancel observes 409 ownership_changed instead.
    x-avernet-security:
      user: required
      app: required
    parameters:
      - name: transfer_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    responses:
      "200":
        description: The cancelled receipt (or the ORIGINAL receipt on retry).
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/OwnershipTransferEnvelope
      "400":
        description: Body content on the bodyless action, or a malformed identifier.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: >-
          Caller is a recorded party whose role forbids the action (the
          recipient cancelling), or the Principal carried no trusted
          User.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: >-
          The transfer id does not exist OR the caller is not one of its
          two recorded parties — one indistinguishable branch.
        x-error-codes:
          - ownership_transfer_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "409":
        description: >-
          The deadline lapsed, the row is already terminal for this
          incompatible action, the initiating owner already lost the
          ownership (invalidated/owner_changed keeps its code on
          retry), or the ownership is not initialized.
        x-error-codes:
          - ownership_changed
          - ownership_transfer_expired
          - ownership_transfer_not_pending
          - ownership_not_initialized
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse
