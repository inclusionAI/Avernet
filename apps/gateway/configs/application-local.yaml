user_config:
  # Local browser debugging: TeamClaw dev proxy forwards cookies, and this
  # strategy maps staff_id -> UserPrincipal before falling back to Google token.
  identity_strategies:
    user: [dev_cookie, google]

  # Local runs the bare SQLite plugin against an IN-MEMORY database, so the
  # schema is created from the ORM metadata at boot (the plugin's own
  # bare-mode default). Production deployments use the migrated schema —
  # they never load this overlay. Without this the local identity chains
  # (app_token / bot_token / access_key) crash on missing tables instead of
  # resolving against real — empty — registries.
  database:
    create_schema: true
    seed_data: true

  # Deterministic local dev test apps, seeded into the (in-memory) app
  # registry at boot — DEV/ SINGLE-BOX ONLY, never production (an empty/absent
  # list seeds nothing anywhere). The api_key is a well-known NOT-FOR-PROD
  # stand-in in the real 32-char base62 shape so the app_token strategy
  # verifies it through the same prefix+hash path a production key takes.
  # singlebox's Backend manager-sync sender presents this credential
  # (exported with the identical literal by singlebox/modules/backend.sh).
  local_dev_apps:
    - app_name: singlebox-manager-sync
      tenant: teamclaw
      api_key: SingleboxManagerSyncDevAppKey000

  upstream_vars:
    backend_server_url: http://127.0.0.1:8888
    baas_server_url: http://127.0.0.1:8890
    bcs_server_url: http://127.0.0.1:21000
    engine_proxy_server_url: http://127.0.0.1:8888
    bcsfuse_server_url: http://127.0.0.1:8765
