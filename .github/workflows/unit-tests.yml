name: Unit Tests

on:
  pull_request:
    branches:
      - dev
      - dev_refactory_collaboration
      - main
      - 'REL*'
  push:
    branches:
      - dev
      - dev_refactory_collaboration
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bcs:
    name: BCS unit tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bcs_contract
          MYSQL_USER: bcs
          MYSQL_PASSWORD: bcs_test_only
          MYSQL_ROOT_PASSWORD: root_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot_test_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Dedicated disposable MySQL services for the six
      # bot-authority plan §6 gates (Task 8): each
      # authority_mysql entry applies the FULL migration
      # chain and therefore needs its own EMPTY database
      # (migration chains must not run on the same dirty
      # database). Existing MySQL contract steps keep the
      # main `bcs_contract` service unchanged.
      mysql_authority_edge:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bcs_authority_edge
          MYSQL_USER: bcs
          MYSQL_PASSWORD: bcs_test_only
          MYSQL_ROOT_PASSWORD: root_test_only
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot_test_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql_authority_bot:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bcs_authority_bot
          MYSQL_USER: bcs
          MYSQL_PASSWORD: bcs_test_only
          MYSQL_ROOT_PASSWORD: root_test_only
        ports:
          - 3308:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot_test_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql_authority_group:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bcs_authority_group
          MYSQL_USER: bcs
          MYSQL_PASSWORD: bcs_test_only
          MYSQL_ROOT_PASSWORD: root_test_only
        ports:
          - 3309:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot_test_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql_authority_session:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bcs_authority_session
          MYSQL_USER: bcs
          MYSQL_PASSWORD: bcs_test_only
          MYSQL_ROOT_PASSWORD: root_test_only
        ports:
          - 3310:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot_test_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CARGO_TERM_COLOR: always
      BCS_TEST_MYSQL_URL: mysql://bcs:bcs_test_only@127.0.0.1:3306/bcs_contract
      # Pushes compare the whole event range, not the already-updated origin/dev.
      BCS_PUSH_BEFORE: ${{ github.event.before }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: apps/bcs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate unit-test diff behavior
        working-directory: ${{ github.workspace }}
        run: python3 singlebox/ci/tests/test_unit_test_workflow_diff.py

      - name: Detect BCS changes vs base
        id: changes
        working-directory: ${{ github.workspace }}
        run: python3 apps/bcs/scripts/ci/detect_changes.py

      - name: Set up Node.js for DeepSeek Harness BCN plugin
        if: steps.changes.outputs.dsh-bcn-changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test DeepSeek Harness BCN plugin
        if: steps.changes.outputs.dsh-bcn-changed == 'true'
        working-directory: ${{ github.workspace }}/apps/bcs/crates/plugins/deepseek-harness-channel-bcn
        run: |
          npm install --ignore-scripts --no-package-lock
          npm run ci

      - name: Install system dependencies
        if: steps.changes.outputs.skip-bcs != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        if: steps.changes.outputs.skip-bcs != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add llvm-tools
          rustc --version
          cargo --version

      - name: Install cargo-nextest and cargo-llvm-cov
        if: steps.changes.outputs.skip-bcs != 'true'
        run: bash scripts/install_cargo_test_tools.sh

      - name: Validate BCS CI tooling
        if: steps.changes.outputs.skip-bcs != 'true'
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s singlebox/ci/tests -p 'test_bcs_*.py'

      - name: Cache instrumented Rust dependencies
        if: steps.changes.outputs.skip-bcs != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/bcs -> target/llvm-cov-target
          shared-key: bcs-unit-coverage-v1
          key: ${{ hashFiles('apps/bcs/scripts/cargo_test_tools.sha256') }}
          env-vars: CARGO_PROFILE_ CARGO_INCREMENTAL
          cache-workspace-crates: false
          cache-bin: false
          # Only trusted branch pushes publish reusable caches. PRs restore
          # their base/default branch cache without saving a PR-private copy.
          save-if: ${{ github.event_name == 'push' }}

      - name: Run unit tests with coverage
        if: steps.changes.outputs.skip-bcs != 'true'
        run: bash scripts/ci_test.sh --coverage --reuse-build

      # One disposable-DB command gates two labeled phases: [phase 1/3] the
      # migration chain and [phase 2/3] the Group Store human-notify contract
      # (the v20 prefix upgrade is [phase 3/3]). Do not create a second
      # unmanaged database lifecycle for them.
      - name: Run MySQL full migration chain and Group Store notify contracts
        if: steps.changes.outputs.skip-bcs != 'true'
        run: python3 scripts/ci_contract_test.py --package bcs-admin --binary bcs-admin --test full_mysql_migration_chain_applies_and_preserves_history

      - name: Run MySQL Group Context contract
        if: steps.changes.outputs.skip-bcs != 'true'
        run: python3 scripts/ci_contract_test.py --package bcs-group-context-store --binary conformance_group_context_repo_mysql --test mysql_group_context_timestamps_roundtrip_in_utc_and_non_utc_sessions

      - name: Run MySQL DB plugin contract
        if: steps.changes.outputs.skip-bcs != 'true'
        run: python3 scripts/ci_contract_test.py --package bcs-db-mysql --binary conformance_db_plugin --test conformance_mysql_db_plugin_for_text_and_prepared_protocols

      # Bot-authority plan §6 gates (Task 8): four dedicated
      # disposable databases (one per service above). Each
      # step must report `1 passed / 0 failed / 0 ignored` —
      # a matching-zero run ("0 tests") also fails the step
      # — and the harness scenario inventory line so an
      # empty aggregate can never slip through.
      - name: Run Bot Authority strict reads/manager/transfer MySQL conformance
        if: steps.changes.outputs.skip-bcs != 'true'
        env:
          BCS_TEST_MYSQL_URL: mysql://bcs:bcs_test_only@127.0.0.1:3307/bcs_authority_edge
        run: |
          output=$(python3 scripts/ci_contract_test.py --package bcs-edge-permission-store --binary authority_mysql --test authority_mysql_conformance 2>&1) \
            || { echo "$output"; exit 1; }
          echo "$output"
          echo "$output" | grep -q 'test result: ok. 1 passed; 0 failed; 0 ignored' \
            || { echo "expected summary: 1 passed / 0 failed / 0 ignored" >&2; exit 1; }
          echo "$output" | grep -q 'authority-mysql-gate=edge-authority scenarios=63' \
            || { echo "authority scenario inventory unfinished" >&2; exit 1; }

      - name: Run Bot Authority provider lifecycle MySQL conformance
        if: steps.changes.outputs.skip-bcs != 'true'
        env:
          BCS_TEST_MYSQL_URL: mysql://bcs:bcs_test_only@127.0.0.1:3308/bcs_authority_bot
        run: |
          output=$(python3 scripts/ci_contract_test.py --package bcs-bot-store --binary authority_mysql --test provider_lifecycle_mysql_conformance 2>&1) \
            || { echo "$output"; exit 1; }
          echo "$output"
          echo "$output" | grep -q 'test result: ok. 1 passed; 0 failed; 0 ignored' \
            || { echo "expected summary: 1 passed / 0 failed / 0 ignored" >&2; exit 1; }
          echo "$output" | grep -q 'authority-mysql-gate=provider-lifecycle scenarios=30' \
            || { echo "provider lifecycle scenario inventory unfinished" >&2; exit 1; }

      - name: Run Bot Authority group snapshot MySQL conformance
        if: steps.changes.outputs.skip-bcs != 'true'
        env:
          BCS_TEST_MYSQL_URL: mysql://bcs:bcs_test_only@127.0.0.1:3309/bcs_authority_group
        run: |
          output=$(python3 scripts/ci_contract_test.py --package bcs-group-store --binary authority_mysql --test group_authorization_mysql_conformance 2>&1) \
            || { echo "$output"; exit 1; }
          echo "$output"
          echo "$output" | grep -q 'test result: ok. 1 passed; 0 failed; 0 ignored' \
            || { echo "expected summary: 1 passed / 0 failed / 0 ignored" >&2; exit 1; }
          echo "$output" | grep -q 'authority-mysql-gate=group-authorization scenarios=9' \
            || { echo "group snapshot scenario inventory unfinished" >&2; exit 1; }

      - name: Run Bot Authority session snapshot MySQL conformance
        if: steps.changes.outputs.skip-bcs != 'true'
        env:
          BCS_TEST_MYSQL_URL: mysql://bcs:bcs_test_only@127.0.0.1:3310/bcs_authority_session
        run: |
          output=$(python3 scripts/ci_contract_test.py --package bcs-session-store --binary authority_mysql --test session_authorization_mysql_conformance 2>&1) \
            || { echo "$output"; exit 1; }
          echo "$output"
          echo "$output" | grep -q 'test result: ok. 1 passed; 0 failed; 0 ignored' \
            || { echo "expected summary: 1 passed / 0 failed / 0 ignored" >&2; exit 1; }
          echo "$output" | grep -q 'authority-mysql-gate=session-authorization scenarios=6' \
            || { echo "session snapshot scenario inventory unfinished" >&2; exit 1; }

      - name: Run MySQL Eventing migration contract
        if: steps.changes.outputs.skip-bcs != 'true'
        run: python3 scripts/ci_contract_test.py --package bcs-admin --binary bcs-admin --test eventing_mysql_migration_applies_to_real_mysql

      - name: Run MySQL HumanInput index migration contract
        if: steps.changes.outputs.skip-bcs != 'true'
        run: python3 scripts/ci_contract_test.py --package bcs-admin --binary bcs-admin --test human_input_index_migrations_apply_to_real_mysql

      - name: Run MySQL merged 016 migration contract
        if: steps.changes.outputs.skip-bcs != 'true'
        run: python3 scripts/ci_contract_test.py --package bcs-admin --binary bcs-admin --test merged_016_migration_applies_to_real_mysql

      - name: Run MySQL fixed Loop migration contract
        if: steps.changes.outputs.skip-bcs != 'true'
        run: python3 scripts/ci_contract_test.py --package bcs-admin --binary bcs-admin --test fixed_loop_migration_applies_to_real_mysql

      - name: Run MySQL fixed Loop snapshot and rerun contracts
        if: steps.changes.outputs.skip-bcs != 'true'
        run: python3 scripts/ci_contract_test.py --package bcs-collaboration-store --binary mysql_store --test real_mysql_fixed_loop_snapshot_and_rerun_contract

      - name: Run MySQL Event Store and Delivery contracts
        if: steps.changes.outputs.skip-bcs != 'true'
        run: python3 scripts/ci_contract_test.py --package bcs-event-store --binary conformance_event_store_mysql --test mysql_event_store_passes_contract

      - name: Enforce coverage gates
        if: steps.changes.outputs.skip-bcs != 'true'
        env:
          BCS_BASE_REF: ${{ steps.changes.outputs.base-ref }}
        working-directory: ${{ github.workspace }}/apps/bcs
        run: |
          python3 scripts/cov_gate.py \
            --base-ref "$BCS_BASE_REF" \
            --bcs-dir "$PWD" \
            --pass-rate-min 100 \
            --overall-line-min 84 \
            --changed-line-min 80

      - name: Upload BCS test results
        if: always() && steps.changes.outputs.skip-bcs != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bcs-testresult
          path: apps/bcs/testresult/
          if-no-files-found: ignore

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # PR: compare against the checked-out merge commit's exact base tree.
      # push/dispatch: compare against dev (repo default branch) instead.
      BACKEND_BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/dev' }}
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend changes vs base
        id: changes
        # Run from the repo root so the "-- apps/backend" pathspec resolves; the job
        # default working-directory is apps/backend, so override to the workspace root.
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          # Make sure the base ref is present locally (shallow clones may not have it).
          git fetch --no-tags --depth=1 origin "${BACKEND_BASE_REF#origin/}" 2>/dev/null || true
          # Diff the base ref against the working tree. PR runs check out a merge commit,
          # for which "<base>...HEAD" collapses to nothing; diffing base against the tree
          # sees all PR-introduced changes regardless of the merge-commit checkout.
          mapfile -t files < <(git diff --name-only "${BACKEND_BASE_REF}" -- apps/backend singlebox/ci/legacy_skill_compatibility.sh .github/workflows/unit-tests.yml || true)
          n=${#files[@]}
          if [ "$n" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No changes under apps/backend vs ${BACKEND_BASE_REF}; skipping backend tests."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Detected ${n} changed file(s) under apps/backend vs ${BACKEND_BASE_REF}."
            printf '%s\n' "${files[@]}" | sed 's/^/  - /'
          fi

      - name: Set up Python
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          # Backend targets Python >=3.12,<3.13 (see apps/backend/pyproject.toml).
          python-version: '3.12'

      - name: Install uv
        if: steps.changes.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Run unit tests with coverage
        if: steps.changes.outputs.skip != 'true'
        # ci_test.sh runs pytest with coverage and enforces the case-pass-rate /
        # line-coverage / changed-line-coverage gates via scripts/ci/report_check.py.
        run: bash scripts/ci_test.sh --base "$BACKEND_BASE_REF"

      - name: Enforce Legacy Skill compatibility gate
        if: steps.changes.outputs.skip != 'true'
        working-directory: ${{ github.workspace }}
        run: bash singlebox/ci/legacy_skill_compatibility.sh

      - name: Upload backend test results
        if: always() && steps.changes.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-testresult
          path: apps/backend/pytest_report/
          if-no-files-found: ignore

  engine:
    name: Engine unit tests
    runs-on: ubuntu-latest
    env:
      ENGINE_BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/dev' }}
    defaults:
      run:
        working-directory: engine/adapter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect engine changes vs base
        id: changes
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${ENGINE_BASE_REF#origin/}" 2>/dev/null || true
          mapfile -t files < <(git diff --name-only "${ENGINE_BASE_REF}" -- engine/adapter || true)
          n=${#files[@]}
          if [ "$n" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No changes under engine/adapter vs ${ENGINE_BASE_REF}; skipping engine tests."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Detected ${n} changed file(s) under engine/adapter vs ${ENGINE_BASE_REF}."
            printf '%s\n' "${files[@]}" | sed 's/^/  - /'
          fi

      - name: Set up Python
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          # Engine targets Python >=3.12 (see engine/adapter/pyproject.toml).
          python-version: '3.12'

      - name: Install uv
        if: steps.changes.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: engine/adapter/uv.lock

      - name: Run unit tests with coverage
        if: steps.changes.outputs.skip != 'true'
        run: bash scripts/ci_test.sh --base "$ENGINE_BASE_REF"

      - name: Upload engine test results
        if: always() && steps.changes.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engine-testresult
          path: engine/adapter/pytest_report/
          if-no-files-found: ignore

  baas:
    name: BaaS unit tests
    runs-on: ubuntu-latest
    env:
      # PR: compare against the checked-out merge commit's exact base tree.
      # push/dispatch: compare against dev (repo default branch) instead.
      BAAS_BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/dev' }}
    defaults:
      run:
        working-directory: apps/baas
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect baas changes vs base
        id: changes
        # Run from the repo root so the "-- apps/baas" pathspec resolves; the job
        # default working-directory is apps/baas, so override to the workspace root.
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          # Make sure the base ref is present locally (shallow clones may not have it).
          git fetch --no-tags --depth=1 origin "${BAAS_BASE_REF#origin/}" 2>/dev/null || true
          # Diff the base ref against the working tree. PR runs check out a merge commit,
          # for which "<base>...HEAD" collapses to nothing; diffing base against the tree
          # sees all PR-introduced changes regardless of the merge-commit checkout.
          mapfile -t files < <(git diff --name-only "${BAAS_BASE_REF}" -- apps/baas || true)
          n=${#files[@]}
          if [ "$n" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No changes under apps/baas vs ${BAAS_BASE_REF}; skipping baas tests."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Detected ${n} changed file(s) under apps/baas vs ${BAAS_BASE_REF}."
            printf '%s\n' "${files[@]}" | sed 's/^/  - /'
          fi

      - name: Set up Python
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          # Baas targets Python >=3.12,<3.13 (see apps/baas/pyproject.toml).
          python-version: '3.12'

      - name: Install uv
        if: steps.changes.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/baas/uv.lock

      - name: Run unit tests with coverage
        if: steps.changes.outputs.skip != 'true'
        # ci_test.sh runs pytest with coverage and enforces the case-pass-rate /
        # line-coverage / changed-line-coverage gates via scripts/ci/report_check.py.
        run: DEPLOY_ENV=dev bash scripts/ci_test.sh --base "${BAAS_BASE_REF}"

      - name: Upload baas test results
        if: always() && steps.changes.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: baas-testresult
          path: apps/baas/pytest_report/
          if-no-files-found: ignore

  gateway:
    name: Gateway unit tests
    runs-on: ubuntu-latest
    env:
      # PR: compare against the checked-out merge commit's exact base tree.
      # push/dispatch: compare against dev (repo default branch) instead.
      GATEWAY_BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/dev' }}
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect gateway changes vs base
        id: changes
        # Run from the repo root so the "-- apps/gateway" pathspec resolves; the job
        # default working-directory is apps/gateway, so override to the workspace root.
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          # Make sure the base ref is present locally (shallow clones may not have it).
          git fetch --no-tags --depth=1 origin "${GATEWAY_BASE_REF#origin/}" 2>/dev/null || true
          # Diff the base ref against the working tree. PR runs check out a merge commit,
          # for which "<base>...HEAD" collapses to nothing; diffing base against the tree
          # sees all PR-introduced changes regardless of the merge-commit checkout.
          mapfile -t files < <(git diff --name-only "${GATEWAY_BASE_REF}" -- apps/gateway || true)
          n=${#files[@]}
          if [ "$n" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No changes under apps/gateway vs ${GATEWAY_BASE_REF}; skipping gateway tests."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Detected ${n} changed file(s) under apps/gateway vs ${GATEWAY_BASE_REF}."
            printf '%s\n' "${files[@]}" | sed 's/^/  - /'
          fi

      - name: Set up Python
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          # Gateway targets Python >=3.12 (see apps/gateway/pyproject.toml).
          python-version: '3.12'

      - name: Install uv
        if: steps.changes.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/gateway/uv.lock

      - name: Run unit tests with coverage
        if: steps.changes.outputs.skip != 'true'
        # ci_test.sh runs ruff lint + pytest with coverage and produces JUnit XML
        # and HTML reports under pytest_report/.
        run: bash scripts/ci_test.sh --base "${GATEWAY_BASE_REF}"

      - name: Upload gateway test results
        if: always() && steps.changes.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gateway-testresult
          path: apps/gateway/pytest_report/
          if-no-files-found: ignore

  proxy:
    name: Sandbox-proxy unit tests
    runs-on: ubuntu-latest
    env:
      # PR: compare against the checked-out merge commit's exact base tree.
      # push/dispatch: compare against dev (repo default branch) instead.
      PROXY_BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/dev' }}
    defaults:
      run:
        working-directory: apps/proxy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect proxy changes vs base
        id: changes
        # Run from the repo root so the "-- apps/proxy" pathspec resolves; the job
        # default working-directory is apps/proxy, so override to the workspace root.
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          # Make sure the base ref is present locally (shallow clones may not have it).
          git fetch --no-tags --depth=1 origin "${PROXY_BASE_REF#origin/}" 2>/dev/null || true
          # Diff the base ref against the working tree. PR runs check out a merge commit,
          # for which "<base>...HEAD" collapses to nothing; diffing base against the tree
          # sees all PR-introduced changes regardless of the merge-commit checkout.
          mapfile -t files < <(git diff --name-only "${PROXY_BASE_REF}" -- apps/proxy || true)
          n=${#files[@]}
          if [ "$n" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No changes under apps/proxy vs ${PROXY_BASE_REF}; skipping proxy tests."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Detected ${n} changed file(s) under apps/proxy vs ${PROXY_BASE_REF}."
            printf '%s\n' "${files[@]}" | sed 's/^/  - /'
          fi

      - name: Set up Python
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          # Proxy targets Python >=3.12 (see apps/proxy/pyproject.toml).
          python-version: '3.12'

      - name: Install uv
        if: steps.changes.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/proxy/uv.lock

      - name: Run unit tests with coverage
        if: steps.changes.outputs.skip != 'true'
        # ci_test.sh runs ruff lint + pytest with coverage and produces JUnit
        # XML and HTML reports under pytest_report/.
        run: bash scripts/ci_test.sh --base "${PROXY_BASE_REF}"

      - name: Upload proxy test results
        if: always() && steps.changes.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proxy-testresult
          path: apps/proxy/pytest_report/
          if-no-files-found: ignore
