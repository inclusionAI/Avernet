name: Frontend Nextgen

on:
  pull_request:
    branches:
      - dev
      - main
      - 'REL*'
    paths:
      - 'apps/frontend-nextgen/**'
      - 'packages/a2a-chat-client/**'
      - 'docker/services/frontend-nextgen.dockerfile'
      - 'docker/services/service-deployment.yaml'
      - 'docker/kube-deploy.sh'
      - '.github/workflows/frontend-nextgen.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'apps/frontend-nextgen/**'
      - 'packages/a2a-chat-client/**'
      - 'docker/services/frontend-nextgen.dockerfile'
      - 'docker/services/service-deployment.yaml'
      - 'docker/kube-deploy.sh'
      - '.github/workflows/frontend-nextgen.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-nextgen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Open Core frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-nextgen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend-nextgen/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install locked public dependencies
        run: npm ci

      - name: Check Open Core boundary
        run: npm run check:open-core

      - name: Run frontend CI
        run: npm run ci

  a2a-chat-client:
    name: Shared a2a-chat-client package checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/a2a-chat-client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/a2a-chat-client/package-lock.json

      - name: Install dev dependencies (oracle + test chain)
        run: npm ci

      - name: Typecheck package
        run: npx tsc --noEmit

      - name: Check Open Core boundary (package root)
        run: node ../../apps/frontend-nextgen/scripts/check-open-core.cjs .

      - name: Run package tests
        run: npx jest --runInBand
