  <g class="t">
    <text x="44" y="50" class="title">微内核七角色：一套分层，两个模块</text>
    <text x="44" y="78" class="sub">Backend 与 Engine 部署形态完全不同，内部结构却同构。每一层里列出几个实际组件，便于对上号；层数与依赖方向一致，不同的是各自的系统边界通向哪里。</text>
    <text x="44" y="120" class="colhead">架构角色</text>
    <text x="240" y="120" class="colhead">职责</text>
    <text x="660" y="120" class="colhead">BACKEND · 中心化多租户服务</text>
    <text x="1058" y="120" class="colhead">ENGINE · 随 Bot 部署的单机服务</text>
