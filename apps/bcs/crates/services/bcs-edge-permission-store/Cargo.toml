[package]
name = "bcs-edge-permission-store"
description = "Edge-permission persistence stores (edge_grants / permission_profiles / permission_requests) for BCS"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[dependencies]
async-trait = { workspace = true }
bcs-db-api = { workspace = true }
bcs-domain = { workspace = true }
bcs-service-api = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bcs-db-local = { workspace = true }
bcs-test-support = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
# tests/authority_transaction_capability.rs pulls bootstrap migrations.rs in
# via #[path] (same pattern as bcs-message-store); it needs sha2/hex to
# compile (same versions as the bcs crate that owns the file). sha2 is a
# regular dependency above.
hex = { workspace = true }
# tests/conformance_bot_authority.rs drives the shared authority contract:
# the SQL driver (DbBotAuthorityStore), the in-memory MemoryBotRepo driver,
# and the production Core over both.
bcs-edge-permission = { workspace = true }
bcs-bot-store = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true