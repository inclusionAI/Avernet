name: ClawWeb CI

on:
  push:
    paths:
      - "src/evolverun/clawweb/**"
      - ".github/workflows/clawweb-ci.yml"
  pull_request:
    paths:
      - "src/evolverun/clawweb/**"
      - ".github/workflows/clawweb-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawweb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/evolverun/clawweb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: src/evolverun/clawweb/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check packages
        run: npm run check

      - name: Build packages
        run: npm run build
