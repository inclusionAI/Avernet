BotCandidateSearchPath:
  get:
    operationId: search_bot_candidates
    tags: ["Collaboration / Bots"]
    summary: >-
      Search candidate physical Bots from a managed Bot's perspective (including Human Actor).
    description: >-
      Human control-plane projection of legacy /actors/search. The path bot_id
      replaces legacy current_bot_uuid, while purpose maps to legacy
      cooperatable_only. Search first uses the configured semantic worker
      recommendation service with a fixed top-K of 20. Results contain
      physical Bots only and preserve recommendation ordering when available.
      An omitted, empty, or whitespace-only q returns an empty successful
      result without invoking semantic or name search. Gateway route admission
      does not require a User, App, or Bot Principal. BCS still requires a
      usable Human identity and authorizes the selected perspective. An
      authenticated Human browser is an explicit read-only consumer of this
      operation; it has no /openapi/v1 alias and no anonymous access, and it
      needs the same usable Human identity and perspective authorization. A
      semantic call performs at most one provider recall of up to 20 candidate
      items. The result is the authorized subset of that recall, in provider
      order; it may contain fewer than 20 items because no top-up query fills
      the page. When that recall is empty, the provider is unavailable or
      fails, or every recalled Bot is filtered out, the operation falls back to
      a trimmed case-insensitive Bot-name substring search; the fallback is
      likewise bounded to 20 items and applies the same viewer visibility
      filtering before pagination. Recalled Bots that survive authorization
      but are absent from the registry are skipped; when every recalled Bot
      is absent, the operation returns an empty semantic result rather than
      a name fallback.
    x-avernet-security:
      user: optional
      app: optional
      bot: optional
    x-avernet-behavior:
      legacy_equivalent: /actors/search
      acting_bot:
        - managed_physical_bot
        - current_human_actor
      result_kind: bot
      purpose_mapping:
        discovery:
          cooperatable_only: false
        collaboration:
          cooperatable_only: true
      top_k: 20
      primary_ordering: provider_order
      friend_source: approved_connect_edge
      viewer_visibility:
        human: user_visibility
        bot: visibility
      fallback: trimmed_case_insensitive_name_substring
      empty_query:
        equivalent_inputs:
          - omitted
          - empty
          - whitespace
        downstream_search: skip
      search_modes:
        - empty_query
        - semantic
        - name_fallback
    parameters:
      - $ref: ../shared.yaml#/BotIdPath
      - name: q
        in: query
        description: >-
          Optional natural-language candidate search query. Omitted, empty,
          and whitespace-only values have identical empty-query semantics.
        schema:
          type: string
      - name: purpose
        in: query
        description: >-
          discovery returns public and protected Bots. collaboration returns
          public Bots plus accepted friends regardless of non-public visibility.
        schema:
          type: string
          enum:
            - discovery
            - collaboration
          default: discovery
    responses:
      "200":
        description: >-
          Candidate Bots in recommendation order, or legacy name-fallback order
          when semantic recommendation does not produce a usable result.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotCandidateSearchEnvelope
      "400":
        description: Invalid candidate-search query.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: A supplied Gateway Principal is invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: >-
          BCS requires a usable Human identity; the current Human must manage
          the selected physical Bot, or the selected Human Actor must represent
          that Human.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Acting Bot is missing, deleted, or unonboarded.
        x-error-codes:
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

QueryBotsPath:
  post:
    operationId: query_bots
    tags: ["Collaboration / Bots"]
    summary: Query Bot domain objects by explicit identifiers.
    description: >-
      Human control-plane operation for deterministic explicit-ID hydration.
      Both physical Bot and Human rows can be returned. The operation does not
      apply ownership or visibility filtering. Duplicate IDs are collapsed at
      their first occurrence; missing, deleted, and unonboarded rows are
      silently omitted. An empty bot_ids array returns an empty items array.
    x-avernet-security:
      user: required
      app: required
    x-avernet-behavior:
      result_kinds:
        - bot
        - human
      authorization_filter: none
      visibility_filter: none
      deduplicate: first_occurrence
      ordering: request_order
      missing: omit
      deleted: omit
      unonboarded: omit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/QueryBotsRequest"
    responses:
      "200":
        description: Bot objects in first-occurrence request order.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotListEnvelope
      "400":
        description: Invalid JSON body, identifier, or batch size.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: Authenticated Principal is not a Human control-plane caller.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

BotPath:
  get:
    operationId: get_bot
    tags: ["Collaboration / Bots"]
    summary: Get one Bot domain object by exact identifier.
    description: >-
      Human control-plane exact-ID lookup for either a physical Bot or a Human
      row. No acting Bot, ownership filter, or visibility filter is applied;
      visibility controls directory discovery rather than explicit hydration.
    x-avernet-security:
      user: required
      app: required
    x-avernet-behavior:
      result_kinds:
        - bot
        - human
      visibility_filter: none
    parameters:
      - $ref: ../shared.yaml#/BotIdPath
    responses:
      "200":
        description: Full Bot domain object selected by kind.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotEnvelope
      "400":
        description: Invalid Bot identifier encoding.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: Authenticated Principal is not a Human control-plane caller.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Bot is missing, deleted, or unonboarded.
        x-error-codes:
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse
  patch:
    operationId: update_bot
    tags: ["Collaboration / Bots"]
    summary: Update the explicitly mutable Bot properties.
    description: >-
      Human control-plane owner update. The current Human staff_no must equal
      the target row's created_by; a missing created_by is not special-cased and
      is therefore forbidden. descriptor is a nested partial update available
      only for a physical Bot. Descriptor arrays replace their complete stored
      arrays. bot_id, kind, env, created_by, timestamps, reachability, provider,
      and agent_code are immutable through this operation.
    x-avernet-security:
      user: required
      app: required
    x-avernet-behavior:
      authorization: created_by_matches_current_staff_no
      missing_created_by: forbidden
      descriptor_kind: bot_only
      descriptor_arrays: replace
    parameters:
      - $ref: ../shared.yaml#/BotIdPath
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/UpdateBotRequest"
    responses:
      "200":
        description: Updated full Bot domain object with refreshed updated_at.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotEnvelope
      "400":
        description: >-
          Empty or invalid patch, or a descriptor patch targeting a Human row.
        x-error-codes:
          - invalid_request
          - invalid_bot_kind
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: Current Human is not the target row's created_by.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "404":
        description: Bot is missing, deleted, or unonboarded.
        x-error-codes:
          - bot_not_found
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

MyBotsPath:
  get:
    operationId: list_my_bots
    tags: ["Collaboration / Bots"]
    summary: >-
      List Bot rows controllable by the current Human (the owner|manager
      union plus the Human self entry).
    description: >-
      Human control-plane operation. The candidate set is the caller's
      approved owner|manager edge union plus the Human self entry (the §10.2a
      legacy creator window may also contribute rows during the migration
      window), without kind-specific handling.
      Both physical Bot and Human rows can be returned. Omitting kind means all
      kinds; reachability only matches physical Bots, so combining kind=human
      with reachability produces an empty page.
      Each returned row includes avatar_url: the current Bot display URL, or
      null for Bots without an avatar and for Human rows. Avatars are read only
      after the page passes the list-drift retry and composition checks. A
      rejected page returns bot_list_changed without reading avatars; avatar
      read failures on an accepted page fail the request rather than returning
      misleading null values.
    x-avernet-security:
      user: required
      app: required
    x-avernet-behavior:
      owner_field: created_by
      owner_value: current_staff_no
      omitted_kind: all
      reachability_applies_to: bot
      ordering:
        - human_self_first
        - reachable_first
        - created_at_desc
        - bot_id_asc
    parameters:
      - name: kind
        in: query
        description: Bot kind filter; omission returns both kinds.
        schema:
          type: string
          enum:
            - bot
            - human
      - name: name
        in: query
        description: >-
          Optional trimmed, case-insensitive name substring; empty is absent.
        schema:
          type: string
      - name: status
        in: query
        description: Raw persisted status filter.
        schema:
          $ref: ../domain-models.yaml#/BotStatus
      - name: reachability
        in: query
        description: >-
          Computed reachability filter for physical Bots only; when omitted,
          the same computed value still drives the page order (reachable rows
          before unreachable ones).
        schema:
          $ref: ../domain-models.yaml#/BotReachability
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: >-
          Rows ordered with the Human self entry first, then reachable
          physical Bots before unreachable ones over the same runtime
          observation, created_at descending with bot_id ascending as the
          deterministic tie-breaker, then paginated; an explicit reachability
          filter degenerates the order to plain created_at descending.
        content:
          application/json:
            schema:
              $ref: ../domain-models.yaml#/BotPageEnvelope
      "400":
        description: Invalid filter or pagination parameter.
        x-error-codes:
          - invalid_request
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "401":
        description: Gateway Human Principal is missing or invalid.
        x-error-codes:
          - unauthenticated
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "403":
        description: Authenticated Principal is not a Human control-plane caller.
        x-error-codes:
          - forbidden
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500":
        $ref: ../shared.yaml#/InternalErrorResponse

QueryBotsRequest:
  type: object
  additionalProperties: false
  required:
    - bot_ids
  properties:
    bot_ids:
      type: array
      maxItems: 100
      description: >-
        Explicit IDs. Duplicates are accepted and collapsed at their first
        occurrence. An empty array is valid.
      items:
        type: string
        minLength: 1

UpdateBotDescriptor:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    summary:
      type: string
      description: New summary; omission keeps the stored value.
    domains:
      type: array
      description: Complete replacement; an empty array clears the value.
      items:
        type: string
    skills:
      type: array
      description: Complete replacement; an empty array clears the value.
      items:
        $ref: ../domain-models.yaml#/BotSkill
    scopes:
      type: array
      description: Complete replacement; an empty array clears the value.
      items:
        type: string

UpdateBotRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
    visibility:
      $ref: ../domain-models.yaml#/BotVisibility
    status:
      $ref: ../domain-models.yaml#/BotStatus
    descriptor:
      $ref: "#/UpdateBotDescriptor"
    task_claim_mode:
      type: boolean
      description: >-
        Task-claim opt-in toggle. Omit to leave the stored value unchanged;
        defaults to false when never set. Physical bots only.
    task_dream_mode:
      type: boolean
      description: >-
        Task-dream opt-in toggle. Omit to leave the stored value unchanged;
        defaults to false when never set. Physical bots only.
    user_visibility:
      $ref: ../domain-models.yaml#/UserVisibility
    friend_ext:
      type: object
      additionalProperties: true
      description: Friend connection policy extension, including department scopes.
    friend_check_in_strategy:
      $ref: ../domain-models.yaml#/FriendCheckInStrategy
