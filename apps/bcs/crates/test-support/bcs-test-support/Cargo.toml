[package]
name         = "bcs-test-support"
description  = "Test fixtures for BCS service contracts"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[features]
diagnostic-logs = ["dep:bcs-observability", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
bcs-domain      = { workspace = true }
bcs-service-api = { workspace = true }
bcs-config      = { workspace = true }
bcs-db-local    = { workspace = true }
bcs-bot         = { workspace = true }
bcs-bot-store   = { workspace = true }
bcs-app-bot     = { workspace = true }
bcs-edge-permission = { workspace = true }
bcs-edge-permission-store = { workspace = true }
bcs-app-register = { workspace = true }
bcs-route-security = { workspace = true }
bcs-relation    = { workspace = true }
bcs-auth-api    = { workspace = true }
bcs-cache-api   = { workspace = true }
bcs-db-api      = { workspace = true }
bcs-llm-api     = { workspace = true }
bcs-human-notify-api = { workspace = true }
bcs-session     = { workspace = true }
bcs-session-file = { workspace = true }
bcs-observability = { workspace = true, optional = true }
tracing         = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
axum            = { workspace = true }
tokio           = { workspace = true }
async-trait     = { workspace = true }
serde_json      = { workspace = true }
uuid            = { workspace = true }
sha2            = { workspace = true }
