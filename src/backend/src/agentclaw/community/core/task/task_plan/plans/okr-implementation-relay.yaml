template_id: okr-implementation-relay
entry_bot_id: 20260828_8azkbtgs
entry_name: 入口 OKR实现Bot
task_type: static_plan
# 串行接力 V2。链:
# 入口(20260828_8azkbtgs,图前:分析OKR→决定找营销策略专家)
# -> ① 营销策略专家(20260828_whd6nx7x,单独:产出策略方向+判定信息不够,决定拉圈人选品)
# -> ② 策略生成群(driver 专家 20260828_whd6nx7x + 圈人 20260828_6snfeiq0 + 选品 20260828_roqtqqkx:
#      专家驱动,圈人/选品细化,专家汇成完整营销策略)
# -> ③'业务风控专家(20260828_7q4cbeze,单独:拿到②策略→定风险点与范围→启动风险评审,框架据此拉下一节点的风险评审群)
# -> ③ 风险评审群(业务风控 20260828_7q4cbeze driver+合规 20260828_jbadndne)
# -> ④ 不可实现任务转BBS广场+自动研发(20260828_f7wfi27d,串行腿非旁路;须把上游策略/风险全料一并带到正文供⑤审核)
# -> ⑤ 营销策略审核(20260828_9rgd70li)
# -> ⑥ 投放实施(20260828_k9c2slro)
# -> ⑦ 通知(notify,负责人)
#
# 接力承载: 每个节点 input 只透传上游"产出正文"(handoff=$.result / 入口=okr 原文);
# 框架在 _decorate 注入 V2 输入三段(# 接自 / ## 群组成 / ## 上游产出正文 / ## 本角色任务),不做摘要/合成。
# 各节点 task 已据 playbook 总结"上游会给你什么 + 你的角色任务";rule(输出格式/接力交接)仍由各 bot 的 skill/rule 配置。
input_schema:
  okr:
    type: string
    required: true
nodes:
  - id: marketing_strategy
    name: 营销策略专家
    type: bot
    bot_id: 20260828_whd6nx7x
    depends_on: []
    input:
      okr: $.input.okr
    output:
      handoff: $.result
    task: |
      上游会给你(入口 OKR实现Bot):OKR 目标与活动背景,以及他对"为什么卡在营销策略"的根因与交给你的问题;若仅给到原始需求(无分析),请自行先抓"为何营销策略是关键卡点"的根因,再据此产出。
      你据此产出双十一大促营销策略;遇到你无法独立闭环的部分,按你的判断决定如何推进。
  - id: strategy_generation_group
    name: 策略生成群
    type: collaboration
    depends_on: [marketing_strategy]
    collaboration:
      bot_ids: [20260828_whd6nx7x, 20260828_6snfeiq0, 20260828_roqtqqkx]
      bot_names: [营销策略专家, 圈人 specialist, 选品 specialist]
      mode: chat
      completion: report
    input:
      handoff: $.marketing_strategy.output.handoff
    output:
      handoff: $.result
    task: |
      上游会给你(① 营销策略专家产出):背景/目标、三平台差异化营销策略方向、他识别需补的圈人/选品部分、处理不了的问题(多平台价比、低价拉新质量、舆情需风控/无人承接)。
      你是专家(driver):向圈人/选品 specialist 派活,每人按其专长各自细化;最终你须把【三平台差异化策略 + 圈人人群方案 + 选品商品方案 + 营销玩法】汇总成一份完整营销策略产出正文上报,让下游业务风控专家一次拿到全部方案(不要只给策略结论、漏掉人群/选品细节)。
      处理不了的问题,按你的判断标明。
  - id: risk_lead
    name: 业务风控专家
    type: bot
    bot_id: 20260828_7q4cbeze
    depends_on: [strategy_generation_group]
    input:
      handoff: $.strategy_generation_group.output.handoff
    output:
      handoff: $.result
    task: |
      上游会给你(② 策略生成群完整产出):背景/目标、三平台完整营销策略、圈人人群方案、选品商品方案,以及群识别处理不了的问题(多平台价比/退款争议/库存匹配/低价拉新质量需风控评估;舆情监测缺口无人承接)。
      你是全局业务风控 owner(不止纯业务):围绕营销目标,对策略落地可能带来的业务/经营/合规、以及会影响业务结果的技术/系统风险做统一判断,识别需重点评估的风险点与范围,启动风险评审(下一步会拉合规专家进群一起评审)。
      处理不了的问题,按你的判断标明。
  - id: risk_assessment
    name: 风险评审群
    type: collaboration
    depends_on: [risk_lead]
    collaboration:
      bot_ids: [20260828_7q4cbeze, 20260828_jbadndne]
      bot_names: [业务风控, 合规]
      mode: chat
      completion: report
    input:
      handoff: $.risk_lead.output.handoff
    output:
      risk_result: $.report.result
      unhandled_tasks: $.result.unhandled_tasks
      handoff: $.result
    task: |
      上游会给你(③' 业务风控专家):需重点评估的风险点与范围初判 + ② 策略要点。
      你是风险评审群(driver 业务风控 7q4cbeze + 合规 jbadndne):基于上家风险点与范围,做双十一大促业务/合规风险评审,逐项给成因/等级/约束。
      处理不了的问题,按你的判断标明。
      (硬字段:driver output JSON 须带 unhandled_tasks 数组,供框架路由后续;叙述用职能词)
  - id: risk_unhandled_to_bbs
    name: 不可实现任务转BBS广场
    type: bbs_handoff
    bot_id: 20260828_f7wfi27d
    depends_on: [risk_assessment]
    input:
      unhandled_tasks: $.risk_assessment.output.unhandled_tasks
      handoff: $.risk_assessment.output.handoff
    output:
      bbs_handed: $.result
      handoff: $.result
    task: |
      上游会给你(③ 风险评审群完整产出):背景/目标、各类业务/合规风险逐项(成因/等级/约束),以及识别无人承接的任务(如"舆情监测系统无承接团队")。
      你是自动研发:把上家识别出无人承接的任务组织成研发需求并交付;你必在本跳产出正文里 carry-forward 上游①策略/②圈人选品/③完整风险清单全料,供下游审核一次审齐。
      框架兜底:上家真实上报未带 unhandled_tasks,按占位 mock。
  - id: strategy_approval
    name: 营销策略审核
    type: bot
    bot_id: 20260828_9rgd70li
    depends_on: [risk_unhandled_to_bbs]
    input:
      handoff: $.risk_unhandled_to_bbs.output.handoff
    output:
      approval_result: $.result
      handoff: $.result
    task: |
      上游会给你(④ 自动研发完整产出正文):④ 自产研发交付 + carry-forward 的①策略/②圈人选品细节/③完整风险清单。
      你看不到③完整风险清单的话,是 ④ rule 没 carry-forward,不找框架做 fan-in。
      你是结构化审核:对双十一大促营销策略做结构化审核;需要退回或流转的,按你的判断给建议。
  - id: implementation
    name: 投放实施
    type: bot
    bot_id: 20260828_k9c2slro
    depends_on: [strategy_approval]
    input:
      handoff: $.strategy_approval.output.handoff
    output:
      implementation_result: $.result
      handoff: $.result
    task: |
      上游会给你(⑤ 审核完整产出):审核结论、问题清单(各级别+处理意见+需⑥盯控的高风险项)。
      你是投放实施:把已批准方案落为各平台/时段/资源位执行动作并跟踪;异常按你的判断决定处置方式。
  - id: notify_done
    name: 通知完成
    type: notify
    depends_on: [implementation]
    input:
      handoff: $.implementation.output.handoff
    task: |
      上游会给你(⑥ 投放实施完整产出):配置单、监控规则、日报、当日异常处置。
      把"大促已实施 + 进展/风险 + 各跳交接摘要"通知负责人。
