[package]
name = "avernet-goal-cli"
version = "1.0.0-dev"
edition = "2024"
description = "avernet-goal-cli CLI 工具"
license = "Apache-2.0"
publish = false

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
cli-client-sdk-rust = { git = "https://code.alipay.com/codebuild/cli-client-sdk-rust.git", tag = "v2.0.3" }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }

[[bin]]
name = "avernet-goal-cli"
path = "src/main.rs"
