<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2457a6"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b3402e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">Subscriptions survive an owner crash</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">Events are durable with event_seq; the subscriber keeps its cursor and re-syncs itself. The owner never has to know who listens.</text>

  <rect x="60" y="72" width="170" height="40" rx="8" fill="#eef2fa" stroke="#2457a6"/>
  <text x="145" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2457a6">Gateway GW1</text>
  <rect x="340" y="72" width="170" height="40" rx="8" fill="#f8e6e1" stroke="#b3402e"/>
  <text x="425" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#b3402e">Executor E3 (owner)</text>
  <rect x="560" y="72" width="170" height="40" rx="8" fill="#ffffff" stroke="#2457a6"/>
  <text x="645" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2457a6">Event log (DB)</text>
  <rect x="770" y="72" width="170" height="40" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="855" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#157a55">Executor E4</text>
  <line x1="145" y1="112" x2="145" y2="400" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="425" y1="112" x2="425" y2="260" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="645" y1="112" x2="645" y2="400" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="855" y1="112" x2="855" y2="400" stroke="#b9c6bf" stroke-dasharray="3 4"/>

  <line x1="429" y1="140" x2="641" y2="140" stroke="#157a55" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="535" y="134" font-size="11" text-anchor="middle" fill="#157a55">commit #41 (fenced)</text>
  <line x1="421" y1="160" x2="149" y2="160" stroke="#2457a6" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="285" y="154" font-size="11" text-anchor="middle" fill="#2457a6">Event #41</text>
  <rect x="70" y="170" width="150" height="22" rx="5" fill="#ffffff" stroke="#2457a6"/>
  <text x="145" y="185" font-size="10.5" text-anchor="middle" fill="#2457a6">last_seq = 41</text>
  <line x1="429" y1="210" x2="641" y2="210" stroke="#157a55" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="535" y="204" font-size="11" text-anchor="middle" fill="#157a55">commit #42 (fenced)</text>
  <rect x="345" y="226" width="160" height="34" rx="5" fill="#f8e6e1" stroke="#b3402e"/>
  <text x="425" y="241" font-size="10.5" text-anchor="middle" fill="#b3402e">crashes before</text>
  <text x="425" y="254" font-size="10.5" text-anchor="middle" fill="#b3402e">publishing #42</text>

  <rect x="20" y="268" width="250" height="56" rx="6" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="34" y="286" font-size="10.5" font-weight="bold" fill="#9a6b0a">GW1 notices, without a call of its own:</text>
  <text x="34" y="302" font-size="10.5" fill="#1c2420">channel break · roster stale ·</text>
  <text x="34" y="316" font-size="10.5" fill="#1c2420">5 s re-assertion gets NOT_OWNER</text>
  <rect x="770" y="280" width="170" height="34" rx="5" fill="#ffffff" stroke="#157a55"/>
  <text x="855" y="295" font-size="10.5" text-anchor="middle" fill="#157a55">claims S (token n+1),</text>
  <text x="855" y="308" font-size="10.5" text-anchor="middle" fill="#157a55">~6–8 s after the crash</text>

  <line x1="149" y1="344" x2="851" y2="344" stroke="#2457a6" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="500" y="338" font-size="11" text-anchor="middle" fill="#2457a6">Subscribe(S, last_seq = 41)</text>
  <line x1="851" y1="364" x2="649" y2="364" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="750" y="378" font-size="10.5" text-anchor="middle" fill="#5c6a62">read events &gt; 41</text>
  <line x1="851" y1="394" x2="149" y2="394" stroke="#2457a6" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="500" y="388" font-size="11" text-anchor="middle" fill="#2457a6">Event #42 (replayed), then live</text>

  <rect x="24" y="420" width="912" height="84" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="44" y="444" font-size="13" font-weight="bold" fill="#1c2420">Guarantee</text>
  <text x="44" y="466" font-size="11.5" fill="#1c2420">Every committed control event reaches every live subscriber at least once and in order, however often ownership changes (dedup by event_seq).</text>
  <text x="44" y="486" font-size="11.5" fill="#1c2420">Planned handoff skips the wait: the old owner sends MOVED(successor) and gateways re-subscribe at once. Tokens are not involved: they never pass an executor.</text>
</svg>
