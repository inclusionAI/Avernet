<text x="915.0" y="709.91" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">team-x/… (any team)</text>
<text x="915.0" y="725.12" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">any language over HTTP · same port, same rules</text>
