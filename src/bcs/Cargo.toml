bcs-auth-google            = { path = "crates/plugins/bcs-auth-google" }
bcs-auth-github            = { path = "crates/plugins/bcs-auth-github" }
bcs-auth-wechat            = { path = "crates/plugins/bcs-auth-wechat" }
bcs-auth-alipay            = { path = "crates/plugins/bcs-auth-alipay" }
bcs-auth-local             = { path = "crates/plugins/bcs-auth-local" }
