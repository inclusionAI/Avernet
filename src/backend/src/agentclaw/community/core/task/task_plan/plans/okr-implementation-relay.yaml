template_id: okr-implementation-relay
entry_bot_id: 20260828_8azkbtgs
task_type: static_plan
# 串行接力 V2。链:
# 入口(20260828_8azkbtgs,图前:分析OKR→决定找营销策略专家)
# -> ① 营销策略专家(20260828_whd6nx7x,单独:产出策略方向+判定信息不够,决定拉圈人选品)
# -> ② 策略生成群(driver 专家 20260828_whd6nx7x + 圈人 20260828_6snfeiq0 + 选品 20260828_roqtqqkx:
#      专家驱动,圈人/选品细化,专家汇成完整营销策略)
# -> ③ 风险评估群(业务风控 20260828_7q4cbeze+合规 20260828_jbadndne)
# -> ④ 不可实现任务转BBS广场+自动研发(20260828_f7wfi27d,串行腿非旁路;须把上游策略/风险全料一并带到正文供⑤审核)
# -> ⑤ 营销策略审核(20260828_9rgd70li)
# -> ⑥ 投放实施(20260828_k9c2slro)
# -> ⑦ 通知(notify,负责人)
#
# 接力承载:"handoff" output 用 $.result 取整个上报产出正文;每跳 input 仅透传上游"产出正文"块,
# 框架不再做摘要/合成;⑤只读④handoff,不做跨跳 fan-in risk_result(全料随4 carry-forward).
input_schema:
  okr:
    type: string
    required: true
nodes:
  - id: marketing_strategy
    name: 营销策略专家
    type: bot
    bot_id: 20260828_whd6nx7x
    depends_on: []
    input:
      okr: $.input.okr
    output:
      handoff: $.result
  - id: strategy_generation_group
    name: 策略生成群
    type: collaboration
    depends_on: [marketing_strategy]
    collaboration:
      bot_ids: [20260828_whd6nx7x, 20260828_6snfeiq0, 20260828_roqtqqkx]
      mode: chat
      completion: report
    input:
      handoff: $.marketing_strategy.output.handoff
    output:
      handoff: $.result
  - id: risk_assessment
    name: 风险评估群
    type: collaboration
    depends_on: [strategy_generation_group]
    collaboration:
      bot_ids: [20260828_7q4cbeze, 20260828_jbadndne]
      mode: chat
      completion: report
    input:
      handoff: $.strategy_generation_group.output.handoff
    output:
      risk_result: $.report.result
      unhandled_tasks: $.result.unhandled_tasks
      handoff: $.result
  - id: risk_unhandled_to_bbs
    name: 不可实现任务转BBS广场
    type: bbs_handoff
    bot_id: 20260828_f7wfi27d
    depends_on: [risk_assessment]
    input:
      unhandled_tasks: $.risk_assessment.output.unhandled_tasks
      handoff: $.risk_assessment.output.handoff
    output:
      bbs_handed: $.result
      handoff: $.result
  - id: strategy_approval
    name: 营销策略审核
    type: bot
    bot_id: 20260828_9rgd70li
    depends_on: [risk_unhandled_to_bbs]
    input:
      handoff: $.risk_unhandled_to_bbs.output.handoff
    output:
      approval_result: $.result
      handoff: $.result
  - id: implementation
    name: 投放实施
    type: bot
    bot_id: 20260828_k9c2slro
    depends_on: [strategy_approval]
    input:
      handoff: $.strategy_approval.output.handoff
    output:
      implementation_result: $.result
      handoff: $.result
  - id: notify_done
    name: 通知完成
    type: notify
    depends_on: [implementation]
    input:
      handoff: $.implementation.output.handoff
