<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2457a6"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a6b0a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">会话频道能挺过所有者崩溃</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">订阅者按会话订阅,所以所有者变化对它们不可见。pub/sub 什么都不保留;事件日志才是事实。</text>

  <rect x="40" y="72" width="150" height="40" rx="8" fill="#eef2fa" stroke="#2457a6"/>
  <text x="115" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2457a6">网关 GW1</text>
  <rect x="250" y="72" width="140" height="40" rx="8" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="320" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#9a6b0a">频道 S</text>
  <rect x="450" y="72" width="160" height="40" rx="8" fill="#f8e6e1" stroke="#b3402e"/>
  <text x="530" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#b3402e">执行器 E3(所有者)</text>
  <rect x="640" y="72" width="140" height="40" rx="8" fill="#ffffff" stroke="#2457a6"/>
  <text x="710" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2457a6">事件日志(DB)</text>
  <rect x="800" y="72" width="140" height="40" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="870" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#157a55">执行器 E4</text>
  <line x1="115" y1="112" x2="115" y2="420" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="320" y1="112" x2="320" y2="420" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="530" y1="112" x2="530" y2="250" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="710" y1="112" x2="710" y2="420" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="870" y1="112" x2="870" y2="420" stroke="#b9c6bf" stroke-dasharray="3 4"/>

  <line x1="119" y1="134" x2="316" y2="134" stroke="#9a6b0a" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="218" y="128" font-size="10.5" text-anchor="middle" fill="#9a6b0a">订阅 S(一次)</text>
  <line x1="534" y1="158" x2="706" y2="158" stroke="#157a55" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="620" y="152" font-size="10.5" text-anchor="middle" fill="#157a55">提交 #41</text>
  <line x1="526" y1="174" x2="324" y2="174" stroke="#9a6b0a" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="425" y="168" font-size="10.5" text-anchor="middle" fill="#9a6b0a">Event #41(令牌 n)</text>
  <line x1="316" y1="186" x2="119" y2="186" stroke="#9a6b0a" stroke-width="1.6" marker-end="url(#ao)"/>
  <line x1="534" y1="212" x2="706" y2="212" stroke="#157a55" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="620" y="206" font-size="10.5" text-anchor="middle" fill="#157a55">提交 #42</text>
  <rect x="455" y="222" width="150" height="34" rx="5" fill="#f8e6e1" stroke="#b3402e"/>
  <text x="530" y="237" font-size="10.5" text-anchor="middle" fill="#b3402e">在发布 #42</text>
  <text x="530" y="250" font-size="10.5" text-anchor="middle" fill="#b3402e">之前崩溃</text>

  <rect x="20" y="214" width="190" height="42" rx="6" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="115" y="232" font-size="10.5" text-anchor="middle" fill="#1c2420">PA 的流保持打开;</text>
  <text x="115" y="246" font-size="10.5" text-anchor="middle" fill="#1c2420">输出暂停</text>

  <rect x="790" y="270" width="160" height="34" rx="5" fill="#ffffff" stroke="#157a55"/>
  <text x="870" y="285" font-size="10.5" text-anchor="middle" fill="#157a55">认领 S(令牌 n+1),</text>
  <text x="870" y="298" font-size="10.5" text-anchor="middle" fill="#157a55">从 GW1 FetchBuffer</text>
  <line x1="866" y1="326" x2="324" y2="326" stroke="#9a6b0a" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="600" y="320" font-size="10.5" text-anchor="middle" fill="#9a6b0a">重新发布最新事件 #42 + 步骤缓冲(令牌 n+1)</text>
  <line x1="316" y1="338" x2="119" y2="338" stroke="#9a6b0a" stroke-width="1.6" marker-end="url(#ao)"/>
  <rect x="20" y="350" width="190" height="56" rx="6" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="115" y="368" font-size="10.5" text-anchor="middle" fill="#9a6b0a">有空洞?从日志读取</text>
  <text x="115" y="382" font-size="10.5" text-anchor="middle" fill="#9a6b0a">(ReadEvents after #41)</text>
  <text x="115" y="396" font-size="10.5" text-anchor="middle" fill="#9a6b0a">丢弃更低的令牌</text>
  <line x1="214" y1="378" x2="706" y2="378" stroke="#5c6a62" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <rect x="24" y="432" width="912" height="92" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="44" y="456" font-size="13" font-weight="bold" fill="#1c2420">保证</text>
  <text x="44" y="478" font-size="11.5" fill="#1c2420">每个已提交的控制事件都至少一次、按顺序送达每个存活订阅者(按 event_seq 去重)。增量尽力而为;最终结果精确。</text>
  <text x="44" y="498" font-size="11.5" fill="#1c2420">规则:先提交再发布 · 空洞检测 · 接管时重新发布 · 先订阅再取快照 · 断开后成批追赶。</text>
  <text x="44" y="516" font-size="11" fill="#5c6a62">使用分片、非持久的 pub/sub(Redis 7 SPUBLISH 或 NATS core)—— 绝不用经典集群 PUBLISH,也绝不用持久队列。</text>
</svg>
