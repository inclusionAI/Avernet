# 基础配置
app_name: "secbaas"
workers: 8

log_config:
  trace_log_dir: ""
  log_level: "INFO"
  log_dir: ""

# 中间件配置总览
module_config:
  web:
    port: 8888 # 修改端口需要同步修改nginx.conf内配置

user_config:
  # 插件配置
  plugins:
    auth: "stub"
    secret: "stub"          # stub | real
    cache: "stub"           # stub | redis
    bot_service: "stub"  # real | local | stub
    engine_adapter: "stub"  # stub | real (aicoding/hermes/claude_code engine adapter)
    file_transfer: "stub"  # stub | real
    database: "sqlite"        # sqlite | mariadb
    eval_env: "stub"       # stub | real (评测环境 Plugin: stub=空操作, real=实际逻辑)
    sandbox:
      arca: stub #  arca_sdk or stub
      desktop: stub # real or stub
      k8s: stub # real or stub
      docker: stub # real or stub
      poolab: stub # real or stub
    bot:
      teclaw: stub # real or stub

  # 数据库连接配置
  database:
    database_url: "sqlite:////tmp/secbaas.db"
    create_schema: true
    seed_data: true

  # 沙箱镜像配置（按引擎 template_id → 容器名 → 镜像地址）
  sandbox_images:
    ALIYUN_ACK_DEFAULT:
      avernet-agent: "openclaw:latest"
      avernet-sidecar: "nginx:alpine"
      init: "busybox:latest"
      nas-server: ""
      env: ""

  bot_service:
    proxy_base_url: "https://bot_service.example.com"
    proxy_ws_base_url: "wss://bot_service.example.com"
    adapter_port: 20003
    ws_path: "/api/openclaw/ws"
    connect_timeout: 10
    request_timeout: 600

  # Chat client pool 配置
  chat_client_pool:
    max_size: 100                    # 池中最大总连接数
    max_conns_per_sandbox: 1         # 每个 sandbox_id 最多连接数
    max_concurrent_per_conn: 0       # 每连接最大并发会话数（0=不限）
    session_key_timeout: 30.0        # 同 sessionKey 等待超时（秒）
    max_retries: 1                   # WS 断连重试次数（0=不重试）
    retry_base_backoff: 0.5          # 重试退避基数（秒）

  # BotRunner 任务并发池配置
  bot_runner:
    softmax: 1000                    # 全局最大并发任务数（0=不限）
    per_key_max: 2                   # 每个 bot_id 最大并发任务数（0=不限）
    queue_max: 0                     # 全局最大排队等待数（0=不限）
    acquire_timeout: 0               # acquire 等待槽位超时秒数（0=不限）
    task_timeout: 660.0              # 单任务最大执行秒数（0=不限，默认660=10分钟+1分钟缓冲）
    default_timeout: 1800.0            # 请求默认超时秒数（metadata 未指定 timeout 时使用）
    origin: "https://teamclaw.example.com"

  # BotRun 队列 Worker 配置
  bot_run_queue:
    enabled: false                    # 是否启用队列 Worker
    session_lock_expire_seconds: 300  # session 串行锁过期时间（秒）
    session_lock_renew_seconds: 60    # session 串行锁自动续期间隔（秒）
    qpm_refresh_seconds: 30.0         # QPM 配置刷新间隔（秒）
    poll_interval_seconds: 0.1        # Worker 轮询间隔（秒）
    discover_limit: 50                # 每轮发现的 bot 数上限
    candidates_per_bot: 5             # 每个 bot 单次认领的候选数
    max_concurrent: 50                # 单 Worker 最大并发执行数
    heartbeat_interval_seconds: 30.0  # 心跳间隔（秒）
    machine_count: 1                  # 在线 Worker 机器数（用于均分 QPM）
    bucket_sweep_interval_seconds: 300.0  # 分桶扫描间隔（秒）
    bucket_idle_ttl_seconds: 600.0        # 分桶空闲 TTL（秒）

  teamclaw:
    base_url: "https://teamclaw.example.com"
    timeout: 30

  # OAuth 客户端配置
  oauth:
    base_url: "https://oauth.example.com"

  # ARCA TTL 续期调度器引擎选择 (Phase 5 config switch)
  # "legacy": DeviceTtlTimerTask 运行，DeadlineRenewalScheduler 不启动
  # "deadline": DeadlineRenewalScheduler 运行，DeviceTtlTimerTask 不启动
  renewal_scheduler:
    lock_name: "deadline_renewal_scheduler_lock"
    lock_expire_seconds: 1800
    cron_interval_seconds: 1800
    batch_size: 500
    max_concurrency: 20
    renew_threshold_hours: 12
    retry_delay_minutes: 2
    max_fail_count: 10
    ttl_safety_margin_minutes: 1
    anti_join_verify_interval_cycles: 48
    engine: "legacy"

  # 设备 TTL 定时器配置（每 30 分钟扫描整个到期队列并续期+探活）
  # ARCA 沙箱 TTL 续期为企业版能力：社区版默认关闭此定时任务（enabled: false）。
  device_ttl_timer:
    enabled: false  # 社区版禁用 ARCA 沙箱 TTL 续期定时任务；企业 overlay 置 true
    cron_interval_seconds: 1800  # 执行间隔（秒），默认: 1800（30分钟）
    batch_size: 100  # 每页拉取条数，默认: 100
    max_page_concurrency: 10  # 每页内并发续期的最大并发数
    query_retries: 3  # 单页查询 DB 失败时的重试次数
    lock_name: "device_ttl_timer_lock"  # 分布式锁名称基准，运行时追加环境后缀（如 _pre/_prod）以实现环境隔离
    lock_expire_seconds: 1750  # 分布式锁租约（秒），须 < cron 间隔以允许其它实例在轮次间获取，默认: 1750
    dry_run: false  # 测试模式：只打印日志

  # 文件传输轮询器配置（定期检测 OSS 上传完成并触发 device 下载）
  file_transfer_poller:
    enabled: false  # 是否启用定时任务
    cron_interval_seconds: 10  # 执行间隔（秒），默认: 10
    upload_timeout_seconds: 3600  # 上传超时（秒），超时未完成写入的 ticket 标记 FAILED
    lock_expire_seconds: 300  # per-ticket 分布式锁过期时间（秒），默认: 300
    max_concurrent_tickets: 5  # 单次扫描并发处理的 ticket 数上限
    dry_run: false  # 测试模式：只打印日志

  # BotRun 队列恢复配置（周期性重置心跳过期的 RUNNING 请求回 PENDING）
  bot_run_recovery:
    enabled: false  # 是否启用定时任务
    cron_interval_seconds: 60  # 执行间隔（秒），默认: 60
    lock_name: "bot_run_recovery_lock"  # 分布式锁名称
    lock_expire_seconds: 120  # 分布式锁过期时间（秒），默认: 120
    lock_renew_interval_seconds: 30  # 分布式锁自动续期间隔（秒），默认: 30（0 表示禁用续期）
    stale_seconds: 120  # RUNNING 超过此时长无心跳视为悬挂（秒），默认: 120
    dry_run: false  # 测试模式：只打印日志

  # Expired ACK sandbox timer config (periodically scans expired devices, destroys Pod, stops bot)
  # NOTE: This task only takes effect for Aliyun ACK-created sandboxes
  # (plugins.sandbox.arca == "aliyun_ack"). Enterprise arc_sdk sandboxes are
  # reclaimed by the ARC platform itself; this task does not participate.
  # Disabled by default in community (enabled: false).
  expire_sandbox_timer:
    enabled: false  # 社区版禁用过期沙箱销毁定时任务
    cron_interval_seconds: 86400  # 执行间隔（秒），默认: 86400（1天）
    batch_size: 100  # 每页拉取条数，默认: 100
    max_page_concurrency: 10  # 每页内并发停 bot 的最大并发数
    query_retries: 3  # 单页查询 DB 失败时的重试次数
    lock_name: "expire_sandbox_timer_lock"  # 分布式锁名称基准，运行时追加环境后缀
    lock_expire_seconds: 1750  # 分布式锁租约（秒），须 < cron 间隔
    dry_run: false  # 测试模式：只打印日志，不销毁/停 bot
    grace_seconds: 0  # 到期判定余量（秒），抵消时钟偏差
    default_ttl_minutes: 10080  # 业务默认 TTL（分钟），extra_config 缺失时回退（7 天）

  # BCN 下行协议配置
  bcn:
    api_key:
      prefix: "dummy-prefix"
    uplink:
      base_url: "https://bcn.example.com"
      provider_id: "dummy-provider"

  # Bot Health Checker 配置
  bot_health_checker:
    health_check:
      timeout_seconds: 10           # 单个健康检查超时时间
      max_concurrent: 10            # 最大并发健康检查数
    ttl:
      extend_when_remaining_hours: 16  # 剩余时间 ≤ 16 小时才续期
      target_ttl_hours: 24             # 续期目标 TTL（小时）

  bot_chat_log_relation:
    base_url: "https://backend.example.com"
    timeout: 10
    max_retries: 0

  # agentclawproxy 代理服务主机名（按环境）
  # 用于 proxypass URL 和 WS relay 构造。
  agentclawproxy:
    host:
      dev: "agentclawproxy-dev.example.com"
      pre: "agentclawproxy-pre.example.com"
      prod: "agentclawproxy-prod.example.com"

  # Poolab API 端点（按环境）
  poolab:
    endpoint:
      dev: "https://poolab-dev.example.com"
      pre: "https://poolab-pre.example.com"
      prod: "https://poolab-prod.example.com"

# File transfer OSS storage backend configuration (enterprise/prod deployments only)
  file_transfer_oss:
    endpoint: ""
    external_endpoint: ""
    bucket_name: ""
    staging_root_path: "baas-file-transfer"
    secret_name: ""
  # SecBaaS 回调服务器 URL（按环境）
  # 设备 start hook 完成后通过此 URL 回调状态。
  secbaas:
    callback:
      host:
        dev: "https://secbaas-dev.example.com"
        pre: "https://secbaas-pre.example.com"
        prod: "https://secbaas-prod.example.com"

  # API Gateway 配置
  api_gateway:
    admin_operators:
      - "operator-001"
      - "operator-002"
      - "operator-003"
      - "000001"

  # 部署环境探测配置
  env:
    # 用于探测当前部署环境的环境变量名称
    deploy_env_var: "DEPLOY_ENV"

  # 应用级动态调试/展示标记
  app:
    local_debug: false
    show_error_details: false