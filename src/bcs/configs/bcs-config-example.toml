# BCS deployment example.
#
# Copy this file, replace every example.com host and replace-with-* value,
# then run. Do not commit real credentials.
#
# Environment variable references in quoted string values:
#   key = "${VAR}"            -> value of env var VAR; startup fails if VAR is unset
#   key = "${VAR:-default}"   -> default when VAR is unset or empty
# Only quoted strings are expanded (bare key = ${VAR} is not valid TOML).
# There is NO generic BCS_* substitution — only the specific variables the
# DB/Redis loaders read hardcoded override the [database.mysql.connection]
# and [cache.redis.connection] fields (BCS_DB_HOST/PORT/USER/PASSWORD/...,
# BCS_REDIS_HOST/PORT/PASSWORD/...); those parse the env string into the
# right type, so they are how numeric fields such as port get env-injected.
# There is no escape for a literal "${" — avoid real "${...}" in string
# values unless it is an env reference.

bind = "0.0.0.0"
port = 21000  # Dockerfile healthcheck targets 21000; keep in sync if you change this.
bots_base_dir = "/var/lib/bcs/bots"

max_history_per_session = 1000
store_messages = false
strict_container_validation = true

# Default HTTP Provider chat.send run deadline when the frame has no explicit
# timeout_ms. Configuration changes take effect after BCS restarts.
provider_chat_run_timeout_ms = 10800000

# Deprecated compatibility setting. Provider 2.0 chat.send is always SSE-first;
# this value is retained for config/API compatibility and has no effect.
provider_stream_gray_enabled = false

# Deprecated compatibility setting; retained but no longer consulted.
provider_stream_gray_created_by = []

max_groups_as_driver = 20
max_group_members = 20
max_groups_as_member = 100
max_group_messages = 200
group_chat_delay_min_ms = 1000
group_chat_delay_max_ms = 3000

bcs_endpoint = "https://bcs.example.com"
botchat_url = "https://botchat.example.com"
register_path = "/bcn/register"
default_visibility = "protected"
onboard_binding_enabled = false

dingtalk_accounts = []
api_keys = []
allowed_switch_provider_ids = []

[gateway_principal]
# Accept tokens minted by either the gateway or the backend (shared key).
issuers = ["gateway", "backend"]
audience = "bcs"
key_id = "bare"
# Runtime lookup only; set this environment variable to real secret material.
signing_key_env = "AVERNET_SECRET_PRINCIPAL_SIGNING_KEY_VALUE"

[cors]
allowed_origins = [
  "https://bcs.example.com",
  "https://botchat.example.com",
]

[metrics]
enabled = true
mode = "pull"
endpoint_path = "/metrics"

[telemetry]
enabled = true
service_name = "bcn"
# Complete OTLP traces endpoint; include /v1/traces.
otlp_traces_endpoint = "http://otel-collector.example.com:4318/v1/traces"

[telemetry.extra_headers]
x-collector-route = "collector-local"

[llm]
type = "none"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# api_key = "replace-with-llm-api-key"
model = "gpt-4.1-mini"
timeout_ms = 120000
temperature = 0
max_tokens = 4096
structured_output = "json_schema"

[database]
type = "mysql"

# Select a linked secret backend in deployments that do not use environment
# variables. Group-session WebSocket JWT signing material is resolved through
# [group_session_ws].signing_key_secret. The default logical name remains
# "bcn-group-session-ws-jwt" for backward compatibility.
[secret]
provider = "env"

[secret.providers.env]
prefix = "BCS_SECRET_"

# Public Event recording and Webhook delivery. Keep both switches disabled
# until the Event Store and dispatcher are wired for the deployment.
[eventing]
enabled = false
dispatcher_enabled = false
fanout_poll_interval_ms = 200
delivery_poll_interval_ms = 200
worker_concurrency = 64
per_host_concurrency = 8
lease_ms = 30000
drain_timeout_ms = 10000
event_retention_days = 30

[eventing.retry]
base_delay_ms = 5000
max_delay_ms = 3600000
max_attempts = 12
max_elapsed_ms = 86400000

[eventing.webhook]
connect_timeout_ms = 3000
request_timeout_ms = 10000
max_request_timeout_ms = 30000
max_event_body_bytes = 262144
max_response_body_bytes = 4096
allow_http_loopback = false
allow_non_standard_ports = false

# Private endpoints remain denied unless host, effective port, and every
# resolved address match one entry. A leading "*." matches subdomains only.
# [[eventing.webhook.private_endpoint_allowlist]]
# host = "*.hooks.example.internal"
# cidrs = ["10.20.0.0/16"]
# ports = [443, 8443]

[eventing.limits]
max_group_subscriptions = 10
max_filters_per_subscription = 64

[group_session_ws]
# Optional. Override when the deployment secret backend uses a different
# logical secret name for group-session WebSocket JWT signing material.
signing_key_secret = "bcn-group-session-ws-jwt"

[cache]
type = "redis"

[cache.redis]
timeout_secs = 5
key_prefix = "bcs:"

[cache.redis.connection]
type = "direct"
host = "redis.example.com"
port = 6379
auth_mode = "redis"
username = "replace-with-redis-username"
password = "replace-with-redis-password"

[database.mysql]
database = "bcs"
pool_size = 20
min_pool_size = 5
timeout_secs = 30
stmt_cache_size = 0
statement_protocol = "text"

[database.mysql.connection]
type = "direct"
user = "replace-with-db-user"
password = "replace-with-db-password"
host = "oceanbase.example.com"
port = 3306

[logging]
default_level = "info"
console = true

[[logging.outputs]]
name = "main"
path = "/var/log/bcs"
file = "bcs.log"
level = "info"
rotation = "daily"
targets = ["*", "!bcs_chat_digest", "!bcs_sse_detail"]
max_keep_days = 7

[[logging.outputs]]
name = "common-error"
path = "/var/log/bcs"
file = "common-error.log"
level = "error"
rotation = "daily"
targets = ["*"]
max_keep_days = 7

[[logging.outputs]]
name = "messages"
path = "/var/log/bcs"
file = "bcs-messages.log"
level = "info"
rotation = "daily"
targets = ["bcs_message"]
max_keep_days = 7

[[logging.outputs]]
name = "chat-digest"
path = "/var/log/bcs"
file = "bcs-chat-digest.log"
level = "info"
rotation = "daily"
targets = ["bcs_chat_digest"]
max_keep_days = 7

# SSE downlink detail log — per-frame consumption trace + lag alerts, keep 7 days
[[logging.outputs]]
name = "sse-detail"
path = "/var/log/bcs"
file = "bcs-sse-detail.log"
level = "info"
rotation = "daily"
format = "json"
targets = ["bcs_sse_detail"]
max_keep_days = 7

[logging.modules]
hyper = "warn"
tower_http = "warn"

[user_directory]
# Optional external user directory. Enable this only when the selected provider
# plugin is linked into the binary, then put provider-specific options under
# [user_directory.providers.<provider>].
enabled = false

# Human mention notification: notify human participants when a message
# @-mentions them. Select a linked backend; omit `provider` to disable.
[human_notify]
provider = "dummy"

[human_notify.providers.dummy]
enabled = true
# A linked notification backend can provide its own options, for example:
# [human_notify.providers.example]
# enabled = true
# endpoint = "https://notify.example.com"
# api_key = "${NOTIFY_API_KEY}"

[auth]
chain = ["oauth_session"]
require_authentication = true

[auth.oauth]
jwt_secret = "replace-with-oauth-jwt-secret"
idle_timeout_minutes = 30
base_url = "https://bcs.example.com"
cookie_secure = true
# Path the browser is redirected to after a successful OAuth login.
# Must be a relative path starting with a single "/". Defaults to "/".
# A query string is allowed, e.g. "/?login=success".
success_redirect_path = "/"

[auth.oauth.providers.github]
kind = "github"
client_id = "replace-with-github-client-id"
client_secret = "replace-with-github-client-secret"

[bcsfuse]
enabled = false
url = "https://bcsfuse.example.com"
fusion_timeout_ms = 120000
sync_timeout_ms = 10000
# Base backoff between worker-sync retry attempts; doubles per attempt.
sync_retry_base_ms = 1000
profile_id = "default"
recommend_top_k = 10
recommend_min_score = 0.1

# =============================================================================
# Message History Configuration
# =============================================================================

# Message history storage configuration
[message_history]
# Groups created at or after this timestamp (ms) use the new message store path.
# Groups created before this timestamp fall back to the legacy history path.
# Default: 2026-06-25 12:00:00 Asia/Shanghai (UTC+8) (1782360000000 ms), which is the go-live date.
# Groups created before this date will use the legacy bot-based history path.
cutoff_timestamp = 1782360000000

# ManagerWorker sessions created at or after this timestamp (ms) use DB history.
# Default: 2026-07-05 00:00:00 Asia/Shanghai (UTC+8) (1783180800000 ms).
manager_worker_cutoff_timestamp = 1783180800000

# Max visible history messages for a newly joined participant.
# Set to a large value so new participants can see all history messages.
new_participant_visible_limit = 100000000

# Default page size when the caller does not specify a limit.
# Set to a large value so the default limit is effectively disabled.
default_page_limit = 100000000

# Hard cap on page size to prevent excessive queries.
# Set to a large value so the cap is effectively disabled.
max_page_limit = 100000000

[security_gateway]
# provider 选择安全网关实现。开源默认只内置 "noop"（永远放行）。
# 其他 provider 由链接进二进制的插件注册，并通过 [security_gateway.providers.<provider>] 传递私有配置。
provider = "noop"
dry_run = true

[security.outbound_url]
block_private_networks = true
allow_loopback = false

[invite]
token_secret = "replace-with-invite-token-secret"
default_ttl_seconds = 86400
base_url = "https://bcs.example.com"
group_link_url = "https://botchat.example.com/groups/{group_id}"
session_link_url = "https://botchat.example.com/sessions/{session_id}"

[openapi_v1]
# Base URL for protected session-file URLs (e.g. proxy upload targets).
public_collaboration_base_url = "https://gateway.example.com/openapi/v1/collaboration"
# Base URL for internal-collaboration endpoints (content, shared-file download).
# Falls back to public_collaboration_base_url when unset.
internal_collaboration_base_url = "https://gateway.example.com/api/v1/collaboration"

[session_files]
storage_backend = "local"      # or "baas"
multipart_threshold = 104857600
max_file_size = 5368709120

[session_files.backend]
# local:
data_dir = "/var/bcs/session-files"
# baas (when storage_backend = "baas"):
# endpoint = "https://storage.example.com"
# tenant = "teamclaw"
# health_probe_path = ""
# [session_files.backend.headers]
# X-Baas-Token = "..."

[session_files.share]
token_secret = "replace-with-share-token-secret"
default_ttl_seconds = 86400
share_base_url = "https://bcs.example.com"

[manifest]
schema_version = 1

[[manifest.bundles]]
name = "bcsPanel"
type = "url"
url = "https://gw.alipayobjects.com/render/p/hitu_npm/@avernet-assets/bcs-panel/1.3.0/dist/index.umd.js"
