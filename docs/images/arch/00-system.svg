<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="how backend and engine interact with other components">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
    .title{font-size:25px;font-weight:600;fill:#1F1E1C}
    .sub{font-size:13.5px;fill:#75736E}
    .bt{font-size:14px;font-weight:600}
    .bd{font-size:11px;fill:#5E5C57}
    .num{font-size:12px;font-weight:700;fill:#A85C47}
    .fl{font-size:11.5px;fill:#33322E}
    .lg{font-size:11.5px;font-weight:600;fill:#8A8781;letter-spacing:.05em}
  </style>
  <rect width="1400" height="900" fill="#FAF9F7"/>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A85C47"/></marker>
  <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8781"/></marker></defs>
  <g class="t">
    <text x="44" y="50" class="title">Backend 与 Engine 怎么跟别的组件打交道</text>
    <text x="44" y="78" class="sub">要点是那条红线：Backend 想跟某个 Bot 说话，不能直接找它 —— 先问 BaaS 这个 Bot 在哪，拿到定位结果，再经统一入口打进去。</text>
    <rect x="44" y="120" width="190" height="96" rx="6" fill="#E4EBF5" stroke="#3C6198" stroke-width="1"/>
    <text x="58" y="145" class="bt" fill="#22405F">前端 / 外部租户</text>
    <text x="58" y="165" class="bd">发起会话</text>
    <text x="58" y="182" class="bd">管理 Bot 与技能</text>
    <rect x="470" y="120" width="340" height="96" rx="6" fill="#F1EFEA" stroke="#8A8781" stroke-width="1"/>
    <text x="484" y="145" class="bt" fill="#33322E">BCS / BCN　协作面</text>
    <text x="484" y="165" class="bd">Bot 注册与发现 · 组队</text>
    <text x="484" y="182" class="bd">消息路由 · 群聊</text>
    <rect x="1050" y="120" width="306" height="96" rx="6" fill="#F1EFEA" stroke="#8A8781" stroke-width="1"/>
    <text x="1064" y="145" class="bt" fill="#33322E">外部 Bot 平台</text>
    <text x="1064" y="165" class="bd">注册成 Provider</text>
    <text x="1064" y="182" class="bd">自己调度自己的 Bot</text>
    <rect x="44" y="286" width="390" height="150" rx="6" fill="#E3EDE4" stroke="#3F7350" stroke-width="2.2"/>
    <text x="58" y="311" class="bt" fill="#26452F">Backend　控制面</text>
    <text x="58" y="331" class="bd">Bot 生命周期 · 技能 · 空间 · 发布</text>
    <text x="58" y="348" class="bd">配额与权限 · 多租户隔离</text>
    <text x="58" y="365" class="bd">自己不持有任何 Bot 运行时</text>
    <rect x="44" y="500" width="390" height="100" rx="6" fill="#F1EFEA" stroke="#8A8781" stroke-width="1"/>
    <text x="58" y="525" class="bt" fill="#33322E">BaaS　供给面</text>
    <text x="58" y="545" class="bd">创建 Bot · 供给容器</text>
    <text x="58" y="562" class="bd">记录每个 Bot 的容器与连接信息</text>
    <text x="58" y="579" class="bd">—— Bot 在哪，只有它知道</text>
    <rect x="560" y="286" width="250" height="314" rx="6" fill="#F6EBD8" stroke="#A1762E" stroke-width="1"/>
    <text x="574" y="311" class="bt" fill="#5E4519">sandbox-proxy</text>
    <text x="574" y="331" class="bd">统一入口</text>
    <text x="574" y="348" class="bd">鉴权 · 目标解析</text>
    <text x="574" y="365" class="bd">HTTP 与长连接转发</text>
    <text x="574" y="382" class="bd"></text>
    <text x="574" y="399" class="bd">把后面的运行时</text>
    <text x="574" y="416" class="bd">藏在身后</text>
    <rect x="920" y="286" width="436" height="150" rx="6" fill="#E3EDE4" stroke="#3F7350" stroke-width="2.2"/>
    <text x="934" y="311" class="bt" fill="#26452F">Engine　执行面</text>
    <text x="934" y="331" class="bd">会话 · 对话 · 技能 · MCP · 定时 · 审批 · 文件</text>
    <text x="934" y="348" class="bd">随 Bot 部署，只服务它自己那一个 Bot</text>
    <rect x="920" y="500" width="436" height="100" rx="6" fill="#DFEDEC" stroke="#3B7A73" stroke-width="1"/>
    <text x="934" y="525" class="bt" fill="#234945">引擎网关 + 沙箱运行时</text>
    <text x="934" y="545" class="bd">把标准接口翻到各引擎的原生协议</text>
    <text x="934" y="562" class="bd">技能与命令行工具落盘 · 模型调用</text>
    <path d="M 139 220 L 139 282" fill="none" stroke="#8A8781" stroke-width="1.8" marker-end="url(#mg)"/>
    <text x="150" y="256" class="num">①</text>
    <path d="M 160 440 L 160 496" fill="none" stroke="#A85C47" stroke-width="1.8" marker-end="url(#m)"/>
    <text x="172" y="474" class="num">②</text>
    <path d="M 438 352 L 556 352" fill="none" stroke="#A85C47" stroke-width="1.8" marker-end="url(#m)"/>
    <text x="480" y="342" class="num">③</text>
    <path d="M 814 352 L 916 352" fill="none" stroke="#A85C47" stroke-width="1.8" marker-end="url(#m)"/>
    <text x="856" y="342" class="num">④</text>
    <path d="M 300 282 L 560 220" fill="none" stroke="#8A8781" stroke-width="1.8" marker-end="url(#mg)"/>
    <text x="420" y="248" class="num">⑤</text>
    <path d="M 810 176 L 1046 176" fill="none" stroke="#8A8781" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mg)"/>
    <text x="916" y="166" class="num">⑥</text>
    <path d="M 700 220 L 1000 282" fill="none" stroke="#8A8781" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mg)"/>
    <text x="836" y="262" class="num">⑦</text>
    <path d="M 1138 440 L 1138 496" fill="none" stroke="#8A8781" stroke-width="1.8" marker-end="url(#mg)"/>
    <text x="1150" y="474" class="num">⑧</text>
    <text x="44" y="676" class="lg">这几条线分别是什么</text>
    <text x="44" y="700" class="num">①</text>
    <text x="104" y="700" class="fl">前端与外部租户只跟 Backend 打交道 —— 管理 Bot、技能、发布，全部走控制面。</text>
    <text x="44" y="730" class="num">②</text>
    <text x="104" y="730" class="fl">Backend 想跟某个 Bot 说话，第一步是问 BaaS：这个 Bot 的容器在哪、怎么连。定位信息只有 BaaS 有。</text>
    <text x="44" y="760" class="num">③ ④</text>
    <text x="104" y="760" class="fl">拿到定位结果后，经统一入口打到那个 Bot 的 Engine 上 —— 会话、技能、定时都走这条。Backend 从不直连运行时。</text>
    <text x="44" y="790" class="num">⑤</text>
    <text x="104" y="790" class="fl">Bot 注册进协作网络，之后的协作路由由协作面负责。</text>
    <text x="44" y="820" class="num">⑥ ⑦</text>
    <text x="104" y="820" class="fl">协作面把消息派下去：外部平台走 Provider 回调，自建运行时走长连接直连。</text>
    <text x="44" y="850" class="num">⑧</text>
    <text x="104" y="850" class="fl">Engine 把标准接口翻成引擎原生协议，最终在沙箱里调模型、落技能。</text>
  </g>
</svg>