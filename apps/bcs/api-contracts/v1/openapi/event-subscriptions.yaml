EventSubscriptionScope:
  type: object
  additionalProperties: false
  required: [type, id]
  properties:
    type:
      type: string
      enum: [group]
    id:
      type: string
      minLength: 1

EventPayload:
  type: object
  additionalProperties: false
  properties:
    mode:
      type: string
      enum: [metadata_only, full]
      default: metadata_only

EventOrdering:
  type: object
  additionalProperties: false
  properties:
    mode:
      type: string
      enum: [strict_per_stream]
      default: strict_per_stream

WebhookSinkInput:
  type: object
  additionalProperties: false
  required: [type, url]
  properties:
    type:
      type: string
      const: webhook
    url:
      type: string
      format: uri
      writeOnly: true
    request_timeout_ms:
      type: integer
      minimum: 1000
      maximum: 30000

PatchWebhookSinkInput:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type:
      type: string
      const: webhook
    url:
      type: string
      format: uri
      writeOnly: true
    request_timeout_ms:
      type: integer
      minimum: 1000
      maximum: 30000

CreateEventSubscriptionRequest:
  type: object
  additionalProperties: false
  required: [name, scope, event_filters, sink]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 128
    scope:
      $ref: "#/EventSubscriptionScope"
    event_filters:
      type: array
      minItems: 1
      maxItems: 64
      uniqueItems: true
      items:
        type: string
        minLength: 1
    payload:
      $ref: "#/EventPayload"
    sink:
      $ref: "#/WebhookSinkInput"

PatchEventSubscriptionRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    revision:
      type: integer
      minimum: 1
    name:
      type: string
      minLength: 1
      maxLength: 128
    event_filters:
      type: array
      minItems: 1
      maxItems: 64
      uniqueItems: true
      items:
        type: string
        minLength: 1
    payload:
      $ref: "#/EventPayload"
    sink:
      $ref: "#/PatchWebhookSinkInput"
    status:
      type: string
      enum: [active, disabled]

ReplayEventDeliveryRequest:
  type: object
  additionalProperties: false
  required: [replay_request_id, expected_subscription_revision]
  properties:
    replay_request_id:
      type: string
      minLength: 1
    expected_subscription_revision:
      type: integer
      minimum: 1

SkipEventDeliveryRequest:
  type: object
  additionalProperties: false
  required: [reason]
  properties:
    reason:
      type: string
      minLength: 1

EventSubscription:
  type: object
  additionalProperties: false
  required:
    - subscription_id
    - name
    - scope
    - include_descendants
    - event_filters
    - payload
    - ordering
    - sink
    - status
    - revision
    - created_at
    - updated_at
  properties:
    subscription_id: {type: string}
    name: {type: string}
    scope:
      $ref: "#/EventSubscriptionScope"
    include_descendants: {type: boolean}
    event_filters:
      type: array
      items: {type: string}
    payload:
      $ref: "#/EventPayload"
    ordering:
      $ref: "#/EventOrdering"
    sink:
      type: object
      additionalProperties: false
      required: [type, endpoint, request_timeout_ms]
      properties:
        type: {type: string, const: webhook}
        endpoint:
          type: object
          additionalProperties: false
          required: [scheme, host, path_hash]
          properties:
            scheme: {type: string}
            host: {type: string}
            path_hash: {type: string}
        request_timeout_ms: {type: integer}
    status:
      type: string
      enum: [pending, active, disabled, deleted]
    revision: {type: integer, minimum: 1}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}

EventDeliverySummary:
  type: object
  additionalProperties: false
  required:
    - delivery_id
    - event_id
    - event_type
    - subscription_id
    - subscription_revision
    - stream_key_hash
    - sequence
    - status
    - attempt_count
    - created_at
  properties:
    delivery_id: {type: string}
    event_id: {type: string}
    event_type: {type: string}
    subscription_id: {type: string}
    subscription_revision: {type: integer}
    stream_key_hash: {type: string}
    sequence: {type: integer}
    status:
      type: string
      enum: [pending, in_flight, retry_wait, succeeded, dead_lettered, cancelled, skipped]
    attempt_count: {type: integer}
    last_http_status: {type: integer}
    last_error_category: {type: string}
    created_at: {type: string, format: date-time}

EventSubscriptionEnvelope:
  type: object
  additionalProperties: false
  required: [code, message, data, request_id]
  properties:
    code: {type: integer, const: 20000}
    message: {type: string}
    data:
      $ref: "#/EventSubscription"
    request_id:
      $ref: ../shared.yaml#/RequestId

CreatedEventSubscriptionEnvelope:
  type: object
  additionalProperties: false
  required: [code, message, data, request_id]
  properties:
    code: {type: integer, const: 20100}
    message: {type: string}
    data:
      $ref: "#/EventSubscription"
    request_id:
      $ref: ../shared.yaml#/RequestId

EventSubscriptionPageEnvelope:
  type: object
  additionalProperties: false
  required: [code, message, data, request_id]
  properties:
    code: {type: integer, const: 20000}
    message: {type: string}
    data:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/EventSubscription"
        next_cursor: {type: string}
    request_id:
      $ref: ../shared.yaml#/RequestId

EventDeliveryPageEnvelope:
  type: object
  additionalProperties: false
  required: [code, message, data, request_id]
  properties:
    code: {type: integer, const: 20000}
    message: {type: string}
    data:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/EventDeliverySummary"
        next_cursor: {type: string}
    request_id:
      $ref: ../shared.yaml#/RequestId

EventDeliveryDetailEnvelope:
  type: object
  additionalProperties: false
  required: [code, message, data, request_id]
  properties:
    code: {type: integer, const: 20000}
    message: {type: string}
    data:
      type: object
      additionalProperties: false
      required: [delivery, attempts]
      properties:
        delivery:
          $ref: "#/EventDeliverySummary"
        attempts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [attempt_no, started_at]
            properties:
              attempt_no: {type: integer}
              started_at: {type: string, format: date-time}
              completed_at: {type: string, format: date-time}
              latency_ms: {type: integer}
              result: {type: string, enum: [success, retryable, terminal]}
              http_status: {type: integer}
              error_category: {type: string}
        replay_of_delivery_id: {type: string}
        resolved_by_delivery_id: {type: string}
    request_id:
      $ref: ../shared.yaml#/RequestId

EventSubscriptionTestEnvelope:
  type: object
  additionalProperties: false
  required: [code, message, data, request_id]
  properties:
    code: {type: integer, const: 20000}
    message: {type: string}
    data:
      type: object
      additionalProperties: false
      required: [request_id, delivered, completed_at]
      properties:
        request_id: {type: string}
        delivered: {type: boolean}
        http_status: {type: integer}
        error_category: {type: string}
        completed_at: {type: string, format: date-time}
    request_id:
      $ref: ../shared.yaml#/RequestId

ReplayEventDeliveryEnvelope:
  type: object
  additionalProperties: false
  required: [code, message, data, request_id]
  properties:
    code: {type: integer, const: 20200}
    message: {type: string}
    data:
      type: object
      additionalProperties: false
      required: [original_delivery_id, replacement]
      properties:
        original_delivery_id: {type: string}
        replacement:
          $ref: "#/EventDeliverySummary"
    request_id:
      $ref: ../shared.yaml#/RequestId

SkipEventDeliveryEnvelope:
  type: object
  additionalProperties: false
  required: [code, message, data, request_id]
  properties:
    code: {type: integer, const: 20000}
    message: {type: string}
    data:
      type: object
      additionalProperties: false
      required: [delivery_id, status, skipped_at]
      properties:
        delivery_id: {type: string}
        status: {type: string, const: skipped}
        skipped_at: {type: string, format: date-time}
    request_id:
      $ref: ../shared.yaml#/RequestId

UnauthenticatedResponse:
  description: Gateway Principal is missing or invalid.
  x-error-codes: [unauthenticated]
  content:
    application/json:
      schema:
        $ref: ../shared.yaml#/ErrorEnvelope

SubscriptionForbiddenResponse:
  description: Principal cannot manage the Event Subscription scope.
  x-error-codes: [event_subscription_forbidden]
  content:
    application/json:
      schema:
        $ref: ../shared.yaml#/ErrorEnvelope

SubscriptionNotFoundResponse:
  description: Event Subscription does not exist or is not visible.
  x-error-codes: [event_subscription_not_found]
  content:
    application/json:
      schema:
        $ref: ../shared.yaml#/ErrorEnvelope

DeliveryNotFoundResponse:
  description: Event Delivery does not exist or is not visible.
  x-error-codes: [event_delivery_not_found]
  content:
    application/json:
      schema:
        $ref: ../shared.yaml#/ErrorEnvelope

InvalidSubscriptionResponse:
  description: Event Subscription request is invalid.
  x-error-codes:
    - invalid_request
    - invalid_page_limit
    - invalid_event_filter
    - invalid_event_scope
    - invalid_webhook_url
  content:
    application/json:
      schema:
        $ref: ../shared.yaml#/ErrorEnvelope

SubscriptionConflictResponse:
  description: Event Subscription mutation conflicts with current state.
  x-error-codes:
    - event_subscription_limit_reached
    - event_subscription_revision_conflict
  content:
    application/json:
      schema:
        $ref: ../shared.yaml#/ErrorEnvelope

DeliveryConflictResponse:
  description: Event Delivery cannot be replayed or skipped in its current state.
  x-error-codes:
    - event_subscription_revision_conflict
    - event_delivery_not_replayable
    - event_delivery_lane_blocked
  content:
    application/json:
      schema:
        $ref: ../shared.yaml#/ErrorEnvelope

EventSubscriptionsPath:
  post:
    operationId: create_event_subscription
    tags: ["Collaboration / Event Subscriptions"]
    summary: Create an Event Subscription.
    x-avernet-security: {user: required, app: required}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/CreateEventSubscriptionRequest"
    responses:
      "201":
        description: Event Subscription created.
        content:
          application/json:
            schema:
              $ref: "#/CreatedEventSubscriptionEnvelope"
      "400": {$ref: "#/InvalidSubscriptionResponse"}
      "401": {$ref: "#/UnauthenticatedResponse"}
      "403": {$ref: "#/SubscriptionForbiddenResponse"}
      "409": {$ref: "#/SubscriptionConflictResponse"}
      "500": {$ref: ../shared.yaml#/InternalErrorResponse}
  get:
    operationId: list_event_subscriptions
    tags: ["Collaboration / Event Subscriptions"]
    summary: List visible Event Subscriptions using cursor pagination.
    x-avernet-security: {user: required, app: required}
    parameters:
      - {name: scope_type, in: query, schema: {type: string, enum: [group]}}
      - {name: scope_id, in: query, schema: {type: string}}
      - {name: status, in: query, schema: {type: string, enum: [pending, active, disabled, deleted]}}
      - {name: cursor, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    responses:
      "200":
        description: Cursor page of Event Subscriptions.
        content:
          application/json:
            schema:
              $ref: "#/EventSubscriptionPageEnvelope"
      "400": {$ref: "#/InvalidSubscriptionResponse"}
      "401": {$ref: "#/UnauthenticatedResponse"}
      "500": {$ref: ../shared.yaml#/InternalErrorResponse}

EventSubscriptionPath:
  get:
    operationId: get_event_subscription
    tags: ["Collaboration / Event Subscriptions"]
    summary: Get a redacted Event Subscription.
    x-avernet-security: {user: required, app: required}
    parameters:
      - {name: subscription_id, in: path, required: true, schema: {type: string}}
    responses:
      "200":
        description: Redacted Event Subscription.
        content:
          application/json:
            schema:
              $ref: "#/EventSubscriptionEnvelope"
      "401": {$ref: "#/UnauthenticatedResponse"}
      "404": {$ref: "#/SubscriptionNotFoundResponse"}
      "500": {$ref: ../shared.yaml#/InternalErrorResponse}
  patch:
    operationId: patch_event_subscription
    tags: ["Collaboration / Event Subscriptions"]
    summary: Create a new immutable Event Subscription revision.
    x-avernet-security: {user: required, app: required}
    parameters:
      - {name: subscription_id, in: path, required: true, schema: {type: string}}
      - name: If-Match
        in: header
        required: false
        description: Strong numeric revision ETag; required when body revision is omitted.
        schema: {type: string}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/PatchEventSubscriptionRequest"
    responses:
      "200":
        description: Updated redacted Event Subscription.
        content:
          application/json:
            schema:
              $ref: "#/EventSubscriptionEnvelope"
      "400": {$ref: "#/InvalidSubscriptionResponse"}
      "401": {$ref: "#/UnauthenticatedResponse"}
      "403": {$ref: "#/SubscriptionForbiddenResponse"}
      "404": {$ref: "#/SubscriptionNotFoundResponse"}
      "409": {$ref: "#/SubscriptionConflictResponse"}
      "500": {$ref: ../shared.yaml#/InternalErrorResponse}
  delete:
    operationId: delete_event_subscription
    tags: ["Collaboration / Event Subscriptions"]
    summary: Soft-delete an Event Subscription and return its redacted summary.
    x-avernet-security: {user: required, app: required}
    parameters:
      - {name: subscription_id, in: path, required: true, schema: {type: string}}
      - {name: revision, in: query, required: false, schema: {type: integer, minimum: 1}}
      - {name: If-Match, in: header, required: false, schema: {type: string}}
    responses:
      "200":
        description: Final redacted Event Subscription summary.
        content:
          application/json:
            schema:
              $ref: "#/EventSubscriptionEnvelope"
      "400": {$ref: "#/InvalidSubscriptionResponse"}
      "401": {$ref: "#/UnauthenticatedResponse"}
      "403": {$ref: "#/SubscriptionForbiddenResponse"}
      "404": {$ref: "#/SubscriptionNotFoundResponse"}
      "409": {$ref: "#/SubscriptionConflictResponse"}
      "500": {$ref: ../shared.yaml#/InternalErrorResponse}

TestEventSubscriptionPath:
  post:
    operationId: test_event_subscription
    tags: ["Collaboration / Event Subscriptions"]
    summary: Send one synchronous, non-retrying test Event.
    x-avernet-security: {user: required, app: required}
    parameters:
      - {name: subscription_id, in: path, required: true, schema: {type: string}}
    responses:
      "200":
        description: Redacted test result.
        content:
          application/json:
            schema:
              $ref: "#/EventSubscriptionTestEnvelope"
      "401": {$ref: "#/UnauthenticatedResponse"}
      "403": {$ref: "#/SubscriptionForbiddenResponse"}
      "404": {$ref: "#/SubscriptionNotFoundResponse"}
      "422":
        description: Test delivery failed.
        x-error-codes: [event_subscription_test_failed]
        content:
          application/json:
            schema:
              $ref: ../shared.yaml#/ErrorEnvelope
      "500": {$ref: ../shared.yaml#/InternalErrorResponse}

EventSubscriptionDeliveriesPath:
  get:
    operationId: list_event_subscription_deliveries
    tags: ["Collaboration / Event Subscriptions"]
    summary: List Event Delivery history using cursor pagination.
    x-avernet-security: {user: required, app: required}
    parameters:
      - {name: subscription_id, in: path, required: true, schema: {type: string}}
      - {name: status, in: query, schema: {type: string, enum: [pending, in_flight, retry_wait, succeeded, dead_lettered, cancelled, skipped]}}
      - {name: cursor, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    responses:
      "200":
        description: Cursor page of Event Deliveries.
        content:
          application/json:
            schema:
              $ref: "#/EventDeliveryPageEnvelope"
      "400": {$ref: "#/InvalidSubscriptionResponse"}
      "401": {$ref: "#/UnauthenticatedResponse"}
      "404": {$ref: "#/SubscriptionNotFoundResponse"}
      "500": {$ref: ../shared.yaml#/InternalErrorResponse}

EventDeliveryPath:
  get:
    operationId: get_event_delivery
    tags: ["Collaboration / Event Subscriptions"]
    summary: Get Event Delivery and Attempt summaries.
    x-avernet-security: {user: required, app: required}
    parameters:
      - {name: delivery_id, in: path, required: true, schema: {type: string}}
    responses:
      "200":
        description: Event Delivery detail.
        content:
          application/json:
            schema:
              $ref: "#/EventDeliveryDetailEnvelope"
      "401": {$ref: "#/UnauthenticatedResponse"}
      "404": {$ref: "#/DeliveryNotFoundResponse"}
      "500": {$ref: ../shared.yaml#/InternalErrorResponse}

ReplayEventDeliveryPath:
  post:
    operationId: replay_event_delivery
    tags: ["Collaboration / Event Subscriptions"]
    summary: Queue an idempotent replacement for an unresolved DLQ Delivery.
    x-avernet-security: {user: required, app: required}
    parameters:
      - {name: delivery_id, in: path, required: true, schema: {type: string}}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/ReplayEventDeliveryRequest"
    responses:
      "202":
        description: Replacement Delivery queued.
        content:
          application/json:
            schema:
              $ref: "#/ReplayEventDeliveryEnvelope"
      "400": {$ref: "#/InvalidSubscriptionResponse"}
      "401": {$ref: "#/UnauthenticatedResponse"}
      "403": {$ref: "#/SubscriptionForbiddenResponse"}
      "404": {$ref: "#/DeliveryNotFoundResponse"}
      "409": {$ref: "#/DeliveryConflictResponse"}
      "500": {$ref: ../shared.yaml#/InternalErrorResponse}

SkipEventDeliveryPath:
  post:
    operationId: skip_event_delivery
    tags: ["Collaboration / Event Subscriptions"]
    summary: Audit and skip an unresolved DLQ Delivery.
    x-avernet-security: {user: required, app: required}
    parameters:
      - {name: delivery_id, in: path, required: true, schema: {type: string}}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/SkipEventDeliveryRequest"
    responses:
      "200":
        description: Delivery skipped and strict lane unblocked.
        content:
          application/json:
            schema:
              $ref: "#/SkipEventDeliveryEnvelope"
      "400": {$ref: "#/InvalidSubscriptionResponse"}
      "401": {$ref: "#/UnauthenticatedResponse"}
      "403": {$ref: "#/SubscriptionForbiddenResponse"}
      "404": {$ref: "#/DeliveryNotFoundResponse"}
      "409": {$ref: "#/DeliveryConflictResponse"}
      "500": {$ref: ../shared.yaml#/InternalErrorResponse}
