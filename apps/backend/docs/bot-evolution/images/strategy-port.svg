<text x="675" y="135" font-size="14" font-weight="700" fill="#334155" text-anchor="middle" dominant-baseline="middle">StrategyContext — the only door out</text>
<text x="405" y="160" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start" dominant-baseline="middle">Always granted</text>
<rect x="405" y="172" width="82" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="446.0" y="187.0" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">parent</text>
<rect x="497" y="172" width="82" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="538.0" y="187.0" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">workspace</text>
<rect x="589" y="172" width="82" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="630.0" y="187.0" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">submit · ops</text>
<rect x="681" y="172" width="82" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="722.0" y="187.0" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">budget</text>
<rect x="773" y="172" width="180" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="863.0" y="187.0" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">log · artifacts · cancelled</text>
<text x="405" y="222" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start" dominant-baseline="middle">Granted only if declared in needs</text>
<rect x="405" y="234" width="150" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="480.0" y="249.0" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">experience.sessions@1</text>
<rect x="563" y="234" width="150" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="638.0" y="249.0" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">experience.feedback@1</text>
<rect x="721" y="234" width="96" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="769.0" y="249.0" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">agents@1</text>
<rect x="825" y="234" width="126" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="888.0" y="249.0" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">evaluate.train@1</text>
<path d="M 190 82 L 190 123" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="198" y="103" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">run(ctx)</text>
<path d="M 340 200 L 388 200" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="364" y="190" font-size="11.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">calls</text>
<rect x="40" y="330" width="300" height="100" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="190.0" y="356.7125" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">Binding (per bot)</text>
<text x="190.0" y="373.92499999999995" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">strategy · trigger · parent</text>
<text x="190.0" y="389.44999999999993" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">allowed genes · verification profile</text>
<text x="190.0" y="404.9749999999999" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">budget · params</text>
