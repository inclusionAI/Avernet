<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="540" fill="#fafbf9"/>
  <text x="24" y="32" font-size="16" font-weight="bold" fill="#1c2420">Supply-agent categories — where the idempotency profile lives</text>

  <!-- center BCN -->
  <rect x="370" y="210" width="180" height="104" rx="12" fill="#e3f0e9" stroke="#157a55" stroke-width="1.5"/>
  <text x="460" y="238" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2420">BCN</text>
  <text x="460" y="258" font-size="10.5" text-anchor="middle" fill="#1c2420">dispatch gate:</text>
  <text x="460" y="272" font-size="10.5" text-anchor="middle" fill="#1c2420">side-effect class × tier</text>
  <text x="460" y="292" font-size="10" text-anchor="middle" fill="#5c6a62">records + verifies declared</text>
  <text x="460" y="304" font-size="10" text-anchor="middle" fill="#5c6a62">profile capability per bot</text>

  <!-- left: dial-in -->
  <text x="60" y="76" font-size="12.5" font-weight="bold" fill="#5c6a62">DIAL-IN (WS — agent connects to BCN)</text>

  <rect x="60" y="90" width="260" height="72" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="190" y="110" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">B · bcs-bridge (Rust)</text>
  <text x="190" y="126" font-size="10.5" text-anchor="middle" fill="#5c6a62">Claude Code · Codex · QwenWork · future</text>
  <rect x="98" y="134" width="184" height="20" rx="10" fill="#e3f0e9" stroke="#157a55"/>
  <text x="190" y="148" font-size="10" text-anchor="middle" fill="#157a55">profile in our adapter — cost: low</text>

  <rect x="60" y="178" width="260" height="72" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="190" y="198" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">A1 · openclaw-channel-bcn (TS)</text>
  <text x="190" y="214" font-size="10.5" text-anchor="middle" fill="#5c6a62">singlebox bots · agency-agent · local users</text>
  <rect x="78" y="222" width="224" height="20" rx="10" fill="#e3f0e9" stroke="#157a55"/>
  <text x="190" y="236" font-size="10" text-anchor="middle" fill="#157a55">profile in our adapter — low-med + fleet rollout</text>

  <rect x="60" y="266" width="260" height="72" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="190" y="286" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">A2 · deepseek-harness-channel-bcn</text>
  <text x="190" y="302" font-size="10.5" text-anchor="middle" fill="#5c6a62">DSH community bots</text>
  <rect x="78" y="310" width="224" height="20" rx="10" fill="#e3f0e9" stroke="#157a55"/>
  <text x="190" y="324" font-size="10" text-anchor="middle" fill="#157a55">profile in our adapter — low-med + fleet rollout</text>

  <rect x="60" y="354" width="260" height="50" rx="10" fill="#ffffff" stroke="#b9c6bf" stroke-dasharray="4 3"/>
  <text x="190" y="374" font-size="12" text-anchor="middle" fill="#1c2420">D · scripted / test bots</text>
  <text x="190" y="392" font-size="10" text-anchor="middle" fill="#5c6a62">trivial; conformance fixtures in bcs-test-support</text>

  <line x1="320" y1="126" x2="366" y2="226" stroke="#5c6a62" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <line x1="320" y1="214" x2="366" y2="252" stroke="#5c6a62" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <line x1="320" y1="302" x2="366" y2="282" stroke="#5c6a62" marker-end="url(#ar)" marker-start="url(#ar)"/>

  <!-- right: dial-out -->
  <text x="600" y="76" font-size="12.5" font-weight="bold" fill="#5c6a62">DIAL-OUT (webhook + SSE — BCN dials out)</text>

  <rect x="600" y="104" width="280" height="88" rx="10" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="740" y="124" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">C1 · engine adapter (in-house provider)</text>
  <text x="740" y="140" font-size="10.5" text-anchor="middle" fill="#5c6a62">backend-created bots · OpenClaw/Moltis engines</text>
  <rect x="628" y="150" width="224" height="20" rx="10" fill="#e3f0e9" stroke="#157a55"/>
  <text x="740" y="164" font-size="10" text-anchor="middle" fill="#157a55">rides the A2A migration — make window durable</text>
  <text x="740" y="184" font-size="10" text-anchor="middle" fill="#5c6a62">likely home of the launch experts</text>

  <rect x="600" y="220" width="280" height="96" rx="10" fill="#ffffff" stroke="#9a6b0a" stroke-dasharray="5 4"/>
  <text x="740" y="240" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">C2 · external provider platforms</text>
  <text x="740" y="256" font-size="10.5" text-anchor="middle" fill="#5c6a62">third parties, their code — contract only</text>
  <rect x="628" y="266" width="224" height="20" rx="10" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="740" y="280" font-size="10" text-anchor="middle" fill="#9a6b0a">profile by conformance suite — timeline theirs</text>
  <text x="740" y="302" font-size="10" text-anchor="middle" fill="#5c6a62">until verified: read-only tier (scoped, not blocked)</text>

  <line x1="550" y1="240" x2="596" y2="156" stroke="#5c6a62" marker-end="url(#ar)"/>
  <line x1="550" y1="272" x2="596" y2="268" stroke="#5c6a62" marker-end="url(#ar)"/>

  <!-- tier table -->
  <rect x="60" y="430" width="820" height="86" rx="10" fill="#f2f5f3" stroke="#b9c6bf"/>
  <text x="76" y="454" font-size="12" font-weight="bold" fill="#1c2420">Capability tiers (enforced at dispatch)</text>
  <text x="76" y="476" font-size="11" fill="#1c2420">· Baseline (any vanilla A2A agent): read_only / idempotent steps — search, fetch, summarize</text>
  <text x="76" y="496" font-size="11" fill="#157a55">· Profile-verified: also external_side_effect steps — book, pay, send</text>
  <text x="620" y="476" font-size="10.5" fill="#5c6a62">declared (AgentCard extension / registration flag)</text>
  <text x="620" y="496" font-size="10.5" fill="#5c6a62">→ verified (conformance) → enforced (gate)</text>
</svg>
