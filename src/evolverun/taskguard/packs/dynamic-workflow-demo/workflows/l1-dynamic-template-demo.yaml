# ============================================================================
# L1: 动态模板展开 (Dynamic Template Expansion)
# ============================================================================
# 类似 Airflow 的 expand()，运行时为 forEach 数组的每个元素
# 从 nodeTemplates 模板生成独立的运行时节点。
#
# 场景：对多个代码检查项并行执行嵌入式 Agent 审查，
# 每个检查项生成一个独立节点（如 scan-format__item0__scan）。
# ============================================================================
id: l1-dynamic-template-demo
version: 1
title: L1 动态模板展开演示

input:
  mode: mixed
  requiredParams: [projectName]
  sources:
    params: true
    message: true

identity:
  key: "{{input.params.projectName}}"
  label: "L1演示: {{input.params.projectName}}"
  duplicatePolicy: allow

outputs:
  summary:
    from: "{{nodeOutput.aggregate}}"
    public: true
    description: "汇总审查结果"

defaults:
  progress:
    enabled: true
    sink: chat

messages:
  onCreated: "L1 动态模板展开演示已启动：{{input.params.projectName}}"
  onFinished: "L1 演示已完成。"

# ── 节点模板 ──
# dynamic-template 节点运行时会把 nodeTemplates 中指定的模板
# 为 forEach 数组的每个元素生成运行时节点。
# 节点 ID 模式: ${dtNodeId}__item${index}__${bodyNodeId}
nodeTemplates:
  scan:
    title: "代码审查: {{item.name}}"
    phase: P2
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        对项目 {{input.params.projectName}} 执行代码审查，检查项: {{item.name}}

        检查要求: {{item.description}}

        严格输出 JSON:
        {
          "check": "{{item.name}}",
          "passed": true 或 false,
          "findings": ["发现1", "发现2"],
          "severity": "high/medium/low"
        }

nodes:
  # ── P1: 准备检查列表 ──
  - id: prepare-checks
    title: 准备检查项列表
    phase: P1
    dependsOn: []
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        为项目 {{input.params.projectName}} 生成代码审查检查项列表。

        严格输出 JSON 数组:
        [
          { "name": "代码格式", "description": "检查代码格式和命名规范" },
          { "name": "安全漏洞", "description": "检查常见安全漏洞如SQL注入、XSS" },
          { "name": "性能问题", "description": "检查性能瓶颈和内存泄漏" }
        ]

  # ── P2: 动态模板展开 ──
  # 运行时为 prepare-checks 输出数组的每个元素生成一个 scan 节点
  - id: scan-list
    title: 并行代码审查
    phase: P2
    dependsOn: [prepare-checks]
    executor:
      type: dynamic-template
      forEach: "{{nodeOutput.prepare-checks}}"
      template: scan

  # ── P3: 汇总结果 ──
  - id: aggregate
    title: 汇总审查结果
    phase: P3
    dependsOn: [scan-list]
    triggerRule: all_success
    executor:
      type: embedded-agent
      outputMode: json
      prompt: >
        汇总所有代码审查结果，生成最终报告。

        所有检查结果: {{nodeOutput.scan-list}}

        严格输出 JSON:
        {
          "project": "{{input.params.projectName}}",
          "totalChecks": 3,
          "passedChecks": 0,
          "failedChecks": 0,
          "summary": "审查摘要",
          "recommendations": ["建议1", "建议2"]
        }

  - id: done
    title: 完成
    phase: P4
    dependsOn: [aggregate]
    executor:
      type: done
      message: "L1 动态模板展开演示完成"