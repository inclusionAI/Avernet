<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="360" fill="#fafbf9"/>
  <text x="24" y="34" font-size="16" font-weight="bold" fill="#1c2420">Three lifetimes: run ⊂ episode ⊂ task session</text>

  <!-- warm band labels -->
  <text x="60" y="78" font-size="11" font-weight="bold" fill="#157a55">WARM (in memory, on one node)</text>

  <!-- Episode 1 -->
  <rect x="110" y="88" width="190" height="78" rx="10" fill="#e3f0e9" stroke="#157a55" stroke-width="1.5"/>
  <text x="205" y="106" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1c2420">episode 1 — warm on node A</text>
  <text x="205" y="120" font-size="10" text-anchor="middle" fill="#5c6a62">user iterating, rounds minutes apart</text>
  <rect x="124" y="130" width="70" height="26" rx="5" fill="#ffffff" stroke="#157a55"/>
  <text x="159" y="147" font-size="10" text-anchor="middle" fill="#1c2420">run 1</text>
  <rect x="210" y="130" width="76" height="26" rx="5" fill="#ffffff" stroke="#157a55"/>
  <text x="248" y="147" font-size="10" text-anchor="middle" fill="#1c2420">run 2 (revise)</text>

  <!-- Episode 2 -->
  <rect x="560" y="88" width="170" height="78" rx="10" fill="#e3f0e9" stroke="#157a55" stroke-width="1.5"/>
  <text x="645" y="106" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1c2420">episode 2 — warm on node C</text>
  <text x="645" y="120" font-size="10" text-anchor="middle" fill="#5c6a62">user returns months later</text>
  <rect x="588" y="130" width="112" height="26" rx="5" fill="#ffffff" stroke="#157a55"/>
  <text x="644" y="147" font-size="10" text-anchor="middle" fill="#1c2420">run 3 (prep plan)</text>

  <!-- GC / rehydrate arrows -->
  <line x1="310" y1="128" x2="368" y2="180" stroke="#9a6b0a" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="330" y="186" font-size="10.5" fill="#9a6b0a">idle → evict (GC)</text>
  <line x1="500" y1="196" x2="554" y2="140" stroke="#157a55" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="402" y="212" font-size="10.5" fill="#157a55">rehydrate from DB — same path as failover</text>

  <!-- idle note -->
  <text x="432" y="110" font-size="10.5" text-anchor="middle" fill="#5c6a62">idle: cold, durable only</text>
  <line x1="304" y1="122" x2="556" y2="122" stroke="#b9c6bf" stroke-dasharray="2 4"/>

  <!-- Task session bar -->
  <text x="60" y="246" font-size="11" font-weight="bold" fill="#1c2420">DURABLE (shared DB, whole time)</text>
  <rect x="80" y="256" width="760" height="34" rx="8" fill="#ffffff" stroke="#1c2420" stroke-width="1.5"/>
  <text x="460" y="277" font-size="11.5" text-anchor="middle" fill="#1c2420">task session — L2 thread of record + L3 workspace, written through on every round</text>

  <!-- time axis -->
  <line x1="60" y1="322" x2="880" y2="322" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="80" y="342" font-size="10.5" fill="#5c6a62">task created</text>
  <text x="432" y="342" font-size="10.5" text-anchor="middle" fill="#5c6a62">… months …</text>
  <text x="800" y="342" font-size="10.5" fill="#5c6a62">task closed</text>
  <line x1="205" y1="166" x2="205" y2="252" stroke="#b9c6bf" stroke-dasharray="2 4"/>
  <line x1="645" y1="166" x2="645" y2="252" stroke="#b9c6bf" stroke-dasharray="2 4"/>
</svg>
