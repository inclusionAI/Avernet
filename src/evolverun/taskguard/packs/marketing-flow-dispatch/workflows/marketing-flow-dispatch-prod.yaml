id: marketing-flow-dispatch
version: 1
title: 营销智评分流
config:
  description: "营销智评分流规则配置 - 根据 buName 路由到不同的下游 bot"
  version: "1.1.0"
  rules:
    - name: 金融线营销评审
      field: buName
      match_mode: regex_any
      keywords:
        - 网商
        - R88
        - 小微业务
        - 蚂蚁星河
        - 消金
        - 消费金融
        - 花呗
        - 车生活
        - 信用购
        - 借呗
        - 信用卡
        - 还款
        - 财富
        - 黑卡
        - 基金
        - 余额宝
        - 股票
        - 理财
        - 大稳健
        - 大权益
        - 帮你投
        - 小荷包
        - 保险
        - 险
        - 财保
      target_bot_uuid: "20260514_adan6ap1:461514"
      target_bot_id: "20260514_adan6ap1:461514"
      target_bot_name: "下游评审bot"
    - name: 支付线营销评审
      field: buName
      match_mode: regex_any
      keywords:
        - 支付
        - 常规支付
        - 用户运营
        - 收单
        - 商家服务
        - 跨境
        - 国际支付
        - 线下支付
        - 付款
        - 转账
      target_bot_uuid: "20260514_adan6ap1:461514"
      target_bot_id: "20260514_adan6ap1:461514"
      target_bot_name: "下游评审bot"
  default_action:
    type: reject
    message: "该活动对应的buName暂无对应bot"
identity:
  key: "{{input.params.activityId}}"
  label: "活动 {{input.params.activityId}}"
  duplicatePolicy: "allow"
requiredParams:
  - activityId

messages:
  onCreated: "开始分流，活动ID: {{params.activityId}}"
  onFinished: "分流完成"

outputs:
  action:
    from: match-routing
    public: true
    description: 分流结果 (route/reject)
  buName:
    from: extract-buname
    public: true
    description: 业务线名称

nodes:
  # ── Node 1: MCP selectById 获取初始化数据 ──
  - id: fetch-activity
    title: 获取活动数据
    phase: fetch
    dependsOn: []
    executor:
      type: mcp-call
      server: mcp.ant.agentix.108780.test_tool_kit
      tool: risk_evaluation_toolkit
      args:
        evalMaterial/evalType: "AI_DATA"
        evalMaterial/evalContent: "{{params.activityId}}"
        evalMaterial/evaSubType: "AI,selectById"
        evalMaterial/requestId: ""
      outputMode: json
      timeoutMs: 30000
    progressMessage: "正在获取活动 {{params.activityId}} 的数据…"

  # ── Node 2: 解析活动数据（拆解嵌套 JSON） ──
  - id: parse-activity-data
    title: 解析活动数据
    phase: extract
    dependsOn: [fetch-activity]
    executor:
      type: cli-script
      command: node
      args:
        eval: |
          const raw = process.env.NODE_INPUT || '{}';
          const diag = [];
          diag.push('rawLen=' + raw.length);
          diag.push('rawFirst100=' + raw.substring(0, 100));
          function stripCtrls(s) {
            let out = '';
            for (let i = 0; i < s.length; i++) {
              const c = s.charCodeAt(i);
              out += (c < 32 || c === 127) ? ' ' : s[i];
            }
            return out;
          }
          const sanitized = stripCtrls(raw);
          let input;
          try {
            input = JSON.parse(sanitized);
          } catch (e) {
            console.log(JSON.stringify({ buName: null, buNameSource: null, error: 'JSON.parse failed: ' + e.message.substring(0, 200), diag: diag.join('; ') }));
            process.exit(0);
          }
          diag.push('parsedKeys=' + (typeof input === 'object' && input ? Object.keys(input).join(',') : typeof input));
          function deepParse(val) {
            if (typeof val === 'string') {
              let cleaned = stripCtrls(val);
              for (let i = 0; i < 15; i++) {
                try { cleaned = JSON.parse(cleaned); } catch(e) { break; }
              }
              val = cleaned;
            }
            if (val && typeof val === 'object' && !Array.isArray(val)) {
              for (const key of Object.keys(val)) { val[key] = deepParse(val[key]); }
            }
            if (Array.isArray(val)) {
              for (let i = 0; i < val.length; i++) { val[i] = deepParse(val[i]); }
            }
            return val;
          }
          function findBuName(obj, path) {
            path = path || '.';
            if (!obj || typeof obj !== 'object') return null;
            if (typeof obj.buName === 'string' && obj.buName.trim()) return obj.buName;
            for (const key of Object.keys(obj)) {
              const found = findBuName(obj[key], path + '.' + key);
              if (found) return found;
            }
            return null;
          }
          function findActivityItem(obj, depth) {
            if (!obj || typeof obj !== 'object' || depth > 8) return null;
            if ((obj.material && typeof obj.material === 'object') || (obj.pendingReviewData && typeof obj.pendingReviewData === 'object') || (obj.campName)) return obj;
            for (const key of Object.keys(obj)) {
              const found = findActivityItem(obj[key], depth + 1);
              if (found) return found;
            }
            return null;
          }
          try {
            const unwrapped = deepParse(input);
            diag.push('unwrappedType=' + typeof unwrapped);
            if (unwrapped && typeof unwrapped === 'object') {
              diag.push('unwrappedKeys=' + Object.keys(unwrapped).join(','));
              if (unwrapped.data && typeof unwrapped.data === 'object') {
                diag.push('dataKeys=' + Object.keys(unwrapped.data).join(','));
                if (unwrapped.data.data) {
                  diag.push('data.dataType=' + typeof unwrapped.data.data);
                  if (typeof unwrapped.data.data === 'object') diag.push('data.dataKeys=' + Object.keys(unwrapped.data.data).join(','));
                }
              }
            }
            let buName = findBuName(unwrapped);
            let buNameSource = buName ? 'tree-walk' : null;
            diag.push('buName=' + buName + ';source=' + buNameSource);
            const item = findActivityItem(unwrapped, 0);
            let material = null;
            let projectName = null;
            if (item) {
              material = (item.material && typeof item.material === 'object') ? item.material : null;
              projectName = item.campName || (material && material.campName) || item.projectName || null;
              if (!buName && material && material.buName) { buName = material.buName; buNameSource = 'material'; }
              if (!buName && item.pendingReviewData && item.pendingReviewData.buName) { buName = item.pendingReviewData.buName; buNameSource = 'pendingReviewData'; }
              if (!buName && item.extData && typeof item.extData === 'object' && item.extData.pendingReviewData) {
                const pr = typeof item.extData.pendingReviewData === 'object' ? item.extData.pendingReviewData : null;
                if (pr && pr.buName) { buName = pr.buName; buNameSource = 'extData.pendingReviewData'; }
              }
            }
            if (!buName && projectName) { buName = projectName; buNameSource = 'projectName'; }
            if (!buName) {
              console.log(JSON.stringify({ buName: null, buNameSource: null, error: 'buName not found in response tree', material: null, projectName: null, diag: diag.join(' | ') }));
            } else {
              console.log(JSON.stringify({ buName, buNameSource, error: null, material, projectName, diag: diag.join(' | ') }));
            }
          } catch (e) {
            console.log(JSON.stringify({ buName: null, buNameSource: null, error: e.message, material: null, projectName: null, diag: diag.join(' | ') }));
          }
      env:
        NODE_INPUT: "{{nodeOutput.fetch-activity}}"
      outputMode: json
      timeoutMs: 15000
    progressMessage: "正在解析活动数据…"

  # ── Node 3: 提取 buName ──
  - id: extract-buname
    title: 提取业务线信息
    phase: extract
    dependsOn: [parse-activity-data]
    executor:
      type: cli-script
      command: node
      args:
        eval: |
          const input = JSON.parse(process.env.NODE_INPUT || '{}');
          try {
            const buName = input.buName || null;
            const buNameSource = input.buNameSource || null;
            const error = input.error || null;
            const projectName = input.projectName || null;
            if (buName) {
              console.log(JSON.stringify({ buName, buNameSource, error: null }));
            } else if (error) {
              console.log(JSON.stringify({ buName: null, buNameSource: null, error: error }));
            } else if (projectName) {
              console.log(JSON.stringify({ buName: projectName, buNameSource: 'projectName', error: null }));
            } else {
              console.log(JSON.stringify({ buName: null, buNameSource: null, error: 'buName not found and no projectName fallback' }));
            }
          } catch (e) {
            console.log(JSON.stringify({ buName: null, buNameSource: null, error: e.message }));
          }
      env:
        NODE_INPUT: "{{nodeOutput.parse-activity-data}}"
      outputMode: json
      timeoutMs: 10000
    progressMessage: "正在提取 buName…"

  # ── Node 4: 匹配分流规则 ──
  - id: match-routing
    title: 匹配分流规则
    phase: route
    dependsOn: [extract-buname]
    executor:
      type: cli-script
      command: node
      args:
        eval: |
          const bunameInput = JSON.parse(process.env.BUNAME_INPUT || '{}');
          const config = JSON.parse(process.env.WORKFLOW_CONFIG || '{}');
          try {
            const buName = bunameInput.buName;
            if (!buName) {
              const msg = (config.default_action && config.default_action.message) || '该活动对应的buName暂无对应bot';
              console.log(JSON.stringify({ action: 'reject', matchedRule: null, message: msg }));
              process.exit(0);
            }
            const rules = config.rules || [];
            for (const rule of rules) {
              const keywords = rule.keywords || [];
              const matched = keywords.find(kw => buName.includes(kw));
              if (matched) {
                console.log(JSON.stringify({ action: 'route', matchedRule: rule.name, matchedKeyword: matched, targetBotUuid: rule.target_bot_uuid, targetBotId: rule.target_bot_id, targetBotName: rule.target_bot_name }));
                process.exit(0);
              }
            }
            const msg = (config.default_action && config.default_action.message) || '该活动对应的buName暂无对应bot';
            console.log(JSON.stringify({ action: 'reject', matchedRule: null, message: msg }));
          } catch (e) {
            console.log(JSON.stringify({ action: 'reject', matchedRule: null, message: 'Routing error: ' + e.message }));
          }
      env:
        BUNAME_INPUT: "{{nodeOutput.extract-buname}}"
        WORKFLOW_CONFIG: "{{workflowData.config}}"
      outputMode: json
      timeoutMs: 10000
    onResult:
      branches:
        - branchId: matched
          match: { action: route }
          complete: false
        - branchId: unmatched
          match: { action: reject }
          complete: false
      default:
        complete: false
    progressMessage: "正在匹配分流规则…"

  # ── Node 4: 路由到下游Bot → 下游bot评审 ──
  - id: dispatch-route
    title: 路由到下游Bot
    phase: dispatch
    dependsOn: [match-routing]
    branchId: matched
    executor:
      type: baas-call
      mode: message
      botId: "{{nodeOutput.match-routing.targetBotId}}"
      message: "评审活动 {{params.activityId}}"
      baseUrl: "https://secbaas-prod.alipay.com"
      timeoutMs: 1800000
      pollIntervalMs: 3000
    progressMessage: "正在调用 {{nodeOutput.match-routing.targetBotName}} 评审…"

  # ── Node 5: 无匹配规则 → 返回文案 ──
  - id: reject-unmatched
    title: 无匹配规则
    phase: dispatch
    dependsOn: [match-routing]
    branchId: unmatched
    progressMessage: "{{nodeOutput.match-routing.message}}"
    executor:
      type: done

  # ── Node 6: 完成 ──
  - id: finish
    title: 完成
    phase: finish
    dependsOn: [dispatch-route, reject-unmatched]
    join: any
    executor:
      type: done