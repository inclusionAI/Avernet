# Gateway community-deployment config — MariaDB storage + Redis cache via env
# placeholders.
# Loaded as an overlay on application.yaml when COMMUNITY_DEPLOY=community
# (COMMUNITY_DEPLOY wins over SERVER_ENV for overlay selection; SERVER_ENV may
# still be set for env-dependent behaviour, e.g. principal signing).
#
# Env placeholders (${NAME}) are expanded by the config loader from the process
# environment (see gateway.community.config._config_loader.ConfigLoader). The
# values must be supplied by the deployment (the docker entrypoint / scheduler):
#   DATABASE_URL     — MariaDB connection URL (mysql+aiomysql://...)
#   REDIS_URL        — Redis cache URL (redis://...)
#   COMMUNITY_DEPLOY — must be "community" to select this overlay
#
# Upstream endpoints keep a scheme-full fallback (:-...), so an unset env var
# still yields a valid URL: the gateway refuses to boot when a server base_url
# lacks a scheme (core/forwarding/_domains.py), and a bare unset ${NAME} would
# otherwise leak the literal placeholder into the URL and crash startup.

app_name: "gateway"
workers: 1

module_config:
  web:
    port: 8888

user_config:
  # Plugin selectors — switch from community stubs to real backends.
  plugins:
    cache: "redis"
    database: "mariadb"

  # MariaDB connection config (plugins.database = "mariadb").
  database:
    database_url: "${DATABASE_URL}"
    create_schema: false
    seed_data: false

  # Redis cache config (plugins.cache = "redis").
  cache_redis:
    url: "${REDIS_URL}"
    socket_timeout: 5.0
    socket_connect_timeout: 5.0

  # Upstream endpoints — env-driven with scheme-full defaults so the gateway
  # always boots. Each value must carry a scheme (http/https/ws/wss).
  upstream_vars:
    backend_server_url: "${BACKEND_SERVER_URL:-https://backend.avernet.com}"
    baas_server_url: "${BAAS_SERVER_URL:-https://baas.avernet.com}"
    bcs_server_url: "${BCS_SERVER_URL:-https://bcs.avernet.com}"
    engine_proxy_server_url: "${ENGINE_PROXY_SERVER_URL:-https://engineproxy.avernet.com}"
    bcsfuse_server_url: "${BCSFUSE_SERVER_URL:-https://bcsfuse.avernet.com}"
    clawweb_server_url: "${CLAWWEB_SERVER_URL:-http://evolvetrace.inner.avernet.com}"
