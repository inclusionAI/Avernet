id: dynamic-workflow-demo
version: "1.0.0"
title: 动态工作流 L1-L4 示例演示
description: |
  动态工作流引擎四层能力的示例 Pack，用于测试和演示：
  - L1 (dynamic-template): 参数化模板展开 — 类似 Airflow expand()，运行时为每个数组元素生成节点
  - L2 (goal-evaluator): LLM 条件评估 + 目标驱动循环 — LLM 判断分支选择和目标是否达成
  - L3 (llm-orchestrator): LLM 动态编排 — LLM 从可用动作菜单中选择并注入节点
  - L4 (yaml-synthesizer): LLM 从零生成 YAML — LLM 生成完整 WorkflowSpec，引擎验证后执行

workflows:
  - id: l1-dynamic-template-demo
    file: workflows/l1-dynamic-template-demo.yaml
  - id: l2-goal-evaluator-demo
    file: workflows/l2-goal-evaluator-demo.yaml
  - id: l3-llm-orchestrator-demo
    file: workflows/l3-llm-orchestrator-demo.yaml
  - id: l4-yaml-synthesis-demo
    file: workflows/l4-yaml-synthesis-demo.yaml

facades:
  - command: demo-l1
    defaultWorkflow: l1-dynamic-template-demo
    help:
      title: L1 动态模板展开演示
      summary: 演示 dynamic-template 执行器为每个检查项生成独立节点
      examples:
        - "/demo-l1 项目=交易系统"
  - command: demo-l2
    defaultWorkflow: l2-goal-evaluator-demo
    help:
      title: L2 目标评估循环演示
      summary: 演示 goal-evaluator 循环直到审查目标达成或达到最大尝试次数
      examples:
        - "/demo-l2 目标=审查代码安全"
  - command: demo-l3
    defaultWorkflow: l3-llm-orchestrator-demo
    help:
      title: L3 LLM 动态编排演示
      summary: 演示 llm-orchestrator 从可用动作中选择并注入节点
      examples:
        - "/demo-l3 目标=评估营销活动风险"
  - command: demo-l4
    defaultWorkflow: l4-yaml-synthesis-demo
    help:
      title: L4 YAML 合成演示
      summary: 演示 LLM 从自然语言目标生成完整 YAML 工作流定义，引擎验证后执行
      examples:
        - "/demo-l4 帮我审查这个项目的代码质量"