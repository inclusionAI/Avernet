id: marketing-flow-dispatch
version: "1.0.0"
title: 营销智评分流器
description: 根据活动业务线(buName)将评审请求路由到对应的下游bot

workflows:
  - id: marketing-flow-dispatch
    file: workflows/marketing-flow-dispatch.yaml
  - id: marketing-flow-dispatch-alert
    file: workflows/marketing-flow-dispatch-alert.yaml

facades:
  - command: marketing-flow-dispatch
    defaultWorkflow: marketing-flow-dispatch
    help:
      title: 营销智评分流
      summary: 输入活动ID，自动获取buName并匹配分流规则，路由到下游评审bot
      examples:
        - "/marketing-flow-dispatch 4000009"
        - "/marketing-flow-dispatch CP128769143"
  - command: cct-sop-alert
    defaultWorkflow: marketing-flow-dispatch-alert
    help:
      title: 营销智评分流（告警测试）
      summary: 测试钉钉告警通知的分流工作流，botId带test前缀会触发失败
      examples:
        - "/cct-sop-alert 4000009"