<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b3402e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">Why fencing: the zombie owner</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">A cannot detect its own pause. Only the storage its write lands in can reject it.</text>

  <rect x="90" y="72" width="180" height="40" rx="8" fill="#f8e6e1" stroke="#b3402e"/>
  <text x="180" y="90" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#b3402e">Node A (old owner)</text>
  <text x="180" y="105" font-size="10.5" text-anchor="middle" fill="#b3402e">pauses → zombie</text>
  <rect x="390" y="72" width="180" height="40" rx="8" fill="#eef2fa" stroke="#2457a6"/>
  <text x="480" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2457a6">Shared DB (lease row of bucket b)</text>
  <rect x="690" y="72" width="180" height="40" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="780" y="97" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#157a55">Node B (new owner)</text>
  <line x1="180" y1="112" x2="180" y2="540" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="480" y1="112" x2="480" y2="540" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="780" y1="112" x2="780" y2="540" stroke="#b9c6bf" stroke-dasharray="3 4"/>

  <text x="30" y="146" font-size="11" fill="#5c6a62">t = 0</text>
  <rect x="404" y="132" width="152" height="24" rx="5" fill="#ffffff" stroke="#2457a6"/>
  <text x="480" y="148" font-size="11" text-anchor="middle" fill="#1c2420">owner A · token 7</text>
  <line x1="184" y1="176" x2="476" y2="176" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="330" y="170" font-size="11" text-anchor="middle" fill="#1c2420">fenced write (token 7) ✓</text>

  <text x="30" y="212" font-size="11" fill="#5c6a62">t = 1 s</text>
  <rect x="120" y="198" width="120" height="96" rx="6" fill="#f8e6e1" stroke="#b3402e" stroke-dasharray="4 3"/>
  <text x="180" y="226" font-size="11" text-anchor="middle" fill="#b3402e">40 s pause</text>
  <text x="180" y="244" font-size="10.5" text-anchor="middle" fill="#b3402e">(GC, VM migration,</text>
  <text x="180" y="260" font-size="10.5" text-anchor="middle" fill="#b3402e">kernel stall)</text>
  <text x="180" y="280" font-size="10.5" text-anchor="middle" fill="#b3402e">no heartbeats</text>

  <text x="30" y="246" font-size="11" fill="#5c6a62">t ≈ 5 s</text>
  <rect x="404" y="232" width="152" height="24" rx="5" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="480" y="248" font-size="11" text-anchor="middle" fill="#9a6b0a">A's heartbeat stale</text>
  <text x="30" y="290" font-size="11" fill="#5c6a62">t ≈ 6 s</text>
  <line x1="776" y1="286" x2="484" y2="286" stroke="#157a55" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="630" y="279" font-size="11" text-anchor="middle" fill="#157a55">CLAIM: token 7 → 8 WHERE claimable</text>
  <rect x="404" y="300" width="152" height="24" rx="5" fill="#ffffff" stroke="#157a55"/>
  <text x="480" y="316" font-size="11" text-anchor="middle" fill="#157a55">owner B · token 8</text>
  <line x1="484" y1="336" x2="776" y2="336" stroke="#157a55" marker-end="url(#ag)"/>
  <text x="630" y="352" font-size="11" text-anchor="middle" fill="#157a55">affected rows = 1 → B owns S</text>
  <line x1="776" y1="380" x2="484" y2="380" stroke="#157a55" marker-end="url(#ag)"/>
  <text x="630" y="374" font-size="11" text-anchor="middle" fill="#157a55">rehydrate, fenced writes (token 8) ✓</text>

  <text x="30" y="426" font-size="11" fill="#5c6a62">t = 41 s</text>
  <text x="180" y="414" font-size="11" text-anchor="middle" fill="#b3402e">A wakes, still "owner"</text>
  <line x1="184" y1="430" x2="476" y2="430" stroke="#b3402e" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="330" y="446" font-size="11" text-anchor="middle" fill="#b3402e">fenced write: token 7, but the row says 8</text>
  <rect x="404" y="456" width="152" height="40" rx="5" fill="#f8e6e1" stroke="#b3402e"/>
  <text x="480" y="473" font-size="11" font-weight="bold" text-anchor="middle" fill="#b3402e">mismatch → rollback</text>
  <text x="480" y="488" font-size="10.5" text-anchor="middle" fill="#b3402e">nothing lands</text>
  <line x1="476" y1="516" x2="184" y2="516" stroke="#b3402e" marker-end="url(#ab)"/>
  <text x="330" y="510" font-size="11" text-anchor="middle" fill="#b3402e">LeaseLost → A stops driving b's sessions</text>

  <rect x="600" y="420" width="340" height="110" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="616" y="442" font-size="12" font-weight="bold" fill="#1c2420">What correctness did not need</text>
  <text x="616" y="462" font-size="11.5" fill="#1c2420">• A knowing it was paused</text>
  <text x="616" y="480" font-size="11.5" fill="#1c2420">• nodes agreeing on membership</text>
  <text x="616" y="498" font-size="11.5" fill="#1c2420">• synchronized clocks</text>
  <text x="616" y="516" font-size="11.5" fill="#1c2420">• the load balancer or the hash</text>
</svg>
