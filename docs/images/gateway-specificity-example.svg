<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="请求 /openapi/v1/bots/skills/list 同时落在 bots 和 repository-skills 两个 domain 的声明范围内；repository-skills 多钉住了 skills 这一段字面量，字面量段数 4 比 bots 的 3 更多，因此更具体并胜出，bots 的配置对这条请求不生效">
  <defs>
    <marker id="spec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a4413"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect x="10" y="8" width="880" height="284" rx="16" fill="#f7f9f7" stroke="#d8ded9" stroke-width="1"/>

  <!-- request path row -->
  <text x="40" y="32" class="mono" font-size="12" fill="#6b7a74" style="letter-spacing:0.5px">请求路径　GET /openapi/v1/bots/skills/list</text>

  <g font-size="13" class="mono" fill="#161b1a" text-anchor="middle">
    <rect x="40" y="42" width="140" height="40" rx="6" fill="#ffffff" stroke="#161b1a" stroke-width="1.2"/>
    <text x="110" y="67">openapi</text>
    <rect x="188" y="42" width="140" height="40" rx="6" fill="#ffffff" stroke="#161b1a" stroke-width="1.2"/>
    <text x="258" y="67">v1</text>
    <rect x="336" y="42" width="140" height="40" rx="6" fill="#ffffff" stroke="#161b1a" stroke-width="1.2"/>
    <text x="406" y="67">bots</text>
    <rect x="484" y="42" width="140" height="40" rx="6" fill="#ffffff" stroke="#161b1a" stroke-width="1.2"/>
    <text x="554" y="67">skills</text>
    <rect x="632" y="42" width="140" height="40" rx="6" fill="#ffffff" stroke="#161b1a" stroke-width="1.2"/>
    <text x="702" y="67">list</text>
  </g>

  <!-- alignment guides -->
  <g stroke="#c7cfc9" stroke-width="1" stroke-dasharray="3,4">
    <line x1="40" y1="82" x2="40" y2="256"/>
    <line x1="180" y1="82" x2="180" y2="256"/>
    <line x1="336" y1="82" x2="336" y2="256"/>
    <line x1="484" y1="82" x2="484" y2="256"/>
    <line x1="632" y1="82" x2="632" y2="256"/>
    <line x1="772" y1="82" x2="772" y2="256"/>
  </g>

  <!-- domain: bots -->
  <text x="40" y="112" class="mono" font-size="11.5" fill="#4b5652">bots　（未声明 match，隐式为 /openapi/v1/bots/**）</text>
  <rect x="40" y="120" width="140" height="36" rx="6" fill="#eaf3ef" stroke="#3c6e63" stroke-width="1.4"/>
  <rect x="188" y="120" width="140" height="36" rx="6" fill="#eaf3ef" stroke="#3c6e63" stroke-width="1.4"/>
  <rect x="336" y="120" width="140" height="36" rx="6" fill="#eaf3ef" stroke="#3c6e63" stroke-width="1.4"/>
  <rect x="484" y="120" width="288" height="36" rx="6" fill="none" stroke="#3c6e63" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="628" y="143" class="mono" font-size="12" fill="#3c6e63" text-anchor="middle">** （skills、list 都落在通配符里）</text>
  <text x="800" y="143" class="sans" font-size="12" fill="#3c6e63" text-anchor="start">字面量段：3</text>

  <!-- domain: repository-skills -->
  <text x="40" y="202" class="mono" font-size="11.5" fill="#4b5652">repository-skills　（match: /openapi/v1/bots/skills/**）</text>
  <rect x="40" y="210" width="140" height="36" rx="6" fill="#fdf6ee" stroke="#c8661c" stroke-width="1.8"/>
  <rect x="188" y="210" width="140" height="36" rx="6" fill="#fdf6ee" stroke="#c8661c" stroke-width="1.8"/>
  <rect x="336" y="210" width="140" height="36" rx="6" fill="#fdf6ee" stroke="#c8661c" stroke-width="1.8"/>
  <rect x="484" y="210" width="140" height="36" rx="6" fill="#fdf6ee" stroke="#c8661c" stroke-width="1.8"/>
  <rect x="632" y="210" width="140" height="36" rx="6" fill="none" stroke="#c8661c" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="702" y="233" class="mono" font-size="12" fill="#8a4413" text-anchor="middle">**</text>
  <text x="800" y="228" class="sans" font-size="12" font-weight="600" fill="#8a4413" text-anchor="start">字面量段：4</text>
  <text x="800" y="245" class="sans" font-size="11.5" font-weight="600" fill="#8a4413" text-anchor="start">→ 更具体，胜出</text>

  <!-- callout arrow pointing at the extra pinned "skills" segment -->
  <path d="M 720 200 C 700 185, 580 175, 560 158" fill="none" stroke="#8a4413" stroke-width="1.4" marker-end="url(#spec-arrow)"/>
  <text x="726" y="200" class="sans" font-size="11.5" fill="#8a4413">多钉住了这一段</text>
</svg>
