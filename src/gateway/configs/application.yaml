# Gateway community default config (open-source, no internal middlewares).
# The enterprise edition overlays this with ZCache/ZDAS/DDSOSS/etc. via
# application.yaml in the gateway-enterprise package.
#
# This is the only runtime configuration file the gateway reads. Keep
# gateway-specific sections under user_config so startup has a single source of
# truth for user-selectable Gateway behavior.

app_name: "gateway"
enable_sidecar: false
workers: 1

log_config:
  trace_log_dir: ""
  log_level: "INFO"
  log_dir: ""

# Module config — only the web server is configured here. RPC/DRM/cache
# middlewares are enterprise-only and added via overlay in gateway-enterprise.
module_config:
  web:
    port: 8888
    start: "gateway.community.adapters.web.app:app"
    enable_api_docs: true

# User-level Gateway config — plugin selectors, authn chains, route security,
# upstream variable values, and routing all live here.
user_config:
  # Plugin selection — community-safe defaults (all stub/descriptive).
  # Enterprise overrides specific selectors via config overlay.
  plugins:
    forwarder: "httpx"
    schema_catalog: "file"
    cache: "stub"
    auth: "stub"
    # SecretResolver flavor. Community reads creds from env; enterprise overlays
    # this with a corp/KMS-backed selector registered via the plugin_registry.
    secret: "community"
    authn:
      app_token: "stub"
      tenant: "stub"
    database:
      plugin_database: "SQLITE_ORM"
      database_url: ""

  # SecretResolver configuration. The community (env-backed) resolver reads
  # ``{env_prefix}{NAME}_VALUE`` / ``_USER`` from the process environment.
  # Enterprise overlays may swap the resolver implementation via the plugin
  # registry (e.g. a corp secret store / KMS).
  secret:
    env_prefix: "AVERNET_SECRET_"

  # PrincipalSigner (JWT client) config. The signing key is a secret and is
  # resolved at runtime via the SecretResolver using ``secret_name``; the
  # remaining fields are non-secret and live here. With the community resolver
  # above that means AVERNET_SECRET_PRINCIPAL_SIGNING_KEY_VALUE, and its value
  # must equal the one the upstream verifies with — both sides log a
  # fingerprint of it at boot so the two can be compared without printing it.
  #
  # There is NO fallback key. A missing or empty value refuses the boot in
  # pre/prod, and elsewhere leaves the gateway unable to sign, so every
  # forwarded request answers 500 rather than carrying an identity no upstream
  # can verify. The dev key that used to fill this gap was a committed
  # credential, and no upstream accepted tokens signed with it anyway.
  #
  # `issuer` is a two-sided contract: the backend pins the value it accepts in
  # code, so changing this requires changing that constant in the same release
  # or every request 401s.
  principal_signer:
    secret_name: "principal_signing_key"
    kid: "bare"
    issuer: "gateway"
    ttl_seconds: 60

  # Values used to expand ${...} placeholders in upstreams.servers.*.base_url.
  #
  # Every value carries a SCHEME — http, https, ws or wss — and startup refuses
  # one that does not, naming the server. This is not style: the forwarder
  # concatenates the base url with the request path, and `backend.example/x`
  # parses as a *relative* URL with an empty host, so a scheme-less value fails
  # at the first call rather than at boot.
  #
  # The scheme says the origin and whether the connection is TLS; it does not
  # decide which planes the upstream serves. The router re-spells it per plane
  # (https ⇄ wss, http ⇄ ws), so one configured value works for both and no
  # operator has to know which planes a given upstream is used for.
  #
  # These defaults are the SINGLE-BOX values: each URL names the port the
  # matching `scripts/singlebox.sh` service listens on by default (backend 8888,
  # baas 8890, bcs 21000, bcsfuse 8765 — two independent constants per service;
  # changing a singlebox default port means changing it here too). A deployed
  # edition overrides this whole section, exactly as it does for the schema
  # sources above.
  #
  # `engine_proxy_server_url` stays a placeholder: no singlebox service serves
  # the `/proxypass` prefix, so there is nothing local to name. Only the
  # `bots-messages-ws` socket domain reads it; every other route is unaffected.
  upstream_vars:
    backend_server_url: http://127.0.0.1:8888
    baas_server_url: http://127.0.0.1:8890
    bcs_server_url: http://127.0.0.1:21000
    engine_proxy_server_url: https://engineproxy.sample.com
    bcsfuse_server_url: http://127.0.0.1:8765
    clawweb_server_url: https://clawweb.sample.com

  # Browser CORS allow-list for the gateway's own edge.
  #
  # A page on another origin cannot call the gateway without it: the browser
  # sends a credential-less `OPTIONS` preflight first and refuses to send the
  # real request unless the answer carries `Access-Control-Allow-Origin`. That
  # preflight is answered by the gateway itself, before routing and before
  # `route_security` — an upstream's own allow-list governs callers that reach
  # that component directly and cannot speak for this address.
  #
  # The gateway answers with `Access-Control-Allow-Credentials: true`, because a
  # browser call through it carries the cookie or `Authorization` header it
  # authenticates with. Every origin must therefore be listed exactly or matched
  # by `allow_origin_regex` (a Python regex, matched against the WHOLE origin —
  # scheme, host and port — and compiled on its own, so its own inline flags
  # apply to it alone). `allow_origins: ["*"]` is REFUSED at load time: with
  # credentials enabled a wildcard does not fail loudly, it silently admits
  # every origin on the internet to credentialed calls. A catch-all regex is
  # refused for the same reason, whichever scheme or port it names (`.*`,
  # `https://.*`, `http://.*`, `https://.*:8443`) — pin the host suffix the
  # environment actually serves. `http://localhost:[0-9]+` pins a host and is
  # accepted; `http://.*` does not and is not.
  #
  # Neutral default = localhost only, so a single-box UI works out of the box.
  # A deployment adds its own frontend origins in its `application-<env>.yaml`
  # overlay (selected by `SERVER_ENV`), e.g.:
  #
  #   user_config:
  #     cors:
  #       allow_origins:
  #         - "https://your-frontend.example.com"
  #       allow_origin_regex:
  #         - "https://[a-z0-9-]+\\.preview\\.example\\.com"
  #
  # An overlay REPLACES a list rather than extending it, so repeat any localhost
  # origin the environment still needs.
  cors:
    allow_origins:
      - "http://localhost"
      - "http://localhost:3000"
      - "http://localhost:8000"
      - "http://localhost:8080"
      - "http://localhost:8888"
    allow_origin_regex: []

  # Per-identity strategy chain (system-level config).
  # Each identity type runs its strategies in order; the first to recognise the
  # credential wins (design §5). Flavor-specific verification backends are wired
  # by PluginAccessor in the composition root.
  identity_strategies:
    user: [google]
    bot: [bot_token]
    app: [app_token]
    access_key: [access_key_token]

  # Route → identity-requirement table for the gateway (auth design §8, reshaped).
  #
  # Each value is ``{<identity-type>: required|optional}`` — the identities a
  # route accepts and whether each is mandatory. More specific rules override
  # more general ones; "/**" is the top-level default. The authoritative
  # per-operation source is each route's ``x-avernet-security`` marker; this
  # section stores the aggregated table the gateway resolves at request time.
  route_security:
    # Top-level default: every route requires an authenticated user.
    "/**":
      user: required

    # The public API. BOTH identities optional, and the table cannot say what is
    # actually meant here — "at least one of user or app" — so this is the
    # closest expressible rule plus a backend guard, rather than a loosening.
    #
    # Why optional at all: an application may now act for a user it holds a
    # grant from, with no human on the wire (backend
    # `adapters/http/openapi_v1/admission.py`). Under `user: required` such a
    # request never reaches the backend, so the App identity has to be
    # resolvable and the User has to be allowed to be absent.
    #
    # Why `app: optional` rather than omitted: the runner resolves ONLY the
    # identities a route declares (core/authn/_runner.py). An undeclared App
    # never reaches the signed principal, so the backend could not tell an
    # application from an anonymous caller — and every grant check would have
    # nothing to check against.
    #
    # WHAT ENFORCES THE REFUSAL NOW. "Neither identity present" is still
    # refused, one hop later: the backend's `require_principal` runs on every
    # public route and answers 401. The refusal MOVED from the edge to the
    # component; it was not removed. Two consequences worth knowing before
    # changing anything here: unauthenticated traffic now reaches the backend
    # before being refused (relevant to edge rate-limiting and to which log it
    # appears in), and the per-operation decision about which callers are
    # admitted lives in the backend's admission table, not here.
    #
    # This table therefore enumerates the REFUSALS below — the operations that
    # still require a human — rather than the ~57 that admit a machine caller.
    # Six rules a reviewer can check against the table beats fifty-seven nobody
    # will read.
    "/openapi/v1/bots/**":
      user: optional
      app: optional
    "/openapi/v1/bots/skills/**":
      user: required

    # ── The refusals: operations that still require a human on the wire ──────

    # The user-identity read: its answer IS the end user, so a caller with no
    # human on the wire has nothing to ask. Explicit even though /** already
    # requires a user, for the same reason the spaces rules below are: when the
    # broader policy evolves, this route must remain fail-closed.
    "/openapi/v1/org/user":
      user: required
    # Department directory search — a tenant-wide catalogue read, identical for
    # every caller, so it admits an application acting alone (OPEN). Mirrors the
    # mcp catalogue rules: explicit even though it could default.
    "/openapi/v1/org/dept":
      user: optional
      app: optional

    # Space/member/favorite OpenAPI operations are user-only in the first
    # refactor phase. Keep this explicit even though /** also requires a user:
    # when the broader public API policy evolves, these routes must remain
    # fail-closed until app identity semantics for spaces are approved.
    "/openapi/v1/bots/spaces/**":
      user: required
    "/openapi/v1/bots/work-orders/**":
      user: required
    "/openapi/v1/bots/work-order-notifications/**":
      user: required

    # Local Bot creation has no existing Bot grant to check and may initiate
    # Passport consent. Polling auth-status completes that same human creation
    # transaction. Other workshop/local operations inherit the wide user-or-app
    # rule and are narrowed or grant-checked by Backend admission.
    "POST /openapi/v1/bots/local":
      user: required
    "GET /openapi/v1/bots/{bot_id}/local/auth-status":
      user: required

    # The IAM token is a first-party browser credential and Caller preparation
    # consumes that same user's HttpOnly cookie.  Do not declare `app` here:
    # the auth runner resolves only identities named by the matched rule, so an
    # application credential cannot reach either operation as a principal.
    "GET /openapi/v1/org/user/iam-token":
      user: required
    "POST /openapi/v1/bots/{bot_id}/caller-identity":
      user: required

    # Creating a bot. No bot exists yet for a grant to cover, and creation
    # spends the user's quota.
    "POST /openapi/v1/bots":
      user: required

    # Reading and withdrawing authorizations. Withdrawal deliberately does NOT
    # require an App — an owner must be able to withdraw after the
    # application's credential is lost or rotated — but it does require a human:
    # letting an application enumerate or withdraw authorizations on a bot would
    # let it survey its competitors and unhook them.
    "GET /openapi/v1/bots/{bot_id}/authorized-apps":
      user: required
    "DELETE /openapi/v1/bots/{bot_id}/authorized-apps/{app_id}":
      user: required

    # MCP *configuration* — account-level state with no bot dimension. A grant
    # is consent to reach a bot, not to reconfigure an account. (The catalogue
    # reads under /mcp/servers and /mcp/tenants are a different thing and stay
    # on the wide rule.)
    "/openapi/v1/bots/mcp/servers/{server_code}/config":
      user: required
    "/openapi/v1/bots/mcp/servers/{server_code}/permissions":
      user: required

    # The load-test endpoints touch no user's data and are not part of this
    # feature. Left exactly as they were rather than swept along with the
    # prefix they happen to sit under.
    "/openapi/v1/bots/loadtest/**":
      user: required

    # Bot Logs can query explicit user/Bot and trace identifiers. Require both
    # the end-user identity and the registered calling application so a user
    # credential alone cannot access this tenant-level observability surface.
    "/openapi/v1/bots/logs/**":
      user: required
      app: required

    # Granting an application access to a bot is a CONSENT moment, and consent
    # requires both parties on the wire: the bot owner's identity and the
    # application's own credential. The application is never named as a
    # parameter — the handler reads it off the App principal — so this rule is
    # what makes "you cannot grant to an application other than yourself" true
    # by construction rather than by a check.
    #
    # METHOD-QUALIFIED, and that is load-bearing. GET (list) and DELETE
    # (withdraw) on the same prefix deliberately do NOT require an App: an owner
    # must be able to withdraw after the application's credential is lost or
    # rotated, and asking "which apps can reach my bot?" must not depend on
    # holding any one application's key.
    #
    # They DO require a user, and that is now stated explicitly among the
    # refusals above rather than inherited. It used to fall out of
    # "/openapi/v1/bots/**"; that rule no longer requires a human, so leaving
    # these to inherit would have quietly admitted an application to enumerating
    # and withdrawing the authorizations on a bot.
    "POST /openapi/v1/bots/{bot_id}/authorized-apps":
      user: required
      app: required

    # The application's view — "which of this owner's bots may I reach?". Both
    # parties again, and here the App is not merely required, it is what the
    # answer is SCOPED BY: the handler reads app_id off this principal.
    #
    # Declaring the identity is what makes that scoping possible at all. The
    # runner resolves only the identities a route declares (core/authn/_runner.py),
    # so on a user-only rule the App would never reach the signed principal and
    # the query would have nothing to filter on. There is no middle option here
    # — either the route declares `app` and the App is mandatory, or the App is
    # invisible to the upstream.
    #
    # Not method-qualified: GET is the only method this path has, and any method
    # it could grow answers the same "what may I reach" question.
    #
    # Sits under /openapi/v1/bots because the gateway resolves an upstream from
    # the segment after the version base; a top-level path here would match no
    # domain and be refused at the edge rather than reaching the backend.
    # The application's view — "which bots may I reach as this user?".
    #
    # `user: optional` since the app-only caller landed: this is the one
    # operation an integration calls to discover its own scope, and requiring a
    # human on the wire would make that discoverable only by the very person the
    # integration exists to act for. The App stays REQUIRED — it is what the
    # answer is scoped by, not merely permitted.
    "/openapi/v1/bots/authorized":
      user: optional
      app: required

    "/openapi/v1/collaboration/**":
      user: required
      app: required

    # New-version publish-to-users: served by the backend (the antprocess
    # approval + bcs_pub callback live there), pulled out of the
    # collaboration→bcs domain by the `collaboration-publish` match upstream. A
    # logged-in end user via cookie SSO — no app credential — mirroring the legacy
    # POST /api/bots/{bot_id}/public this replaces. The method-qualified exact
    # path outranks the broad collaboration/** (app: required) rule above.
    "POST /openapi/v1/collaboration/bots/{bot_uuid}/public":
      user: required

    "/api/v1/collaboration/**":
      user: optional
      app: optional
      bot: optional

    # Session-file use cases let BCN choose Human or Bot as the effective Actor.
    # Gateway therefore best-effort resolves and signs every relevant identity;
    # BCN's HumanOrOwnedBot policy rejects "none" and mismatched User/Bot owner
    # claims before the application facade authorizes the Session and file.
    "/openapi/v1/collaboration/sessions/{session_id}/files/**":
      user: optional
      app: optional
      bot: optional

    "/api/v1/collaboration/sessions/{session_id}/files/**":
      user: optional
      app: optional
      bot: optional

    # A share token is the complete credential for this one download route.
    # BCN verifies it and deliberately returns the same 404 for every failure.
    "GET /openapi/v1/collaboration/sessions/shared-file/content": {}
    "GET /api/v1/collaboration/sessions/shared-file/content": {}

    "/openapi/v1/bcsfuse/**":
      user: required

# The harness operations sit beneath the addressed bot, so the wide
    # "/openapi/v1/bots/**" rule above would otherwise admit them with no user
    # on the wire. They diagnose and patch a bot's live config files — a human
    # stays on the boundary, and the extra literal segment outranks the prefix.
    "/openapi/v1/bots/{bot_id}/harness/**":
      user: required

    # HarnessFlow (task escort) — served by clawweb. Authz is delegated to
    # clawweb; the gateway passes through both identities when present.
    "/openapi/v1/harnessflow/**":
      user: optional
      app: optional

    # BCN verifies the short-lived session credential carried by this exact
    # WebSocket handshake. Keep every other collaboration operation, including
    # session-token issuance, on the required User Principal boundary above.
    "WEBSOCKET /openapi/v1/collaboration/messages/ws": {}

    # The tenant bot socket, and the FIRST rule under /openapi/v1 that
    # requires no identity at all. Deliberate: the credential is already in the
    # handshake's query string and is checked by the proxypass hop behind the
    # gateway, and a browser's WebSocket API can attach nothing else — it takes
    # a URL and a subprotocol, no headers.
    #
    # Written down as an explicit empty requirement rather than left out — an
    # omitted rule falls through to "/**" above and fails closed, so silence
    # here would refuse every socket. Stating it keeps this table an honest
    # description of what the gateway requires, and makes tightening the prefix
    # a config edit rather than a code change.
    #
    # QUALIFIED BY PLANE, and that is load-bearing rather than decorative.
    #
    # This table is plane-blind: an unqualified rule governs every request to the
    # path, whichever entrypoint serves it. The exemption sits INSIDE the
    # authenticated "/openapi/v1/bots/**" prefix above and outranks it on literal
    # segment count — five to three — so unqualified it would exempt ordinary
    # HTTP requests here too. Those do not 404: a socket domain is not a
    # candidate on the HTTP plane, so they fall through to `bots` and are
    # forwarded to the backend. An unauthenticated caller could therefore reach
    # the backend through this prefix, and a `..` in the path normalises out on
    # the way, landing anywhere under /openapi/v1.
    #
    # `WEBSOCKET` is the method the relay entrypoint authenticates under, so this
    # rule matches a handshake and nothing else. An HTTP GET to the same path
    # does not match it and falls to "/openapi/v1/bots/**" above, where both
    # identities are optional at the edge and the backend's `require_principal`
    # is what refuses a caller it cannot act for.
    #
    # Pinned to the socket's own `ws` subtree rather than to the whole of
    # `/openapi/v1/bots/messages`, so it exempts exactly the paths the socket
    # domain below claims. The HTTP endpoints `messages` is reserved for stay on
    # the wide rule, on every plane.
    "WEBSOCKET /openapi/v1/bots/messages/ws/**": {}

  # Domain → upstream-server map for the gateway.
  #
  # The leading path segment after `base_path` is the DOMAIN; it selects the
  # target server. A request whose leading segment is not a configured domain is
  # denied (the gateway forwards only into known domains — never an open proxy).
  #
  # `schema` tells the gateway where to read that domain's published OpenAPI
  # description for doc generation:
  #   source: file          → `path` (single-box; committed / local artifact)
  #   source: object_store  → `url`  (any deployed edition — corp or community;
  #                                    each upstream publishes its dumped doc to an
  #                                    object store on deploy, gateway auto-adopts
  #                                    the latest via background refresh)
  #   source: http          → `url`  (any deployed edition;
  #                                    fetches the latest published description
  #                                    from an HTTP endpoint with background refresh)
  # "object_store" is vendor-neutral (S3 / MinIO / GCS / OSS / …); the reader is
  # a pluggable flavor of the SchemaCatalog SPI. The schema is a DOC-ONLY input —
  # routing/auth/forwarding never read it.
  internal_api_docs:
    schemas:
      bcn-internal:
        source: file
        path: schemas/bcn.internal.openapi.json
        refresh_seconds: 300

  upstreams:
    base_path: /openapi/v1

    # Each domain may also declare:
    #
    #   match: <path pattern>
    #     Which paths this domain claims: literal segments, optionally
    #     continued by `{param}` segments (each claims ONE segment, whatever it
    #     holds — literals may follow it), then `**`. Unset means
    #     `<base_path>/<domain name>/**` — the leading-segment routing every
    #     domain had before patterns, so a domain that says nothing keeps its
    #     address exactly. Declare one to put a domain BENEATH another, on a
    #     different upstream — `/openapi/v1/bots/{bot_id}/shell/**` claims the
    #     shell subtree of every bot while `/openapi/v1/bots/**` keeps the rest.
    #
    #     Resolution matches first and ranks second: every domain claiming the
    #     path AND answering the request's plane is a candidate, and the most
    #     specific (most literal segments, parameters breaking ties) wins. The
    #     plane filters the candidates, so claiming a prefix for one plane
    #     leaves the other plane's resolution of the same path untouched.
    #
    #     Startup REFUSES a pattern whose leading LITERAL segments do not pin
    #     `base_path` plus at least one more literal segment — a parameter pins
    #     nothing, so it may only appear after that. `match: /**` is an open
    #     proxy into that domain's upstream, and this is the check that makes
    #     it untypable. It also refuses two patterns that claim a common path
    #     with equal specificity, where the winner would be undefined.
    #
    #   protocols: [http] | [websocket] | [http, websocket]
    #     Which plane serves it. Unset means `[http]`, so every domain below
    #     behaves exactly as it always has. The two planes have different
    #     handling and different forwarders, and the entrypoint for a plane a
    #     domain does not declare refuses it — a socket domain must not become
    #     an HTTP proxy into its upstream just because both read this map.
    #
    #   rewrite: {from: <gateway prefix>, to: <upstream prefix>}
    #     Unset means the path forwards VERBATIM and only the origin changes,
    #     which is the property this whole design rests on. Declare one prefix
    #     substitution when the upstream serves the same resources under a
    #     different prefix. `from` must start at the domain's own prefix, or the
    #     rule could never match and startup refuses it.

    domains:
      org:
        server: backend
        # Backend publishes one public artifact; domain generation filters it
        # to /openapi/v1/org before serving it through this route.
        schema:
          source: file
          path: schemas/bots.openapi.json
          refresh_seconds: 300
      bots:
        server: backend
        # Single-box default. A deployed edition overrides this with an object store:
        #   schema:
        #     source: object_store
        #     url: "${BOTS_OPENAPI_URL}"   # e.g. https://<bucket>/bots/openapi-latest.json
        #     refresh_seconds: 300
        schema:
          source: file
          path: schemas/bots.openapi.json
          refresh_seconds: 300
      caller:
        server: backend
        schema:
          source: file
          path: schemas/bots.openapi.json
          refresh_seconds: 300
      dept:
        server: backend
        schema:
          source: file
          path: schemas/bots.openapi.json
          refresh_seconds: 300
      repository-skills:
        match: /openapi/v1/bots/skills/**
        server: backend
        schema:
          source: file
          path: schemas/bots.openapi.json
          refresh_seconds: 300
      spaces:
        server: backend
        schema:
          source: file
          path: schemas/bots.openapi.json
          refresh_seconds: 300
      work-orders:
        server: backend
        schema:
          source: file
          path: schemas/bots.openapi.json
          refresh_seconds: 300
      work-order-notifications:
        server: backend
        schema:
          source: file
          path: schemas/bots.openapi.json
          refresh_seconds: 300
      # The harness operations moved under /openapi/v1/bots/{bot_id}/harness/**:
      # the bots domain routes them to the same backend verbatim, and a domain
      # match cannot pin a path behind a path parameter, so no separate domain
      # can claim them. Their published description rides in bots.openapi.json.
      collaboration:
        server: bcs
        protocols: [http, websocket]
        schema:
          source: file
          path: schemas/bcn.openapi.json
          refresh_seconds: 300
      collaboration-internal:
        match: /api/v1/collaboration/**
        server: bcs
        protocols: [http]
      # New-version publish-to-users is served by the backend (it owns the
      # antprocess approval flow + the bcs_pub callback), even though the rest of
      # the collaboration namespace goes to BCS. The `public` leaf keeps this
      # subtree disjoint from BCS's bots/{bot_uuid}/friendships,
      # friend-requests, mine, query, and the match outranks the broad
      # collaboration→bcs rule behind it; the rewrite onto the backend route
      # /openapi/v1/bots/{bot_id}/public-bcs is gateway-side.
      collaboration-publish:
        match: /openapi/v1/collaboration/bots/{bot_uuid}/public/**
        server: backend
        protocols: [http]
      # bcsfuse public surface: fusion + fusable worker-config queries, served
      # under clean, version-free sub-prefixes. bcsfuse still serves its own /api/v1
      # and /v1 prefixes directly (unchanged) for callers that reach the service
      # without the gateway; the gateway exposes only these clean paths.
      bcsfuse-fusion:
        match: /openapi/v1/bcsfuse/groups/**
        server: bcsfuse
        protocols: [http]
        rewrite:
          from: /openapi/v1/bcsfuse/groups
          to: /api/v1/groups
        schema:
          source: file
          path: schemas/bcsfuse-fusion.openapi.json
          refresh_seconds: 300
      bcsfuse-workers:
        match: /openapi/v1/bcsfuse/workers/**
        server: bcsfuse
        protocols: [http]
        rewrite:
          from: /openapi/v1/bcsfuse/workers
          to: /v1/workers
        schema:
          source: file
          path: schemas/bcsfuse-workers.openapi.json
          refresh_seconds: 300
      chat:
        server: baas
        schema:
          source: file
          path: schemas/baas.openapi.json
          refresh_seconds: 300

      # HarnessFlow (task escort) — served by clawweb.
      harnessflow:
        match: /openapi/v1/harnessflow/**
        server: clawweb
        protocols: [http]
        rewrite:
          from: /openapi/v1/harnessflow
          to: /

      # The tenant bot socket. The backend's connection endpoint publishes
      # `wss://<gateway>/openapi/v1/bots/messages/ws/<target><engine-path>?x-proxypass-token=…`
      # and this is what serves it.
      #
      # It sits BENEATH the `bots` domain above, on a different upstream, which
      # is what `match` exists for: the whole bots scope — management on the
      # backend, runtime on the engine proxy — is one team's surface and belongs
      # under one public prefix. The leading segment names the OWNER, not the
      # process, and the gateway is what decouples the two.
      #
      # Socket-only, and that is not a detail. Because a domain is only a
      # candidate on the plane it declares, an HTTP request to this prefix is not
      # served by this domain at all — it falls to `bots` above, and reaches the
      # backend.
      #
      # `ws` is the socket's own segment, and it is claimed rather than inferred.
      # `messages` names the channel, not the transport: HTTP endpoints are
      # expected to grow under it, and the plane alone would keep them apart. The
      # segment buys what the plane cannot — the claim, and the unauthenticated
      # WEBSOCKET exemption in `route_security` above that follows it, are pinned
      # to one subtree that is visible as such in a URL, so a future endpoint at
      # `/openapi/v1/bots/messages/<anything-else>` is outside both by
      # construction rather than by a reader's care.
      #
      # The engine proxy serves the same targets under `/proxypass/`, so the
      # prefix is substituted; everything past it — the routing target, the
      # engine path, the credential in the query — travels byte for byte.
      #
      # No `schema:` — a WebSocket has no OpenAPI representation, so this domain
      # contributes nothing to the served document.
      #
      # Operational note for any L7 hop a deployment puts in front of the
      # gateway: it must pass the Upgrade through and impose NO read timeout on
      # this path. The credential is checked once, at the handshake, and the
      # connection is designed to outlive its expiry — an idle deadline tears
      # down healthy sockets.
      bots-messages-ws:
        match: /openapi/v1/bots/messages/ws/**
        server: engine_proxy
        protocols: [websocket]
        rewrite:
          from: /openapi/v1/bots/messages/ws
          to: /proxypass

      # The load-test socket — the backend's echo endpoint, forwarded verbatim.
      #
      # It exists so a load run can measure this relay: what a handshake and a
      # round trip cost through the gateway, with an upstream that does nothing
      # but send the frame back. The HTTP half of the same group needs no entry
      # here — `bots` above already carries `/openapi/v1/bots/**` to the backend
      # on the HTTP plane — but the socket plane has no such catch-all, because
      # `bots` declares no `protocols` and so serves HTTP only. Without this
      # domain the handshake is refused with "no route for path" and only the
      # HTTP endpoint is measurable.
      #
      # Socket-only, like the domain above, so an HTTP request under this prefix
      # is not this domain's at all and still resolves through `bots`.
      #
      # No `rewrite:` — the backend serves this address itself, so only the
      # origin changes. And no `schema:`: a WebSocket has no OpenAPI
      # representation.
      #
      # Authentication is inherited, deliberately. This prefix appears nowhere
      # in `route_security`, so it falls to `/openapi/v1/bots/**` — user
      # required — and the relay signs that identity into the handshake the
      # backend verifies. A load test that measured an exempted path would be
      # measuring a path no caller can take.
      bots-loadtest-ws:
        match: /openapi/v1/bots/loadtest/ws/**
        server: backend
        protocols: [websocket]

    servers:
      backend:
        base_url: "${backend_server_url}"
      baas:
        base_url: "${baas_server_url}"
      bcs:
        base_url: "${bcs_server_url}"
      bcsfuse:
        base_url: "${bcsfuse_server_url}"
      engine_proxy:
        base_url: "${engine_proxy_server_url}"
      clawweb:
        base_url: "${clawweb_server_url}"
