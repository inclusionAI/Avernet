<script>
'use strict';
// Standalone design prototype. No network calls, credentials or persisted user data.
// Host brand structure follows OCB internal/bootstrap/clawweb/src/App.tsx; no host code is changed.
const $=id=>document.getElementById(id);
const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const anchor=Date.parse('2026-09-10T18:42:08+08:00');
const bots=[
 {id:'20260810_4vqhaw2p',engine:'TE',status:'normal',lastCheck:anchor-8000,total:36},
 {id:'20260731_0gu2ft1f',engine:'OC',status:'error',lastCheck:anchor-42*60000,total:24},
 {id:'20260622_z00hf5y1',engine:'TE',status:'unknown',lastCheck:anchor-2*3600000,total:0},
 {id:'20260901_8md0cr6a',engine:'OC',status:'paused',lastCheck:null,total:0}
];
const resultLabels={all:'全部',alert:'告警',pass:'通过',unresolved:'无法判断'};
const healthLabels={normal:'监控正常',error:'检查异常',unknown:'状态未知',paused:'已暂停'};
const state={bot:bots[0].id,decision:'all',start:'',end:'',keyword:'',page:1,size:10,open:new Set()};
let refreshTimer,searchTimer,toastTimer,refreshPending=false;
const cache=new Map();
function dateParts(time){const d=new Date(time+8*3600000);return {date:d.toISOString().slice(0,10),time:d.toISOString().slice(11,19)}}
function fullTime(time){if(time==null)return '—';const p=dateParts(time);return `${p.date} ${p.time}`}
function currentBot(){return bots.find(b=>b.id===state.bot)}
function allRecords(bot){if(cache.has(bot.id))return cache.get(bot.id);const rows=[];
 const kinds=['alert','pass','pass','unresolved','pass','alert','pass','pass','alert','pass','unresolved','pass'];
 for(let i=0;i<bot.total;i++){
  const kind=kinds[i%kinds.length],variant=i%3,occurredAt=i===bot.total-1?null:anchor-Math.floor(i/9)*86400000-(i%9)*37*60000;
  const failure=variant===0?'数据获取失败':variant===1?'请求响应超时':'工具调用失败';
  const system=kind==='alert'?(variant===0?'MCP 服务 risk_evaluation_toolkit 返回空响应，脚本 JSON 解析失败，活动数据未能获取。':variant===1?'外部服务在规定时间内未返回结果，本轮工具调用超时，后续任务未继续执行。':'工具调用返回异常，必要参数未通过上游校验，本轮任务未完成。'):kind==='pass'?'本轮工具调用与结果返回正常，未发现需要告警的异常。':'当前可用证据不足，无法确认任务最终结果，未生成确定的故障结论。';
  const business=kind==='alert'?(variant===0?'用户发起海豚评审流水线，执行过程中未获取到活动数据，任务未成功提交，最终以关单收尾。':variant===1?'用户请求查询业务数据，由于外部服务响应超时，本次查询未获得结果。':'用户发起业务处理请求，执行阶段工具调用失败，目标尚未完成。'):kind==='pass'?'用户请求已完成处理，返回结果与本轮任务目标一致。':'现有会话信息不足以判断业务目标是否完成。';
  rows.push({id:`diag-${bot.id}-${String(i+1).padStart(4,'0')}`,kind,title:kind==='alert'?`外部服务异常 · ${failure}`:kind==='pass'?['任务执行完成','查询结果已返回','业务流程正常结束'][variant]:'证据不足，暂无法判断',occurredAt,diagnosedAt:occurredAt==null?anchor:occurredAt+43000,
   traceId:bot.engine==='TE'?`trace_${bot.id.slice(-4)}_${String(i+1).padStart(4,'0')}_e8b0d9f7`:null,sessionKey:bot.engine==='OC'?`agent:main:bcs-cli:${bot.id}:${461514+i}:b0dad${String(i).padStart(3,'0')}`:null,sessionId:bot.engine==='TE'?`session_${bot.id.slice(-4)}_${String(Math.floor(i/3)+1).padStart(3,'0')}`:null,
   intervention:i%5===0,confidence:kind==='alert'?(i===0?.8:(.76+i%17/100)):null,tc:kind==='alert'?(variant===0?'TC.MCP.DATA':variant===1?'TC.MCP.TIMEOUT':'TC.MCP.CALL'):null,category:kind==='alert'?'外部服务异常':null,subtype:kind==='alert'?failure:null,handler:kind==='alert'?'仲彦':null,system,business});
 }
 cache.set(bot.id,rows);return rows;
}
function matchingBase(){return allRecords(currentBot()).filter(r=>{if((state.start||state.end)&&r.occurredAt==null)return false;const d=r.occurredAt==null?'':dateParts(r.occurredAt).date;if(state.start&&d<state.start||state.end&&d>state.end)return false;const text=[r.traceId,r.sessionKey,r.sessionId].filter(Boolean).join(' ').toLowerCase();return !state.keyword||text.includes(state.keyword.toLowerCase())})}
function closeMenus(focusId){$('botMenu').hidden=true;$('dateMenu').hidden=true;$('botToggle').setAttribute('aria-expanded','false');$('dateToggle').setAttribute('aria-expanded','false');if(focusId)$(focusId).focus()}
function renderContext(){const b=currentBot();$('botSelected').textContent=b.id;$('botHealth').className='health '+(b.status==='normal'?'':b.status);$('botHealth').innerHTML=`<span class="dot"></span>${healthLabels[b.status]}`;$('lastCheck').textContent=b.lastCheck==null?'暂无成功检查记录':`最近成功检查 ${fullTime(b.lastCheck).slice(5)}`;
 $('botOptions').innerHTML=bots.map(bot=>`<button type="button" class="bot-option ${bot.id===state.bot?'selected':''}" data-bot="${bot.id}" aria-pressed="${bot.id===state.bot}"><span class="dot" style="color:${({normal:'#168363',error:'#cd4650',unknown:'#ac791e',paused:'#929bab'})[bot.status]}"></span><span class="mono">${bot.id}</span>${bot.id===state.bot?'<svg class="icon choice-check" aria-hidden="true"><use href="#i-check"/></svg>':''}<span class="visually-hidden">${healthLabels[bot.status]}</span></button>`).join('');
 $('dateLabel').textContent=!state.start&&!state.end?'全部时间':state.start===state.end?state.start:`${state.start||'不限'} — ${state.end||'不限'}`;
}
function field(label,value,cls=''){return `<div><dt>${label}</dt><dd class="${cls}">${escapeHtml(value??'—')}</dd></div>`}
function detail(r){const ids=[['诊断编号',r.id],...(r.sessionKey?[['Session Key',r.sessionKey]]:[]),...(r.sessionId?[['Session ID',r.sessionId]]:[]),...(r.traceId?[['Trace ID',r.traceId]]:[])];return `<div class="record-detail" id="detail-${r.id}"><div class="diagnosis-narratives"><section class="narrative"><div class="narrative-label">${icon('text')}业务诊断</div><p>${escapeHtml(r.business)}</p></section><section class="narrative"><div class="narrative-label">${icon('code')}系统诊断</div><p>${escapeHtml(r.system)}</p></section></div><dl class="detail-grid">${field('TC 故障标签',r.tc,'mono')}${field('诊断置信度',r.confidence==null?null:(r.confidence*100).toFixed(1)+'%','confidence')}${field('业务问题类型',r.category)}${field('业务问题子类型',r.subtype)}${field('处理人',r.handler)}${field('是否人工干预',r.intervention?'是':'否')}${field('会话时间',r.occurredAt==null?'时间未知':fullTime(r.occurredAt))}${field('诊断完成时间',fullTime(r.diagnosedAt))}</dl><div class="detail-identifiers">${ids.map(([label,value])=>`<div class="id-line"><span>${label}</span><code>${escapeHtml(value)}</code><button type="button" class="copy-btn" data-copy="${escapeHtml(value)}" aria-label="复制${label}">${icon('copy')}</button></div>`).join('')}</div></div>`}
function record(r){const p=r.occurredAt==null?null:dateParts(r.occurredAt),isOpen=state.open.has(r.id);return `<article class="record ${isOpen?'expanded':''}" id="row-${r.id}"><button type="button" class="record-summary" data-record="${r.id}" aria-expanded="${isOpen}" aria-controls="detail-${r.id}"><span class="record-main"><span class="decision-symbol ${r.kind}">${icon(({alert:'alert',pass:'check',unresolved:'question'})[r.kind])}</span><span class="record-text"><span class="record-title-line"><span class="record-title">${escapeHtml(r.title)}</span><span class="decision-word">${resultLabels[r.kind]}</span></span><span class="record-session mono" style="display:block">${escapeHtml(r.traceId||r.sessionKey)}</span></span></span><span class="record-time">${p?`<span class="day">${p.date.slice(5)}</span>${p.time}`:'时间未知'}</span><span class="intervention ${r.intervention?'yes':''}">${r.intervention?icon('user')+'是':'否'}</span><svg class="icon expand-icon" aria-hidden="true"><use href="#i-chevron"/></svg></button>${isOpen?detail(r):`<div id="detail-${r.id}" hidden></div>`}</article>`}
function renderList(){const base=matchingBase(),counts={all:base.length,alert:0,pass:0,unresolved:0};base.forEach(r=>counts[r.kind]++);const filtered=base.filter(r=>state.decision==='all'||r.kind===state.decision),pages=Math.max(1,Math.ceil(filtered.length/state.size));state.page=Math.max(1,Math.min(state.page,pages));const start=(state.page-1)*state.size,visible=filtered.slice(start,start+state.size);
 $('resultTabs').innerHTML=Object.keys(resultLabels).map(key=>`<button type="button" data-decision="${key}" aria-pressed="${state.decision===key}" class="${state.decision===key?'active':''}">${resultLabels[key]}<span class="number">${counts[key]}</span></button>`).join('');
 $('recordList').innerHTML=visible.length?visible.map(record).join(''):`<div class="empty-state"><div class="empty-icon">${icon('empty')}</div><h3>${allRecords(currentBot()).length?'没有符合条件的诊断记录':'暂无诊断记录'}</h3><p>${allRecords(currentBot()).length?'试试其他关键词，或调整会话时间范围。':currentBot().status==='paused'?'此 Bot 已暂停监控。':'此 Bot 还没有可展示的诊断结果。'}</p>${allRecords(currentBot()).length?'<button type="button" data-action="clearFilters">清除筛选条件</button>':''}</div>`;
 $('rangeText').innerHTML=filtered.length?`第 <b>${start+1}–${start+visible.length}</b> 条，共 <b>${filtered.length}</b> 条`:'共 0 条';
 const numbers=pages<=5?Array.from({length:pages},(_,i)=>i+1):[1,...Array.from({length:3},(_,i)=>Math.max(2,Math.min(state.page-1,pages-3))+i),pages];const unique=[...new Set(numbers)];let last=0;
 $('pageButtons').innerHTML=`<button class="page-btn" type="button" data-page="${state.page-1}" aria-label="上一页" ${state.page<=1?'disabled':''}>${icon('arrow')}</button>`+unique.map(n=>{const gap=n-last>1;last=n;return (gap?'<span class="page-ellipsis">…</span>':'')+`<button class="page-btn ${n===state.page?'active':''}" type="button" data-page="${n}" aria-label="第 ${n} 页" ${n===state.page?'aria-current="page"':''}>${n}</button>`}).join('')+`<button class="page-btn" type="button" data-page="${state.page+1}" aria-label="下一页" ${!filtered.length||state.page>=pages?'disabled':''}><svg class="icon" aria-hidden="true" style="transform:rotate(180deg)"><use href="#i-arrow"/></svg></button>`;
 $('searchClear').hidden=!$('search').value;
}
function resetList(){state.page=1;state.open.clear();renderList()}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2800)}
function switchModule(monitor){closeMenus();$('monitorPage').hidden=!monitor;$('governancePage').hidden=monitor;for(const [id,active] of [['navMonitor',monitor],['navGovernance',!monitor]]){$(id).classList.toggle('active',active);if(active)$(id).setAttribute('aria-current','page');else $(id).removeAttribute('aria-current')}}
function refresh(manual=false){if(refreshPending||document.hidden||$('monitorPage').hidden)return;refreshPending=true;$('refresh').disabled=true;$('refresh').classList.add('busy');$('refresh').querySelector('span').textContent='刷新中';clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{renderList();$('updatedTime').textContent='更新于 '+dateParts(Date.now()).time;$('refresh').disabled=false;$('refresh').classList.remove('busy');$('refresh').querySelector('span').textContent='刷新';refreshPending=false;if(manual)toast('示例记录已刷新，当前筛选与展开状态已保留。')},420)}
function applyDates(start,end){if(start&&end&&start>end){$('dateError').hidden=false;$('dateStart').setAttribute('aria-invalid','true');$('dateEnd').setAttribute('aria-invalid','true');return false}state.start=start;state.end=end;$('dateError').hidden=true;$('dateStart').removeAttribute('aria-invalid');$('dateEnd').removeAttribute('aria-invalid');closeMenus('dateToggle');renderContext();resetList();return true}
$('botToggle').addEventListener('click',()=>{const wasOpen=!$('botMenu').hidden;closeMenus();if(!wasOpen){$('botMenu').hidden=false;$('botToggle').setAttribute('aria-expanded','true');$('botOptions').querySelector('.selected').focus()}});
$('dateToggle').addEventListener('click',()=>{const wasOpen=!$('dateMenu').hidden;closeMenus();if(!wasOpen){$('dateMenu').hidden=false;$('dateToggle').setAttribute('aria-expanded','true');$('dateStart').value=state.start;$('dateEnd').value=state.end;$('dateError').hidden=true;$('dateStart').removeAttribute('aria-invalid');$('dateEnd').removeAttribute('aria-invalid')}});
$('dateApply').addEventListener('click',()=>applyDates($('dateStart').value,$('dateEnd').value));$('dateCancel').addEventListener('click',()=>closeMenus('dateToggle'));
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);$('searchClear').hidden=!$('search').value;searchTimer=setTimeout(()=>{state.keyword=$('search').value.trim();resetList()},220)});
$('searchClear').addEventListener('click',()=>{clearTimeout(searchTimer);$('search').value='';state.keyword='';resetList();$('search').focus()});
$('pageSize').addEventListener('change',()=>{state.size=Number($('pageSize').value);resetList()});$('refresh').addEventListener('click',()=>refresh(true));
document.addEventListener('click',async event=>{const button=event.target.closest('button');if(!event.target.closest('.control-block'))closeMenus();if(!button)return;
 if(button.dataset.notice){toast(button.dataset.notice);return}
 if(button.dataset.action){if(button.dataset.action==='clearFilters'){state.decision='all';state.start='';state.end='';state.keyword='';clearTimeout(searchTimer);$('search').value='';renderContext();resetList()}else switchModule(button.dataset.action==='monitor');return}
 if(button.dataset.bot){state.bot=button.dataset.bot;closeMenus('botToggle');renderContext();resetList();return}
 if(button.dataset.days){const days=button.dataset.days;if(days==='all')applyDates('','');else applyDates(dateParts(anchor-(Number(days)-1)*86400000).date,dateParts(anchor).date);return}
 if(button.dataset.decision){state.decision=button.dataset.decision;resetList();$('resultTabs').querySelector(`[data-decision="${state.decision}"]`).focus();return}
 if(button.dataset.page){state.page=Number(button.dataset.page);state.open.clear();renderList();document.querySelector('.records-title').scrollIntoView({behavior:'smooth',block:'start'});return}
 if(button.dataset.record){const id=button.dataset.record,r=allRecords(currentBot()).find(r=>r.id===id);if(state.open.has(id))state.open.delete(id);else state.open.add(id);$('row-'+id).outerHTML=record(r);document.querySelector(`[data-record="${id}"]`).focus({preventScroll:true});return}
 if(button.dataset.copy){try{await navigator.clipboard.writeText(button.dataset.copy);toast('已复制')}catch{toast('浏览器未允许复制，请选中标识文本手动复制。')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const focus=!$('botMenu').hidden?'botToggle':!$('dateMenu').hidden?'dateToggle':null;closeMenus(focus)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
setInterval(()=>refresh(),30000);
renderContext();renderList();
</script>
</body>
</html>
