<text x="525.0" y="364.47499999999997" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">Capability providers (per engine)</text>
<text x="525.0" y="381.68749999999994" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">session export · agent runner</text>
<text x="525.0" y="397.2124999999999" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">train evaluator</text>
<rect x="690" y="330" width="270" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="825.0" y="364.47499999999997" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">Platform pipeline</text>
<text x="825.0" y="381.68749999999994" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">record → verify → gate → promote</text>
<text x="825.0" y="397.2124999999999" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="middle">verdict looked up by candidate id</text>
<path d="M 525 285 L 525 328" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="533" y="307" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">served by</text>
<path d="M 825 285 L 825 328" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="833" y="307" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">submit / verdict</text>
<path d="M 40 380 L 22 380 L 22 51 L 38 51" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="12" y="215" font-size="11" font-weight="400" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 12 215)">configures</text>
