<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="#fafbf9"/>
  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1c2420">排空执行器 A(G 组原地重启)</text>
  <text x="24" y="52" font-size="12" fill="#5c6a62">执行器不持有任何流,所以排空它只是移动租约。流在网关上保持打开,只暂停几毫秒。</text>

  <rect x="24" y="72" width="912" height="62" rx="8" fill="#ffffff" stroke="#5c6a62"/>
  <text x="44" y="96" font-size="13" font-weight="bold" fill="#1c2420">1 · 停止信号</text>
  <text x="44" y="118" font-size="11.5" fill="#1c2420">花名册 state = draining(网关和同伴不再把工作放到 A)· 停止认领 · 继续服务 A 仍拥有的每个会话</text>

  <rect x="24" y="146" width="912" height="190" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="44" y="170" font-size="13" font-weight="bold" fill="#157a55">2 · 桶(约 4096/N 个),最忙的先移</text>
  <rect x="44" y="184" width="280" height="136" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="184" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">冷会话</text>
  <text x="58" y="230" font-size="11" fill="#1c2420">内存中什么都没有</text>
  <text x="58" y="254" font-size="11.5" font-weight="bold" fill="#157a55">→ 无需任何操作</text>
  <text x="58" y="274" font-size="11" fill="#5c6a62">它们属于桶的新所有者,</text>
  <text x="58" y="290" font-size="11" fill="#5c6a62">后者在下一轮请求时加载它们</text>
  <rect x="340" y="184" width="580" height="136" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="630" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">每个桶 —— 热会话随之移动,即使正在流式输出</text>
  <text x="354" y="230" font-size="11.5" font-weight="bold" fill="#157a55">→ 交接:PREPARE(+ 热会话)· 暂停 · TRANSFER · COMMIT 给 B</text>
  <text x="354" y="254" font-size="11" fill="#1c2420">流式步骤继续在其派发网关上运行;它后续的增量、事件和结果发往 B</text>
  <text x="354" y="272" font-size="11" fill="#1c2420">PA 的流仍订阅着 S 的频道;现在由 B 在那里发布,所以只暂停几毫秒</text>
  <text x="354" y="296" font-size="11" fill="#5c6a62">唯一的等待:正在进行的持久写入或派发启动(几毫秒)</text>
  <text x="354" y="312" font-size="11" fill="#5c6a62">后继 ∉ G:正在排空的执行器拒绝 PREPARE</text>

  <rect x="24" y="348" width="912" height="62" rx="8" fill="#ffffff" stroke="#5c6a62"/>
  <text x="44" y="372" font-size="13" font-weight="bold" fill="#1c2420">3 · 截止时间(25 s,在平台停止超时之内)</text>
  <text x="44" y="394" font-size="11.5" fill="#1c2420">把剩下的桶 TRANSFER 给各自的 HRW 后继,不经 PREPARE · 之后到达的请求得到 NOT_OWNER(B)</text>

  <rect x="24" y="422" width="440" height="78" rx="8" fill="#ffffff" stroke="#5c6a62"/>
  <text x="44" y="446" font-size="13" font-weight="bold" fill="#1c2420">4 · 删除花名册行,退出</text>
  <text x="44" y="468" font-size="11.5" fill="#5c6a62">控制通道保持打开,直到最后一次交接</text>
  <line x1="464" y1="461" x2="490" y2="461" stroke="#5c6a62" marker-end="url(#ar)"/>
  <rect x="496" y="422" width="440" height="78" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="516" y="446" font-size="13" font-weight="bold" fill="#157a55">5 · 重启:地址不变,node_id 换新</text>
  <text x="516" y="468" font-size="11.5" fill="#1c2420">遗留的桶立即可认领 · member_name 不变 →</text>
  <text x="516" y="486" font-size="11.5" fill="#1c2420">拿回同样的桶</text>
</svg>
