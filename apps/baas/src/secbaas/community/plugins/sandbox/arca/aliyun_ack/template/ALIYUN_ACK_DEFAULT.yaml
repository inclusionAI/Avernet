# ===== 1. Header rules ConfigMap (from outbound_operation_rule) =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-header-rules-{{ uid }}
  namespace: {{ namespace }}
data:
  header-rules.yaml: |
{{ header_rules_yaml | indent(4, True) }}
---
# ===== 2. Deployment (avernet-agent + envoy-sidecar) =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avernet-agent-{{ uid }}
  namespace: {{ namespace }}
  labels:
    app: avernet-agent
    biz-id: "{{ uid }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avernet-agent
      biz-id: "{{ uid }}"
  template:
    metadata:
      labels:
        app: avernet-agent
        biz-id: "{{ uid }}"
      annotations:
        avernet.arcasandbox/ttl_expiration_timestamp: "{{ ttl_expiration_timestamp }}"
    spec:
      initContainers:
      - name: init-dir
        image: {{ init_image }}
        command: ["sh", "-c", "test -d /mnt/data/{{ storage_id }} || (mkdir -p /mnt/data/{{ storage_id }} && chown 10001:10001 /mnt/data/{{ storage_id }})"]
        volumeMounts:
        - name: data
          mountPath: /mnt/data
      containers:
      - name: {{ container_name }}
        image: {{ agent_image }}
{% if envs %}
        env:
{% for k, v in envs.items() %}
        - name: {{ k }}
          value: "{{ v }}"
{% endfor %}
{% endif %}
        ports:
        - containerPort: 20003
        volumeMounts:
        - name: data
          mountPath: {{ mount_path }}
          subPath: {{ storage_id }}
        resources:
          requests:
            cpu: "{{ cpu_request }}"
            memory: "{{ memory_request }}"
          limits:
            cpu: "{{ cpu_limit }}"
            memory: "{{ memory_limit }}"
      - name: envoy-sidecar
        image: {{ sidecar_image }}
        ports:
        - containerPort: 38080
        - containerPort: 38081
        volumeMounts:
        - name: header-rules
          mountPath: /etc/sidecar/header-rules.yaml
          subPath: header-rules.yaml
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
      volumes:
      - name: data
        nfs:
          server: {{ nas_server }}
          path: /
      - name: header-rules
        configMap:
          name: envoy-header-rules-{{ uid }}
