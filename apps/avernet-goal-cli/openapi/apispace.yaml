openapi: 3.0.3
info:
  title: Avernet Goal CLI API
  description: Task Intake、确认后创建任务及任务图查询接口。
  version: 1.0.0
servers:
  - url: "{__DOMAIN__}"
paths:
  /api/v1/collaboration/tasks/intake:
    post:
      operationId: intakeGoal
      summary: 发起或继续任务澄清
      description: 同一 session 的后续请求通过 X-Task-Intake-Session-ID 传递 session_id。
      tags: [goal]
      x-cli-auth:
        authHeader: authorization
      parameters:
        - $ref: "#/components/parameters/IntakeSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskIntakeCommand"
      responses:
        "200":
          description: 当前任务澄清状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskIntakeEnvelope"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/collaboration/tasks/start:
    post:
      operationId: startConfirmedGoal
      summary: 从已确认 Intake Session 创建任务
      tags: [goal]
      x-cli-auth:
        authHeader: authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartIntakeRequest"
      responses:
        "200":
          description: 任务创建结果；同一 session_id 重试返回同一任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskOpEnvelope"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/collaboration/tasks/{task_id}:
    get:
      operationId: getGoalTask
      summary: 查询任务执行图
      tags: [goal]
      x-cli-auth:
        authHeader: authorization
      parameters:
        - name: task_id
          in: path
          required: true
          description: TaskService 创建的任务 ID
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: 任务执行图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDashboardEnvelope"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
components:
  parameters:
    IntakeSessionHeader:
      name: X-Task-Intake-Session-ID
      in: header
      required: false
      description: START 不传；RESUME、CONTINUE、CONFIRM、CANCEL 必须传。
      schema:
        type: string
  responses:
    ErrorResponse:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    IntakeTarget:
      type: object
      additionalProperties: false
      required: [target_type, target_id]
      properties:
        target_type:
          type: string
          enum: [BOT, GROUP]
        target_id:
          type: string
          minLength: 1
    TaskIntakeCommand:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [START, RESUME, CONTINUE, CONFIRM, CANCEL]
        message:
          type: string
          nullable: true
        requested_a2a_proxy_bot_ref:
          type: string
          nullable: true
        requested_target:
          allOf:
            - $ref: "#/components/schemas/IntakeTarget"
          nullable: true
        requested_mode:
          type: string
          enum: [relay, centralized]
          nullable: true
    AcceptanceCriterion:
      type: object
      required: [id, description]
      properties:
        id:
          type: string
        description:
          type: string
    TaskSpec:
      type: object
      required: [context, goal]
      properties:
        context:
          type: object
          required: [title, background, extend_props]
          properties:
            title:
              type: string
            background:
              type: string
            extend_props:
              type: object
              additionalProperties: true
        goal:
          type: object
          required: [objective, acceptances]
          properties:
            objective:
              type: string
            acceptances:
              type: array
              items:
                $ref: "#/components/schemas/AcceptanceCriterion"
    TaskIntakeResult:
      type: object
      required:
        - session_id
        - owner_user_id
        - source_type
        - status
        - execution_mode
        - processing
        - missing_fields
        - questions
        - create_time_ms
        - update_time_ms
      properties:
        session_id:
          type: string
        owner_user_id:
          type: string
        source_type:
          type: string
        status:
          type: string
          enum: [CLARIFYING, CONFIRMED, CANCELLED]
        target:
          allOf:
            - $ref: "#/components/schemas/IntakeTarget"
          nullable: true
        execution_mode:
          type: string
          enum: [relay, centralized]
        processing:
          type: boolean
        task_spec:
          allOf:
            - $ref: "#/components/schemas/TaskSpec"
          nullable: true
        missing_fields:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            type: string
        create_time_ms:
          type: integer
          format: int64
        update_time_ms:
          type: integer
          format: int64
    StartIntakeRequest:
      type: object
      additionalProperties: false
      required: [session_id]
      properties:
        session_id:
          type: string
          minLength: 1
    TaskOpResult:
      type: object
      required: [task_id, success, run_id, extend_props]
      properties:
        task_id:
          type: string
        node_id:
          type: string
          nullable: true
        success:
          type: boolean
        run_id:
          type: integer
          format: int64
        message:
          type: string
          nullable: true
        extend_props:
          type: object
          additionalProperties: true
    TaskDashboard:
      type: object
      additionalProperties: true
      description: TaskExecutionGraph 的公开 Dashboard 投影。
    EnvelopeBase:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: integer
        message:
          type: string
        request_id:
          type: string
    TaskIntakeEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/TaskIntakeResult"
    TaskOpEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/TaskOpResult"
    TaskDashboardEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/TaskDashboard"
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              nullable: true
x-api-svc:
  org: tmc
  project: agentclawengine
  name: avernet-goal-cli
  describe: Avernet Goal CLI API
  config:
    serverUrl: "{__DOMAIN__}"
    backend:
      protocol: "{__ENDPOINT_PROTOCOL__}"
      endpoints:
        - "{__ENDPOINT_HOST__}"
      port: "{__ENDPOINT_PORT__}"
