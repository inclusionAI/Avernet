<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c6a62"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#157a55"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b3402e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="600" fill="#fafbf9"/>
  <text x="24" y="30" font-size="16" font-weight="bold" fill="#1c2420">Takeover with fencing and key reuse (the zombie scenario)</text>

  <!-- lifeline headers -->
  <rect x="70" y="48" width="150" height="38" rx="8" fill="#f8e6e1" stroke="#b3402e"/>
  <text x="145" y="66" font-size="12" font-weight="bold" text-anchor="middle" fill="#b3402e">Node A (old owner,</text>
  <text x="145" y="80" font-size="11" text-anchor="middle" fill="#b3402e">stalls → zombie)</text>
  <rect x="330" y="48" width="140" height="38" rx="8" fill="#ffffff" stroke="#1c2420"/>
  <text x="400" y="72" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">Shared DB</text>
  <rect x="540" y="48" width="140" height="38" rx="8" fill="#e3f0e9" stroke="#157a55"/>
  <text x="610" y="72" font-size="12" font-weight="bold" text-anchor="middle" fill="#157a55">Node B (new owner)</text>
  <rect x="760" y="48" width="140" height="38" rx="8" fill="#ffffff" stroke="#b9c6bf"/>
  <text x="830" y="72" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2420">Supply agent</text>

  <line x1="145" y1="86" x2="145" y2="570" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="400" y1="86" x2="400" y2="570" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="610" y1="86" x2="610" y2="570" stroke="#b9c6bf" stroke-dasharray="3 4"/>
  <line x1="830" y1="86" x2="830" y2="570" stroke="#b9c6bf" stroke-dasharray="3 4"/>

  <!-- 1 -->
  <line x1="145" y1="116" x2="396" y2="116" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="270" y="106" font-size="11" text-anchor="middle" fill="#1c2420">1 · INSERT dispatch {step S, att 1, key K, SENDING} — token n</text>
  <text x="145" y="142" font-size="10.5" text-anchor="middle" fill="#b3402e">…stalls before (or during) the send…</text>

  <!-- 2 -->
  <rect x="352" y="156" width="96" height="24" rx="5" fill="#f7eed7" stroke="#9a6b0a"/>
  <text x="400" y="172" font-size="10.5" text-anchor="middle" fill="#9a6b0a">2 · lease expires</text>

  <!-- 3 -->
  <line x1="610" y1="210" x2="404" y2="210" stroke="#157a55" marker-end="url(#ag)"/>
  <text x="508" y="200" font-size="11" text-anchor="middle" fill="#157a55">3 · claim lease (CAS) — fencing token n+1</text>

  <!-- 4 -->
  <line x1="610" y1="248" x2="404" y2="248" stroke="#157a55" marker-end="url(#ag)"/>
  <text x="508" y="238" font-size="11" text-anchor="middle" fill="#157a55">4 · rehydrate task — the cache-miss path</text>

  <!-- 5 -->
  <line x1="610" y1="292" x2="826" y2="292" stroke="#157a55" marker-end="url(#ag)"/>
  <text x="718" y="282" font-size="11" text-anchor="middle" fill="#157a55">5 · probe retry-only, key K</text>
  <line x1="826" y1="318" x2="614" y2="318" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="720" y="334" font-size="11" text-anchor="middle" fill="#5c6a62">"unknown" ⇒ never arrived</text>

  <!-- 6 -->
  <line x1="610" y1="364" x2="826" y2="364" stroke="#157a55" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="718" y="354" font-size="11" font-weight="bold" text-anchor="middle" fill="#157a55">6 · resend with the SAME key K (att stays 1)</text>

  <!-- 7 zombie late send -->
  <line x1="145" y1="408" x2="826" y2="408" stroke="#b3402e" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <text x="480" y="398" font-size="11" text-anchor="middle" fill="#b3402e">7 · zombie wakes — late original send, key K</text>
  <rect x="700" y="420" width="206" height="30" rx="6" fill="#e3f0e9" stroke="#157a55"/>
  <text x="803" y="439" font-size="10.5" text-anchor="middle" fill="#157a55">dedup: same key ⇒ same task, executed once</text>

  <!-- 8 zombie stale write -->
  <line x1="145" y1="478" x2="396" y2="478" stroke="#b3402e" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <text x="268" y="468" font-size="11" text-anchor="middle" fill="#b3402e">8 · stale checkpoint write (token n)</text>
  <text x="400" y="498" font-size="11" font-weight="bold" text-anchor="middle" fill="#b3402e">✕ refused — fencing token too old</text>

  <!-- 9 -->
  <line x1="826" y1="528" x2="614" y2="528" stroke="#5c6a62" marker-end="url(#ar)"/>
  <text x="720" y="518" font-size="11" text-anchor="middle" fill="#1c2420">9 · result (streamed / fetched)</text>
  <line x1="610" y1="554" x2="404" y2="554" stroke="#157a55" marker-end="url(#ag)"/>
  <text x="508" y="546" font-size="11" text-anchor="middle" fill="#157a55">10 · checkpoint (token n+1) — resume run</text>

  <text x="24" y="590" font-size="10.5" fill="#5c6a62">Fencing guards storage (step 8); the agent-side idempotency key guards the already-launched send (step 7). Both are needed.</text>
</svg>
