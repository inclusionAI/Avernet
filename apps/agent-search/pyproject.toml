[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avernet-agent-search"
version = "0.1.0"
description = "Agent search application composed with Avernet Search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["avernet-search[http]==0.1.0"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.24.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
avernet-search = { path = "../../middleware/python/avernet-search", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
