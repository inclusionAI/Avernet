# -----------------------------------------------------------------------------
# Example Kubernetes manifests for deploying bcsfuse on Aliyun ACK.
#
# Usage:
#   1. Replace all placeholder values (image, secrets, domain names).
#   2. Apply Secret first:  kubectl apply -f bcsfuse-secret.yaml
#   3. Apply ConfigMap:    kubectl apply -f bcsfuse-configmap.yaml
#   4. Apply Deployment:   kubectl apply -f bcsfuse-deployment.yaml
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: bcsfuse-config
  namespace: default
data:
  # Non-sensitive configuration
  BCSFUSE_PROVIDER_MODE: "runtime"
  BCSFUSE_PORT: "8765"
  BCSFUSE_SERVER_HOST: "0.0.0.0"
  MYSQL_HOST: "rm-xxxxxxxxxxxxxxxx.mysql.cn-beijing.rds.aliyuncs.com"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "avernet"
  EMBEDDING_BASE_URL: "https://ws-xxxxxxxxxxxx.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  EMBEDDING_MODEL: "qwen3.7-text-embedding"
  EMBEDDING_DIMENSION: "1024"
  EMBEDDING_TIMEOUT_MS: "30000"
  LLM_BASE_URL: "https://ws-xxxxxxxxxxxx.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  LLM_API_TYPE: "openai"
  LLM_FAST_MODEL: "glm-5.2"
  LLM_BALANCED_MODEL: "glm-5.2"
  LLM_REASONING_MODEL: "glm-5.2"
  LLM_LONG_CONTEXT_MODEL: "glm-5.2"
  LLM_EXTRACTION_MODEL: "glm-5.2"
  LLM_DEFAULT_TIMEOUT_MS: "600000"
  LLM_REASONING_TIMEOUT_MS: "600000"
---
apiVersion: v1
kind: Secret
metadata:
  name: bcsfuse-secrets
  namespace: default
type: Opaque
stringData:
  # Sensitive values. Use kubectl create secret or external secrets manager.
  MYSQL_USER: "avernet_db"
  MYSQL_PASSWORD: "REPLACE_WITH_REAL_PASSWORD"
  EMBEDDING_AUTH_TOKEN: "REPLACE_WITH_REAL_TOKEN"
  LLM_AUTH_TOKEN: "REPLACE_WITH_REAL_TOKEN"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bcsfuse
  namespace: default
  labels:
    app: bcsfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bcsfuse
  template:
    metadata:
      labels:
        app: bcsfuse
    spec:
      containers:
        - name: bcsfuse
          image: avernet-registry.cn-beijing.cr.aliyuncs.com/avernet/bcsfuse:20260826
          imagePullPolicy: Always
          ports:
            - containerPort: 8765
              name: http
          envFrom:
            - configMapRef:
                name: bcsfuse-config
            - secretRef:
                name: bcsfuse-secrets
          env:
            # Explicit bool flag that cannot live safely in ConfigMap alone
            - name: ENABLE_REAL_LLM
              value: "true"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: bcsfuse
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: bcsfuse
  ports:
    - port: 80
      targetPort: 8765
      name: http
