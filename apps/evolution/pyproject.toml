[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avernet-evolution"
version = "0.1.0"
description = "Independent Evolution control plane and strategy worker SDK"
requires-python = ">=3.12,<3.13"
dependencies = [
  "avernet-genome-contracts==1.0.0",
  "fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27",
  "pydantic>=2.12,<3", "jsonschema>=4.20", "pyjwt>=2.9",
]

[project.scripts]
evolution = "avernet_evolution.bootstrap:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.14.13"]

[tool.uv.sources]
avernet-genome-contracts = { path = "../../packages/genome-contracts", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/avernet_evolution"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
