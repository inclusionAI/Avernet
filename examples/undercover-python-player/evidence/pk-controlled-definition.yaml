        transitions:
          complete:
            targets: [pk_tally]

      pk_vote_3:
        kind: bot_task
        display_name: "pk_vote_3"
        assignee:
          type: bot_binding
          binding: seat3
        instruction: |
          你是 3 号，你的词是【测试物】。
          【本轮 PK 投票】只输出「我投N号」，禁止弃权。
          可以投：1号、2号、4号；不能投自己。
          [Input] 为受控 PK 测试输入；[Upstream Outputs] 为受控投票。
          输出不得出现「测试物」。
        transitions:
          complete:
            targets: [pk_tally]

      pk_vote_4:
        kind: bot_task
        display_name: "pk_vote_4"
        assignee:
          type: bot_binding
          binding: seat4
        instruction: |
          你是 4 号，你的词是【测试物】。
          【本轮 PK 投票】只输出「我投N号」，禁止弃权。
          可以投：1号、2号、3号；不能投自己。
          [Input] 为受控 PK 测试输入；[Upstream Outputs] 为受控投票。
          输出不得出现「测试物」。
        transitions:
          complete:
            targets: [pk_tally]
      pk_tally:
        kind: bot_task
        display_name: "pk_tally"
        final_output: true
        assignee:
          type: bot_binding
          binding: referee
        instruction: |
          你是 1 号，你的词是【测试物】。描述你的词：PK 结束，2 号胜出。
          只输出一句不超过 25 字的受控 PK 结论，不出现「测试物」。
