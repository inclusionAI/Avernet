[project]
name = "gateway-community"
description = "teamclawgw community edition — open-source gateway skeleton"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.27.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-asgi>=0.63b1",
    "dependency-injector>=4.49.1",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
]

[project.scripts]
gateway-community = "gateway.community.main:main"

[project.entry-points."gateway.runner"]
bare = "gateway.community.plugins.runner.bare:BareAppRunnerPlugin"

[project.entry-points."gateway.logger"]
bare = "gateway.community.plugins.logger.bare:BareLoggerPlugin"

[project.entry-points."gateway.tracer"]
bare = "gateway.community.plugins.tracer.bare:BareTracerPlugin"

[project.entry-points."gateway.cache"]
bare = "gateway.community.plugins.cache.in_memory:InMemoryCachePlugin"

[project.entry-points."gateway.auth"]
bare = "gateway.community.plugins.auth.stub:StubAuthPlugin"

[project.entry-points."gateway.database"]
bare = "gateway.community.plugins.database.sqlite:SqliteDatabasePlugin"

[project.entry-points."gateway.forwarder"]
bare = "gateway.community.plugins.forwarder.httpx:HttpxForwarder"

[project.entry-points."gateway.schema_catalog"]
bare = "gateway.community.plugins.schema_catalog.file:FileSchemaCatalog"

# --- 包索引配置（开源：阿里云公共镜像） ---
[[tool.uv.index]]
default = true
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"

# --- 依赖分组配置 ---
[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pre-commit>=3.6.0",
    "debugpy>=1.8.0",
    "mypy>=1.20.2",
    "types-pyyaml>=6.0.12.20260508",
    "pytest-cov>=7.1.0",
    "coverage>=7.6.0",
    "pytestarch>=4.0.0,<5.0.0",
    "httpx2>=2.7.0",
    "greenlet>=3.5.3",
    "basedpyright>=1.39.9",
]

# --- 构建后端定义 ---
[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
# 只打包 src 目录，测试代码不进 whl
packages = ["src/gateway"]

[tool.hatch.version]
# 动态版本：从代码中的 __version__ 读取
path = "src/gateway/community/__about__.py"

[tool.hatch.build]
exclude = [
    "*.log",
    ".github",
]

# --- 代码检查工具 Ruff 配置 ---
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["E501", "ASYNC109"]
select = ["E", "F", "I", "N", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E402",
    "N",
    "E731",
    "ASYNC240",
    "F401",
    "F841",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

# --- 测试工具 Pytest 配置 ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests (against separately started app)",
    "baseline: marks tests as baseline / smoke tests",
]

# --- 静态类型检查 Pyright 配置 ---
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]

[tool.pyright.diagnosticSeverityOverrides]
reportUnusedCoroutine = "error"
reportMissingTypeStubs = "warning"

# --- 静态类型检查 Mypy 配置 ---
[tool.mypy]
files = ["src"]
ignore_missing_imports = true
pretty = true
python_version = "3.12"
show_error_codes = true
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
warn_unreachable = false
check_untyped_defs = true
