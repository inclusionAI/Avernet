# ClawMind L5 Goal-Loop Demo
# 一句话驱动的自适应循环工作流示例
#
# 用户只需给出一个目标，ClawMind 会：
# 1. LLM 自动规划（生成 WorkflowSpec）
# 2. 执行工作流
# 3. 评估目标是否达成
# 4. 未达成 → 局部修复或全局重规划 → 回到步骤 2
# 5. 达成 → 对抗验证 → 通过 → 结束
# 6. 收敛检测：连续 N 轮无进展或预算耗尽则停止

name: goal-loop-code-quality
version: 1
description: |
  L5 Goal-Loop 示例：确保项目代码质量达标
  - 自动规划代码审查流程
  - 执行后评估是否达标
  - 未达标则自适应修复（局部修复→全局重规划）
  - 直到目标达成或收敛停止

nodes:
  # ── L5 Goal-Loop 节点 ──
  # 这是整个工作流的核心：一个 goal-loop 节点驱动自适应循环
  - id: ensure-quality
    title: "确保代码质量达标"
    phase: main
    executor:
      type: goal-loop
      goal: "确保项目的所有测试通过且 lint 无错误"
      
      # 初始计划：LLM 自动合成工作流
      initialPlan:
        type: synthesize
        hints:
          - "先运行测试看哪些失败"
          - "再运行 lint 看哪些不通过"
          - "修复失败项后重新验证"
      
      # 评估配置
      evaluation:
        model: haiku
        criteria:
          - "所有测试通过 (npm test)"
          - "lint 无错误 (npm run lint)"
        temperature: 0.2
      
      # 修复策略
      repair:
        mode: adaptive              # 先局部修复，失败后全局重规划
        maxReplans: 3               # 最多全局重规划 3 次
        maxLocalRepairs: 3          # 每轮最多局部修复 3 次
        repairActions:
          - name: fix-test
            type: embedded-agent
            description: "分析并修复失败的测试用例"
            params:
              prompt: "分析失败的测试，找到根本原因并修复"
          - name: fix-lint
            type: cli-script
            description: "运行 eslint --fix 自动修复 lint 问题"
            params:
              command: "npm run lint -- --fix"
          - name: re-run-tests
            type: cli-script
            description: "重新运行测试套件"
            params:
              command: "npm test"
          - name: re-run-lint
            type: cli-script
            description: "重新运行 lint 检查"
            params:
              command: "npm run lint"
        allowDynamicActions: true   # 允许 LLM 创造新动作
      
      # 预算约束
      budget:
        maxTokens: 500000           # 最多消耗 50 万 Token
        maxNodes: 50                # 最多注入 50 个节点
        # 注意: budget.maxIterations 和顶层 maxIterations 是不同的约束:
        #   - budget.maxIterations: 预算维度，用于 budget-exhausted 检测
        #   - 顶层 maxIterations:   循环上限，用于 max-iterations 收敛检测
        # 此处省略 budget.maxIterations，让顶层 maxIterations 统一控制
      
      # 对抗验证
      verification:
        prompt: "确认所有测试确实通过（不是被跳过或 mock），且 lint 确实无错误"
        model: haiku
        minVotes: 2                 # 3 个验证者中至少 2 个同意
        totalVoters: 3
      
      # 收敛检测
      convergence:
        noProgressIterations: 3     # 连续 3 轮无进展则停止
        repeatedFailures: 5         # 同一节点连续失败 5 次则停止
      
      # 最多迭代次数
      maxIterations: 20

  # ── 完成后的报告节点 ──
  - id: report
    title: "生成最终报告"
    phase: main
    dependsOn: [ensure-quality]
    executor:
      type: embedded-agent
      prompt: |
        代码质量目标已处理完毕。
        
        Goal-Loop 最终评估结果: {{ensure-quality.output}}
        
        请生成一份总结报告，包括：
        1. 最终是否达标
        2. 经历了多少轮迭代
        3. 做了哪些修复
        4. 是否触发了重规划