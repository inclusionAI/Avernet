id: camp-pingshen-2604-assessment
version: 2.0.0
title: 活动风险评估 (2604版)
description: |
  基于 camp-pingshen-2604-skill 的一站式活动风险评估工作流。
  完整执行 Stage 0-6 的评审流程：需求解析 → 类型判断 → 活动拆解 →
  风险识别 → 评分评级 → 评估意见 → 报告生成。
  每个 Stage 输出后自动运行验证脚本，支持语雀文档读取和子任务推进。

workflows:
  - id: "camp-pingshen-2604-assessment"
    file: workflows/camp-pingshen-2604-assessment.yaml

facades:
  - command: camp-pingshen
    workflowId: camp-pingshen-2604-assessment
    description: "一站式活动风险评估（2604版）。用法: /camp-pingshen --docUrl <语雀URL> --projectName <项目名>"
    params:
      - key: docUrl
        required: true
        description: "语雀活动需求文档 URL"
      - key: projectName
        required: true
        description: "项目名称（用于 workspace 目录命名）"
      - key: subTaskId
        required: false
        description: "子任务ID（Stage 5 推进子任务时使用，可选）"