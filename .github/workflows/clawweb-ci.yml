name: ClawWeb Unit Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawweb-unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clawweb:
    name: ClawWeb unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/evolverun/clawweb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Always produce a check result; unrelated PRs skip only the heavy steps.
      - name: Detect ClawWeb changes
        id: changes
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash apps/evolverun/clawweb/scripts/ci/detect-changes.sh

      - name: Set up Node.js
        if: steps.changes.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: apps/evolverun/clawweb/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.skip == 'false'
        run: npm ci --no-audit --no-fund

      - name: Build packages
        if: steps.changes.outputs.skip == 'false'
        run: npm run ci:build

      - name: Check packages
        if: steps.changes.outputs.skip == 'false'
        run: npm run ci:check

      - name: Verify test runner
        if: steps.changes.outputs.skip == 'false'
        run: node --test scripts/ci/run-tests.test.mjs scripts/ci/detect-changes.test.mjs

      - name: Test packages with coverage
        if: steps.changes.outputs.skip == 'false'
        continue-on-error: false
        run: npm run test:ci

      - name: Publish test summary
        if: always() && steps.changes.outputs.skip == 'false'
        run: |
          if [ -f test-results/summary.md ]; then
            cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Tests NOT_RUN or interrupted: no summary generated; inspect preceding steps.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test reports
        if: always() && steps.changes.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: clawweb-test-results
          path: apps/evolverun/clawweb/test-results/
          if-no-files-found: warn
