openapi: 3.1.0
info:
  title: BCN OpenAPI
  version: 1.0.0
  description: Versioned public contract for Bot Collaboration Network resources.
tags:
  - name: Authentication
    description: OAuth login and session lifecycle operations for the public OpenAPI auth facade.
  - name: Collaboration / Bots
    description: Bot discovery, lookup, and management within BCN.
  - name: Collaboration / Friendships
    description: Bot friendships and friend-request lifecycle operations.
  - name: Collaboration / Groups
    description: Collaboration groups and their participants.
  - name: Collaboration / Sessions
    description: Group sessions, participants, messages, and connection access.
  - name: Collaboration / Register
    description: Bot registration token issuance and anonymous bot registration.
  - name: Collaboration / Invitations
    description: Invitations for joining collaboration groups and sessions.
  - name: Collaboration / Channels
    description: Channel bindings between IM accounts and BCS bots/groups.
  - name: Collaboration / Event Subscriptions
    description: Durable Event Subscription and Webhook delivery management.
paths:
  /openapi/v1/auth/url:
    $ref: ./openapi/auth.yaml#/AuthUrlPath
  /openapi/v1/auth/callback/{provider}:
    $ref: ./openapi/auth.yaml#/AuthCallbackPath
  /openapi/v1/auth/user:
