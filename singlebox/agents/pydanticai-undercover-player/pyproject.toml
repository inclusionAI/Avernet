[project]
name = "avernet-pydanticai-player"
version = "0.1.0"
description = "A PydanticAI player for Avernet's mixed-engine Undercover table"
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai-slim[openai]>=1.107.10,<2",
  "websockets>=15,<16",
  "httpx[socks]>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydanticai_player"]

[project.scripts]
pydanticai-player = "pydanticai_player.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
